  <style>
html { background-color: #101012 }
html.idf-entering::before, html.idf-entering::after {
  content: ""; position: fixed; pointer-events: none; opacity: 1;
  transition: opacity 160ms ease-out;
}
html.idf-entering::before { inset: 0; z-index: 2147483645; background: #101012 }
html.idf-entering::after {
  z-index: 2147483646; inset: 50% auto auto 50%; width: 15px; height: 15px;
  margin: -9px; border: 2px solid #3d3d42; border-top-color: #dbdbdf;
  border-radius: 50%; animation: idf-arrival .7s linear infinite;
}
html.idf-entering.idf-revealing::before, html.idf-entering.idf-revealing::after { opacity: 0 }
@keyframes idf-arrival { to { transform: rotate(1turn) } }
@media (prefers-reduced-motion: reduce) {
  html.idf-entering::before, html.idf-entering::after { transition: none; animation: none }
}
</style>
<script>
(() => {
  const root = document.documentElement;
  if (new URLSearchParams(location.search).has("maps_app")) return;
  root.classList.add("idf-entering");
  function reveal() {
    if (!root.classList.contains("idf-entering")) return;
    root.classList.add("idf-revealing");
    setTimeout(() => root.classList.remove("idf-entering", "idf-revealing"), 180);
  }
  const deadline = setTimeout(reveal, 1600);
  document.addEventListener("DOMContentLoaded", async () => {
    const ready = [];
    if (document.fonts) {
      ready.push(document.fonts.load("500 16px Inter"), document.fonts.load('700 32px "Barlow Condensed"'));
    }
    const picture = document.querySelector(".fold:not([hidden]) .fold-image");
    if (picture?.decode) ready.push(picture.decode());
    await Promise.allSettled(ready);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      clearTimeout(deadline);
      reveal();
    }));
  }, {once:true});
  window.addEventListener("pageshow", event => {
    if (event.persisted) root.classList.remove("idf-entering", "idf-revealing");
  });
})();
</script>

  <style>
    :root{
      --credits-surface:#171717;
      --credits-surface-soft:#141414;
      --credits-border:#2f2f2f;
      --credits-border-soft:#2a2a2a;
      --credits-text:#ececec;
      --credits-muted:#c6c6c6;
    }
    html, body{
      height:100%;
    }
    body{
      overflow-x:hidden;
      overflow-y:auto;
    }

    .credits-wrap{
      min-height:100vh;
      height:auto;
      box-sizing:border-box;
      padding:calc(var(--sitebar-height, 52px) + 14px) 12px calc(var(--shared-footer-height, 24px) + 16px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      overflow:visible;
    }

    .credits-card{
      width:min(900px, 100%);
      border:1px solid var(--credits-border);
      border-radius:14px;
      background:var(--credits-surface);
      color:var(--credits-text);
      box-shadow:0 16px 36px rgba(0,0,0,.35);
      padding:14px;
      display:grid;
      grid-template-rows:auto auto auto;
      gap:10px;
      min-height:0;
      overflow:visible;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }

    .credits-title{
      margin:0;
      font-size:clamp(20px, 3vw, 28px);
      line-height:1.15;
      color:#fff;
      letter-spacing:-.01em;
    }
    .credits-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px 16px;
      flex-wrap:wrap;
    }
    .credits-lang-notice{
      margin:0;
      color:#efe6bf;
      font-size:12px;
      font-weight:700;
      line-height:1.2;
      text-align:right;
      max-width:min(520px, 100%);
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #695b22;
      background:rgba(125, 104, 27, .22);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .credits-lang-notice[hidden]{
      display:none !important;
    }

    .credits-subtitle{
      margin:0;
      color:var(--credits-muted);
      font-size:13px;
      line-height:1.45;
    }
    .credits-list{
      display:block;
      min-height:auto;
      overflow:visible;
      padding-right:0;
    }
    .credits-list > .credits-group{
      margin-bottom:10px;
    }
    .credits-list > .credits-group:last-child{
      margin-bottom:0;
    }
    .credits-group{
      border:1px solid #2d2d2d;
      border-radius:10px;
      background:#101010;
      overflow:hidden;
    }
    .credits-group-title{
      margin:0;
      padding:8px 10px;
      border-bottom:1px solid #2d2d2d;
      background:#151515;
      color:#d7d7d7;
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      line-height:1.2;
    }
    .credits-group-list{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
      padding:10px;
    }

    .credit-item{
      border:1px solid var(--credits-border-soft);
      border-radius:10px;
      background:var(--credits-surface-soft);
      padding:10px;
      display:grid;
      gap:8px 10px;
      grid-template-columns:86px minmax(0, 1fr);
      grid-template-areas:"photo meta";
      align-items:start;
      transition:border-color .2s ease, box-shadow .2s ease;
      box-sizing:border-box;
      width:100%;
      min-width:0;
      max-width:100%;
      overflow:hidden;
      cursor:pointer;
    }
    .credit-item:hover,
    .credit-item:focus-within{
      border-color:#4a4a4a;
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }
    .credit-item:focus-visible{
      outline:2px solid #ffffff;
      outline-offset:2px;
    }
    .credit-item.is-modal-open{
      border-color:#f3d24f;
      box-shadow:0 0 0 1px rgba(243,210,79,.45), 0 10px 24px rgba(0,0,0,.36);
    }

    .credit-photo-wrap{
      grid-area:photo;
      align-self:start;
      width:86px;
      height:86px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid #3a3a3a;
      background:#101010;
      box-shadow:0 8px 18px rgba(0,0,0,.28);
      flex:0 0 auto;
    }

    .credit-photo{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .credit-meta{
      grid-area:meta;
      min-width:0;
      display:grid;
      gap:6px;
      align-content:start;
    }
    .credit-head{
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .credit-name{
      margin:0;
      color:#fff;
      font-size:clamp(17px, 2.7vw, 22px);
      font-weight:900;
      line-height:1.08;
      letter-spacing:-.01em;
      display:flex;
      align-items:baseline;
      gap:8px;
      min-width:0;
      flex:1 1 auto;
      flex-wrap:wrap;
    }
    .credit-name-main{
      min-width:0;
      font-size:.9em;
      overflow-wrap:anywhere;
    }
    .credit-name-since-card{
      color:rgba(255,255,255,.58);
      font-size:.45em;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      margin-left:auto;
      align-self:flex-start;
    }
    .credit-status{
      margin:0;
      color:#e0e0e0;
      font-size:11px;
      font-weight:700;
      line-height:1.35;
      display:grid;
      grid-template-columns:1fr;
      gap:2px;
      width:100%;
      box-sizing:border-box;
    }
    .credit-status-item{
      min-width:0;
      font-size:12px;
      color:#b6b6b6;
    }

    .credit-networks-line{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width:0;
      margin-left:auto;
    }
    .credit-networks-label{
      margin:0;
      color:#bdbdbd;
      font-size:11px;
      font-weight:700;
      letter-spacing:.03em;
      text-transform:uppercase;
    }

    .credit-social-list{
      display:flex;
      flex-wrap:nowrap;
      gap:6px;
      justify-content:flex-end;
    }

    .credit-social-empty{
      color:#a9a9a9;
      font-size:11.5px;
      font-weight:600;
    }
    .credit-modal-empty{
      margin:0;
      color:#a9a9a9;
      font-size:12px;
      font-weight:600;
      line-height:1.35;
    }

    @media (max-width:700px){
      .credits-wrap{
        padding:calc(var(--sitebar-height, 52px) + 10px) 8px calc(var(--shared-footer-height, 24px) + 12px);
      }
      .credits-group-list{
        grid-template-columns:1fr;
      }
      .credits-card{
        padding:11px;
        border-radius:12px;
      }
      .credit-item{
        grid-template-columns:74px minmax(0, 1fr);
        grid-template-areas:"photo meta";
        gap:8px;
        padding:8px;
        min-width:0;
        max-width:100%;
      }
      .credit-photo-wrap{
        width:74px;
        height:74px;
      }
      .credit-social-btn{
        min-height:22px;
        padding:0 7px;
        font-size:10.5px;
      }
    }

    @media (prefers-reduced-motion: reduce){ .credit-item,.credit-social-btn { transition:none } }
  </style>

.page-credits .credits-group { border: none; background: none; border-radius: 0 }
.page-credits .credits-list > .credits-group + .credits-group { margin-top: 1.6rem }
.page-credits .credits-group-title {
  padding: 0 0 .6rem; background: none; border: none; text-transform: none;
  letter-spacing: 0; color: #ededf0; font: 700 1.55rem/1.1 "Barlow Condensed",sans-serif;
}
.page-credits .credits-group-list { padding: 0; gap: .75rem }
.page-credits :is(.credit-item,.credit-modal,.credit-image-viewer) {
  background: #202023; border: 1px solid var(--page-border); border-radius: 7px; box-shadow: none;
}
.page-credits .credit-item { padding: clamp(10px,1.25vw,17px) }
.page-credits .credit-item:is(:hover,:focus-visible,.is-modal-open) { background: #262629; border-color: #727279 }
.page-actualites { --page-photo: var(--section-image) }
.page-actualites .news-item { background: #202023; border: 1px solid var(--page-border); border-radius: 7px }
.page-actualites .news-feedback { margin: 0 var(--content-pad) 16px }
.page-actualites .news-feedback:empty { display: none }
.page-mentions_legales { --page-photo: var(--section-image) }
.page-mentions_legales .legal-wrap { max-width: 1160px }
.page-mentions_legales .legal-card { padding-bottom: var(--content-pad) }
.legal-card > :not(h1) { margin-inline: var(--content-pad) }
.page-mentions_legales .legal-section-title {
  margin-top: 1.5rem; font: 700 1.6rem/1.1 "Barlow Condensed",Inter,sans-serif;
}
.page-mentions_legales .legal-text { font-size: .93rem; line-height: 1.7; color: #c9c9cf }
.page-mentions_legales .legal-details { border-color: var(--page-border) }
.page-404 .not-found-wrap { margin-block: auto }
.page-404 .not-found-card {
  padding: clamp(32px,7vw,96px) var(--content-pad); text-align: left;
  background: linear-gradient(75deg,#101012f5,#101012a0 55%,#10101245),var(--section-image) center / cover;
}
.page-404 .not-found-actions { justify-content: flex-start }
.page-404 .not-found-title { margin: .3rem 0 1rem }
.page-404 .not-found-btn.primary { background: #ebebed; border: 0; color: #171719; border-radius: 6px; text-decoration: none }
.page-live-telemetry {
  --bg: #101012; --panel: #19191c; --row: #1b1b1e; --row-alt: #202024; --border: #3e3e40;
  --text: #ededf0; --muted: #aaaab4; --line: #4d4d55; --num: #a5deb0; --bool: #ceb4e8;
  --string: #b7d5ec; --null: #a8a8b0; --error: #efa9a9; --ok: #9fddb1; --warn: #eabf84;
}
.telemetry-controls,.page-live-telemetry .viewer { box-sizing: border-box; width: calc(100% - 2 * var(--edge)); max-width: 1440px; margin-inline: auto }
.telemetry-controls h1 { margin: 1.5rem 0 1rem }
.telemetry-controls :is(input,button,.pill) { background: #202023; color: var(--text); border-color: var(--border) }
.telemetry-controls input { min-width: 0 }
.telemetry-controls .topbar { flex-wrap: wrap }
.page-live-telemetry .viewer { min-height: 250px; flex: 1; border-radius: 7px; box-shadow: none }
.page-map { height: 100svh; overflow: hidden }
.page-map .mast { position: fixed; inset: 0 0 auto; z-index: 1800; background: #161618 }
.page-map #map { top: var(--site-header-h); bottom: 0 }
.page-map :is(.search-input,.dbus-panel,.settings-panel,.search-panel,.line-preview-panel) {
  color: #f0f0f2; background-color: #19191c; border-color: var(--page-border); border-radius: 7px;
}
.maps-app-mode .page-map #map { inset: 0 }
@keyframes page-in { from { transform: translateY(5px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: no-preference) {
  .interior :is(.faq-card,.credits-card,.news-card,.legal-card,.not-found-card), .faq-item[open] .faq-answer { animation: page-in .24s var(--ease) }
}
@media (max-width: 740px) {
  .interior { --edge: clamp(12px,4vw,26px); --content-pad: 16px }
  .interior :is(.faq-title,.credits-head,.news-title,.legal-title) { min-height: 118px }
  .page-credits .credits-group-list { grid-template-columns: minmax(0,1fr) }
  .page-faq .faq-answer { margin-right: .6rem }
}
@media (prefers-reduced-motion: reduce) {
  .interior *, .interior *::before, .interior *::after { animation-duration: .01ms !important; transition-duration: .01ms !important }
}

  <style>
.interior main.section-wrap {
  display: block;
  box-sizing: border-box;
  width: min(100%, 1510px);
  max-width: none;
  margin: 0 auto;
  padding: clamp(18px, 3.4vh, 36px) var(--edge) 20px;
}
.section-wrap > .section-title {
  display: flex;
  align-items: center;
  gap: clamp(12px, 1.5vw, 24px);
  margin: 0 0 .32em;
  color: #fafafa;
  font: 700 clamp(2.7rem, 5.4vw, 5rem)/1.02 "Barlow Condensed", Inter, sans-serif;
  letter-spacing: -.025em;
}
.section-title::after {
  content: "";
  flex: 1;
  height: 2px;
  margin-top: .2em;
  background: linear-gradient(to right, #414246, transparent 94%);
}
.section-wrap > .credits-lang-notice { margin-bottom: 12px }
.section-wrap .legal-text { max-width: 105ch }

</style>
  <style>
.credit-social-btn{
  min-width:26px;
  min-height:26px;
  padding:0;
  border-radius:7px;
  border:1px solid var(--social-border, #414141);
  background:var(--social-bg, #2a2a2a);
  color:var(--social-text, #f3f3f3);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0;
  text-decoration:none;
  box-shadow:0 6px 14px rgba(0,0,0,.28);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
}
.credit-social-btn span{
  display:none;
}
.credit-social-btn:hover{
  transform:translateY(-1px);
  border-color:var(--social-hover-border, var(--social-border, #565656));
  background:var(--social-hover-bg, var(--social-bg, #333333));
  box-shadow:0 8px 16px rgba(0,0,0,.33);
}
.credit-social-btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}
.credit-social-btn svg{
  width:12px;
  height:12px;
  fill:currentColor;
  stroke:none;
  flex:0 0 auto;
}
.credit-social-btn img{
  width:12px;
  height:12px;
  display:block;
  object-fit:contain;
  flex:0 0 auto;
}
.credit-social-btn .site-icon-email{
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.credit-social-btn .site-icon-discord path,
.credit-social-btn .site-icon-youtube path{
  fill:currentColor !important;
  stroke:none !important;
}
.credit-social-btn.is-labeled{
  min-width:unset;
  min-height:28px;
  padding:0 9px;
  gap:6px;
}
.credit-social-btn.is-labeled span{
  display:inline;
  font-size:11px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}

</style>
  <style>
html.credits-modal-open { overflow: hidden }
.page-credits :is(.credit-modal, .credit-lightbox) {
  --inset: clamp(16px, 2.5vw, 30px);
  box-sizing: border-box;
  width: min(960px, calc(100% - 40px));
  max-width: none;
  max-height: 90svh;
  margin: auto;
  padding: 0;
  overflow: hidden;
  color: #f5f5f6;
  background: #1b1b1e;
  border: 1px solid #46464a;
  border-radius: 9px;
  font: 400 1rem/1.45 Inter, sans-serif;
  color-scheme: dark;
}
.credit-modal:not(.has-gallery) { width: min(540px, calc(100% - 40px)) }
:is(.credit-modal, .credit-lightbox)[open] { display: flex; flex-direction: column }
:is(.credit-modal, .credit-lightbox)::backdrop { background: rgb(8 8 10 / 80%) }
.credits-modal-open :is(.credit-modal, .credit-lightbox) [hidden] { display: none }
.credit-modal-head, .credit-lightbox-head {
  flex: none; display: flex; align-items: center; gap: 14px;
  padding: 16px var(--inset); border-bottom: 1px solid #38383c;
}
.credit-modal-photo-wrap { width: 52px; height: 52px; overflow: hidden; border-radius: 7px; background: #29292c }
.credit-modal-photo { width: 100%; height: 100%; object-fit: cover }
.credit-modal-title, .credit-lightbox-head h2 {
  margin: 0; min-width: 0; overflow-wrap: anywhere;
  font: 700 clamp(1.7rem, 3vw, 2.4rem)/1.04 "Barlow Condensed", sans-serif;
}
.credit-modal-title-handle {
  display: block; margin-top: 5px; color: #aaaab1;
  font: 500 .8rem/1.2 Inter, sans-serif;
}
.credit-close, .credit-gallery-controls button {
  display: grid; place-items: center; flex: none; width: 40px; height: 40px; padding: 0;
  color: #ededee; background: #252528; border: 1px solid #46464a;
  border-radius: 6px; cursor: pointer; font: 400 1.55rem/1 Arial, sans-serif;
}
.credit-close { margin-left: auto }
.credit-gallery-controls button { width: 36px; height: 36px }
:is(.credit-close, .credit-gallery-controls button):hover:enabled { background: #343439; border-color: #85858b }
.credit-gallery-controls button:disabled { opacity: .34; cursor: default }
.credit-layout {
  min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr);
  gap: var(--inset); align-items: start; padding: var(--inset);
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
}
.has-gallery .credit-layout {
  grid-template-columns: minmax(185px, .38fr) minmax(0, 1fr);
  grid-template-areas: "info gallery";
}
.has-gallery .credit-modal-content { grid-area: info }
.has-gallery #creditGalleryHome { grid-area: gallery; min-width: 0 }
.credit-modal-content { display: grid; gap: 18px; min-width: 0; overflow-wrap: anywhere }
.credit-modal-category-row, .credit-modal-identity { display: grid; justify-items: start; gap: 7px }
.credit-modal-category-since { color: #b6b6bd; font-size: .79rem }
.credit-modal-role-list, .credit-modal-role-buttons { display: flex; flex-wrap: wrap; gap: 5px }
.credit-modal-category, .credit-modal-role-pill, .credit-modal-role-btn {
  margin: 0; padding: .32em .58em; color: #e4e4e7; background: #28282c;
  border: 1px solid #414145; border-radius: 4px; font-size: .73rem; line-height: 1.35;
}
.credit-modal-category, .credit-modal-role-pill { font-weight: 700; border-left: 3px solid var(--role-color, #79797e) }
.credit-modal-section { border-top: 1px solid #39393d; padding-top: 14px }
.credit-modal-section-title { margin: 0 0 9px; font: 700 1.25rem/1.12 "Barlow Condensed", sans-serif }
.credit-modal-section .credit-social-list { justify-content: flex-start; flex-wrap: wrap }
.credit-modal-contrib-detail { margin: .55em 0 0; font-size: .86rem; color: #c5c5cb }
.credit-gallery { margin: 0; min-width: 0 }
.credit-stage {
  --photo-max-height: 52svh;
  position: relative; margin-inline: auto;
  width: min(100%, calc(var(--photo-max-height) * var(--photo-ratio, 1.77778)));
  aspect-ratio: var(--photo-ratio, 1.77778);
  overflow: hidden; box-sizing: border-box; border: 1px solid #3d3d42; border-radius: 6px;
  background: #101012; touch-action: pan-y pinch-zoom; user-select: none;
}
.credit-zoom, .credit-photo-slot, .credit-stage-message {
  position: absolute; inset: 0; display: grid; place-items: center;
}
.credit-zoom { cursor: zoom-in }
.credit-photo-slot img { width: 100%; height: 100%; min-height: 0; object-fit: contain; pointer-events: none }
.credit-stage-message { pointer-events: none; padding: 16px; text-align: center; font-weight: 700 }
.credit-stage .expand-mark {
  position: absolute; right: 10px; bottom: 10px; width: 32px; height: 32px; padding: 6px;
  box-sizing: border-box; border-radius: 5px; color: #fff; background: #242427;
  fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
}
.credit-stage.is-loading::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 20px; height: 20px;
  border: 2px solid #48484d; border-top-color: #eee; border-radius: 50%; pointer-events: none;
  animation: credit-spinner .8s linear infinite;
}
.credit-gallery-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0 }
.credit-caption { min-width: 0; overflow-wrap: anywhere; font-size: .84rem }
.credit-gallery-controls { display: flex; flex: none; align-items: center; gap: 8px }
.credit-position { min-width: 4ch; text-align: center; color: #c4c4c9; font: 500 .78rem/1 Inter, sans-serif; font-variant-numeric: tabular-nums }
.credit-thumbnails {
  position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 3px 2px 5px;
  scrollbar-width: thin; overscroll-behavior-x: contain;
}
.credit-thumbnails button {
  flex: 0 0 64px; height: 42px; overflow: hidden; padding: 2px;
  background: #202023; color: #ddd; border: 1px solid #46464a; border-radius: 4px; cursor: pointer;
}
.credit-thumbnails button[aria-current=true] { border-color: #f3f3f5; background: #dbdbdf }
.credit-thumbnails img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px }
.page-credits .credit-lightbox { width: min(1160px, calc(100% - 32px)); max-height: 96svh }
.credit-lightbox-head { padding-block: 10px }
.credit-lightbox-head h2 { font-size: 1.6rem }

.credit-lightbox .credit-stage { --photo-max-height: 68svh }
.credit-lightbox .credit-zoom { cursor: zoom-out }
.credit-lightbox .expand-mark { display: none }
.credit-zoom:focus-visible { outline-offset: -4px }
@keyframes credit-spinner { to { transform: rotate(360deg) } }
@keyframes credit-detail-in { from { opacity: 0; transform: translateY(5px) } }
@media (prefers-reduced-motion: no-preference) {
  :is(.credit-modal, .credit-lightbox)[open] { animation: credit-detail-in .16s ease-out }
}
@media (prefers-reduced-motion: reduce) { .credit-stage.is-loading::after { animation: none } }
@media (max-width: 700px) {
  .page-credits :is(.credit-modal, .credit-lightbox) { width: calc(100% - 20px); max-height: 94svh; --inset: 14px }
  .has-gallery .credit-layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "gallery" "info" }
  .credit-modal-photo-wrap { width: 43px; height: 43px }
  .credit-modal-head { padding-block: 11px }

      function selectImage(index) {

        const message = stage.querySelector(".credit-stage-message");
        const slot = zoom.querySelector(".credit-photo-slot");
        stage.classList.remove("is-loading");
        slot.replaceChildren();
        message.textContent = item.text || "";

        zoom.hidden = !!item.isMoreText;
        if (!item.href) stage.style.removeProperty("--photo-ratio");

          image.alt = formatMessage(t("credits_contribution_image_alt", "Contribution image: {name}"), {name: caption || String(index + 1)});
          image.draggable = false;
          stage.classList.add("is-loading");

            stage.classList.remove("is-loading");

      function bindGalleryEvents() {

        const cacheMs = Math.max(60000, Number(sheetCfg.cache_ms) || 180000);
        const timeoutMs = Math.max(3000, Number(sheetCfg.timeout_ms) || 10000);

        if (!spreadsheetId) return ENABLE_LOCAL_MODE ? fallbackContributors() : [];

        const cachedRows = readCache(cacheMs);

        const sheetUrl = buildSheetUrl(spreadsheetId, gid);

        if (!contributors.length) throw new Error("Sheet is empty");
        return contributors;

    $("#current-language").textContent = languageNames[language];
    $("#current-flag").src = flagPath(language);
    languageTrigger.setAttribute("aria-label", tr("language_label") + " · " + languageNames[language]);
    for (const option of languageMenu.children) {
      option.setAttribute("aria-checked", String(option.dataset.language === language));
    }
    const url = new URL(location.href);
    if (persist || url.searchParams.has("lang")) {
      try { localStorage.setItem("idf_lang", language); } catch {}
      if (url.searchParams.has("lang")) {
        url.searchParams.delete("lang");
        // Some browsers disallow file: history rewrites that change the query.
        try { history.replaceState(history.state, "", url); } catch {}
      }
    }
    all("[data-t]").forEach(el => { el.textContent = tr(el.dataset.t); });
    for (const el of all("[data-t-code]")) {
      let message = tr(el.dataset.tCode);
      if (el.dataset.codeTerms) {
        for (const term of el.dataset.codeTerms.split("|")) {
          message = message.replaceAll(term, "`" + term + "`");
        }
      }
      const segments = message.split("`");
      el.replaceChildren(...segments.map((text, index) => {
        if (index % 2 === 0) return text;
        const code = document.createElement("code");
        code.textContent = text;
        return code;
      }));
    }
    all("[data-label]").forEach(el => el.setAttribute("aria-label",tr(el.dataset.label)));
    all("[data-system]").forEach(el => { el.textContent = systemName; });
    $(".mast .monogram").setAttribute("aria-label","Île-de-France Map — " + tr("nav_accueil"));
    document.dispatchEvent(new CustomEvent("idf:language", {detail: language}));
  }
  for (const [code, name] of Object.entries(languageNames)) {
    const option = document.createElement("button");
    option.type = "button";
    option.lang = code;
    option.dataset.language = code;
    option.setAttribute("role", "menuitemradio");
    option.tabIndex = -1;
    const flag = document.createElement("img");
    flag.className = "language-flag";
    flag.alt = "";
    flag.src = flagPath(code);
    option.append(flag, name);
    languageMenu.append(option);
  }
  let openGroup = null;
  function positionNavPopup() {
    if (!openGroup?.classList.contains("nav-dropdown")) return;
    const popup = openGroup.querySelector(".nav-popup");
    const left = openGroup.getBoundingClientRect().left;
    const space = document.documentElement.clientWidth - left - popup.offsetWidth - 12;
    popup.style.setProperty("--menu-offset", Math.max(12 - left, Math.min(0, space)) + "px");
  }
  function closeGroup(restoreFocus = false) {
    if (!openGroup) return;
    const trigger = openGroup.querySelector("button[aria-expanded]");
    openGroup = null;
    trigger.setAttribute("aria-expanded", "false");
    if (restoreFocus) trigger.focus({preventScroll:true});
    trigger.nextElementSibling.inert = true;
  }
  for (const group of all(".mast .nav-dropdown, .mast .language-picker")) {
    const trigger = group.querySelector("button[aria-expanded]");
    const popup = trigger.nextElementSibling;
    function open() {
      if (openGroup !== group) closeGroup();
      openGroup = group;
      popup.inert = false;
      trigger.setAttribute("aria-expanded", "true");
      positionNavPopup();
      if (group === languagePicker) languageMenu.querySelector('[aria-checked="true"]').focus({preventScroll:true});
    }
    trigger.addEventListener("click", () => {
      if (openGroup === group) closeGroup(true);
      else open();
    });
    group.addEventListener("keydown", event => {
      if (event.key === "Escape" && openGroup === group) {
        event.preventDefault();
        event.stopPropagation();
        closeGroup(true);
        return;
      }
      if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
      if (group === languagePicker && event.target !== trigger) return;
      event.preventDefault();
      open();
      if (group === languagePicker) return;
      const items = [...popup.querySelectorAll("a")];
      const index = items.indexOf(document.activeElement);
      const delta = event.key === "ArrowDown" ? 1 : -1;
      const start = index < 0 && delta < 0 ? 0 : index;
      items[(start + delta + items.length) % items.length].focus({preventScroll:true});
    });
    group.addEventListener("focusout", event => {
      if (openGroup === group && !group.contains(event.relatedTarget)) closeGroup();
    });
    if (group !== languagePicker) popup.addEventListener("click", event => {
      if (event.target.closest("a")) closeGroup(true);
    });
  }
  languageMenu.addEventListener("click", event => {
    const option = event.target.closest("[data-language]");
    if (!option) return;
    language = option.dataset.language;
    syncLanguage(true);
    closeGroup(true);
  });
  languageMenu.addEventListener("keydown", event => {
    if (event.key === "Tab") {
      event.stopPropagation();
      closeGroup(true);
      return;
    }
    const options = [...languageMenu.children];
    const index = options.indexOf(event.target);
    const column = Math.ceil(options.length / 2);
    let next;
    switch (event.key) {
      case "ArrowDown": next = index + 1; break;
      case "ArrowUp": next = index - 1; break;
      case "ArrowRight": next = index + column; break;
      case "ArrowLeft": next = index - column; break;
      case "Home": next = 0; break;
      case "End": next = options.length - 1; break;
      default:
        if (event.key.length !== 1 || !event.key.trim() || event.altKey || event.ctrlKey || event.metaKey) return;
        next = options.findIndex(option => option.textContent.toLocaleLowerCase().startsWith(event.key.toLocaleLowerCase()));
        if (next < 0) return;
    }
    event.preventDefault();
    options[(next + options.length) % options.length].focus();
  });
  document.addEventListener("pointerdown", event => {
    if (openGroup && !openGroup.contains(event.target)) closeGroup();
  });
  window.addEventListener("resize", positionNavPopup);
  all("[data-offsite-key]").forEach(el => {
    if (links[el.dataset.offsiteKey]) el.href = links[el.dataset.offsiteKey];
  });
  const copyrightYear = $("#copyright-year");
  if (copyrightYear) copyrightYear.textContent = new Date().getFullYear();
  window.IDFSite = { tr };
  language = localLanguage();
  syncLanguage();
})();

</script>
<script id="mobile-navigation">

(() => {
  const header = document.querySelector('.mast');
  const nav = header?.querySelector('.site-nav');
  const toggle = header?.querySelector('.mobile-nav-toggle');
  if (!nav || !toggle) return;
  const mobile = matchMedia('(max-width: 740px)');
  function closeSubmenus() {
    for (const button of nav.querySelectorAll('.nav-trigger[aria-expanded="true"]')) button.click();
  }
  function setOpen(open, focus = false) {
    closeSubmenus();
    header.classList.toggle('mobile-nav-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    nav.inert = mobile.matches && !open;
    if (focus) (open ? nav.querySelector('a,button') : toggle)?.focus({preventScroll: true});
  }
  toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('click', event => {
    if (mobile.matches && !header.contains(event.target)) setOpen(false);
  });
  nav.addEventListener('click', event => {
    if (mobile.matches && event.target.closest('a')) setOpen(false, true);
  });
  header.querySelector('.language-trigger')?.addEventListener('click', () => {
    if (mobile.matches) setOpen(false);
  });
  header.addEventListener('keydown', event => {
    if (event.defaultPrevented || !mobile.matches) return;
    if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
      event.preventDefault();
      setOpen(false, true);
    } else if (event.key === 'ArrowDown' && event.target === toggle) {
      event.preventDefault();
      setOpen(true, true);
    }
  });
  header.addEventListener('focusout', event => {
    if (mobile.matches && !header.contains(event.relatedTarget)) setOpen(false);
  });
  mobile.addEventListener('change', () => setOpen(false));
  header.classList.add('mobile-nav-ready');
  setOpen(false);
})();

</script>

  <style>
    html[data-app-ready="0"] {
      background:#0b0b0b;
    }
    html[data-theme="light"][data-app-ready="0"] {
      background:#ecf2f8;
    }
    html[data-app-ready="0"] body {
      opacity:0 !important;
      visibility:hidden !important;
      overflow:hidden !important;
    }
  </style>
  <script>
    (function setupAppReadyGate() {
      const root = document.documentElement;
      root.setAttribute("data-app-ready", "0");
      let done = false;
      function reveal() {
        if (done) return;
        done = true;
        root.setAttribute("data-app-ready", "1");
      }
      window.__setAppReady = function __setAppReady(options) {
        const cfg = options && typeof options === "object" ? options : {};
        const minFrames = Math.max(4, Number(cfg.minFrames) || 8);
        const stableFrames = Math.max(2, Number(cfg.stableFrames) || 3);
        const maxFrames = Math.max(minFrames + stableFrames, Number(cfg.maxFrames) || 28);
        let frameCount = 0;
        let stableCount = 0;
        let previousKey = "";
        const step = () => {
          frameCount += 1;
          let layoutKey = "";
          const body = document.body;
          if (body) {
            const rect = body.getBoundingClientRect();
            layoutKey = [
              Math.round(rect.width),
              Math.round(rect.height),
              document.documentElement.scrollWidth,
              document.documentElement.scrollHeight
            ].join("x");
          }
          stableCount = layoutKey && layoutKey === previousKey ? stableCount + 1 : 0;
          previousKey = layoutKey;
          const enoughFrames = frameCount >= minFrames;
          const visuallyStable = stableCount >= stableFrames;
          const frameBudgetExceeded = frameCount >= maxFrames;
          if ((!enoughFrames || !visuallyStable) && !frameBudgetExceeded) {
            requestAnimationFrame(step);
            return;
          }
          reveal();
        };
        const start = () => requestAnimationFrame(step);
        if (document.fonts && document.fonts.ready) {
          Promise.race([
            document.fonts.ready.catch(() => {}),
            new Promise((resolve) => setTimeout(resolve, 1200))
          ]).finally(start);
          return;
        }
        start();
      };
      window.addEventListener("pageshow", reveal, { once: true });
      window.setTimeout(reveal, 7000);
    })();
  </script>
  <title>Credits</title>
  <link rel="icon" type="image/png" href="images/idf_logo_new.png"/>
  <style>
    :root{
      --credits-surface:#171717;
      --credits-surface-soft:#141414;
      --credits-border:#2f2f2f;
      --credits-border-soft:#2a2a2a;
      --credits-text:#ececec;
      --credits-muted:#c6c6c6;
    }
    html, body{
      height:100%;
    }
    body{
      overflow-x:hidden;
      overflow-y:auto;
    }

    .credits-wrap{
      min-height:100vh;
      height:auto;
      box-sizing:border-box;
      padding:calc(var(--sitebar-height, 52px) + 14px) 12px calc(var(--shared-footer-height, 24px) + 16px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      overflow:visible;
    }

    .credits-card{
      width:min(900px, 100%);
      border:1px solid var(--credits-border);
      border-radius:14px;
      background:var(--credits-surface);
      color:var(--credits-text);
      box-shadow:0 16px 36px rgba(0,0,0,.35);
      padding:14px;
      display:grid;
      grid-template-rows:auto auto auto;
      gap:10px;
      min-height:0;
      overflow:visible;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }

    .credits-title{
      margin:0;
      font-size:clamp(20px, 3vw, 28px);
      line-height:1.15;
      color:#fff;
      letter-spacing:-.01em;
    }
    .credits-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px 16px;
      flex-wrap:wrap;
    }
    .credits-lang-notice{
      margin:0;
      color:#efe6bf;
      font-size:12px;
      font-weight:700;
      line-height:1.2;
      text-align:right;
      max-width:min(520px, 100%);
      display:inline-flex;
      align-items:center;
      justify-content:flex-end;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #695b22;
      background:rgba(125, 104, 27, .22);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .credits-lang-notice[hidden]{
      display:none !important;
    }

    .credits-subtitle{
      margin:0;
      color:var(--credits-muted);
      font-size:13px;
      line-height:1.45;
    }
    .credits-feedback{
      margin:2px 0 0;
      color:#bdbdbd;
      font-size:12px;
      line-height:1.4;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .credits-feedback.is-loading::before{
      content:"";
      width:12px;
      height:12px;
      border:2px solid #5f5f5f;
      border-top-color:#f0f0f0;
      border-radius:50%;
      animation:credits-spin .75s linear infinite;
    }
    .credits-feedback.is-error{
      color:#f4b2b2;
    }
    @keyframes credits-spin{
      to{
        transform:rotate(360deg);
      }
    }

    .credits-list{
      display:block;
      min-height:auto;
      overflow:visible;
      padding-right:0;
    }
    .credits-list > .credits-group{
      margin-bottom:10px;
    }
    .credits-list > .credits-group:last-child{
      margin-bottom:0;
    }
    .credits-group{
      border:1px solid #2d2d2d;
      border-radius:10px;
      background:#101010;
      overflow:hidden;
    }
    .credits-group-title{
      margin:0;
      padding:8px 10px;
      border-bottom:1px solid #2d2d2d;
      background:#151515;
      color:#d7d7d7;
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      line-height:1.2;
    }
    .credits-group-list{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:10px;
      padding:10px;
    }

    .credit-item{
      border:1px solid var(--credits-border-soft);
      border-radius:10px;
      background:var(--credits-surface-soft);
      padding:10px;
      display:grid;
      gap:8px 10px;
      grid-template-columns:86px minmax(0, 1fr);
      grid-template-areas:"photo meta";
      align-items:start;
      transition:border-color .2s ease, box-shadow .2s ease;
      box-sizing:border-box;
      width:100%;
      min-width:0;
      max-width:100%;
      overflow:hidden;
      cursor:pointer;
    }
    .credit-item:hover,
    .credit-item:focus-within{
      border-color:#4a4a4a;
      box-shadow:0 8px 20px rgba(0,0,0,.28);
    }
    .credit-item:focus-visible{
      outline:2px solid #ffffff;
      outline-offset:2px;
    }
    .credit-item.is-modal-open{
      border-color:#f3d24f;
      box-shadow:0 0 0 1px rgba(243,210,79,.45), 0 10px 24px rgba(0,0,0,.36);
    }

    .credit-photo-wrap{
      grid-area:photo;
      align-self:start;
      width:86px;
      height:86px;
      border-radius:10px;
      overflow:hidden;
      border:1px solid #3a3a3a;
      background:#101010;
      box-shadow:0 8px 18px rgba(0,0,0,.28);
      flex:0 0 auto;
    }

    .credit-photo{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .credit-meta{
      grid-area:meta;
      min-width:0;
      display:grid;
      gap:6px;
      align-content:start;
    }
    .credit-head{
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .credit-name{
      margin:0;
      color:#fff;
      font-size:clamp(17px, 2.7vw, 22px);
      font-weight:900;
      line-height:1.08;
      letter-spacing:-.01em;
      display:flex;
      align-items:baseline;
      gap:8px;
      min-width:0;
      flex:1 1 auto;
      flex-wrap:wrap;
    }
    .credit-name-main{
      min-width:0;
      font-size:.9em;
      overflow-wrap:anywhere;
    }
    .credit-name-since-card{
      color:rgba(255,255,255,.58);
      font-size:.45em;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
      margin-left:auto;
      align-self:flex-start;
    }
    .credit-status{
      margin:0;
      color:#e0e0e0;
      font-size:11px;
      font-weight:700;
      line-height:1.35;
      display:grid;
      grid-template-columns:1fr;
      gap:2px;
      width:100%;
      box-sizing:border-box;
    }
    .credit-status-item{
      min-width:0;
      font-size:12px;
      color:#b6b6b6;
    }

    .credit-networks-line{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width:0;
      margin-left:auto;
    }
    .credit-networks-label{
      margin:0;
      color:#bdbdbd;
      font-size:11px;
      font-weight:700;
      letter-spacing:.03em;
      text-transform:uppercase;
    }

    .credit-social-list{
      display:flex;
      flex-wrap:nowrap;
      gap:6px;
      justify-content:flex-end;
    }

    .credit-social-btn{
      min-width:26px;
      min-height:26px;
      padding:0;
      border-radius:7px;
      border:1px solid var(--social-border, #414141);
      background:var(--social-bg, #2a2a2a);
      color:var(--social-text, #f3f3f3);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0;
      text-decoration:none;
      box-shadow:0 6px 14px rgba(0,0,0,.28);
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    }
    .credit-social-btn span{
      display:none;
    }
    .credit-social-btn:hover{
      transform:translateY(-1px);
      border-color:var(--social-hover-border, var(--social-border, #565656));
      background:var(--social-hover-bg, var(--social-bg, #333333));
      box-shadow:0 8px 16px rgba(0,0,0,.33);
    }
    .credit-social-btn:focus-visible{
      outline:2px solid #fff;
      outline-offset:2px;
    }
    .credit-social-btn svg{
      width:12px;
      height:12px;
      fill:currentColor;
      stroke:none;
      flex:0 0 auto;
    }
    .credit-social-btn img{
      width:12px;
      height:12px;
      display:block;
      object-fit:contain;
      flex:0 0 auto;
    }
    .credit-social-btn .site-icon-email{
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .credit-social-btn .site-icon-discord path,
    .credit-social-btn .site-icon-youtube path{
      fill:currentColor !important;
      stroke:none !important;
    }
    .credit-social-empty{
      color:#a9a9a9;
      font-size:11.5px;
      font-weight:600;
    }
    .credit-modal-overlay[hidden]{
      display:none !important;
    }
    .credit-modal-overlay{
      position:fixed;
      inset:0;
      z-index:1800;
      background:rgba(8,8,8,.76);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px 12px;
      box-sizing:border-box;
    }
    .credit-modal-overlay.is-open{
      display:flex;
    }
    .credit-modal{
      width:min(720px, 100%);
      max-height:min(86vh, 760px);
      overflow:auto;
      overscroll-behavior:contain;
      border:1px solid #393939;
      border-radius:14px;
      background:#111111;
      color:#efefef;
      box-shadow:0 24px 52px rgba(0,0,0,.48);
      padding:14px;
      display:grid;
      gap:12px;
    }
    .credit-modal-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .credit-modal-title{
      margin:0;
      font-size:clamp(20px, 3.2vw, 28px);
      line-height:1.1;
      color:#ffffff;
      display:flex;
      align-items:baseline;
      gap:8px;
      flex-wrap:wrap;
    }
    .credit-modal-title-main{
      min-width:0;
      overflow-wrap:anywhere;
    }
    .credit-modal-title-handle{
      color:rgba(255,255,255,.55);
      font-size:.58em;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
    }
    .credit-modal-close{
      border:1px solid #8f2f2f;
      background:#4a1313;
      color:#ffe5e5;
      width:30px;
      height:30px;
      border-radius:8px;
      font-size:18px;
      line-height:1;
      font-weight:800;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0;
      flex:0 0 auto;
    }
    .credit-modal-close:hover{
      background:#611919;
      border-color:#b03b3b;
    }
    .credit-modal-close:focus-visible{
      outline:2px solid #ffffff;
      outline-offset:2px;
    }
    .credit-modal-content{
      display:grid;
      gap:12px;
    }
    .credit-modal-top{
      display:grid;
      grid-template-columns:112px minmax(0, 1fr);
      gap:10px;
      align-items:start;
    }
    .credit-modal-photo-wrap{
      width:112px;
      height:112px;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #3a3a3a;
      background:#171717;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
    }
    .credit-modal-photo{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .credit-modal-identity{
      min-width:0;
      display:grid;
      gap:7px;
      align-content:start;
    }
    .credit-modal-username{
      margin:0;
      font-size:12px;
      font-weight:700;
      color:#b7b7b7;
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .credit-modal-category{
      margin:0;
      display:inline-flex;
      align-items:center;
      width:max-content;
      max-width:100%;
      border:1px solid #444444;
      border-radius:999px;
      background:#1a1a1a;
      color:#dcdcdc;
      font-size:11px;
      font-weight:700;
      letter-spacing:.02em;
      text-transform:uppercase;
      padding:4px 9px;
      line-height:1.2;
      box-sizing:border-box;
    }
    .credit-modal-category-row{
      display:inline-flex;
      align-items:center;
      gap:8px;
      width:max-content;
      max-width:100%;
    }
    .credit-modal-category-since{
      margin:0;
      font-size:10px;
      font-weight:700;
      color:#b7b7b7;
      line-height:1.2;
      white-space:nowrap;
      cursor:help;
    }
    .credit-modal-role-list{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:2px;
    }
    .credit-modal-role-pill{
      display:inline-flex;
      align-items:center;
      border:1px solid #3c3c3c;
      border-radius:999px;
      background:#191919;
      color:#cfcfcf;
      font-size:10px;
      font-weight:700;
      line-height:1.2;
      padding:3px 8px;
      white-space:nowrap;
      box-sizing:border-box;
    }
    .credit-modal-section{
      border:1px solid #2f2f2f;
      border-radius:10px;
      background:#171717;
      padding:10px;
      display:grid;
      gap:8px;
    }
    .credit-modal-section-title{
      margin:0;
      color:#f2f2f2;
      font-size:13px;
      font-weight:800;
      line-height:1.2;
      letter-spacing:.03em;
      text-transform:uppercase;
    }
    .credit-modal-role-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .credit-modal-role-btn{
      border:1px solid #454545;
      background:#1c1c1c;
      color:#e8e8e8;
      border-radius:9px;
      min-height:30px;
      padding:0 10px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      transition:background .16s ease, border-color .16s ease, color .16s ease;
    }
    .credit-modal-role-btn:hover{
      background:#262626;
      border-color:#5a5a5a;
    }
    .credit-modal-role-btn.is-static{
      cursor:help;
    }
    .credit-modal-role-btn.is-static:hover{
      background:#1c1c1c;
      border-color:#454545;
      color:#e8e8e8;
    }
    .credit-modal-role-btn.is-static:not(.has-tooltip){
      cursor:default;
    }
    .credit-modal-role-btn.is-open{
      background:#2f3e67;
      border-color:#6f8ad7;
      color:#f4f7ff;
    }
    .credit-modal-role-btn.is-disabled{
      opacity:1;
      cursor:not-allowed;
      filter:none;
    }
    .credit-modal-role-btn.is-disabled:hover{
      background:#1c1c1c;
      border-color:#454545;
      color:#e8e8e8;
    }
    .credit-modal-role-btn:focus-visible{
      outline:2px solid #ffffff;
      outline-offset:2px;
    }
    .credit-modal-role-content{
      display:grid;
      gap:10px;
    }
    .credit-modal-section.is-roles-collapsed{
      padding-bottom:4px;
      gap:6px;
    }
    .credit-modal-role-panel{
      border:1px solid #303030;
      border-radius:10px;
      background:#141414;
      padding:9px;
      display:grid;
      gap:8px;
      box-sizing:border-box;
    }
    .credit-modal-role-panel[hidden]{
      display:none !important;
    }
    .credit-modal-contrib-title{
      margin:0;
      display:flex;
      align-items:baseline;
      gap:8px;
      width:auto;
      flex-wrap:wrap;
      color:#d9d9d9;
      font-size:13px;
      font-weight:700;
      line-height:1.4;
    }
    .credit-modal-group-name{
      color:#ececec;
      font-size:13px;
      font-weight:800;
      line-height:1.35;
      overflow-wrap:anywhere;
    }
    .credit-modal-contrib-main{
      display:none;
      overflow-wrap:anywhere;
      min-width:0;
      flex:0 1 auto;
    }
    .credit-modal-contrib-inline-caption{
      color:#b9b9b9;
      font-size:11px;
      font-weight:600;
      line-height:1.35;
      margin-left:0;
      text-align:left;
      flex:0 0 auto;
      white-space:nowrap;
      max-width:none;
    }
    .credit-modal-contrib-detail{
      margin:0;
      color:#bbbbbb;
      font-size:12px;
      line-height:1.45;
      white-space:pre-line;
      overflow-wrap:anywhere;
    }
    .credit-modal-carousel{
      display:grid;
      grid-template-columns:auto minmax(0, 1fr) auto;
      align-items:center;
      gap:8px;
    }
    .credit-modal-carousel-btn{
      width:34px;
      height:34px;
      border:1px solid #5f5f5f;
      background:#242424;
      color:#f0f0f0;
      border-radius:8px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      line-height:1;
      padding:0;
    }
    .credit-modal-carousel-btn:hover{
      background:#242424;
      border-color:#5a5a5a;
    }
    .credit-modal-carousel-btn:disabled{
      opacity:.28;
      color:#767676;
      background:#131313;
      border-color:#2d2d2d;
      cursor:default;
    }
    .credit-modal-carousel-btn.is-disabled{
      opacity:.2;
      color:#5f5f5f !important;
      background:#111111 !important;
      border-color:#242424 !important;
      cursor:default;
      pointer-events:none;
      box-shadow:none;
      filter:grayscale(1);
    }
    .credit-modal-images{
      display:flex;
      gap:10px;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:none;
      padding:2px 0;
      scroll-padding-inline-start:0;
      scrollbar-width:none;
      -ms-overflow-style:none;
      cursor:grab;
      touch-action:none;
      -webkit-overflow-scrolling:touch;
      user-select:none;
    }
    .credit-modal-images.is-dragging{
      cursor:grabbing;
      user-select:none;
      scroll-snap-type:none;
    }
    .credit-modal-images::-webkit-scrollbar{
      display:none;
    }
    .credit-modal-image-link{
      display:block;
      flex:0 0 clamp(220px, 58vw, 360px);
      border-radius:0;
      overflow:visible;
      background:transparent;
      text-decoration:none;
      user-select:none;
      box-shadow:none;
    }
    .credit-modal-image-stage{
      position:relative;
      width:100%;
      height:220px;
      border-radius:10px;
      overflow:hidden;

  <script>
    (function initCreditsPage() {
      const CACHE_KEY = "idf_credits_sheet_cache_v2";
      const ENABLE_LOCAL_MODE = true;
      let CREDITS_IMAGES_INDEX_CACHE = null;
      let CREDITS_IMAGES_INIT_PROMISE = null;
      function getManifestCreditsImagesIndex() {
        const raw = window.CREDITS_IMAGES_MANIFEST;
        if (!raw || typeof raw !== "object") return {};
        return raw;
      }
      function isLocalRuntime() {
        const host = String(window.location.hostname || "").toLowerCase();
        return window.location.protocol === "file:"
          || host === "localhost"
          || host === "127.0.0.1"
          || host === "::1";
      }
      function safeDecode(text) {
        try {
          return decodeURIComponent(String(text || ""));
        } catch {
          return String(text || "");
        }
      }
      function isImageFileName(fileName) {
        return /\.(png|jpe?g|webp|gif|avif)$/i.test(String(fileName || ""));
      }
      function byNaturalName(a, b) {
        return String(a || "").localeCompare(String(b || ""), undefined, { numeric: true, sensitivity: "base" });
      }
      async function fetchDirectoryListingEntries(baseUrl) {
        try {
          const response = await fetch(baseUrl, { cache: "no-store" });
          if (!response.ok) return [];
          const html = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");
          const anchors = Array.from(doc.querySelectorAll("a[href]"));
          const entries = [];
          anchors.forEach((anchor) => {
            const href = String(anchor.getAttribute("href") || "").trim();
            if (!href || href === "." || href === ".." || href === "./" || href === "../") return;
            let resolved;
            try {
              resolved = new URL(href, baseUrl);
            } catch {
              return;
            }
            const decodedPath = safeDecode(resolved.pathname || "");
            entries.push({
              href,
              isDirectory: /\/$/.test(href),
              path: decodedPath
            });
          });
          return entries;
        } catch {
          return [];
        }
      }
      async function discoverLocalCreditsImagesIndex() {
        if (!isLocalRuntime()) return {};
        const rootUrl = new URL("./images/credits/", window.location.href);
        const rootPath = safeDecode(rootUrl.pathname || "");
        const rootEntries = await fetchDirectoryListingEntries(rootUrl.toString());
        const folders = rootEntries
          .map((entry) => {
            if (!entry || !entry.path || !entry.path.startsWith(rootPath)) return "";
            const rel = entry.path.slice(rootPath.length).replace(/\/+$/g, "");
            if (!rel || rel.includes("/")) return "";
            return rel;
          })
          .filter((folderName) => /^\d{6,}[-_].+/.test(folderName));
        const uniqueFolders = Array.from(new Set(folders)).sort(byNaturalName);
        const discovered = {};
        for (const folderName of uniqueFolders) {
          const idMatch = String(folderName).match(/^(\d{6,})/);
          if (!idMatch) continue;
          const userId = idMatch[1];
          const folderUrl = new URL(`${encodeURIComponent(folderName)}/`, rootUrl).toString();
          const folderPath = safeDecode(new URL(`${encodeURIComponent(folderName)}/`, rootUrl).pathname || "");
          const folderEntries = await fetchDirectoryListingEntries(folderUrl);
          const folderFileNames = folderEntries
            .map((entry) => {
              if (!entry || !entry.path || !entry.path.startsWith(folderPath)) return "";
              const rel = entry.path.slice(folderPath.length).replace(/\/+$/g, "");
              if (!rel || rel.includes("/")) return "";
              return rel;
            });
          const files = folderFileNames
            .filter((fileName) => isImageFileName(fileName))
            .sort(byNaturalName);
          const hasEndMarker = folderFileNames.some((fileName) => String(fileName || "").trim().toLowerCase() === "fin");
          discovered[userId] = { folder: folderName, files, hasEndMarker };
        }
        return discovered;
      }
      function mergeCreditsImagesIndex(baseIndex, overrideIndex) {
        const base = baseIndex && typeof baseIndex === "object" ? baseIndex : {};
        const override = overrideIndex && typeof overrideIndex === "object" ? overrideIndex : {};
        const merged = { ...base };
        Object.keys(override).forEach((userId) => {
          merged[userId] = override[userId];
        });
        return merged;
      }
      function initCreditsImagesIndex() {
        if (!CREDITS_IMAGES_INDEX_CACHE) {
          CREDITS_IMAGES_INDEX_CACHE = getManifestCreditsImagesIndex();
        }
        if (!isLocalRuntime()) {
          return Promise.resolve(CREDITS_IMAGES_INDEX_CACHE);
        }
        if (CREDITS_IMAGES_INIT_PROMISE) return CREDITS_IMAGES_INIT_PROMISE;
        CREDITS_IMAGES_INIT_PROMISE = discoverLocalCreditsImagesIndex()
          .then((autoIndex) => {
            if (autoIndex && Object.keys(autoIndex).length) {
              CREDITS_IMAGES_INDEX_CACHE = mergeCreditsImagesIndex(CREDITS_IMAGES_INDEX_CACHE, autoIndex);
              refreshContributorModalLocale();
            }
            return CREDITS_IMAGES_INDEX_CACHE;
          })
          .catch(() => CREDITS_IMAGES_INDEX_CACHE);
        return CREDITS_IMAGES_INIT_PROMISE;
      }
      function getCreditsImagesIndex() {
        if (!CREDITS_IMAGES_INDEX_CACHE) {
          CREDITS_IMAGES_INDEX_CACHE = getManifestCreditsImagesIndex();
        }
        return CREDITS_IMAGES_INDEX_CACHE;
      }
      function fileCaptionFromName(fileName) {
        const rawBase = String(fileName || "")
          .replace(/\.[^.]+$/g, "");
        const withoutOrderPrefix = rawBase.replace(/^\d+[_-]+/, "");
        const source = withoutOrderPrefix || rawBase;
        return source
          .replace(/[_-]+/g, " ")
          .trim();
      }
      function getLocalContributionImages(contributor) {
        const userId = String(contributor && contributor.userId || "").trim();
        if (!userId) return [];
        const entry = getCreditsImagesIndex()[userId];
        if (!entry || !entry.folder || !Array.isArray(entry.files) || !entry.files.length) return [];
        return entry.files
          .map((file) => String(file || "").trim())
          .filter(Boolean)
          .map((file) => ({
            href: `./images/credits/${encodeURIComponent(entry.folder)}/${encodeURIComponent(file)}`,
            caption: fileCaptionFromName(file)
          }));
      }
      function hasLocalEndMarker(contributor) {
        const userId = String(contributor && contributor.userId || "").trim();
        if (!userId) return false;
        const entry = getCreditsImagesIndex()[userId];
        if (!entry || !entry.folder) return false;
        if (typeof entry.hasEndMarker === "boolean") return entry.hasEndMarker;
        if (!Array.isArray(entry.files)) return false;
        return entry.files.some((file) => String(file || "").trim().toLowerCase() === "fin");
      }

      function rawLang() {
        return String(document.documentElement.getAttribute("lang") || "fr").toLowerCase().slice(0, 2);
      }
      function lang() {
        const code = rawLang();
        const supported = new Set(["fr", "en", "es", "de", "pl", "pt", "nl", "it", "ru", "zh", "ko", "ja"]);
        return supported.has(code) ? code : "en";
      }
      function unsupportedLanguageNoticeText() {
        return "";
      }
      function tRaw(key, fallback) {
        const i18n = window.I18N || {};
        const code = rawLang();
        const fromRaw = i18n[code] && i18n[code][key];
        if (typeof fromRaw === "string" && fromRaw) return fromRaw;
        const fromEn = i18n.en && i18n.en[key];
        if (typeof fromEn === "string" && fromEn) return fromEn;
        const fromFr = i18n.fr && i18n.fr[key];
        if (typeof fromFr === "string" && fromFr) return fromFr;
        return fallback;
      }
      function t(key, fallback) {
        const i18n = window.I18N || {};
        const code = lang();
        const fromLang = i18n[code] && i18n[code][key];
        if (typeof fromLang === "string" && fromLang) return fromLang;
        const fromEn = i18n.en && i18n.en[key];
        if (typeof fromEn === "string" && fromEn) return fromEn;
        if (code === "fr") {
          const fromFr = i18n.fr && i18n.fr[key];
          if (typeof fromFr === "string" && fromFr) return fromFr;
        }
        return fallback;
      }
      function formatMessage(template, values) {
        const source = String(template || "");
        return source.replace(/\{([a-z0-9_]+)\}/gi, (match, key) => {
          if (!values || typeof values !== "object") return match;
          const value = values[key];
          return value == null ? match : String(value);
        });
      }
      function normalizeHeader(raw) {
        return String(raw || "")
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "");
      }
      function firstNonEmpty(obj, keys) {
        for (const key of keys) {
          const value = String(obj[key] ?? "").trim();
          if (value) return value;
        }
        return "";
      }
      function firstParsedValue(obj, keys, parser) {
        for (const key of keys) {
          const parsed = parser(obj[key]);
          if (parsed) return parsed;
        }
        return "";
      }
      const SHEET_LANGS = ["fr", "en", "es", "de", "pl", "pt", "nl", "it", "ru", "zh", "ko", "ja"];
      function collectLocalizedValues(row, prefix) {
        const out = {};
        SHEET_LANGS.forEach((code) => {
          const value = String(row && row[`${prefix}_${code}`] || "").trim();
          if (value) out[code] = value;
        });
        return out;
      }
      function resolveLocalizedValue(defaultValue, valuesByLang) {
        const code = lang();
        const localized = String(valuesByLang && valuesByLang[code] || "").trim();
        if (localized) return localized;
        if (code === "fr") return String(defaultValue || "").trim();
        const english = String(valuesByLang && valuesByLang.en || "").trim();
        if (english) return english;
        return String(defaultValue || "").trim();
      }
      function normalizeRoleText(raw) {
        return String(raw || "").replace(/\\+/g, "\n").trim();
      }
      function normalizeCategoryText(raw) {
        const source = String(raw || "")
          .replace(/\\+/g, "\n")
          .trim();
        if (!source) return "";
        const parts = source
          .split(/\r?\n+/)
          .map((line) => String(line || "").trim())
          .filter(Boolean);
        return parts[0] || "";
      }
      function splitMultilineValues(raw) {
        const source = String(raw || "")
          .replace(/\\+/g, "\n")
          .trim();
        if (!source) return [];
        return source
          .split(/\r?\n+/)
          .map((line) => String(line || "").trim())
          .filter(Boolean);
      }
      function normalizeHexColor(raw) {
        const match = String(raw || "").trim().match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i);
        if (!match) return "";
        const hex = String(match[1] || "").toLowerCase();
        if (hex.length === 3) {
          return `#${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
        }
        return `#${hex}`;
      }
      function contrastTextForHex(hexColor) {
        const hex = normalizeHexColor(hexColor);
        if (!hex) return "#ffffff";
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const brightness = (r * 299 + g * 587 + b * 114) / 1000;
        return brightness >= 145 ? "#000000" : "#ffffff";
      }
      function parseRoleLine(rawLine) {
        const source = String(rawLine || "").trim();
        if (!source) return null;
        const colorMatch = source.match(/[\(\uff08]\s*#([0-9a-f]{3}|[0-9a-f]{6})\s*[\)\uff09]/i);
        const bgColor = colorMatch ? normalizeHexColor(colorMatch[1]) : "";
        const label = source
          .replace(/[\(\uff08]\s*#(?:[0-9a-f]{3}|[0-9a-f]{6})\s*[\)\uff09]/ig, " ")
          .replace(/\s+/g, " ")
          .trim();
        if (!label) return null;
        return {
          label,
          bgColor,
          textColor: bgColor ? contrastTextForHex(bgColor) : ""
        };
      }
      function parseRoleItemsWithColors(rawText) {
        const source = String(rawText || "")
          .replace(/\\+/g, "\n")
          .trim();
        if (!source) return [];
        const out = [];
        const seen = new Set();
        const regex = /([^\\\r\n]+?)\s*[\(\uff08]\s*#([0-9a-f]{3}|[0-9a-f]{6})\s*[\)\uff09]/gi;
        let match = null;
        while ((match = regex.exec(source)) !== null) {
          const label = String(match[1] || "").replace(/\s+/g, " ").trim();
          const bgColor = normalizeHexColor(match[2] || "");
          if (!label || !bgColor) continue;
          const key = `${label.toLowerCase()}|${bgColor}`;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({
            label,
            bgColor,
            textColor: contrastTextForHex(bgColor)
          });
        }
        return out;
      }
      function normalizeRoleKey(raw) {
        return String(raw || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }
      function roleTranslationKeyForLabel(rawLabel) {
        const key = normalizeRoleKey(rawLabel);
        if (!key) return "";
        const has = (token) => key.includes(token);
        const hasAny = (tokens) => tokens.some((token) => has(token));
        const hasWord = (word) => new RegExp(`(?:^|\\s)${word}(?:\\s|$)`).test(key);
        const hasTexture = hasAny(["texture", "textures"]);
        const hasVehicle = hasAny(["vehicule", "vehicules", "vehicle", "vehicles", "veicoli", "pojazd"]);
        const hasTrailer = hasAny(["remorque", "remorques", "trailer", "trailers", "rimorchio", "rimorchi", "reboque", "reboques", "naczepa", "naczep"]);

        if (hasAny(["gerant du projet", "project manager", "project lead"])) return "credits_role_manager";
        if (hasAny(["developpeur", "developer", "developpeuse"])) return "credits_role_developer";
        if (hasAny(["administrateur", "administrator"]) || hasWord("admin")) return "credits_role_administrator";
        if (hasAny(["moderateur", "moderator"]) || hasWord("modo")) return "credits_role_moderator";
        if (hasAny(["animateur", "animator"])) return "credits_role_animator";
        if (hasAny(["contributeur", "contributor"])) return "credits_role_contributor";
        if (hasAny([
          "server booster",
          "supporter",
          "moddeurs",
          "modders",
          "modder",
          "createur de contenu",
          "content creator",
          "soutien",
          "support",
          "acces vocal prive",
          "private voice access",
          "notification"
        ])) return "credits_role_contributor";

        if (hasAny(["mapping", "cartographie", "mappeo", "mapeamento", "mapowanie", "mappatura"])) return "credits_term_mapping";
        if (hasAny(["modeles 3d", "modele 3d", "3d models", "3d model", "modelli 3d", "modelos 3d", "modelle 3d", "modele 3 d"])) return "credits_term_3d_models";
        if (hasAny(["logiciels", "logiciel", "software", "softwares", "programme", "programmes", "programa", "programas", "oprogramowanie"])) return "credits_term_software";
        if (has("dbus world") && hasAny(["ligne", "lignes", "line", "lines", "linhas", "linie", "linee"])) return "credits_term_dbus_world_lines";
        if (hasTexture && hasVehicle && (hasWord("ia") || hasWord("ai"))) return "credits_term_ai_vehicle_textures";
        if (hasTexture && hasVehicle && hasAny(["modde", "modded", "moddees", "moddes", "modados", "moddati", "modyfikowanych", "gemodde"])) return "credits_term_modded_vehicle_textures";
        if (hasTexture && hasTrailer) {
          const singularPattern = /(?:^|\s)(texture)\s+(remorque|trailer|rimorchio|reboque|naczepa)(?:\s|$)/;
          return singularPattern.test(key) ? "credits_term_trailer_texture" : "credits_term_trailer_textures";
        }
        return "";
      }
      function roleTranslationKeyFromColor(rawColor) {
        const color = normalizeHexColor(rawColor);
        if (!color) return "";
        if (color === "#a9c9ff") return "credits_role_manager";
        if (color === "#0053a1") return "credits_role_developer";
        if (color === "#aa3b3b") return "credits_role_administrator";
        if (color === "#c06824") return "credits_role_moderator";
        if (color === "#70e1f5" || color === "#ffe300") return "credits_role_animator";
        if (color === "#ff0000" || color === "#4cadd0") return "credits_role_contributor";
        return "";
      }
      function translateRoleLabel(rawLabelForLookup, fallbackLabel, rawColor) {
        const key = roleTranslationKeyForLabel(rawLabelForLookup) || roleTranslationKeyFromColor(rawColor);
        const fallback = String(fallbackLabel || rawLabelForLookup || "").trim();
        if (!key) return fallback;
        return String(t(key, fallback) || "").trim() || fallback;

          roleBtn.className = "credit-modal-role-btn is-static";
          roleBtn.textContent = entry.title;
          roleBtn.setAttribute("aria-disabled", "true");
          roleBtn.tabIndex = -1;
          const tooltipText = String(entry && entry.tooltipText || "").trim();
          if (tooltipText) {
            roleBtn.title = tooltipText;
            roleBtn.classList.add("has-tooltip");
            roleBtn.setAttribute("aria-label", tooltipText);
          } else {
            roleBtn.setAttribute("aria-label", entry.title);
          }
          roleButtons.appendChild(roleBtn);

          const fallbackCaptionLines = [];
          if (inlineLabel) fallbackCaptionLines.push(inlineLabel);
          detailLines.forEach((line) => fallbackCaptionLines.push(line));

          if (hasImages) {
            entry.imageItems.forEach((imageItem, imageIndex) => {
              const href = String(imageItem && imageItem.url || "").trim();
              if (!href) return;
              const explicitCaption = String(imageItem && imageItem.caption || "").trim();
              const fallbackCaption = fallbackCaptionLines[imageIndex] || fallbackCaptionLines[0] || "";
              parsedGroupedImages.push({
                href,
                caption: explicitCaption || fallbackCaption
              });
            });
            return;
          }

          if (inlineLabel) groupedText.push(inlineLabel);
          if (detailText) {
            String(detailText)
              .split(/\r?\n+/)
              .map((line) => line.trim())
              .filter(Boolean)
              .forEach((line) => groupedText.push(line));
          }
        });
        const isFrenchUi = lang() === "fr";
        const hasPlusContributionImage = hasLocalEndMarker(contributor);
        const localGroupedImages = getLocalContributionImages(contributor);
        let groupedImages = localGroupedImages.length ? [...localGroupedImages] : [...parsedGroupedImages];
        const isFinPngHref = (href) => /(?:^|\/)fin\.png(?:$|[?#])/i.test(String(href || "").trim());
        if (hasPlusContributionImage) {
          const plusHref = "./images/credits/fin.png";
          const plusAlreadyPresent = groupedImages.some((item) => {
            const href = String(item && item.href || "").trim();
            return isFinPngHref(href);
          });
          if (!plusAlreadyPresent) groupedImages.push({ href: plusHref, caption: "" });
        }
        if (!isFrenchUi) {
          const hadFinMarkerVisual = hasPlusContributionImage || groupedImages.some((item) => isFinPngHref(item && item.href));
          groupedImages = groupedImages.filter((item) => !isFinPngHref(item && item.href));
          if (hadFinMarkerVisual) {
            groupedImages.push({
              isMoreText: true,
              text: "AND MUCH MORE!"
            });
          }
        }

        let initCarouselState = null;
        if (groupedImages.length) {
          const showCarouselCaptions = lang() === "fr";
          const panel = document.createElement("div");
          panel.className = "credit-modal-role-panel";
          const carousel = document.createElement("div");
          carousel.className = "credit-modal-carousel";
          const prevBtn = document.createElement("button");
          prevBtn.type = "button";
          prevBtn.className = "credit-modal-carousel-btn is-prev";
          prevBtn.setAttribute("aria-label", t("credits_carousel_prev", "Previous image"));
          prevBtn.textContent = "‹";
          const images = document.createElement("div");
          images.className = "credit-modal-images";
          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          nextBtn.className = "credit-modal-carousel-btn is-next";
          nextBtn.setAttribute("aria-label", t("credits_carousel_next", "Next image"));
          nextBtn.textContent = "›";

          const setBtnState = (btn, disabled) => {
            btn.disabled = !!disabled;
            btn.setAttribute("aria-disabled", disabled ? "true" : "false");
            btn.classList.toggle("is-disabled", !!disabled);
          };
          const updateCarouselButtons = () => {
            const maxScroll = Math.max(0, images.scrollWidth - images.clientWidth);
            const hideButtons = maxScroll <= 2;
            prevBtn.hidden = hideButtons;
            nextBtn.hidden = hideButtons;
            if (hideButtons) {
              setBtnState(prevBtn, true);
              setBtnState(nextBtn, true);
              return;
            }
            const firstItem = images.firstElementChild;
            const firstDelta = firstItem
              ? firstItem.getBoundingClientRect().left - images.getBoundingClientRect().left
              : 0;
            const atStart = images.scrollLeft <= 1 || firstDelta >= -2;
            setBtnState(prevBtn, atStart);
            setBtnState(nextBtn, images.scrollLeft >= maxScroll - 1);
          };
          initCarouselState = () => {
            images.scrollTo({ left: 0, top: 0, behavior: "auto" });
            images.scrollLeft = 0;
            const firstItem = images.firstElementChild;
            if (firstItem && typeof firstItem.scrollIntoView === "function") {
              try {
                firstItem.scrollIntoView({ inline: "start", block: "nearest", behavior: "auto" });
              } catch {}
            }
            setBtnState(prevBtn, true);
            setBtnState(nextBtn, false);
            updateCarouselButtons();
          };

          groupedImages.forEach((item) => {
            if (item && item.isMoreText) {
              const moreItem = document.createElement("div");
              moreItem.className = "credit-modal-image-link is-more-text";
              const moreText = document.createElement("p");
              moreText.className = "credit-modal-more-text";
              moreText.textContent = String(item.text || "AND MUCH + MORE!");
              moreItem.appendChild(moreText);
              images.appendChild(moreItem);
              return;
            }
            const link = document.createElement("a");
            link.className = "credit-modal-image-link";
            link.href = item.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            const stage = document.createElement("div");
            stage.className = "credit-modal-image-stage is-loading";
            const loader = document.createElement("div");
            loader.className = "credit-modal-image-loader";
            loader.setAttribute("aria-hidden", "true");
            const loaderSpinner = document.createElement("span");
            loaderSpinner.className = "credit-modal-image-loader-spinner";
            const loaderLabel = document.createElement("span");
            loaderLabel.className = "credit-modal-image-loader-label";
            loaderLabel.textContent = t("credits_loading", "Loading");
            const loaderProgress = document.createElement("span");
            loaderProgress.className = "credit-modal-image-loader-progress";
            loaderProgress.textContent = "0%";
            loader.appendChild(loaderSpinner);
            loader.appendChild(loaderLabel);
            loader.appendChild(loaderProgress);
            const img = document.createElement("img");
            img.className = "credit-modal-image";
            img.loading = "lazy";
            img.alt = formatMessage(
              t("credits_contribution_image_alt", "Contribution image: {name}"),
              { name: item.caption || "Contribution" }
            );
            let progressValue = 0;
            let isSettled = false;
            let progressTimer = window.setInterval(() => {
              if (isSettled) {
                clearInterval(progressTimer);
                progressTimer = 0;
                return;
              }
              if (progressValue >= 94) {
                clearInterval(progressTimer);
                progressTimer = 0;
                return;
              }
              const remaining = 94 - progressValue;
              const step = remaining > 32 ? 6 : remaining > 18 ? 4 : 2;
              progressValue = Math.min(94, progressValue + step);
              loaderProgress.textContent = `${progressValue}%`;
            }, 120);
            const stopProgressTimer = () => {
              if (!progressTimer) return;
              clearInterval(progressTimer);
              progressTimer = 0;
            };
            const setProgress = (value) => {
              const next = Math.max(progressValue, Math.min(100, Math.round(Number(value) || 0)));
              if (next === progressValue) return;
              progressValue = next;
              loaderProgress.textContent = `${progressValue}%`;
            };
            const markImageLoaded = () => {
              if (isSettled) return;
              isSettled = true;
              stopProgressTimer();
              setProgress(100);
              stage.classList.remove("is-loading");
              stage.classList.add("is-loaded");
              window.requestAnimationFrame(updateCarouselButtons);
            };
            const markImageError = () => {
              if (isSettled) return;
              isSettled = true;
              stopProgressTimer();
              stage.classList.remove("is-loading");
              stage.classList.add("is-error");
              loaderLabel.textContent = t("credits_error", "Error");
              loaderProgress.textContent = "0%";
              window.requestAnimationFrame(updateCarouselButtons);
            };
            img.addEventListener("load", markImageLoaded, { once: true });
            img.addEventListener("error", markImageError, { once: true });
            img.src = item.href;
            if (img.complete && img.naturalWidth > 0) {
              markImageLoaded();
            }
            stage.appendChild(img);
            stage.appendChild(loader);
            link.appendChild(stage);
            if (showCarouselCaptions && item.caption) {
              const captionEl = document.createElement("p");
              captionEl.className = "credit-modal-image-caption";
              captionEl.textContent = item.caption;
              link.appendChild(captionEl);
            }
            images.appendChild(link);
          });

          const stepSize = () => Math.max(220, Math.round(images.clientWidth * 0.85));
          prevBtn.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            images.scrollBy({ left: -stepSize(), behavior: "smooth" });
          });
          nextBtn.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            images.scrollBy({ left: stepSize(), behavior: "smooth" });
          });
          images.addEventListener("scroll", updateCarouselButtons, { passive: true });
          enableHorizontalDragScroll(images);

          carousel.appendChild(prevBtn);
          carousel.appendChild(images);
          carousel.appendChild(nextBtn);
          panel.appendChild(carousel);
          roleContent.appendChild(panel);
        }

        if (!groupedImages.length && groupedText.length) {
          groupedText.forEach((line) => {
            const detail = document.createElement("p");
            detail.className = "credit-modal-contrib-detail";
            detail.textContent = line;
            roleContent.appendChild(detail);
          });
        }

        const hasRoleButtons = roleButtons.childElementCount > 0;
        const hasRoleContent = roleContent.childElementCount > 0;
        if (hasRoleButtons || hasRoleContent) {
          statusSection.appendChild(statusTitle);
          if (hasRoleButtons) statusSection.appendChild(roleButtons);
          if (hasRoleContent) statusSection.appendChild(roleContent);
          content.appendChild(statusSection);
        }
        if (typeof initCarouselState === "function") {
          try {
            window.requestAnimationFrame(() => {
              initCarouselState();
              window.requestAnimationFrame(initCarouselState);
            });
            setTimeout(initCarouselState, 80);
          } catch {}
        }
      }
      function openContributorModal(baseContributor, triggerEl, options = {}) {
        const overlay = document.getElementById("creditDetailModal");
        const closeBtn = document.getElementById("creditDetailClose");
        if (!overlay || !baseContributor) return;
        ACTIVE_MODAL_CONTRIBUTOR = baseContributor;
        ACTIVE_MODAL_TRIGGER = triggerEl || null;
        document.querySelectorAll(".credit-item.is-modal-open").forEach((item) => {
          item.classList.remove("is-modal-open");
        });
        if (triggerEl && triggerEl.classList) triggerEl.classList.add("is-modal-open");
        renderContributorModalContent(baseContributor);
        overlay.hidden = false;
        overlay.classList.add("is-open");
        overlay.setAttribute("aria-hidden", "false");
        lockPageScrollForModal();
        if (options.syncUrl !== false) replaceContributorQueryId(getContributorQueryId(baseContributor));
      }
      function refreshContributorModalLocale() {
        if (!ACTIVE_MODAL_CONTRIBUTOR) return;
        renderContributorModalContent(ACTIVE_MODAL_CONTRIBUTOR);
      }
      function bindContributorModalEvents() {
        const overlay = document.getElementById("creditDetailModal");
        const closeBtn = document.getElementById("creditDetailClose");
        if (!overlay || !closeBtn) return;
        closeBtn.addEventListener("click", closeContributorModal);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) closeContributorModal();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !overlay.hidden) {
            event.preventDefault();
            closeContributorModal();
          }
        });
      }
      function buildContributorCard(contributor, baseContributor, socials) {
        const article = document.createElement("article");
        article.className = "credit-item";
        article.tabIndex = 0;
        article.setAttribute(
          "aria-label",
          formatMessage(t("credits_open_details", "Open details for {name}"), { name: contributor.name })
        );
        article.addEventListener("click", (event) => {
          if (event.target instanceof Element && event.target.closest("a")) return;
          openContributorModal(baseContributor, article);
        });
        article.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          if (event.target instanceof Element && event.target.closest("a")) return;
          event.preventDefault();
          openContributorModal(baseContributor, article);
        });

        const photoWrap = document.createElement("div");
        photoWrap.className = "credit-photo-wrap";
        const photo = document.createElement("img");
        photo.className = "credit-photo";
        photo.loading = "lazy";
        photo.src = contributor.avatar;
        photo.alt = formatMessage(
          t("credits_avatar_alt_template", "Profile photo of {name}"),
          { name: contributor.name }
        );
        photoWrap.appendChild(photo);

        const meta = document.createElement("div");
        meta.className = "credit-meta";
        const name = document.createElement("h2");
        name.className = "credit-name";
        const nameMain = document.createElement("span");
        nameMain.className = "credit-name-main";
        nameMain.textContent = contributor.name;
        name.appendChild(nameMain);
        const joinedDateInfo = parseContributorDate(contributor && contributor.joinedDateDisplay || contributor && contributor.joinedDateIso || "");
        const sinceText = joinedDateInfo && joinedDateInfo.date ? formatSinceDate(joinedDateInfo.date) : "";
        if (sinceText) {
          const sinceEl = document.createElement("span");
          sinceEl.className = "credit-name-since-card";
          sinceEl.textContent = sinceText;
          name.appendChild(sinceEl);
        }
        const status = document.createElement("p");
        status.className = "credit-status";
        const statusTitles = contributionTitlesFromText(contributor.status);
        statusTitles.forEach((line) => {
          const statusItem = document.createElement("span");
          statusItem.className = "credit-status-item";
          statusItem.textContent = line;
          status.appendChild(statusItem);
        });

        const head = document.createElement("div");
        head.className = "credit-head";
        head.appendChild(name);
        meta.appendChild(head);
        if (statusTitles.length) meta.appendChild(status);

        article.appendChild(photoWrap);
        article.appendChild(meta);
        return article;
      }
      let FEEDBACK_STATE = { key: "", fallback: "", isError: false, isLoading: false };
      function setFeedback(message, isError, isLoading) {
        const feedback = document.getElementById("creditsFeedback");
        if (!feedback) return;
        feedback.textContent = message || "";
        feedback.classList.toggle("is-error", !!isError);
        feedback.classList.toggle("is-loading", !!isLoading);
      }
      function setFeedbackByKey(key, fallback, isError, isLoading) {
        FEEDBACK_STATE = {
          key: String(key || "").trim(),
          fallback: String(fallback || "").trim(),
          isError: !!isError,
          isLoading: !!isLoading
        };
        setFeedback(FEEDBACK_STATE.key ? t(FEEDBACK_STATE.key, FEEDBACK_STATE.fallback) : "", FEEDBACK_STATE.isError, FEEDBACK_STATE.isLoading);
      }
      function clearFeedback() {
        FEEDBACK_STATE = { key: "", fallback: "", isError: false, isLoading: false };
        setFeedback("", false, false);
      }
      function refreshFeedbackLocale() {
        if (!FEEDBACK_STATE.key) return;
        setFeedback(t(FEEDBACK_STATE.key, FEEDBACK_STATE.fallback), FEEDBACK_STATE.isError, FEEDBACK_STATE.isLoading);
      }
      function renderCredits(contributors) {
        const host = document.getElementById("creditsList");
        if (!host) return;
        host.innerHTML = "";
        CONTRIBUTOR_BY_QUERY_ID = new Map();
        CONTRIBUTOR_TRIGGER_BY_QUERY_ID = new Map();
        const socials = window.SITE_SOCIAL_BUTTONS && typeof window.SITE_SOCIAL_BUTTONS === "object"
          ? window.SITE_SOCIAL_BUTTONS
          : {};
        const groupsMap = new Map();
        contributors.forEach((baseContributor) => {
          const contributor = localizeContributor(baseContributor);
          const category = String(contributor && contributor.category || "").trim() || t("credits_category_other", "Others");
          const categoryRank = rolePriorityIndex(category);
          if (!groupsMap.has(category)) {
            groupsMap.set(category, {
              items: [],
              rank: categoryRank
            });
          }
          const groupRef = groupsMap.get(category);
          if (groupRef && typeof groupRef === "object") {
            if (categoryRank >= 0 && (typeof groupRef.rank !== "number" || groupRef.rank < 0 || categoryRank < groupRef.rank)) {
              groupRef.rank = categoryRank;
            }
            groupRef.items.push({ base: baseContributor, localized: contributor });
          }
        });

        groupsMap.forEach((groupData, category) => {
          const items = Array.isArray(groupData && groupData.items) ? groupData.items : [];
          const group = document.createElement("section");
          group.className = "credits-group";

          const title = document.createElement("h2");
          title.className = "credits-group-title";
          let categoryLabel = category;
          if (lang() === "fr" && items.length > 1 && !/[sx]$/i.test(String(category).trim())) {
            categoryLabel = `${category}s`;
          }
          const rank = typeof groupData === "object" ? Number(groupData.rank) : -1;
          const showCount = rank !== 0;
          title.textContent = showCount ? `${categoryLabel} (${items.length})` : categoryLabel;

          const list = document.createElement("div");
          list.className = "credits-group-list";
          items.forEach((entry) => {
            const card = buildContributorCard(entry.localized, entry.base, socials);
            list.appendChild(card);
            const queryId = getContributorQueryId(entry.base);
            if (queryId) {
              CONTRIBUTOR_BY_QUERY_ID.set(queryId, entry.base);
              CONTRIBUTOR_TRIGGER_BY_QUERY_ID.set(queryId, card);
            }
          });

          group.appendChild(title);
          group.appendChild(list);
          host.appendChild(group);
        });
      }
      async function loadContributors() {
        const links = window.SITE_LINKS && typeof window.SITE_LINKS === "object"
          ? window.SITE_LINKS
          : {};
        const creditsCfg = links.credits && typeof links.credits === "object"
          ? links.credits
          : {};
        const sheetCfg = creditsCfg.sheet && typeof creditsCfg.sheet === "object"
          ? creditsCfg.sheet
          : {};

        const spreadsheetId = String(sheetCfg.spreadsheet_id || "").trim();
        const gid = String(sheetCfg.gid || "0").trim() || "0";
        const cacheMs = Math.max(60000, Number(sheetCfg.cache_ms) || 180000);
        const timeoutMs = Math.max(3000, Number(sheetCfg.timeout_ms) || 10000);

        if (!spreadsheetId) {
          setFeedbackByKey("credits_error", "Error", true, false);
          return ENABLE_LOCAL_MODE ? fallbackContributors() : [];
        }

        const cachedRows = readCache(cacheMs);
        if (cachedRows && cachedRows.length) {
          const contributors = cachedRows.map(contributorFromRow).filter((item) => item && item.name);
          if (contributors.length) {
            setFeedbackByKey("credits_cache_local_loaded", "", false, false);
            return contributors;
          }
        }

        const sheetUrl = buildSheetUrl(spreadsheetId, gid);
        const rows = await fetchSheetRows(sheetUrl, timeoutMs);
        if (rows.length) writeCache(rows);
        const contributors = rows.map(contributorFromRow).filter((item) => item && item.name);
        if (!contributors.length) throw new Error("Sheet is empty");
        clearFeedback();
        return contributors;
      }
      function render() {
        const pageTitle = t("nav_credits", "Credits");
        const visibleTitle = tRaw("nav_credits", pageTitle);
        const titleEl = document.getElementById("creditsTitle");
        if (titleEl) titleEl.textContent = visibleTitle;
        const langNoticeEl = document.getElementById("creditsLangNotice");
        if (langNoticeEl) {
          const langNotice = unsupportedLanguageNoticeText();
          langNoticeEl.textContent = langNotice;
          langNoticeEl.hidden = !langNotice;
        }
        const closeBtn = document.getElementById("creditDetailClose");
        if (closeBtn) closeBtn.setAttribute("aria-label", t("close", "Close"));
        const pageDescription = t("credits_meta_description", "Contributor credits for the Ile-de-France map.");
        const pageMetaTitle = formatMessage(t("credits_meta_page_title", "Ile-de-France Map - {title}"), { title: pageTitle });
        document.title = pageMetaTitle;
        const metaDescription = document.querySelector('meta[name="description"]');
        if (metaDescription) metaDescription.setAttribute("content", pageDescription);
        const ogDescription = document.querySelector('meta[property="og:description"]');
        if (ogDescription) ogDescription.setAttribute("content", pageDescription);
        const twDescription = document.querySelector('meta[name="twitter:description"]');
        if (twDescription) twDescription.setAttribute("content", pageDescription);
        const twTitle = document.querySelector('meta[name="twitter:title"]');
        if (twTitle) twTitle.setAttribute("content", pageMetaTitle);
        const ogSiteName = document.querySelector('meta[property="og:site_name"]');
        if (ogSiteName) ogSiteName.setAttribute("content", pageMetaTitle);
      }
      let CURRENT_CONTRIBUTORS = [];
      function applyContributors(contributors) {
        CURRENT_CONTRIBUTORS = Array.isArray(contributors) ? contributors : [];
        renderCredits(CURRENT_CONTRIBUTORS);
        refreshContributorModalLocale();
        openContributorModalFromUrlIfNeeded();
      }
      initCreditsImagesIndex();
      bindContributorModalEvents();
      render();
      setFeedbackByKey("credits_loading", "Loading", false, true);
      loadContributors()
        .then((contributors) => {
          applyContributors(contributors);
        })
        .catch(() => {
          if (ENABLE_LOCAL_MODE) {
            const fallback = fallbackContributors();
            applyContributors(fallback);
            setFeedbackByKey("credits_error", "Error", true, false);
            return;
          }
          applyContributors([]);
          setFeedbackByKey("credits_error", "Error", true, false);
        });
      new MutationObserver(() => {
        render();
        renderCredits(CURRENT_CONTRIBUTORS);
        refreshContributorModalLocale();
        openContributorModalFromUrlIfNeeded();
        refreshFeedbackLocale();
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["lang"]
      });
    })();
  </script>
  <script>
    window.__setAppReady?.();
  </script>
</body>

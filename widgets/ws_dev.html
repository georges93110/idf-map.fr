<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebSocket game2 DEV</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: #0f0;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 11px;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .header {
      padding: 5px 10px;
      background: #222;
      border-bottom: 1px solid #444;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logs {
      flex: 1;
      overflow-y: auto;
      padding: 5px 10px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .log-entry {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }
    .timestamp {
      color: #888;
      margin-right: 5px;
    }
    .channel {
      color: #fa0;
      font-weight: bold;
    }
    .type {
      color: #0af;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #222;
    }
    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span>WebSocket game2 DEV</span>
    </div>
    <div id="logs" class="logs"></div>
  </div>

  <script>
    var logsContainer = document.getElementById('logs');

    window.addEventListener('message', function(event) {
      var data = event.data;
      if (!data || data.type !== 'ws_log') return;

      var now = new Date();
      var ts = now.getHours().toString().padStart(2, '0') + ':' + 
               now.getMinutes().toString().padStart(2, '0') + ':' + 
               now.getSeconds().toString().padStart(2, '0') + '.' + 
               now.getMilliseconds().toString().padStart(3, '0');

      var content = '';
      try {
        var payload = data.payload;
        if (typeof payload === 'string') {
            payload = JSON.parse(payload);
        }
        
        var channel = payload.channel || payload.kind || 'unknown';
        var type = payload.type || 'msg';
        
        content = '<div class="log-entry">';
        content += '<span class="timestamp">[' + ts + ']</span>';
        content += '<span class="channel">[' + channel + ']</span> ';
        content += '<span class="type">[' + type + ']</span><br>';
        content += '<pre style="margin: 5px 0 0 0; color: #fff;">' + JSON.stringify(payload, null, 2) + '</pre>';
        content += '</div>';
      } catch (e) {
        content = '<div class="log-entry"><span class="timestamp">[' + ts + ']</span> ' + data.payload + '</div>';
      }

      logsContainer.innerHTML = content;
    });
  </script>
</body>
</html>

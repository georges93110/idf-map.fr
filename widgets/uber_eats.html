<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDF Map - Vue navigation</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --bg-app: #000000;
        --phone-bg: #000000;
        --screen-bg: #000000;
        --nav-header-bg: #000000;
        --nav-header-text: #ffffff;
        --nav-footer-bg: #202124;
        --waze-search-main-bg: #202124;
        --waze-search-surface-bg: #484d56;
        --waze-search-border: #3c4043;
        --waze-search-scroll-thumb: #5c636d;
        --waze-search-scroll-track: #202124;
        --waze-search-control-size: calc(35.2px * var(--waze-ui-scale));
        --waze-search-results-scale: 100%;
        --waze-speed-badge-size: 3.35em;
        --text-primary: #111827;
        --text-subtle: #6b7280;
        --waze-ui-scale: 1;
        --leaflet-frame-scale: 1;
        --waze-view-scale: 1;
        --leaflet-window-offset-y: 0em;
        --waze-tilt-deg: 65deg;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-app);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }


      .app-background {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000000;
      }


      .phone-frame {
        width: min(100vw, calc(100vh * (9 / 19.5)));
        aspect-ratio: 9 / 19.5;
        font-size: calc(16px * var(--waze-ui-scale));
        background: var(--phone-bg);
        border-radius: 2.25em;
        padding: 0.75em;
        border: 0.125em solid #3c4048;
        box-shadow:
          0 1.5em 2.5em rgba(0, 0, 0, 0.45),
          0 0 0 0.0625em rgba(255, 255, 255, 0.04);
        position: relative;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }


      .phone-notch {
        position: absolute;
        top: 0.625em;
        left: 50%;
        transform: translateX(-50%);
        width: 40%;
        height: 1em;
        background: #000814;
        border-radius: 62.5em;
      }


      .phone-screen {
        border-radius: 1.625em;
        background: var(--screen-bg);
        overflow: hidden;
        width: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: inset 0 0 0 0.0625em rgba(15, 23, 42, 0.15);
      }
      .phone-screen.dest-loading::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(128, 128, 128, 0.58);
        z-index: 40;
        pointer-events: none;
      }
      .phone-screen.dest-loading::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1.8em;
        height: 1.8em;
        margin-top: -0.9em;
        margin-left: -0.9em;
        border-radius: 50%;
        border: 0.18em solid rgba(255, 255, 255, 0.28);
        border-top-color: #ffffff;
        animation: waze-phone-spin 0.7s linear infinite;
        z-index: 41;
        pointer-events: none;
      }
      @keyframes waze-phone-spin {
        to { transform: rotate(360deg); }
      }


      .nav-header {
        background: var(--nav-header-bg);
        color: var(--nav-header-text);
        padding: 1.5625em 1em 1.5625em;
        margin-top: 0;
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        box-shadow: 0 0.25em 0.875em rgba(15, 23, 42, 0.5);
        position: relative;
        width: 100%;
        z-index: 2;
      }

      .nav-header-content {
        width: 100%;
        display: flex;
        align-items: flex-start;
        padding-inline: 0.75em;
      }

      .nav-header-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.125em;
        min-width: 0;
      }

      .nav-header-distance {
        font-size: 0.88em;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
      }

      .nav-header-street {
        font-size: 1.8em;
        font-weight: 700;
        line-height: 1;
        color: #56bdf6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Zone carte : strictement contenue dans l'ecran GPS */
      .middle-empty {
        flex: 1.7 1 0%;
        display: block;
        padding: 0;
        margin-bottom: 0;
        position: relative;
        perspective: none;
        overflow: hidden;
        min-height: 0;
        z-index: 1;
      }


      .middle-leaflet-stage {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        position: relative;
        overflow: hidden;
        transform-style: flat;
        transform-origin: 50% 50%;
        transform: none;
        z-index: 1;
      }

      .middle-leaflet-stage.no-tilt {
        transform: none;
      }

      .middle-leaflet-stage::after {
        content: none;
      }

      /* wazeLeafletMap : remplit 100% de la zone GPS sans deborder */
      .middle-leaflet-map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        left: 0;
        top: 0;
        border-radius: 0;
        overflow: hidden;
        background: #282e39;
        box-shadow: inset 0 0 0 0.0625em rgba(255, 255, 255, 0.06);
        transform: none;
        transform-origin: 50% 50%;
        touch-action: pan-x pan-y;
      }

      #wazeLeafletStage {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--leaflet-window-offset-y);
        width: 100%;
        height: calc(100% - var(--leaflet-window-offset-y));
        overflow: hidden;
      }

      #wazeLeafletMap {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }

      .middle-leaflet-map::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 24%, rgba(0, 0, 0, 0.1) 100%);
        z-index: 2;
      }

      .middle-leaflet-map.leaflet-container,
      .middle-leaflet-map .leaflet-container {
        width: 100%;
        height: 100%;
        background: #282e39;
        transform: rotate(var(--waze-view-heading, 0deg)) scale(var(--waze-view-scale, 1)) !important;
        transform-origin: var(--waze-rot-origin-x, 50%) var(--waze-rot-origin-y, 50%);
        will-change: transform;
      }

      .middle-leaflet-map .leaflet-tile-pane {
        background: #282e39 !important;
        filter: none;
        mix-blend-mode: normal;
      }

      .middle-leaflet-map .leaflet-tile {
        /* Lift pure blacks to dark gray */
        filter: brightness(1.06) contrast(0.75) saturate(0.95) !important;
        image-rendering: auto;
      }

      .middle-leaflet-map .leaflet-pane,
      .middle-leaflet-map .leaflet-layer,
      .middle-leaflet-map .leaflet-tile-container {
        background: #282e39;
      }

      .middle-leaflet-map .nav-arrow-icon-wrap {
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .middle-leaflet-map .nav-arrow-icon {
        width: 0.875em;
        height: 0.875em;
        border-radius: 62.5em;
        background: radial-gradient(circle at 30% 25%, #8bd3ff 0%, #2c99f4 58%, #0f67bc 100%);
        box-shadow: 0 0.25em 0.75em rgba(15, 23, 42, 0.5), 0 0 0 0.1875em rgba(255, 255, 255, 0.92);
        position: relative;
        --nav-arrow-angle: 0deg;
      }

      .middle-leaflet-map .nav-arrow-icon svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1em;
        height: 1em;
        fill: #ffffff;
        transform: translate(-50%, -50%) rotate(var(--nav-arrow-angle));
        transform-origin: 50% 50%;
      }

      .middle-nav-arrow-fixed {
        display: none;
      }

      .middle-nav-arrow-icon {
        width: 0.875em;
        height: 0.875em;
        border-radius: 62.5em;
        background: radial-gradient(circle at 30% 25%, #8bd3ff 0%, #2c99f4 58%, #0f67bc 100%);
        box-shadow: 0 0.25em 0.75em rgba(15, 23, 42, 0.5), 0 0 0 0.1875em rgba(255, 255, 255, 0.92);
        position: relative;
        --nav-arrow-angle: 0deg;
      }

      .middle-nav-arrow-icon svg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1em;
        height: 1em;
        fill: #ffffff;
        transform: translate(-50%, -50%) rotate(var(--nav-arrow-angle));
        transform-origin: 50% 50%;
      }

      .middle-leaflet-map .nav-route-dir-host {
        background: transparent;
        border: none;
      }

      .middle-leaflet-map .nav-route-dir-rot {
        display: block;
        transform: rotate(var(--nav-dir-angle, 0deg)) scaleX(var(--nav-turn-flip, 1));
        transform-origin: 50% 50%;
      }

      .middle-leaflet-map .nav-route-turn-svg {
        display: block;
        width: 2.125em;
        height: 2.125em;
      }

      .middle-leaflet-map .nav-route-turn-shape {
        fill: #ffffff;
        stroke: #1b2129;
        stroke-width: 0.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .middle-leaflet-map .arrival-flag-icon-wrap {
        background: transparent;
        border: none;
        overflow: visible;
        transform: none;
      }

      .middle-leaflet-map .arrival-end-dot {
        width: 0.9em;
        height: 0.9em;
        border-radius: 62.5em;
        background: #ffffff;
        border: 0.14em solid #000000;
        box-shadow: 0 0 0 0.06em rgba(0, 0, 0, 0.34);
      }

      .map-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8eaed;
        font-size: 0.95rem;
        background: #202124;
        border-radius: 0.875em;
      }

      .middle-zoom-controls {
        position: absolute;
        top: calc(var(--leaflet-window-offset-y) + 0.875em);
        right: 0.875em;
        z-index: 5;
        display: grid;
        width: 3.35em;
        grid-auto-rows: 3.35em;
        gap: 0.5em;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: none;
        backdrop-filter: none;
      }

      .middle-zoom-btn {
        width: 100%;
        font-size: 1.2em;
        font-weight: 700;
        line-height: 1;
        padding: 0;
        background: #202124 !important;
        color: #f1f3f4;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        box-shadow: inset 0 0 0 0.05em rgba(255, 255, 255, 0.08), 0 0.22em 0.55em rgba(0, 0, 0, 0.32);
      }
      .middle-zoom-btn.footer-control {
        cursor: pointer;
      }

      .middle-zoom-btn .middle-zoom-icon {
        width: 58%;
        height: 58%;
        display: block;
        stroke: currentColor;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.4;
      }

      .middle-zoom-btn:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }

      button:disabled {
        cursor: not-allowed !important;
      }

      .middle-overlay-alert {
        position: absolute;
        right: 1em;
        bottom: 1em;
        width: 4em;
        height: 4em;
        border: 0.0625em solid #3c4043;
        border-radius: 62.5em;
        background: #000000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 4;
      }
      .middle-speed-badge {
        position: absolute;
        left: 1em;
        bottom: 0.85em;
        width: var(--waze-speed-badge-size);
        height: var(--waze-speed-badge-size);
        padding: 0;
        border: 0.0625em solid #3c4043;
        border-radius: 50%;
        background: rgba(32, 33, 36, 0.95);
        color: #e8eaed;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.04em;
        box-shadow: 0 0.22em 0.55em rgba(0, 0, 0, 0.32);
        pointer-events: none;
        z-index: 4;
      }
      .middle-speed-value {
        font-size: 1.34em;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      .middle-speed-unit {
        font-size: 0.58em;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.02em;
        text-transform: lowercase;
        opacity: 0.95;
      }


      .middle-overlay-alert svg {
        width: 2.125em;
        height: 2.125em;
      }

      .alert-triangle {
        fill: #f2c84a;
        stroke: #2f3540;
        stroke-width: 3.4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .alert-plus {
        stroke: #1f2937;
        stroke-width: 3.6;
        stroke-linecap: round;
      }

      .nav-footer {
        margin-top: auto;
        background: var(--nav-footer-bg);
        padding: 0.75em 1em 0.875em;
        border-top: 0.0625em solid #3c4043;
        box-shadow: 0 -0.5em 1.25em rgba(15, 23, 42, 0.18);
        position: relative;
        z-index: 3;
        display: grid;
        grid-template-columns: 15% 1fr 15%;
        align-items: center;
        column-gap: 0.875em;
        flex: 0 0 auto;
      }
      .phone-screen.search-open .nav-footer {
        background: var(--waze-search-main-bg);
        border-top-color: var(--waze-search-border);
      }

      .footer-control {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        border: none;
        border-radius: 62.5em;
        background: #484d56;
        color: #e8eaed;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: not-allowed;
        touch-action: manipulation;
      }
      #footerSearchBtn {
        cursor: not-allowed !important;
      }
      #footerSearchBtn:hover {
        cursor: not-allowed !important;
      }
      #footerSearchBtn.is-cancel-active,
      #footerSearchBtn.is-cancel-active:hover {
        cursor: pointer !important;
      }
      #footerSearchBtn:disabled {
        cursor: not-allowed !important;
      }

      .footer-control svg {
        width: 47.4%;
        height: 47.4%;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }
      .footer-control-slot-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      .footer-filter-icon {
        stroke-width: 2.2;
      }

      .footer-gap {
        grid-column: 1 / -1;
        display: block;
        height: 0.25em;
      }
      .nav-center-toast {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        min-width: 10em;
        max-width: 86%;
        padding: 0.62em 0.88em;
        border-radius: 0.7em;
        border: 0.06em solid rgba(255, 255, 255, 0.28);
        background: rgba(0, 0, 0, 0.82);
        color: #ffffff;
        font-size: 0.86em;
        font-weight: 700;
        line-height: 1.25;
        text-align: center;
        z-index: 38;
        pointer-events: none;
        box-shadow: 0 0.4em 1.4em rgba(0, 0, 0, 0.45);
      }
      .nav-center-toast[hidden] {
        display: none !important;
      }
      .nav-cancel-confirm {
        position: absolute;
        inset: 0;
        z-index: 39;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
      }
      .nav-cancel-confirm[hidden] {
        display: none !important;
      }
      .nav-cancel-confirm-card {
        width: min(84%, 18em);
        padding: 0.8em;
        border-radius: 0.7em;
        border: 0.06em solid #3c4043;
        background: var(--nav-footer-bg);
        color: #e8eaed;
      }
      .nav-cancel-confirm-text {
        font-size: 0.9em;
        font-weight: 700;
        text-align: center;
        line-height: 1.3;
      }
      .nav-cancel-confirm-actions {
        margin-top: 0.62em;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5em;
      }
      .nav-cancel-confirm-btn {
        min-height: 2em;
        border: 0.06em solid #3c4043;
        border-radius: 0.45em;
        background: #484d56;
        color: #e8eaed;
        cursor: pointer;
        font-weight: 700;
      }
      .nav-cancel-confirm-btn.is-yes {
        background: #2e6b55;
        border-color: #3f8e71;
        color: #ffffff;
      }
      .nav-cancel-confirm-btn.is-no {
        background: #8f3434;
        border-color: #b74848;
        color: #ffffff;
      }
      .waze-search-overlay {
        position: absolute;
        inset: 0;
        z-index: 45;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        row-gap: 0.7em;
        padding: 1em 0.72em 0.72em;
        background: var(--waze-search-main-bg);
        color: #e8eaed;
        overflow: hidden;
        font-size: 100%;
      }
      .waze-search-overlay[hidden] {
        display: none !important;
      }
      .waze-search-toolbar {
        display: flex;
        align-items: stretch;
        gap: 0.5em;
        padding: 0.24em;
        min-height: var(--waze-search-control-size);
        flex: 0 0 auto;
        background: var(--waze-search-main-bg);
        border-bottom: none;
        border-radius: 0.62em;
      }
      .waze-search-back-btn {
        width: var(--waze-search-control-size);
        height: var(--waze-search-control-size);
        inline-size: var(--waze-search-control-size);
        block-size: var(--waze-search-control-size);
        min-width: var(--waze-search-control-size);
        min-height: var(--waze-search-control-size);
        min-inline-size: var(--waze-search-control-size);
        min-block-size: var(--waze-search-control-size);
        aspect-ratio: 1 / 1;
        border: 0.06em solid var(--waze-search-border);
        border-radius: 999em;
        background: var(--waze-search-surface-bg);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 var(--waze-search-control-size);
        padding: 0;
        margin: 0;
        font-size: 100%;
        line-height: 1;
        align-self: stretch;
        appearance: none;
        -webkit-appearance: none;
      }
      .waze-search-back-btn svg {
        width: 1em;
        height: 1em;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .waze-search-input {
        flex: 1;
        min-width: 0;
        width: 100%;
        height: var(--waze-search-control-size);
        inline-size: 100%;
        block-size: var(--waze-search-control-size);
        min-height: var(--waze-search-control-size);
        min-block-size: var(--waze-search-control-size);
        border-radius: 999em;
        border: 0.06em solid var(--waze-search-border);
        background: #2b2f35;
        color: #e8eaed;
        padding: 0 0.85em;
        font-size: 100%;
        line-height: 1;
        outline: none;
        margin: 0;
        appearance: none;
        -webkit-appearance: none;
      }
      .waze-search-input:focus {
        border-color: #6a727d;
      }
      .waze-search-input::placeholder {
        color: #b6bec8;
      }
      .waze-search-input::-webkit-search-cancel-button {
        -webkit-appearance: none;
        width: 0.82em;
        height: 0.82em;
        cursor: pointer;
        background:
          linear-gradient(45deg, transparent 43%, #ff3b30 43%, #ff3b30 57%, transparent 57%),
          linear-gradient(-45deg, transparent 43%, #ff3b30 43%, #ff3b30 57%, transparent 57%);
      }
      .waze-search-categories-wrap {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: stretch;
        gap: 0.35em;
        flex: 0 0 auto;
        scroll-behavior: smooth;
      }
      .waze-search-categories-nav {
        width: 1.95em;
        min-width: 1.95em;
        border-radius: 0.62em;
        border: 0.06em solid var(--waze-search-border);
        background: var(--waze-search-surface-bg);
        color: #d8dde3;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .waze-search-categories-nav svg {
        width: 0.88em;
        height: 0.88em;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .waze-search-categories-nav:disabled {
        opacity: 0.38;
        cursor: default;
      }
      .waze-search-categories {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.5em;
        padding: 0;
        flex: 1 1 auto;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
        background: var(--waze-search-main-bg);
      }
      .waze-search-cat-btn {
        min-height: 3.4em;
        padding: 0.42em 0.55em;
        min-width: 6.2em;
        border-radius: 0.7em;
        border: 0.06em solid var(--waze-search-border);
        background: var(--waze-search-surface-bg);
        color: #e8eaed;
        font-size: 0.7em;
        font-weight: 700;
        cursor: pointer;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.24em;
      }
      .waze-search-cat-icon {
        width: 1.9em;
        height: 1.9em;
        border-radius: 0.42em;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        const uberOrderPriceEl = document.getElementById("uberOrderPrice");
        const uberOrderDistanceEl = document.getElementById("uberOrderDistance");
        const uberOrderPickupEl = document.getElementById("uberOrderPickup");
        const uberOrderDropoffEl = document.getElementById("uberOrderDropoff");
        const uberOrderCloseBtnEl = document.getElementById("uberOrderCloseBtn");
        const uberOrderAcceptBtnEl = document.getElementById("uberOrderAcceptBtn");

        if (!mapHost) return;

          return;

        const QS = new URLSearchParams(location.search);
        const BRIDGE_HOST_MODE = String(QS.get("host") || "").trim().toLowerCase();
        const BRIDGE_REQUIRE_GAME_SOURCE = BRIDGE_HOST_MODE === "game";
        /* Tilt 3D : ?tilt=0 dÃ©sactive le tilt (pour tests) */
        const useTilt3D = false;
        (function applyTilt3D() {
          const stage = document.getElementById("wazeLeafletStage");
          if (stage) stage.classList.toggle("no-tilt", !useTilt3D);
        })();
        const MAP_FILES_ROOT = "../map_files";
        const VERSION_PATTERN = /^(\d+)\.(\d+)\.(\d+)([a-z])$/i;

        function parseVersion(value) {
          const match = VERSION_PATTERN.exec(String(value || "").trim());
          if (!match) return null;
          return {
            raw: `${parseInt(match[1], 10)}.${parseInt(match[2], 10)}.${parseInt(match[3], 10)}${match[4].toLowerCase()}`,
            major: parseInt(match[1], 10),
            minor: parseInt(match[2], 10),
            patch: parseInt(match[3], 10),
            suffix: match[4].toLowerCase()
          };
        }

        function compareVersions(a, b) {
          if (a.major !== b.major) return a.major - b.major;
          if (a.minor !== b.minor) return a.minor - b.minor;
          if (a.patch !== b.patch) return a.patch - b.patch;
          return a.suffix.localeCompare(b.suffix);
        }

        function loadVersionsFromManifestSync(root) {
          try {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", `${root}/versions.json`, false);
            xhr.send(null);
            if (xhr.status < 200 || xhr.status >= 300) return [];
            const data = JSON.parse(xhr.responseText);
            if (Array.isArray(data)) {
              return data.map((v) => String(v || "").trim()).filter(Boolean);
            }
            if (data && Array.isArray(data.versions)) {
              return data.versions.map((v) => String(v || "").trim()).filter(Boolean);
            }
            return [];
          } catch {
            return [];
          }
        }

        function loadVersionsFromDirectorySync(root) {
          return [];
        }

        function selectLatestVersion(candidates) {
          const parsed = [...new Set(candidates)].map(parseVersion).filter(Boolean);
          if (!parsed.length) return null;
          parsed.sort(compareVersions);
          return parsed[parsed.length - 1].raw;
        }

        function getSortedAvailableVersions(candidates) {
          const byRaw = new Map();
          candidates.forEach((candidate) => {
            const parsed = parseVersion(candidate);
            if (parsed) byRaw.set(parsed.raw, parsed);
          });
          return [...byRaw.values()].sort((a, b) => compareVersions(b, a)).map((v) => v.raw);
        }

        const forcedVersion = String(QS.get("version") || QS.get("v") || "").trim();
        const parsedForcedVersion = parseVersion(forcedVersion);
        const manifestVersions = loadVersionsFromManifestSync(MAP_FILES_ROOT);
        const dirVersions = loadVersionsFromDirectorySync(MAP_FILES_ROOT);
        const AVAILABLE_MAP_VERSIONS = getSortedAvailableVersions([...manifestVersions, ...dirVersions]);

          }
          const arrowPoint = normalizeBridgeWorldPoint(payload.arrow ?? payload.start);
          if (!arrowPoint) return;
          lastVehicleWorldPoint = arrowPoint;
          const arrowLatLng = toLatLngFromXY(arrowPoint.x, arrowPoint.y);
          if (!arrowLatLng) return;
          const eventTimeMs = resolveBridgeEventTimeMs(ts);
          const payloadSpeedKmh = normalizeIncomingSpeedKmh(
            payload.speed ?? payload.kmh ?? payload.vitesse,
            payload.speedUnit ?? payload.velocityUnit ?? payload.kmhUnit ?? payload.speed_unit
          );
          const computedSpeedKmh = computeInstantBridgeSpeedKmh(
            arrowPoint,
            lastBridgeSampleWorldPoint,
            eventTimeMs,
            lastBridgeSampleTimestampMs
          );
          lastBridgeSampleWorldPoint = arrowPoint;
          lastBridgeSampleTimestampMs = eventTimeMs;
          const resolvedSpeedKmh = chooseResolvedBridgeSpeedKmh(payloadSpeedKmh, computedSpeedKmh);
          if (Number.isFinite(resolvedSpeedKmh)) {
            updateBridgeSpeedKmh(resolvedSpeedKmh, { displayKmh: resolvedSpeedKmh });
          }
          const explicitHeadingRaw = payload.heading ?? payload.Heading;
          const explicitHeadingUnit = String(payload.headingUnit ?? payload.unit ?? "");
          const explicitHeadingConvention = String(
            payload.headingConvention ?? (BRIDGE_REQUIRE_GAME_SOURCE ? "north_ccw" : "")
          );
          const explicitHeading = convertHeadingByConvention(
            normalizeIncomingHeadingDeg(explicitHeadingRaw, explicitHeadingUnit),
            explicitHeadingConvention
          );
          const tsDeltaSec = (Number.isFinite(ts) && Number.isFinite(previousTimestamp))
            ? ((ts - previousTimestamp) / 1000)
            : NaN;
          const fromLatLng = lastBridgeArrowLatLng || null;
          const stepDistMeters = fromLatLng ? map.distance(fromLatLng, arrowLatLng) : NaN;
          const validDistance =
            Number.isFinite(stepDistMeters) &&
            stepDistMeters >= headingInferMinStepDistanceM &&
            stepDistMeters <= headingInferMaxStepDistanceM;

            !Number.isFinite(tsDeltaSec) || (tsDeltaSec > 0 && tsDeltaSec <= headingInferMaxDtSec);

                Number.isFinite(inferredHeading) &&

              }
            }

          }
          lastBridgeArrowLatLng = arrowLatLng;
          lastBridgeArrowWorldPoint = arrowPoint;
          if (wazeSearchOverlayOpen) {

            refreshUberActiveNavigation(arrowPoint);
          } else if (uberPendingOrder) {

            }

        }
        function toFiniteTelemetryValue(value) {

          let z = null;

            if (y === null) y = pickTelemetryValue(src, ["y", "Y"]);

            ts: Number.isFinite(Number(rawTs)) ? Number(rawTs) : Date.now(),

            start: { x, y, z },

            headingConvention: "north_ccw"

            packet.end = Object.assign({}, lastBridgeDestinationWorldPoint);

            packet.routeSelected = true;

            }
            if (Array.isArray(lastBridgeRouteWorldPoints) && lastBridgeRouteWorldPoints.length >= MIN_NAV_ROUTE_POINTS) {

            }
            if (Number.isFinite(Number(lastBridgeRouteReachedIndex))) {
              packet.routeReachedIndex = Math.floor(Number(lastBridgeRouteReachedIndex));
            }
            if (Number.isFinite(Number(lastBridgeRouteTargetIndex))) {

          if (!envelope || typeof envelope !== "object") return;

          if (bridgeOutbox.length > 140) bridgeOutbox.shift();

        function flushBridgeOutbox() {

        function scheduleBridgeReconnect() {

            bridgeReconnectTimer = 0;

          ensureBridgeSocket();

        fullBounds = L.latLngBounds(

        L.tileLayer(`${TILE_BASE}/{z}/{x}/{y}.png`, {

            const targetLatLng = toLatLngFromWorldPoint(TARGET_CENTER_WORLD);

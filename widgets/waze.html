<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDF Map - Vue navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-edgebuffer@1.0.6/src/leaflet.edgebuffer.js"></script>
  <style>
    :root {
      --bg-app: transparent;
      --phone-bg: #000000;
      --screen-bg: #202020;
      --nav-header-bg: #000000;
      --nav-header-text: #ffffff;
      --nav-footer-bg: #202124;
      --waze-search-main-bg: #202124;
      --waze-search-surface-bg: #484d56;
      --waze-search-border: #3c4043;
      --waze-search-scroll-thumb: #5c636d;
      --waze-search-scroll-track: #202124;
      --waze-search-control-size: calc(35.2px * var(--waze-ui-scale));
      --waze-search-results-scale: 100%;
      --waze-speed-badge-size: 3.35em;
      --waze-speed-text-scale: 1.25;
      --text-primary: #111827;
      --text-subtle: #6b7280;
      --waze-ui-scale: 1;
      --leaflet-frame-scale: 1;
      --waze-view-scale: 1;
      --leaflet-window-offset-y: 0em;
      --waze-tilt-deg: 0deg;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
    }

    .app-background {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
    }

    .phone-frame {
      width: min(100vw, calc(100vh * (9 / 19.5)));
      aspect-ratio: 9 / 19.5;
      font-size: calc(16px * var(--waze-ui-scale));
      background: var(--phone-bg);
      border-radius: 2.25em;
      padding: 0.75em;
      border: 0.125em solid #3c4048;
      box-shadow:
        0 1.5em 2.5em rgba(0, 0, 0, 0.45),
        0 0 0 0.0625em rgba(255, 255, 255, 0.04);
      position: relative;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    .phone-notch {
      position: absolute;
      top: 0.625em;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 1em;
      background: #000814;
      border-radius: 62.5em;
    }

    .phone-screen {
      border-radius: 1.625em;
      background: var(--screen-bg);
      overflow: hidden;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: inset 0 0 0 0.0625em rgba(15, 23, 42, 0.15);
    }

    .phone-screen.dest-loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(128, 128, 128, 0.58);
      z-index: 40;
      pointer-events: none;
    }

    .phone-screen.dest-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1.8em;
      height: 1.8em;
      margin-top: -0.9em;
      margin-left: -0.9em;
      border-radius: 50%;
      border: 0.18em solid rgba(255, 255, 255, 0.28);
      border-top-color: #ffffff;
      animation: waze-phone-spin 0.7s linear infinite;
      z-index: 41;
      pointer-events: none;
    }

    @keyframes waze-phone-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .nav-header {
      background: var(--nav-header-bg);
      color: var(--nav-header-text);
      padding: 1.5625em 1em 1.5625em;
      margin-top: 0;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      box-shadow: 0 0.25em 0.875em rgba(15, 23, 42, 0.5);
      position: relative;
      width: 100%;
      z-index: 2;
    }

    .nav-header-content {
      width: 100%;
      display: flex;
      align-items: flex-start;
      padding-inline: 0.75em;
    }

    .nav-header-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.125em;
      min-width: 0;
    }

    .nav-header-distance {
      font-size: 0.88em;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
    }

    .nav-header-street {
      font-size: 1.8em;
      font-weight: 700;
      line-height: 1;
      color: #56bdf6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .middle-empty {
      flex: 1.7 1 0%;
      display: block;
      padding: 0;
      margin-bottom: 0;
      position: relative;
      perspective: none;
      overflow: hidden;
      min-height: 0;
      z-index: 1;
    }

    .middle-leaflet-stage {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      transform-style: flat;
      transform-origin: 50% 50%;
      transform: none;
      z-index: 1;
    }

    .middle-leaflet-stage.no-tilt {
      transform: none !important;
    }

    .middle-leaflet-stage::after {
      content: none;
    }

    /* wazeLeafletMap : remplit 100% de la zone GPS sans deborder */
    .middle-leaflet-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      left: 0;
      top: 0;
      border-radius: 0;
      overflow: hidden;
      background: #282e39;
      box-shadow: inset 0 0 0 0.0625em rgba(255, 255, 255, 0.06);
      transform: none;
      transform-origin: 50% 50%;
      touch-action: pan-x pan-y;
    }

    #wazeLeafletStage {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--leaflet-window-offset-y);
      width: 100%;
      height: calc(100% - var(--leaflet-window-offset-y));
      overflow: hidden;
    }

    #wazeLeafletMap {
      position: absolute !important;
      /* On agrandit massivement pour couvrir les rotations sur un écran très vertical */
      top: -100% !important;
      left: -100% !important;
      width: 300% !important;
      height: 300% !important;
      overflow: hidden !important;
    }

    .middle-leaflet-map::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 24%, rgba(0, 0, 0, 0.1) 100%);
      z-index: 2;
    }

    .middle-leaflet-map.leaflet-container,
    .middle-leaflet-map .leaflet-container {
      width: 100%;
      height: 100%;
      background: #282e39;
      transform: rotate(var(--waze-view-heading, 0deg)) scale(var(--waze-view-scale, 1)) !important;
      transform-origin: var(--waze-rot-origin-x, 50%) var(--waze-rot-origin-y, 50%);
      will-change: transform;
    }

    .middle-leaflet-map .leaflet-tile-pane {
      background: #282e39 !important;
      filter: none;
      mix-blend-mode: normal;
    }

    .middle-leaflet-map .leaflet-tile {
      /* Lift pure blacks to dark gray */
      filter: brightness(1.06) contrast(0.75) saturate(0.95) !important;
      image-rendering: auto;
    }

    .middle-leaflet-map .leaflet-pane,
    .middle-leaflet-map .leaflet-layer,
    .middle-leaflet-map .leaflet-tile-container {
      background: #282e39;
    }

    .middle-leaflet-map .nav-arrow-icon-wrap {
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .middle-leaflet-map .nav-arrow-icon {
      width: 20%;
      height: 20%;
      border-radius: 62.5em;
      background: radial-gradient(circle at 30% 25%, #8bd3ff 0%, #2c99f4 58%, #0f67bc 100%);
      box-shadow: 0 0.25em 0.75em rgba(15, 23, 42, 0.5), 0 0 0 0.1875em rgba(255, 255, 255, 0.92);
      position: relative;
      --nav-arrow-angle: 0deg;
    }

    .middle-leaflet-map .nav-arrow-icon svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 85%;
      height: 85%;
      fill: #ffffff;
      transform: translate(-50%, -50%) rotate(var(--nav-arrow-angle));
      transform-origin: 50% 50%;
    }

    .middle-nav-arrow-fixed {
      display: none;
    }

    .middle-nav-arrow-icon {
      width: 0.875em;
      height: 0.875em;
      border-radius: 62.5em;
      background: radial-gradient(circle at 30% 25%, #8bd3ff 0%, #2c99f4 58%, #0f67bc 100%);
      box-shadow: 0 0.25em 0.75em rgba(15, 23, 42, 0.5), 0 0 0 0.1875em rgba(255, 255, 255, 0.92);
      position: relative;
      --nav-arrow-angle: 0deg;
    }

    .middle-nav-arrow-icon svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 85%;
      height: 85%;
      fill: #ffffff;
      transform: translate(-50%, -50%) rotate(var(--nav-arrow-angle));
      transform-origin: 50% 50%;
    }

    .middle-leaflet-map .nav-route-dir-host {
      background: transparent;
      border: none;
    }

    .middle-leaflet-map .nav-route-dir-rot {
      display: block;
      transform: rotate(var(--nav-dir-angle, 0deg)) scaleX(var(--nav-turn-flip, 1));
      transform-origin: 50% 50%;
    }

    .middle-leaflet-map .nav-route-turn-svg {
      display: block;
      width: 2.125em;
      height: 2.125em;
    }

    .middle-leaflet-map .nav-route-turn-shape {
      fill: #ffffff;
      stroke: #1b2129;
      stroke-width: 0.8;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .middle-leaflet-map .arrival-flag-icon-wrap {
      background: transparent;
      border: none;
      overflow: visible;
      transform: none;
    }

    .middle-leaflet-map .arrival-end-dot {
      width: 0.9em;
      height: 0.9em;
      border-radius: 62.5em;
      background: #ffffff;
      border: 0.14em solid #000000;
      box-shadow: 0 0 0 0.06em rgba(0, 0, 0, 0.34);
    }

    .map-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaed;
      font-size: 0.95rem;
      background: #202124;
      border-radius: 0.875em;
    }

    .middle-zoom-controls {
      position: absolute;
      top: calc(var(--leaflet-window-offset-y) + 0.875em);
      right: 0.875em;
      z-index: 5;
      display: grid;
      width: 3.35em;
      grid-auto-rows: 3.35em;
      gap: 0.5em;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
      backdrop-filter: none;
    }

    .middle-zoom-btn {
      width: 100%;
      font-size: 1.2em;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      background: #202124 !important;
      color: #f1f3f4;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      box-shadow: inset 0 0 0 0.05em rgba(255, 255, 255, 0.08), 0 0.22em 0.55em rgba(0, 0, 0, 0.32);
    }

    .middle-zoom-btn.footer-control {
      cursor: pointer;
    }

    .middle-zoom-btn .middle-zoom-icon {
      width: 58%;
      height: 58%;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.4;
    }

    .middle-zoom-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    button:disabled {
      cursor: not-allowed !important;
    }

    .middle-overlay-alert {
      position: absolute;
      right: 1em;
      bottom: 1em;
      width: 4em;
      height: 4em;
      border: 0.0625em solid #3c4043;
      border-radius: 62.5em;
      background: #000000;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }

    .middle-speed-badge {
      position: absolute;
      left: 1em;
      bottom: 0.85em;
      width: var(--waze-speed-badge-size);
      height: var(--waze-speed-badge-size);
      padding: 0;
      border: 0.0625em solid #3c4043;
      border-radius: 50%;
      background: rgba(32, 33, 36, 0.95);
      color: #e8eaed;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.04em;
      box-shadow: 0 0.22em 0.55em rgba(0, 0, 0, 0.32);
      pointer-events: none;
      z-index: 4;
    }

    .middle-speed-value {
      font-size: calc(1.34em * var(--waze-speed-text-scale));
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.01em;
    }

    .middle-speed-unit {
      font-size: calc(0.58em * var(--waze-speed-text-scale));
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      opacity: 0.95;
    }

    opacity: 0.85;
    }

    .middle-clock {
      position: absolute;
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
      background: #151516;
      color: #ffffff;
      padding: 3px 12px;
      border-radius: 8px;
      font-size: 1.15em;
      font-weight: 800;
      z-index: 10;
      box-shadow: 0 0.15em 0.4em rgba(0, 0, 0, 0.35);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
    }

    .middle-overlay-alert svg {
      width: 2.125em;
      height: 2.125em;
    }

    .alert-triangle {
      fill: #f2c84a;
      stroke: #2f3540;
      stroke-width: 3.4;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .alert-plus {
      stroke: #1f2937;
      stroke-width: 3.6;
      stroke-linecap: round;
    }

    .nav-footer {
      margin-top: auto;
      background: var(--nav-footer-bg);
      padding: 0.75em 1em 0.875em;
      border-top: 0.0625em solid #3c4043;
      box-shadow: 0 -0.5em 1.25em rgba(15, 23, 42, 0.18);
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: 15% 1fr 15%;
      align-items: center;
      column-gap: 0.875em;
      flex: 0 0 auto;
    }

    .phone-screen.search-open .nav-footer {
      background: var(--waze-search-main-bg);
      border-top-color: var(--waze-search-border);
    }

    .footer-control {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 62.5em;
      background: #484d56;
      color: #e8eaed;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
      touch-action: manipulation;
    }

    #footerSearchBtn {
      cursor: pointer;
    }

    #footerSearchBtn:disabled {
      cursor: not-allowed !important;
    }

    .footer-control svg {
      width: 47.4%;
      height: 47.4%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .footer-control-slot-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .footer-filter-icon {
      stroke-width: 2.2;
    }

    .footer-gap {
      grid-column: 1 / -1;
      display: block;
      height: 0.25em;
    }

    .nav-center-toast {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 10em;
      max-width: 86%;
      padding: 0.62em 0.88em;
      border-radius: 0.7em;
      border: 0.06em solid rgba(255, 255, 255, 0.28);
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 0.86em;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      z-index: 38;
      pointer-events: none;
      box-shadow: 0 0.4em 1.4em rgba(0, 0, 0, 0.45);
    }

    .nav-center-toast[hidden] {
      display: none !important;
    }

    .nav-cancel-confirm {
      position: absolute;
      inset: 0;
      z-index: 39;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }

    .nav-cancel-confirm[hidden] {
      display: none !important;
    }

    .nav-cancel-confirm-card {
      width: min(84%, 18em);
      padding: 0.8em;
      border-radius: 0.7em;
      border: 0.06em solid #3c4043;
      background: var(--nav-footer-bg);
      color: #e8eaed;
    }

    .nav-cancel-confirm-text {
      font-size: 0.9em;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }

    .nav-cancel-confirm-actions {
      margin-top: 0.62em;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5em;
    }

    .nav-cancel-confirm-btn {
      min-height: 2em;
      border: 0.06em solid #3c4043;
      border-radius: 0.45em;
      background: #484d56;
      color: #e8eaed;
      cursor: pointer;
      font-weight: 700;
    }

    .nav-cancel-confirm-btn.is-yes {
      background: #2e6b55;
      border-color: #3f8e71;
      color: #ffffff;
    }

    .nav-cancel-confirm-btn.is-no {
      background: #8f3434;
      border-color: #b74848;
      color: #ffffff;
    }

    .waze-search-overlay {
      position: absolute;
      inset: 0;
      z-index: 45;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      row-gap: 0.7em;
      padding: 1em 0.72em 0.72em;
      background: var(--waze-search-main-bg);
      color: #e8eaed;
      overflow: hidden;
      font-size: 100%;
    }

    .waze-search-overlay[hidden] {
      display: none !important;
    }

    .waze-search-toolbar {
      display: flex;
      align-items: stretch;
      gap: 0.5em;
      padding: 0.24em;
      min-height: var(--waze-search-control-size);
      flex: 0 0 auto;
      background: var(--waze-search-main-bg);
      border-bottom: none;
      border-radius: 0.62em;
    }

    .waze-search-back-btn {
      width: var(--waze-search-control-size);
      height: var(--waze-search-control-size);
      inline-size: var(--waze-search-control-size);
      block-size: var(--waze-search-control-size);
      min-width: var(--waze-search-control-size);
      min-height: var(--waze-search-control-size);
      min-inline-size: var(--waze-search-control-size);
      min-block-size: var(--waze-search-control-size);
      aspect-ratio: 1 / 1;
      border: 0.06em solid var(--waze-search-border);
      border-radius: 999em;
      background: var(--waze-search-surface-bg);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 var(--waze-search-control-size);
      padding: 0;
      margin: 0;
      font-size: 100%;
      line-height: 1;
      align-self: stretch;
      appearance: none;
      -webkit-appearance: none;
    }

    .waze-search-back-btn svg {
      width: 1em;
      height: 1em;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .waze-search-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      height: var(--waze-search-control-size);
      inline-size: 100%;
      block-size: var(--waze-search-control-size);
      min-height: var(--waze-search-control-size);
      min-block-size: var(--waze-search-control-size);
      border-radius: 999em;
      border: 0.06em solid var(--waze-search-border);
      background: #2b2f35;
      color: #e8eaed;
      padding: 0 0.85em;
      font-size: 100%;
      line-height: 1;
      outline: none;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .waze-search-input:focus {
      border-color: #6a727d;
    }

    .waze-search-input::placeholder {
      color: #b6bec8;
    }

    .waze-search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      width: 0.82em;
      height: 0.82em;
      cursor: pointer;
      background:
        linear-gradient(45deg, transparent 43%, #ff3b30 43%, #ff3b30 57%, transparent 57%),
        linear-gradient(-45deg, transparent 43%, #ff3b30 43%, #ff3b30 57%, transparent 57%);
    }

    .waze-search-categories-wrap {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 0.35em;
      flex: 0 0 auto;
      scroll-behavior: smooth;
    }

    .waze-search-categories-nav {
      width: 1.95em;
      min-width: 1.95em;
      border-radius: 0.62em;
      border: 0.06em solid var(--waze-search-border);
      background: var(--waze-search-surface-bg);
      color: #d8dde3;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .waze-search-categories-nav svg {
      width: 0.88em;
      height: 0.88em;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .waze-search-categories-nav:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .waze-search-categories {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.5em;
      padding: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -ms-overflow-style: none;
      background: var(--waze-search-main-bg);
    }

    .waze-search-cat-btn {

        const match = VERSION_PATTERN.exec(String(value || "").trim());

        return {
          raw: `${parseInt(match[1], 10)}.${parseInt(match[2], 10)}.${parseInt(match[3], 10)}${match[4].toLowerCase()}`,
          major: parseInt(match[1], 10),
          minor: parseInt(match[2], 10),
          patch: parseInt(match[3], 10),
          suffix: match[4].toLowerCase()
        };
      }

      function compareVersions(a, b) {
        if (a.major !== b.major) return a.major - b.major;
        if (a.minor !== b.minor) return a.minor - b.minor;
        if (a.patch !== b.patch) return a.patch - b.patch;
        return a.suffix.localeCompare(b.suffix);
      }

      function loadVersionsFromManifestSync(root) {
        try {

          const data = JSON.parse(xhr.responseText);
          if (Array.isArray(data)) {
            return data.map((v) => String(v || "").trim()).filter(Boolean);
          }
          if (data && Array.isArray(data.versions)) {
            return data.versions.map((v) => String(v || "").trim()).filter(Boolean);
          }
          return [];
        } catch {

      }

        parsed.sort(compareVersions);

      }

        if (bridgeStopped) return;
        if (bridgeReconnectTimer) return;
        bridgeReconnectTimer = window.setTimeout(() => {
          bridgeReconnectTimer = 0;
          connectBridgeSocket();
        }, bridgeReconnectDelayMs);
        bridgeReconnectDelayMs = Math.min(5000, Math.round(bridgeReconnectDelayMs * 1.6));
      }
      function closeBridgeSocket(options = {}) {
        const stop = options.stop === true;
        const keepOutbox = options.keepOutbox === true;
        if (bridgeReconnectTimer) {
          clearTimeout(bridgeReconnectTimer);
          bridgeReconnectTimer = 0;
        }
        if (stop) bridgeStopped = true;
        if (bridgeChannel) {
          try { bridgeChannel.onopen = null; } catch { }
          try { bridgeChannel.onmessage = null; } catch { }
          try { bridgeChannel.onerror = null; } catch { }
          try { bridgeChannel.onclose = null; } catch { }
          try { bridgeChannel.close(); } catch { }
          bridgeChannel = null;
        }
        if (!keepOutbox) bridgeOutbox = [];
      }
      function postBridgeMessage(channel, payload) {
        const envelope = buildBridgeEnvelope(channel, payload);
        if (!envelope.channel) return false;
        ensureBridgeSocket();
        if (!bridgeChannel || bridgeChannel.readyState !== WebSocket.OPEN) {
          queueBridgeEnvelope(envelope);
          return false;
        }
        try {
          bridgeChannel.send(JSON.stringify(envelope));
          return true;
        } catch {
          queueBridgeEnvelope(envelope);
          return false;
        }
      }
      function connectBridgeSocket() {
        if (bridgeStopped) return;
        closeBridgeSocket({ keepOutbox: true, stop: false });
        let socket = null;
        try { socket = new WebSocket(WIDGET_BRIDGE_WS_URL); } catch { socket = null; }
        if (!socket) {
          scheduleBridgeReconnect();
          return;
        }
        bridgeChannel = socket;
        socket.onopen = () => {
          bridgeReconnectDelayMs = 420;
          flushBridgeOutbox();
          postBridgeMessage(WIDGET_BRIDGE_CHANNEL_WAZE, { type: "waze:request_state" });
        };
        socket.onmessage = (event) => {
          let msg = null;
          try { msg = JSON.parse(event && event.data ? event.data : ""); } catch { msg = null; }
          if (!msg || typeof msg !== "object") return;
          if (String(msg.scope || "") === WIDGET_BRIDGE_SCOPE) {
            if (String(msg.clientId || "") === bridgeSocketClientId) return;
            if (String(msg.channel || "").trim().toLowerCase() !== WIDGET_BRIDGE_CHANNEL_WAZE) return;
            const payload = msg.payload && typeof msg.payload === "object" ? msg.payload : null;
            if (!payload) return;
            applyWazeBridgePayload(payload);
            return;
          }
          const signal = extractTelemetrySignalFromSocket(msg);
          if (!signal) return;
          applyTelemetrySignalFromServer(signal, msg.ts);
        };
        socket.onerror = () => { };
        socket.onclose = () => {
          if (bridgeChannel === socket) bridgeChannel = null;
          scheduleBridgeReconnect();
        };
      }
      function ensureBridgeSocket() {
        if (bridgeStopped) return;
        if (bridgeChannel && (bridgeChannel.readyState === WebSocket.OPEN || bridgeChannel.readyState === WebSocket.CONNECTING)) return;
        if (bridgeReconnectTimer) return;
        connectBridgeSocket();
      }
      function loadInitialBridgePayload() {
        postBridgeMessage(WIDGET_BRIDGE_CHANNEL_WAZE, { type: "waze:request_state" });
      }
      function bindBridgeChannel() {
        ensureBridgeSocket();
      }
      function startHostBridgePolling() {
        if (!BRIDGE_REQUIRE_GAME_SOURCE) return;
        if (hostBridgePollTimer) return;
        hostBridgePollTimer = window.setInterval(async () => {
          if (hostBridgePollInFlight) return;
          hostBridgePollInFlight = true;
          try {
            const payload = await invokeExternalHostFunctionValueWithArgs("wazeGetBridgeState");
            if (!payload || typeof payload !== "object") return;
            if (String(payload.kind || "") !== "waze-dev") return;
            const ts = resolveBridgeEventTimeMs(payload.ts);
            if (Number.isFinite(hostBridgeLastTs) && ts <= hostBridgeLastTs) return;
            hostBridgeLastTs = ts;
            applyWazeBridgePayload(payload);
          } catch { } finally {
            hostBridgePollInFlight = false;
          }
        }, 120);
      }

      fullBounds = L.latLngBounds(
        map.unproject(L.point(0, heightPx), maxNativeZoom),
        map.unproject(L.point(widthPx, 0), maxNativeZoom)
      );
      L.tileLayer(`${TILE_BASE}/{z}/{x}/{y}.png`, {
        tileSize: tileSize,
        className: "waze-tiles-bright",
        minNativeZoom: minNativeZoom,
        maxNativeZoom: maxNativeZoom,
        maxZoom: maxDisplayZoom,
        noWrap: true,
        bounds: fullBounds,
        crossOrigin: true,
        referrerPolicy: "no-referrer",

        /* PARAMÈTRES ANTI-TROUS GRIS */
        updateWhenIdle: false,     // Force le chargement pendant qu'on bouge
        updateWhenZooming: false,  // Force le chargement pendant le zoom
        edgeBufferTiles: 3,        // Le plugin charge 3 rangées cachées d'avance
        keepBuffer: 12             // Garde en mémoire pour éviter de re-télécharger
      }).addTo(map);
      restoreZoomState();
      bindBridgeChannel();
      loadInitialBridgePayload();
      startHostBridgePolling();
      void ensureTrafficAreasLoaded();
      void ensureLocalNavGraphLoaded();

      fetch(dataPath("TileMapInfo.json"))
        .then((r) => {
          if (!r.ok) throw new Error("TileMapInfo");
          return r.json();
        })
        .then((info) => {
          if (!info) return;
          tileMapInfo = info;
          const targetLatLng = toLatLngFromWorldPoint(TARGET_CENTER_WORLD);
          if (!targetLatLng) return;
          const zoomLevel = getEffectiveFollowZoom(bridgeSpeedKmh);
          map.setView(centerForTarget(targetLatLng, zoomLevel), zoomLevel, { animate: false });
          setFollowTarget(targetLatLng, { immediate: true });
          if (pendingBridgePayload) {
            const payload = pendingBridgePayload;
            pendingBridgePayload = null;
            applyWazeBridgePayload(payload);
          }
        })
        .catch(() => { });

      window.wazeSetNavigationPositionXY = function wazeSetNavigationPositionXY(X, Y, Z) {
        const rawPoint = (Number.isFinite(Number(Z)))
          ? { x: X, y: Y, z: Z }
          : { x: X, y: Y };
        const latlng = toLatLngFromWorldPoint(rawPoint);
        if (!latlng) return;
        setFollowTarget(latlng);
      };
      window.wazeSetNavigationPositionXYZ = function wazeSetNavigationPositionXYZ(X, Y, Z) {
        const latlng = toLatLngFromWorldPoint({ x: X, y: Y, z: Z });
        if (!latlng) return;
        setFollowTarget(latlng);
      };

      window.wazeSetNavigationPositionLatLng = function wazeSetNavigationPositionLatLng(lat, lng) {
        const latlng = L.latLng(Number(lat), Number(lng));
        if (!Number.isFinite(latlng.lat) || !Number.isFinite(latlng.lng)) return;
        setFollowTarget(latlng);
      };
      window.wazeSetNavigationHeading = function wazeSetNavigationHeading(headingDeg) {
        setNavigationArrowHeading(headingDeg);
      };
      window.wazeComputeForceNavRoutePreviewXYZ = function wazeComputeForceNavRoutePreviewXYZ(fromX, fromY, fromZ, toX, toY, toZ) {
        return computeLocalForceNavRoutePreviewXYZ(fromX, fromY, fromZ, toX, toY, toZ);
      };
      window.wazeSetNavigationRouteXY = function wazeSetNavigationRouteXY(points) {
        if (!hasUsableNavRoutePoints(points)) {
          const fallbackApplied = notifyRouteNotFoundNeedRoad(lastBridgeArrowWorldPoint);
          if (!fallbackApplied) {
            clearNavigationRoute();
            navArrivalTargetLatLng = null;
            clearArrivalFlagMarker();
          }
          return;
        }
        setNavigationRouteFromWorldPoints(points);
      };
      window.wazeSetNavigationDestinationXYZ = function wazeSetNavigationDestinationXYZ(X, Y, Z) {
        const destination = normalizeBridgeWorldPoint({ x: X, y: Y, z: Z });
        const applied = applyLocalSearchDestinationRoute({ x: X, y: Y, z: Z }, "Destination");
        if (!applied || !destination) return false;
        return applyLocalForceNavRouteToDestination(destination, "Destination")
          .then((ok) => {
            if (!ok) showCenterToast("Aucun itineraire nav trouve pour cette destination.");
            return !!ok;
          })
          .catch(() => false);
      };
      window.wazeClearNavigationDestination = function wazeClearNavigationDestination() {
        applyLocalCancelledRouteState();
        return true;
      };

      map.on("zoomend", function () {
        const currentZoom = map.getZoom();
        if (manualZoomPinned) {
          manualZoomPinnedLevel = clampZoomLevel(currentZoom);
          syncManualZoomOffsetWithCurrentZoom(manualZoomPinnedLevel);
        } else {
          syncManualZoomOffsetWithCurrentZoom(currentZoom);
        }
        refreshNavigationArrowIcon();
        setNavigationViewHeading(navArrowHeadingDeg);
        reprojectNavigationOverlaysFromCache();
        refreshNavigationDirectionMarkers();
        updateGpsZoomButtons();
        saveZoomState();

      });
      bindZoomPressButton(gpsZoomInBtnEl, manualZoomStep);
      bindZoomPressButton(gpsZoomOutBtnEl, -manualZoomStep);
      if (footerSearchBtnEl) {
        footerSearchBtnEl.addEventListener("click", async (event) => {
          event.preventDefault();
          if (Date.now() < searchSelectionLockUntilTs) return;
          if (hasBusCancelEvidence()) {
            openCancelConfirmation();
            return;
          }
          const localHasRouteEvidence = hasBusCancelEvidence();
          const hostHasSelection = BRIDGE_REQUIRE_GAME_SOURCE
            ? await queryHostRouteSelection(localHasRouteEvidence ? 160 : 90)
            : false;
          const inGrace = Date.now() < searchOpenGraceUntilTs;
          if (hostHasSelection) {
            if (!(inGrace && !hasLocalBusRouteEvidence())) {
              bridgeHasRouteSelection = true;
              bridgeRouteSelectionLatched = true;
              refreshFooterSearchCancelMode();
              openCancelConfirmation();
              return;
            }
          }
          if (hasBusCancelEvidence()) {
            if (inGrace && !hasLocalBusRouteEvidence() && !hostHasSelection) {
              bridgeHasRouteSelection = false;
              bridgeRouteSelectionLatched = false;
              refreshFooterSearchCancelMode();
            } else {
              openCancelConfirmation();
              return;
            }
          }
          await openWazeSearchOverlay();
        });
      }
      if (wazeSearchBackBtnEl) {
        wazeSearchBackBtnEl.addEventListener("click", (event) => {
          event.preventDefault();
          closeWazeSearchOverlay({ clearQuery: false });
        });
      }
      if (wazeSearchInputEl) {
        wazeSearchInputEl.addEventListener("input", (event) => {
          wazeSearchQuery = String(event && event.target ? event.target.value : "");
          scheduleWazeSearchRender();
        });
      }
      if (wazeSearchCategoriesEl) {
        wazeSearchCategoriesEl.addEventListener("wheel", (event) => {
          const deltaX = Number(event.deltaX) || 0;
          const deltaY = Number(event.deltaY) || 0;
          const delta = Math.abs(deltaX) > Math.abs(deltaY) ? deltaX : deltaY;
          if (!delta) return;
          if (wazeSearchCategoriesEl.scrollWidth <= wazeSearchCategoriesEl.clientWidth + 1) return;
          event.preventDefault();
          wazeSearchCategoriesEl.scrollBy({ left: delta, behavior: "smooth" });
          window.setTimeout(syncWazeSearchCategoryNavButtons, 120);
        }, { passive: false });
        wazeSearchCategoriesEl.addEventListener("scroll", () => {
          syncWazeSearchCategoryNavButtons();
        }, { passive: true });
        wazeSearchCategoriesEl.addEventListener("click", (event) => {
          const target = event.target;
          const btn = target && target.closest ? target.closest(".waze-search-cat-btn") : null;
          if (!btn) return;
          const kind = String(btn.getAttribute("data-kind") || "");
          setWazeSearchKind(kind);
        });
      }
      if (wazeSearchCatPrevBtnEl) {
        wazeSearchCatPrevBtnEl.addEventListener("click", (event) => {
          event.preventDefault();
          scrollWazeSearchCategories(-1);
        });
      }
      if (wazeSearchCatNextBtnEl) {
        wazeSearchCatNextBtnEl.addEventListener("click", (event) => {
          event.preventDefault();
          scrollWazeSearchCategories(1);
        });
      }
      syncWazeSearchCategoryNavButtons();
      if (navCancelNoBtnEl) {
        navCancelNoBtnEl.addEventListener("click", (event) => {
          event.preventDefault();
          closeCancelConfirmation();
        });
      }
      if (navCancelYesBtnEl) {
        navCancelYesBtnEl.addEventListener("click", async (event) => {
          event.preventDefault();
          if (pendingCancelKind !== "bus") {
            closeCancelConfirmation();
            return;
          }
          closeCancelConfirmation();
          await cancelActiveBusNavigation();
        });
      }
      if (navCancelConfirmEl) {
        navCancelConfirmEl.addEventListener("click", (event) => {
          if (event.target !== navCancelConfirmEl) return;
          closeCancelConfirmation();
        });
      }
      refreshFooterSearchCancelMode();
      setNavigationUiActive(false);
      syncMapSpeedBadgeSize();
      setMapSpeedKmh(0);
      startBridgeSpeedDecayLoop();
      if (typeof window.requestIdleCallback === "function") {
        window.requestIdleCallback(() => {
          void ensureWazeSearchLoaded();
        }, { timeout: 1500 });
      } else {
        window.setTimeout(() => {
          void ensureWazeSearchLoaded();
        }, 500);
      }
      window.addEventListener("pointerup", stopZoomPress, { passive: true });
      const handleViewportResize = () => {
        if (resizeSyncRaf) return;
        resizeSyncRaf = window.requestAnimationFrame(() => {
          resizeSyncRaf = 0;
          syncResponsiveLayout();
        });
      };
      window.addEventListener("resize", handleViewportResize, { passive: true });
      if (typeof ResizeObserver === "function") {
        const ro = new ResizeObserver(handleViewportResize);
        if (appBackgroundEl) ro.observe(appBackgroundEl);
        if (phoneFrameEl) ro.observe(phoneFrameEl);
        if (mapStageEl) ro.observe(mapStageEl);
        ro.observe(mapHost);
      } else {
        resizePollTimer = window.setInterval(syncResponsiveLayout, 320);
      }
      setTimeout(() => {
        syncResponsiveLayout();
        updateGpsZoomButtons();
      }, 50);
      window.addEventListener("beforeunload", function () {
        stopZoomPress();
        if (navCenterToastTimer) {
          clearTimeout(navCenterToastTimer);
          navCenterToastTimer = 0;
        }
        if (routeNotFoundLoadingTimer) {
          clearTimeout(routeNotFoundLoadingTimer);
          routeNotFoundLoadingTimer = 0;
        }
        if (hostBridgePollTimer) {
          clearInterval(hostBridgePollTimer);
          hostBridgePollTimer = 0;
        }
        if (wazeSearchRenderTimer) {
          clearTimeout(wazeSearchRenderTimer);
          wazeSearchRenderTimer = 0;
        }
        closeWazeSearchOverlay({ clearQuery: false });
        closeCancelConfirmation();
        if (resizeSyncRaf) {
          cancelAnimationFrame(resizeSyncRaf);
          resizeSyncRaf = 0;
        }
        if (resizePollTimer) {
          clearInterval(resizePollTimer);
          resizePollTimer = 0;
        }
        if (bridgeSpeedDecayTimer) {
          clearInterval(bridgeSpeedDecayTimer);
          bridgeSpeedDecayTimer = 0;
        }
        closeBridgeSocket({ stop: true });
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "F5" || event.keyCode === 116) {
          event.preventDefault();
          adjustGpsZoom(manualZoomStep, { cycle: true });
        }
      });
      window.addEventListener("message", (event) => {
        const msg = event && event.data;
        if (!msg || msg.scope !== "idf_game_widget_bridge_v1") return;

        if (msg.type === "game_pause_state") {
          document.body.classList.toggle("game-paused", !!msg.pausedByTelemetry);
          return;
        }

        if (String(msg.channel || "").trim().toLowerCase() === WIDGET_BRIDGE_CHANNEL_WAZE) {
          const payload = msg.payload && typeof msg.payload === "object" ? msg.payload : null;
          if (payload) {
            applyWazeBridgePayload(payload);
          }
        }
      });
    })();
  </script>
</body>

</html>

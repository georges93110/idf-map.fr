    html[data-app-ready="0"] {
      background:#0b0b0b;
    }
    html[data-theme="light"][data-app-ready="0"] {
      background:#ecf2f8;
    }

  <script>
    (function setupAppReadyGate() {
      const root = document.documentElement;
      root.setAttribute("data-app-ready", "0");
      let done = false;
      function reveal() {
        if (done) return;
        done = true;
        root.setAttribute("data-app-ready", "1");
      }
      window.__setAppReady = function __setAppReady(options) {
        const cfg = options && typeof options === "object" ? options : {};
        const minFrames = Math.max(4, Number(cfg.minFrames) || 8);
        const stableFrames = Math.max(2, Number(cfg.stableFrames) || 3);
        const maxFrames = Math.max(minFrames + stableFrames, Number(cfg.maxFrames) || 28);
        let frameCount = 0;
        let stableCount = 0;
        let previousKey = "";
        const step = () => {
          frameCount += 1;
          let layoutKey = "";
          const body = document.body;
          if (body) {
            const rect = body.getBoundingClientRect();
            layoutKey = [
              Math.round(rect.width),
              Math.round(rect.height),
              document.documentElement.scrollWidth,
              document.documentElement.scrollHeight
            ].join("x");
          }
          stableCount = layoutKey && layoutKey === previousKey ? stableCount + 1 : 0;
          previousKey = layoutKey;
          const enoughFrames = frameCount >= minFrames;
          const visuallyStable = stableCount >= stableFrames;
          const frameBudgetExceeded = frameCount >= maxFrames;
          if ((!enoughFrames || !visuallyStable) && !frameBudgetExceeded) {
            requestAnimationFrame(step);
            return;
          }
          reveal();
        };
        const start = () => requestAnimationFrame(step);
        if (document.fonts && document.fonts.ready) {
          Promise.race([
            document.fonts.ready.catch(() => {}),
            new Promise((resolve) => setTimeout(resolve, 1200))
          ]).finally(start);
          return;
        }
        start();
      };
      window.addEventListener("pageshow", reveal, { once: true });
      window.setTimeout(reveal, 7000);
    })();
  </script>

  <script>
    (function initLegalPage() {
      let emailCopyToastTimer = 0;
      function lang() {
        return String(document.documentElement.getAttribute("lang") || "fr").toLowerCase().slice(0, 2);
      }
      function t(key, fallback) {
        const i18n = window.I18N || {};
        const code = lang();
        const fromLang = i18n[code] && i18n[code][key];
        if (typeof fromLang === "string" && fromLang) return fromLang;
        const fromFr = i18n.fr && i18n.fr[key];
        if (typeof fromFr === "string" && fromFr) return fromFr;
        return fallback;
      }
      function copiedLabelByLang() {
        const code = lang();
        const labels = {
          fr: "Copié !",
          en: "Copied!",
          es: "Copiado!",
          de: "Kopiert!",
          pl: "Skopiowano!",
          pt: "Copiado!",
          nl: "Gekopieerd!",
          it: "Copiato!",
          ru: "Скопировано!",
          zh: "已复制！",
          ko: "복사됨!",
          ja: "コピーしました！"
        };
        return labels[code] || labels.fr;
      }
      function showEmailCopiedToast() {
        const toast = document.getElementById("legalEmailCopied");
        if (!toast) return;
        if (emailCopyToastTimer) {
          window.clearTimeout(emailCopyToastTimer);
          emailCopyToastTimer = 0;
        }
        toast.textContent = copiedLabelByLang();
        toast.classList.add("is-visible");
        emailCopyToastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
          emailCopyToastTimer = 0;
        }, 1200);
      }
      function copyToClipboard(text) {
        const value = String(text || "").trim();
        if (!value) return Promise.reject(new Error("empty"));
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          return navigator.clipboard.writeText(value);
        }
        return new Promise((resolve, reject) => {
          try {
            const area = document.createElement("textarea");
            area.value = value;
            area.setAttribute("readonly", "true");
            area.style.position = "fixed";
            area.style.top = "-9999px";
            document.body.appendChild(area);
            area.select();
            area.setSelectionRange(0, area.value.length);
            const ok = document.execCommand("copy");
            area.remove();
            if (ok) resolve();
            else reject(new Error("copy failed"));
          } catch (error) {
            reject(error);
          }
        });
      }
      function render() {
        const links = window.SITE_LINKS && typeof window.SITE_LINKS === "object"
          ? window.SITE_LINKS
          : {};
        const legal = links.legal && typeof links.legal === "object"
          ? links.legal
          : {};
        const offsite = window.SITE_OFFSITE_LINKS && typeof window.SITE_OFFSITE_LINKS === "object"
          ? window.SITE_OFFSITE_LINKS
          : {};
        const email = String(legal.email || "").trim();
        const emailLink = document.getElementById("legalEmailLink");
        if (emailLink && email) {
          emailLink.href = "#";
          emailLink.textContent = email;
          emailLink.dataset.emailValue = email;
          if (emailLink.dataset.copyBound !== "1") {
            emailLink.dataset.copyBound = "1";
            emailLink.addEventListener("click", (event) => {
              event.preventDefault();
              const value = String(emailLink.dataset.emailValue || emailLink.textContent || "").trim();
              if (!value) return;
              copyToClipboard(value).then(() => {
                showEmailCopiedToast();
              }).catch(() => {});
            });
          }
        }
        const discordUserIdRaw = String(legal.discord_user_id || "").trim();
        const discordUserId = (discordUserIdRaw.match(/\d+/) || [""])[0];
        const discordProfileUrl = discordUserId
          ? `https://discord.com/users/${encodeURIComponent(discordUserId)}`
          : "";
        const discordUrl = String(discordProfileUrl || offsite.discord_profile || offsite.discord || "").trim();
        const discordLink = document.getElementById("legalDiscordLink");
        if (discordLink) {
          if (discordUrl) {
            discordLink.href = discordUrl;
            discordLink.hidden = false;
          } else {
            discordLink.href = "#";
            discordLink.hidden = true;
          }
        }
        const hostingUrl = String(offsite.legal_hosting || "").trim();
        const hostingLink = document.getElementById("legalHostingLink");
        if (hostingLink) {
          if (hostingUrl) {
            hostingLink.href = hostingUrl;
            hostingLink.textContent = hostingUrl;
          } else {
            hostingLink.href = "#";
          }
        }
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (!key) return;
          el.textContent = t(key, el.textContent);
        });
      }
      render();
      new MutationObserver(render).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["lang"]
      });
    })();
  </script>
  <script>
    (function renderLegalLastUpdate() {
      function parseLastUpdateUtc(rawValue) {
        const raw = String(rawValue || "").trim();
        const parts = raw.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2}) UTC$/);
        if (!parts) return null;
        const year = Number(parts[1]);
        const month = Number(parts[2]) - 1;
        const day = Number(parts[3]);
        const hour = Number(parts[4]);
        const minute = Number(parts[5]);
        const second = Number(parts[6]);
        const date = new Date(Date.UTC(year, month, day, hour, minute, second));
        return Number.isNaN(date.getTime()) ? null : date;
      }

      function formatFrenchDateUtc(date) {
        const days = [
          "Dimanche",
          "Lundi",
          "Mardi",
          "Mercredi",
          "Jeudi",
          "Vendredi",
          "Samedi"
        ];
        const months = [
          "Janvier",
          "Fevrier",
          "Mars",
          "Avril",
          "Mai",
          "Juin",
          "Juillet",
          "Aout",
          "Septembre",
          "Octobre",
          "Novembre",
          "Decembre"
        ];
        const dayName = days[date.getUTCDay()];
        const dayNumber = date.getUTCDate();
        const monthName = months[date.getUTCMonth()];
        const year = date.getUTCFullYear();
        const hour = String(date.getUTCHours()).padStart(2, "0");
        const minute = String(date.getUTCMinutes()).padStart(2, "0");
        const second = String(date.getUTCSeconds()).padStart(2, "0");
        return `${dayName} ${dayNumber} ${monthName} ${year} ${hour}:${minute}:${second}`;
      }

      const output = document.getElementById("legalLastUpdateText");
      if (!output) return;
      const parsedDate = parseLastUpdateUtc(window.LAST_UPDATE);
      if (!parsedDate) {
        output.textContent = "Ce site a ete mis a jour le : indisponible";
        return;
      }
      output.textContent = `Ce site a ete mis a jour le : ${formatFrenchDateUtc(parsedDate)}`;
    })();
  </script>
  <script>
    window.__setAppReady?.();
  </script>

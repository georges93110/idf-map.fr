  <script>
    (function setupAppReadyGate() {
      const root = document.documentElement;
      root.setAttribute("data-app-ready", "0");
      let done = false;
      function reveal() {
        if (done) return;
        done = true;
        root.setAttribute("data-app-ready", "1");
      }
      window.__setAppReady = function __setAppReady(options) {
        const cfg = options && typeof options === "object" ? options : {};
        const minFrames = Math.max(4, Number(cfg.minFrames) || 8);
        const stableFrames = Math.max(2, Number(cfg.stableFrames) || 3);
        const maxFrames = Math.max(minFrames + stableFrames, Number(cfg.maxFrames) || 28);
        let frameCount = 0;
        let stableCount = 0;
        let previousKey = "";
        const step = () => {
          frameCount += 1;
          let layoutKey = "";
          const body = document.body;
          if (body) {
            const rect = body.getBoundingClientRect();
            layoutKey = [
              Math.round(rect.width),
              Math.round(rect.height),
              document.documentElement.scrollWidth,
              document.documentElement.scrollHeight
            ].join("x");
          }
          stableCount = layoutKey && layoutKey === previousKey ? stableCount + 1 : 0;
          previousKey = layoutKey;
          const enoughFrames = frameCount >= minFrames;
          const visuallyStable = stableCount >= stableFrames;
          const frameBudgetExceeded = frameCount >= maxFrames;
          if ((!enoughFrames || !visuallyStable) && !frameBudgetExceeded) {
            requestAnimationFrame(step);
            return;
          }
          reveal();
        };
        const start = () => requestAnimationFrame(step);
        if (document.fonts && document.fonts.ready) {
          Promise.race([
            document.fonts.ready.catch(() => {}),
            new Promise((resolve) => setTimeout(resolve, 1200))
          ]).finally(start);
          return;
        }
        start();
      };
      window.addEventListener("pageshow", reveal, { once: true });
      window.setTimeout(reveal, 7000);
    })();
  </script>

    }

        return parsed;
      }
      function hasParsedUpdateData(parsed) {
        if (!parsed || typeof parsed !== "object") return false;
        if (String(parsed.versionMap || "").trim()) return true;
        if (Array.isArray(parsed.contentItems) && parsed.contentItems.length) return true;
        if (Array.isArray(parsed.content) && parsed.content.length) return true;
        return false;
      }
      function parseTableMessageByKind(tableKind, raw) {
        if (tableKind === "devlog") return parseDevLogMessage(raw);
        return parseUpdateMessage(raw);
      }

      function parseDateToTimestamp(raw) {
        if (raw instanceof Date && Number.isFinite(raw.getTime())) return raw.getTime();
        const value = String(raw || "").trim();
        if (!value) return 0;
        const gviz = value.match(/^Date\(([^)]+)\)$/i);
        if (gviz && gviz[1]) {
          const parts = gviz[1].split(",").map((part) => Number(String(part || "").trim()));
          if (parts.length >= 3 && parts.slice(0, 3).every((num) => Number.isFinite(num))) {
            const [year, monthIndex, day, hour = 0, minute = 0, second = 0] = parts;
            const dt = new Date(year, monthIndex, day, hour, minute, second);
            if (Number.isFinite(dt.getTime())) return dt.getTime();
          }
        }
        const m = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (m) {
          const day = Number(m[1]);
          const month = Number(m[2]);
          const year = Number(m[3]);
          const dt = new Date(year, month - 1, day);
          return Number.isFinite(dt.getTime()) ? dt.getTime() : 0;
        }
        const dt = new Date(value);
        return Number.isFinite(dt.getTime()) ? dt.getTime() : 0;
      }
      function parseDiscordSnowflakeTimestamp(raw) {
        const value = String(raw || "").trim();
        if (!/^\d{17,20}$/.test(value)) return 0;
        try {
          const discordEpoch = 1420070400000n;
          const id = BigInt(value);
          const ts = Number((id >> 22n) + discordEpoch);
          return Number.isFinite(ts) ? ts : 0;
        } catch {
          return 0;
        }
      }
      function formatAbsoluteDate(timestamp, fallbackRaw) {
        const ts = Number(timestamp || 0);
        if (!ts) return String(fallbackRaw || "").trim() || "-";
        try {
          return new Intl.DateTimeFormat(lang(), {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }).format(new Date(ts));
        } catch {
          return String(fallbackRaw || "").trim() || "-";
        }
      }
      function formatRelativeDate(timestamp) {
        const ts = Number(timestamp || 0);
        if (!ts) return "";
        const deltaMs = Date.now() - ts;
        const absMs = Math.abs(deltaMs);
        const units = [
          { key: "year", ms: 365 * 24 * 60 * 60 * 1000 },
          { key: "month", ms: 30 * 24 * 60 * 60 * 1000 },
          { key: "week", ms: 7 * 24 * 60 * 60 * 1000 },
          { key: "day", ms: 24 * 60 * 60 * 1000 },
          { key: "hour", ms: 60 * 60 * 1000 },
          { key: "minute", ms: 60 * 1000 },
          { key: "second", ms: 1000 }
        ];
        let unit = units[units.length - 1];
        for (const candidate of units) {
          if (absMs >= candidate.ms) {
            unit = candidate;
            break;
          }
        }
        const signedValue = -Math.round(deltaMs / unit.ms);
        try {
          return new Intl.RelativeTimeFormat(lang(), { numeric: "auto" }).format(signedValue, unit.key);
        } catch {
          return "";
        }
      }

      function actualiteFromRow(row, index) {
        const messageId = firstNonEmpty(row, ["message_id", "messageid", "id", "post_id"]);
        const date = firstNonEmpty(row, ["date", "created_at", "posted_at"]);
        const messagesByLang = collectMessageTranslations(row);
        const messageRaw = pickLocalizedMessage(messagesByLang, "fr") || firstNonEmpty(row, ["message", "content", "contenu", "texte"]);
        const imagesRaw = firstNonEmpty(row, ["images", "image", "media"]);
        const sourceLink = firstNonEmpty(row, ["lien", "link", "url"]);
        const channelId = parseDiscordChannelId(sourceLink);
        const isUpdateChannel = channelId === UPDATE_CHANNEL_ID;
        const isDevLogChannel = channelId === DEVLOG_CHANNEL_ID;
        const tableKind = isUpdateChannel ? "update" : (isDevLogChannel ? "devlog" : "");
        const useTable = !!tableKind;

        const fromImagesCol = extractUrls(imagesRaw).filter(isImageUrl);
        const messagesPool = Object.values(messagesByLang).filter((value) => String(value || "").trim());
        const fromMessages = messagesPool
          .flatMap((value) => extractUrls(value))
          .filter(isImageUrl);
        const fromMessage = extractUrls(messageRaw).filter(isImageUrl);
        const images = uniqueUrls([...fromImagesCol, ...fromMessages, ...fromMessage]);
        const message = cleanMessage(messageRaw);
        const update = useTable ? parseTableMessageByKind(tableKind, messageRaw) : null;
        const timestamp = parseDiscordSnowflakeTimestamp(messageId) || parseDateToTimestamp(date) || (Date.now() - index);

        return {
          messageId,
          date,
          messageRaw,
          messagesByLang,
          message,
          images: isUpdateChannel ? [] : images,
          channelId,
          tableKind,
          specialUpdate: useTable,
          update,
          timestamp
        };
      }

      let FEEDBACK_STATE = { key: "", fallback: "", isError: false, isLoading: false };
      function setFeedback(message, isError, isLoading) {
        const feedback = document.getElementById("actualitesFeedback");
        if (!feedback) return;
        feedback.textContent = message || "";
        feedback.classList.toggle("is-error", !!isError);
        feedback.classList.toggle("is-loading", !!isLoading);
      }
      function setFeedbackByKey(key, fallback, isError, isLoading) {
        FEEDBACK_STATE = {
          key: String(key || "").trim(),
          fallback: String(fallback || "").trim(),
          isError: !!isError,
          isLoading: !!isLoading
        };
        setFeedback(FEEDBACK_STATE.key ? t(FEEDBACK_STATE.key, FEEDBACK_STATE.fallback) : "", FEEDBACK_STATE.isError, FEEDBACK_STATE.isLoading);
      }
      function clearFeedback() {
        FEEDBACK_STATE = { key: "", fallback: "", isError: false, isLoading: false };
        setFeedback("", false, false);
      }
      function refreshFeedbackLocale() {
        if (!FEEDBACK_STATE.key) return;
        setFeedback(t(FEEDBACK_STATE.key, FEEDBACK_STATE.fallback), FEEDBACK_STATE.isError, FEEDBACK_STATE.isLoading);
      }
      function resolveLocalizedItem(item) {
        const localizedRaw = pickLocalizedMessage(item.messagesByLang, lang()) || item.messageRaw || "";
        const message = cleanMessage(localizedRaw);
        if (!item.specialUpdate) return { message, update: item.update };

        let update = parseTableMessageByKind(item.tableKind, localizedRaw);
        const fallbackUpdate = item.update && typeof item.update === "object" ? item.update : null;
        if (fallbackUpdate && update && typeof update === "object") {
          if (!String(update.versionMap || "").trim() && String(fallbackUpdate.versionMap || "").trim()) update.versionMap = fallbackUpdate.versionMap;
          if (!String(update.minVersion || "").trim() && String(fallbackUpdate.minVersion || "").trim()) update.minVersion = fallbackUpdate.minVersion;
          if (!String(update.recommendedVersion || "").trim() && String(fallbackUpdate.recommendedVersion || "").trim()) update.recommendedVersion = fallbackUpdate.recommendedVersion;
          if ((!Array.isArray(update.dlc) || !update.dlc.length) && Array.isArray(fallbackUpdate.dlc) && fallbackUpdate.dlc.length) update.dlc = [...fallbackUpdate.dlc];
          if ((!Array.isArray(update.contentItems) || !update.contentItems.length) && Array.isArray(fallbackUpdate.contentItems) && fallbackUpdate.contentItems.length) {
            update.contentItems = fallbackUpdate.contentItems.map((entry) => ({
              text: String(entry && entry.text || "").trim(),
              level: Number(entry && entry.level || 0)
            })).filter((entry) => entry.text);
          }
          if ((!Array.isArray(update.content) || !update.content.length) && Array.isArray(update.contentItems) && update.contentItems.length) {
            update.content = update.contentItems.map((entry) => entry.text);
          }
        }
        if (!hasParsedUpdateData(update)) {
          update = item.update;
        }
        if (!hasParsedUpdateData(update)) {
          update = {
            versionMap: "",
            title: "",
            minVersion: "",
            recommendedVersion: "",
            dlc: [],
            content: [],
            contentItems: []
          };
        }
        return { message, update };
      }
      function createUpdateContentList(entries) {
        const root = document.createElement("ul");
        root.className = "news-update-list";
        const items = Array.isArray(entries) ? entries : [];
        let currentTop = null;

        items.forEach((entry) => {
          let text = "";
          let level = 0;
          if (entry && typeof entry === "object" && !Array.isArray(entry)) {
            text = String(entry.text || "").trim();
            level = Number(entry.level || 0);
          } else {
            text = String(entry || "").trim();
          }
          if (!text) return;

          if (level <= 0 || !currentTop) {
            const li = document.createElement("li");
            li.textContent = text;
            root.appendChild(li);
            currentTop = li;
            return;
          }

          let sub = currentTop.querySelector("ul.news-update-sublist");
          if (!sub) {
            sub = document.createElement("ul");
            sub.className = "news-update-sublist";
            currentTop.appendChild(sub);
          }
          const subLi = document.createElement("li");
          subLi.textContent = text;
          sub.appendChild(subLi);
        });

        if (!root.childElementCount) {
          const li = document.createElement("li");
          li.textContent = "-";
          root.appendChild(li);
        }
        return root;
      }
      function createDevLogCarousel(urls) {
        const EDGE_TOLERANCE_PX = 12;
        const sourceItems = uniqueUrls((Array.isArray(urls) ? urls : []).filter(isImageUrl));
        if (!sourceItems.length) {
          const empty = document.createElement("span");
          empty.textContent = "-";
          return empty;
        }
        const carousel = document.createElement("div");
        carousel.className = "news-devlog-carousel";
        const scroller = document.createElement("div");
        scroller.className = "news-devlog-scroller";
        const prev = document.createElement("button");
        prev.type = "button";
        prev.className = "news-devlog-carousel-nav prev";
        prev.setAttribute("aria-label", "Previous");
        prev.innerHTML = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"></path></svg>";
        const next = document.createElement("button");
        next.type = "button";
        next.className = "news-devlog-carousel-nav next";
        next.setAttribute("aria-label", "Next");
        next.innerHTML = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\"></path></svg>";
        let slidePositions = [];
        let currentSlideIndex = 0;

        function setNavDisabled(button, disabled) {
          button.disabled = !!disabled;
          button.setAttribute("aria-disabled", disabled ? "true" : "false");
          button.classList.toggle("is-disabled", !!disabled);
        }
        function scheduleNavRefresh() {
          requestAnimationFrame(updateNavState);
          setTimeout(updateNavState, 80);
          setTimeout(updateNavState, 260);
          setTimeout(updateNavState, 460);
        }
        function setEmptyState() {
          scroller.innerHTML = "";
          const empty = document.createElement("span");
          empty.textContent = "-";
          scroller.appendChild(empty);
          setNavDisabled(prev, true);
          setNavDisabled(next, true);
        }
        function clampIndex(index) {
          if (!slidePositions.length) return 0;
          return Math.max(0, Math.min(slidePositions.length - 1, Number(index) || 0));
        }
        function refreshSlidePositions() {
          slidePositions = Array.from(scroller.querySelectorAll(".news-devlog-slide")).map((slide) => Number(slide.offsetLeft || 0));
          if (!slidePositions.length) currentSlideIndex = 0;
          currentSlideIndex = clampIndex(currentSlideIndex);
        }
        function findNearestSlideIndex(left) {
          if (!slidePositions.length) return 0;
          let nearest = 0;
          let minDist = Infinity;
          for (let i = 0; i < slidePositions.length; i += 1) {
            const dist = Math.abs(Number(left || 0) - slidePositions[i]);
            if (dist < minDist) {
              minDist = dist;
              nearest = i;
            }
          }
          return nearest;
        }
        function scrollToSlide(index, behavior) {
          refreshSlidePositions();
          if (!slidePositions.length) {
            updateNavState();
            return;
          }
          currentSlideIndex = clampIndex(index);
          const left = slidePositions[currentSlideIndex] || 0;
          scroller.scrollTo({ left, behavior: behavior || "smooth" });
          scheduleNavRefresh();
        }
        function updateNavState() {
          refreshSlidePositions();
          if (!slidePositions.length) {
            setNavDisabled(prev, true);
            setNavDisabled(next, true);
            return;
          }
          currentSlideIndex = findNearestSlideIndex(scroller.scrollLeft || 0);
          const atLeft = currentSlideIndex <= 0 || (scroller.scrollLeft || 0) <= EDGE_TOLERANCE_PX;
          const atRight = currentSlideIndex >= slidePositions.length - 1;
          setNavDisabled(prev, atLeft);
          setNavDisabled(next, atRight);
        }
        function checkImageLoadable(url) {
          return new Promise((resolve) => {
            const probe = new Image();
            let done = false;
            const timer = setTimeout(() => {
              if (done) return;
              done = true;
              probe.onload = null;
              probe.onerror = null;
              resolve(false);
            }, 7000);
            probe.onload = () => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              probe.onload = null;
              probe.onerror = null;
              resolve(true);
            };
            probe.onerror = () => {
              if (done) return;
              done = true;
              clearTimeout(timer);
              probe.onload = null;
              probe.onerror = null;
              resolve(false);
            };
            probe.src = url;
          });
        }
        function buildSlides(validUrls) {
          scroller.innerHTML = "";
          validUrls.forEach((url) => {
            const slide = document.createElement("a");
            slide.className = "news-devlog-slide";
            slide.href = url;
            slide.target = "_blank";
            slide.rel = "noopener noreferrer";

            const img = document.createElement("img");
            img.className = "news-devlog-slide-image";
            img.loading = "lazy";
            img.alt = tableLabel("devlogImageAlt");
            img.src = url;

            slide.appendChild(img);
            scroller.appendChild(slide);
          });
          currentSlideIndex = 0;
          requestAnimationFrame(() => {
            scrollToSlide(0, "auto");
            updateNavState();
          });
        }
        async function validateItemsOnLoad() {
          const checks = await Promise.all(sourceItems.map(async (url) => {
            const ok = await checkImageLoadable(url);
            return ok ? url : "";
          }));
          const validItems = checks.filter(Boolean);
          if (!validItems.length) {
            setEmptyState();
            return;
          }
          buildSlides(validItems);
        }
        prev.addEventListener("click", () => {
          scrollToSlide(currentSlideIndex - 1, "smooth");
        });
        next.addEventListener("click", () => {
          scrollToSlide(currentSlideIndex + 1, "smooth");
        });
        scroller.addEventListener("scroll", () => {
          updateNavState();
        });
        scroller.addEventListener("scrollend", () => {
          updateNavState();
        });
        window.addEventListener("resize", () => {
          updateNavState();
        });

        carousel.appendChild(prev);
        carousel.appendChild(scroller);
        carousel.appendChild(next);
        setNavDisabled(prev, true);
        setNavDisabled(next, true);
        validateItemsOnLoad();
        return carousel;
      }

      function renderActualites(items) {
        const host = document.getElementById("actualitesList");
        if (!host) return;
        host.innerHTML = "";

        const sorted = [...items].sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
        const latestItem = sorted.length ? sorted[0] : null;
        const toBaseVersion = (raw) => {
          const value = String(raw || "").trim();
          if (!value) return "";
          const match = value.match(/(\d+(?:\.\d+){2})/);
          if (match && match[1]) return match[1];
          const cleaned = value.replace(/[a-z]+$/i, "");
          return cleaned || value;
        };
        const detectItemBaseVersion = (item) => {
          const fromUpdate = item && item.update && item.update.versionMap ? String(item.update.versionMap).trim() : "";
          if (fromUpdate) return toBaseVersion(fromUpdate);
          const fromMessage = String(item && item.messageRaw || "").match(/(\d+(?:\.\d+){2})/);
          if (fromMessage && fromMessage[1]) return toBaseVersion(fromMessage[1]);
          return "";
        };
        const groupInfoForItem = (item) => {
          const base = detectItemBaseVersion(item);
          if (base) return { key: `version:${base}`, label: `V ${base}` };
          return { key: "version:other", label: "Autres" };
        };
        const buildNewsArticle = (item) => {
          const localized = resolveLocalizedItem(item);
          const article = document.createElement("article");
          article.className = "news-item";
          const head = document.createElement("div");
          head.className = "news-head";

          const dateEl = document.createElement("span");
          dateEl.className = "news-date";
          dateEl.textContent = formatAbsoluteDate(item.timestamp, item.date);
          const agoText = formatRelativeDate(item.timestamp);
          const agoEl = document.createElement("span");
          agoEl.className = "news-ago";
          agoEl.textContent = agoText;

          head.appendChild(dateEl);
          if (agoText) head.appendChild(agoEl);
          article.appendChild(head);

          if (item.specialUpdate && localized.update) {
              const updateWrap = document.createElement("section");
              updateWrap.className = "news-update";
              const versionRaw = String(localized.update.versionMap || "").trim();
              const isLatestNews = !!(latestItem && item === latestItem);

              const table = document.createElement("table");
              table.className = "news-update-table";
              table.classList.add(item.tableKind === "devlog" ? "news-update-table-devlog" : "news-update-table-update");
              if (isLatestNews) table.classList.add("news-update-table-latest");

              const thead = document.createElement("thead");
              const titleRow = document.createElement("tr");
              titleRow.className = "news-update-title-row";
              const titleCell = document.createElement("th");
              titleCell.colSpan = 2;
              const titleWrap = document.createElement("div");
              titleWrap.className = "news-update-title-wrap";
              const titleLabel = document.createElement("span");
              titleLabel.className = "news-update-title-label";
              titleLabel.textContent = item.tableKind === "devlog"
                ? tableLabel("devlogLabel")
                : (isLatestNews ? tableLabel("latestUpdateLabel") : tableLabel("updateLabel"));
              titleWrap.appendChild(titleLabel);
              titleCell.appendChild(titleWrap);
              titleRow.appendChild(titleCell);
              thead.appendChild(titleRow);

              const headRow = document.createElement("tr");
              const versionTh = document.createElement("th");
              versionTh.textContent = tableLabel("versionCol");
              const contentTh = document.createElement("th");
              contentTh.textContent = item.tableKind === "devlog" ? tableLabel("imagesCol") : tableLabel("contentCol");
              headRow.appendChild(versionTh);
              headRow.appendChild(contentTh);
              thead.appendChild(headRow);
              table.appendChild(thead);

              const tbody = document.createElement("tbody");
              const row = document.createElement("tr");
              const versionCell = document.createElement("td");
              versionCell.className = "news-update-version-cell";
              versionCell.textContent = versionRaw ? `V ${versionRaw}` : "-";

              const contentCell = document.createElement("td");
              contentCell.className = "news-update-content-cell";
              if (item.tableKind === "devlog") {
                contentCell.appendChild(createDevLogCarousel(item.images));
              } else {
                contentCell.appendChild(
                  createUpdateContentList(
                    Array.isArray(localized.update.contentItems) ? localized.update.contentItems : localized.update.content
                  )
                );
              }

              row.appendChild(versionCell);
              row.appendChild(contentCell);
              tbody.appendChild(row);
              table.appendChild(tbody);
              updateWrap.appendChild(table);
              article.appendChild(updateWrap);
          } else if (localized.message) {
              const message = document.createElement("div");
              message.className = "news-message";
              message.innerHTML = renderDiscordMessageHtml(localized.message);
              article.appendChild(message);
          }

          if (!item.specialUpdate && Array.isArray(item.images) && item.images.length) {
            const imageGrid = document.createElement("div");
            imageGrid.className = "news-images";
            item.images.forEach((url) => {
              const imageLink = document.createElement("a");
              imageLink.className = "news-image-link";
              imageLink.href = url;
              imageLink.target = "_blank";
              imageLink.rel = "noopener noreferrer";

              const img = document.createElement("img");
              img.className = "news-image";
              img.loading = "lazy";
              img.src = url;
              img.alt = "Image actualite";

              imageLink.appendChild(img);
              imageGrid.appendChild(imageLink);
            });
            article.appendChild(imageGrid);
          }
          return article;
        };

        const groups = [];
        const grouped = new Map();
        sorted.forEach((item) => {
          const info = groupInfoForItem(item);
          if (!grouped.has(info.key)) {
            const entry = { key: info.key, label: info.label, items: [] };
            grouped.set(info.key, entry);
            groups.push(entry);
          }
          grouped.get(info.key).items.push(item);
        });

        const latestGroupKey = groups.length ? groups[0].key : "";
        groups.forEach((group) => {
          const details = document.createElement("details");
          details.className = "news-group";
          if (group.key === latestGroupKey) details.open = true;

          const summary = document.createElement("summary");
          summary.className = "news-group-summary";
          const title = document.createElement("span");
          title.textContent = group.label;
          const count = document.createElement("span");
          count.className = "news-group-count";
          count.textContent = `${group.items.length}`;
          summary.appendChild(title);
          summary.appendChild(count);

          const body = document.createElement("div");
          body.className = "news-group-body";
          group.items.forEach((item) => {
            body.appendChild(buildNewsArticle(item));
          });

          details.appendChild(summary);
          details.appendChild(body);
          host.appendChild(details);
        });
      }

      async function loadActualites() {
        const links = window.SITE_LINKS && typeof window.SITE_LINKS === "object" ? window.SITE_LINKS : {};
        const actualitesCfg = links.actualites && typeof links.actualites === "object" ? links.actualites : {};
        const sheetCfg = actualitesCfg.sheet && typeof actualitesCfg.sheet === "object"
          ? actualitesCfg.sheet
          : ((links.credits && links.credits.sheet) || {});

        const spreadsheetId = String(sheetCfg.spreadsheet_id || "").trim();
        const gid = String(sheetCfg.gid || "0").trim() || "0";
        const sheetName = String(sheetCfg.sheet_name || DEFAULT_SHEET_NAME).trim();
        const cacheMs = Math.max(60000, Number(sheetCfg.cache_ms) || 180000);
        const timeoutMs = Math.max(3000, Number(sheetCfg.timeout_ms) || 10000);

        if (!spreadsheetId) {
          setFeedbackByKey("credits_error", "Erreur", true, false);
          return [];
        }

        const cachedRows = readCache(cacheMs);
        if (cachedRows && cachedRows.length) {
          const entries = cachedRows.map(actualiteFromRow).filter(Boolean);
          if (entries.length) return entries;
        }

        const sheetUrl = buildSheetUrl(spreadsheetId, gid, sheetName);
        const rows = await fetchSheetRows(sheetUrl, timeoutMs);
        if (rows.length) writeCache(rows);
        return rows.map(actualiteFromRow).filter(Boolean);
      }

      function render() {
        const pageTitle = t("nav_actualites", "Actualites");
        const titleEl = document.getElementById("actualitesTitle");
        if (titleEl) titleEl.textContent = pageTitle;
        document.title = `Ile-de-France Map | ${pageTitle}`;
      }

      let CURRENT_ITEMS = [];
      function applyItems(items) {
        CURRENT_ITEMS = Array.isArray(items) ? items : [];
        renderActualites(CURRENT_ITEMS);
      }

      render();
      setFeedbackByKey("credits_loading", "Chargement", false, true);
      loadActualites()
        .then((items) => {
          applyItems(items);
          clearFeedback();
        })
        .catch(() => {
          applyItems([]);
          setFeedbackByKey("credits_error", "Erreur", true, false);
        });

      new MutationObserver(() => {
        render();
        renderActualites(CURRENT_ITEMS);
        refreshFeedbackLocale();
      }).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["lang"]
      });
    })();
  </script>
  <script>
    window.__setAppReady?.();
  </script>

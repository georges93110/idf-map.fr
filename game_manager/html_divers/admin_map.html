<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #output {
      display: none !important;
    }

    .leaflet-container,
    .leaflet-container .leaflet-control-container {
      font-family: Arial, Helvetica, sans-serif;
    }

    .player-marker {
      position: relative;
      width: 34px;
      height: 34px;
      cursor: pointer;
      pointer-events: auto;
    }

    .player-marker-dot {
      position: relative;
      width: 34px;
      height: 34px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: #2f8cff;
      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.44),
        0 4px 12px rgba(0, 0, 0, 0.45);
      box-sizing: border-box;
      pointer-events: auto;
    }

    .player-marker-dot::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 17px solid #fff;
      transform: translate(-50%, -62%) rotate(var(--heading, 0deg));
      transform-origin: 50% 70%;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    .player-marker-dot.is-anonymous {
      background: #000000;
    }

    .player-marker-dot.is-stale {
      background: #ef4444;
    }

    .player-marker-dot.is-paused {
      background: #facc15;
    }

    .player-marker-label {
      position: absolute;
      left: 50%;
      top: 38px;
      transform: translateX(-50%);
      max-width: 180px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 700 12px/1.2 Arial, Helvetica, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .map-error {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 1000;
      max-width: min(520px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: 8px;
      background: rgba(127, 29, 29, 0.85);
      color: #fee2e2;
      font: 13px/1.35 Arial, Helvetica, sans-serif;
    }

    .map-error[hidden] {
      display: none !important;
    }

    .player-filter-panel,
    .player-legend {
      position: fixed;
      right: 12px;
      z-index: 1000;
      width: min(260px, calc(100vw - 24px));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(10, 10, 12, 0.84);
      color: #fff;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    .player-filter-panel {
      top: 12px;
      padding: 10px;
    }

    .player-filter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font: 700 13px/1.2 Arial, Helvetica, sans-serif;
    }

    .player-filter-total {
      color: rgba(255, 255, 255, 0.76);
      font-weight: 700;
    }

    .player-filter-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font: 700 12px/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    .player-filter-row:first-of-type {
      border-top: 0;
    }

    .player-filter-row input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #2f8cff;
      cursor: pointer;
    }

    .player-filter-count {
      min-width: 34px;
      color: rgba(255, 255, 255, 0.78);
      text-align: right;
      font-weight: 700;
    }

    .player-legend {
      bottom: 12px;
      padding: 9px 10px;
    }

    .player-legend-title {
      margin-bottom: 7px;
      font: 700 12px/1.2 Arial, Helvetica, sans-serif;
    }

    .player-legend-row {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 22px;
      color: rgba(255, 255, 255, 0.86);
      font: 700 11px/1.2 Arial, Helvetica, sans-serif;
    }

    .player-legend-dot {
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: #2f8cff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.42);
      box-sizing: border-box;
    }

    .player-legend-dot.is-paused {
      background: #facc15;
    }

    .player-legend-dot.is-stale {
      background: #ef4444;
    }

    .player-legend-dot.is-anonymous {
      background: #000000;
    }

    .player-info-leaflet-popup .leaflet-popup-content-wrapper {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(10, 10, 12, 0.94);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.44);
      backdrop-filter: blur(10px);
    }

    .player-info-leaflet-popup .leaflet-popup-content {
      width: min(520px, calc(100vw - 54px));
      margin: 0;
    }

    .player-info-leaflet-popup .leaflet-popup-tip {
      background: rgba(10, 10, 12, 0.94);
    }

    .player-info-popup {
      max-height: min(560px, calc(100vh - 86px));
      overflow: auto;
      padding: 13px;
      box-sizing: border-box;
      font: 12px/1.35 Arial, Helvetica, sans-serif;
    }

    .player-info-title {
      margin: 0 0 10px;
      font: 800 16px/1.2 Arial, Helvetica, sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-info-section {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .player-info-section:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .player-info-section-title {
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.72);
      font: 800 11px/1.2 Arial, Helvetica, sans-serif;
      text-transform: uppercase;
    }

    .player-info-row {
      display: grid;
      grid-template-columns: minmax(126px, 34%) minmax(0, 1fr);
      gap: 10px;
      min-height: 21px;
      align-items: start;
    }

    .player-info-key {
      color: rgba(255, 255, 255, 0.62);
      font-weight: 700;
    }

    .player-info-value {
      min-width: 0;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 700;
    }

    .player-info-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .player-info-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #2f8cff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.78);
    }

    .player-info-status-dot.is-anonymous {
      background: #000000;
    }

    .player-info-status-dot.is-stale {
      background: #ef4444;
    }

    .player-info-status-dot.is-paused {
      background: #facc15;
    }

    .pcc-voice-panel {
      display: grid;
      gap: 8px;
    }

    .pcc-voice-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pcc-voice-btn {
      min-height: 30px;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: rgba(47, 140, 255, 0.22);
      color: #fff;
      font: 800 11px/1.15 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    .pcc-voice-btn:hover:not(:disabled) {
      background: rgba(47, 140, 255, 0.34);
    }

    .pcc-voice-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .pcc-voice-btn.is-recording {
      border-color: rgba(248, 113, 113, 0.68);
      background: rgba(220, 38, 38, 0.34);
    }

    .pcc-voice-btn.is-secondary {
      background: rgba(255, 255, 255, 0.08);
    }

    .pcc-voice-status {
      min-height: 16px;
      color: rgba(255, 255, 255, 0.72);
      font: 700 11px/1.3 Arial, Helvetica, sans-serif;
    }

    .pcc-voice-status.is-error {
      color: #fecaca;
    }

    .pcc-voice-status.is-ok {
      color: #bbf7d0;
    }

  </style>
</head>
<body>
  <div id="map" aria-label="Carte live"></div>
  <pre id="output" hidden></pre>
  <div id="mapError" class="map-error" hidden></div>
  <div class="player-filter-panel" aria-label="Filtres joueurs">
    <div class="player-filter-head">
      <span>Joueurs</span>
      <span id="playerTotalCount" class="player-filter-total">(0)</span>
    </div>
    <label class="player-filter-row">
      <input id="filterSolo" type="checkbox" checked>
      <span>Solo</span>
      <span id="soloCount" class="player-filter-count">(0)</span>
    </label>
    <label class="player-filter-row">
      <input id="filterConvoy" type="checkbox" checked>
      <span>Serveur Convoi</span>
      <span id="convoyCount" class="player-filter-count">(0)</span>
    </label>
  </div>
  <div class="player-legend" aria-label="Légende joueurs">
    <div class="player-legend-title">Légende</div>
    <div class="player-legend-row"><span class="player-legend-dot"></span><span>Joueur actif</span></div>
    <div class="player-legend-row"><span class="player-legend-dot is-paused"></span><span>Joueur en pause / dans le menu</span></div>
    <div class="player-legend-row"><span class="player-legend-dot is-stale"></span><span>Joueur (signal perdu)</span></div>
    <div class="player-legend-row"><span class="player-legend-dot is-anonymous"></span><span>Joueur (aucun pseudo détecté)</span></div>
  </div>

  <script src="../config/line-config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      "use strict";

      const WS_URL = "wss://panel.idf-map.fr/idfmap/ws/native/";
      const MAP_FILES_ROOT = "../../map_files";
      const VERSION_PATTERN = /^(\d+)\.(\d+)\.(\d+)([a-z])$/i;
      const WS_RECONNECT_MS = 2000;
      const PLAYER_WARNING_MS = 1000;
      const PLAYER_STALE_MS = 10000;
      const PLAYER_STATE_REFRESH_MS = 500;
      const PLAYER_POSITION_INTERPOLATION_MS = 1000;
      const PLAYER_GROUP_SOLO = "solo";
      const PLAYER_GROUP_CONVOY = "convoy";
      const PCC_VOICE_ACTION = "pcc_voice";
      const PCC_VOICE_MAX_DURATION_MS = 12000;
      const PCC_VOICE_MAX_BYTES = 3000000;
      const PCC_VOICE_CHUNK_CHARS = 48000;
      const PCC_VOICE_CHUNK_DELAY_MS = 8;
      const PCC_VOICE_FILTERS = [
        ["radio", "Filtre radio"],
        ["souffle", "Souffle"],
        ["gresillement", "Gresillement"],
        ["perte_signal", "Perte de signal"],
        ["signal_faible", "Signal faible"],
        ["latence", "Latence"],
        ["saturation", "Saturation"],
        ["interferences", "Interferences"]
      ];

      const output = document.getElementById("output");
      const mapError = document.getElementById("mapError");
      const filterSolo = document.getElementById("filterSolo");
      const filterConvoy = document.getElementById("filterConvoy");
      const soloCount = document.getElementById("soloCount");
      const convoyCount = document.getElementById("convoyCount");
      const playerTotalCount = document.getElementById("playerTotalCount");

      const minNativeZoom = 0;
      const maxNativeZoom = 8;
      const tileSize = 256;
      const widthPx = tileSize * Math.pow(2, maxNativeZoom);
      const heightPx = tileSize * Math.pow(2, maxNativeZoom);

      let tileMapInfo = null;
      let selectedVersion = "";
      let dataBase = "";
      let tileBase = "";
      let hasCenteredOnPlayer = false;
      let socket = null;
      let reconnectTimer = 0;
      let playerAnimationFrame = 0;
      let pccRecording = null;
      let pccRecordTimeout = 0;
      const playerMarkers = new Map();
      const pccStatusByPlayerId = new Map();
      const playerFilters = {
        [PLAYER_GROUP_SOLO]: true,
        [PLAYER_GROUP_CONVOY]: true
      };
      const identityKeys = [
        "steamid",
        "steamId",
        "steamID",
        "steam_id",
        "name",
        "steamName",
        "steam_name",
        "playerName",
        "player_name",
        "username",
        "userName",
        "personaname",
        "displayname",
        "displayName",
        "display_name",
        "steamDisplayName",
        "steam_display_name",
        "nickname",
        "from",
        "playerId",
        "player_id"
      ];
      const visibleIdentityKeys = identityKeys.filter((key) => !["from", "playerId", "player_id"].includes(key));

      const map = L.map("map", {
        crs: L.CRS.Simple,
        attributionControl: false,
        zoomControl: true,
        minZoom: minNativeZoom + 4,
        maxZoom: maxNativeZoom + 2,
        zoomSnap: 0.25,
        zoomDelta: 0.25,
        wheelPxPerZoomLevel: 80,
        maxBoundsViscosity: 1.0,
        inertia: true,
        preferCanvas: true,
        zoomAnimation: true,
        fadeAnimation: true,
        markerZoomAnimation: true
      });
      const busRoutePane = map.createPane("busRoutePane");
      busRoutePane.style.zIndex = "430";
      busRoutePane.style.pointerEvents = "none";
      const busStopPane = map.createPane("busStopPane");
      busStopPane.style.zIndex = "520";
      busStopPane.style.pointerEvents = "none";

      const fullBounds = L.latLngBounds(
        map.unproject(L.point(0, heightPx), maxNativeZoom),
        map.unproject(L.point(widthPx, 0), maxNativeZoom)
      );

      function showError(message) {
        const text = String(message || "").trim();
        if (!text) {
          mapError.hidden = true;
          mapError.textContent = "";
          return;
        }
        mapError.textContent = text;
        mapError.hidden = false;
      }

      function parseVersion(value) {
        const match = VERSION_PATTERN.exec(String(value || "").trim());
        if (!match) return null;
        return {
          raw: `${parseInt(match[1], 10)}.${parseInt(match[2], 10)}.${parseInt(match[3], 10)}${match[4].toLowerCase()}`,
          major: parseInt(match[1], 10),
          minor: parseInt(match[2], 10),
          patch: parseInt(match[3], 10),
          suffix: match[4].toLowerCase()
        };
      }

      function compareVersions(a, b) {
        if (a.major !== b.major) return a.major - b.major;
        if (a.minor !== b.minor) return a.minor - b.minor;
        if (a.patch !== b.patch) return a.patch - b.patch;
        return a.suffix.localeCompare(b.suffix);
      }

      async function selectMapVersion() {
        const response = await fetch(`${MAP_FILES_ROOT}/versions.json`, { cache: "no-store" });
        if (!response.ok) throw new Error("versions.json introuvable");
        const list = await response.json();
        const versions = (Array.isArray(list) ? list : list && list.versions || [])
          .map(parseVersion)
          .filter(Boolean)
          .sort(compareVersions);
        if (!versions.length) throw new Error("Aucune version de map disponible");
        const forced = parseVersion(new URLSearchParams(location.search).get("version"));
        return forced ? forced.raw : versions[versions.length - 1].raw;
      }

      function innerBounds(margin) {
        const sw = L.point(margin, heightPx - margin);
        const ne = L.point(widthPx - margin, margin);
        return L.latLngBounds(
          map.unproject(sw, maxNativeZoom),
          map.unproject(ne, maxNativeZoom)
        );
      }

      function applyBounds() {
        const bounds = innerBounds(64);
        map.setMaxBounds(bounds);
        map.panInsideBounds(bounds, { animate: false });
      }

      function toLatLng(worldX, worldY) {
        if (!tileMapInfo) return null;
        const x = Number(worldX);
        const y = Number(worldY);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        const px = (x - tileMapInfo.x1) / (tileMapInfo.x2 - tileMapInfo.x1) * widthPx;
        const py = (y - tileMapInfo.y1) / (tileMapInfo.y2 - tileMapInfo.y1) * heightPx;
        return map.unproject([px, py], maxNativeZoom);
      }

      function routePointToLatLng(point) {
        if (!point || typeof point !== "object") return null;
        const x = Number(point.x ?? point.X);
        const y = Number(point.y ?? point.Y ?? point.z ?? point.Z);
        return toLatLng(x, y);
      }

      function routePointsToLatLngs(points) {
        return (Array.isArray(points) ? points : [])
          .map(routePointToLatLng)
          .filter(Boolean);
      }

      function readNumber(source, keys) {
        if (!source || typeof source !== "object") return null;
        for (const key of keys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = Number(source[key]);
          if (Number.isFinite(value)) return value;
        }
        return null;
      }

      function readString(source, keys) {
        if (!source || typeof source !== "object") return "";
        for (const key of keys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = String(source[key] == null ? "" : source[key]).trim();
          if (/^(null|nil|undefined)$/i.test(value)) continue;
          if (value) return value;
        }
        return "";
      }

      function readCollectionCount(source, keys) {
        if (!source || typeof source !== "object") return null;
        for (const key of keys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = source[key];
          if (Array.isArray(value)) return value.length;
          if (value && typeof value === "object") return Object.keys(value).length;
          const number = Number(value);
          if (Number.isFinite(number) && number >= 0) return Math.floor(number);
        }
        return null;
      }

      function readBooleanState(source, keys) {
        if (!source || typeof source !== "object") return null;
        for (const key of keys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = source[key];
          if (value === true || value === false) return value;
          if (typeof value === "number" && Number.isFinite(value)) return value !== 0;
          const text = String(value == null ? "" : value).trim().toLowerCase();
          if (!text) continue;
          if (["true", "1", "yes", "oui", "on", "pause", "paused", "menu", "main_menu", "in_menu"].includes(text)) return true;
          if (["false", "0", "no", "non", "off", "drive", "driving", "game", "play", "playing"].includes(text)) return false;
        }
        return null;
      }

      function isPausedOrMenuSource(source) {
        if (!source || typeof source !== "object") return false;
        const flag = readBooleanState(source, [
          "paused",
          "isPaused",
          "gamePaused",
          "isGamePaused",
          "pause",
          "inMenu",
          "isInMenu",
          "menuOpen",
          "isMenuOpen",
          "mainMenu",
          "isMainMenuOpen",
          "inPauseMenu",
          "isInPauseMenu"
        ]);
        if (flag === true) return true;
        const state = readString(source, ["state", "status", "mode", "uiMode", "ui_mode", "gameState", "game_state", "screen", "screenName"]);
        const normalized = state.replace(/[-\s]+/g, "_").toLowerCase();
        return normalized.includes("pause") || normalized.includes("menu");
      }

      function normalizeTelemetryFieldKey(key) {
        return String(key || "").trim().toLowerCase().replace(/[\s_\-.]/g, "");
      }

      function readBooleanStateLoose(source, keys) {
        if (!source || typeof source !== "object") return null;
        const direct = readBooleanState(source, keys);
        if (direct !== null) return direct;
        const wanted = new Set(keys.map(normalizeTelemetryFieldKey));
        for (const key of Object.keys(source)) {
          if (!wanted.has(normalizeTelemetryFieldKey(key))) continue;
          const value = source[key];
          if (value === true || value === false) return value;
          if (typeof value === "number" && Number.isFinite(value)) return value !== 0;
          const text = String(value == null ? "" : value).trim().toLowerCase();
          if (["true", "1", "yes", "oui", "on"].includes(text)) return true;
          if (["false", "0", "no", "non", "off"].includes(text)) return false;
        }
        return null;
      }

      function readGameContextInServerRecursive(source, depth = 0, seen = new Set()) {
        if (!source || typeof source !== "object" || depth > 20 || seen.has(source)) return null;
        seen.add(source);
        let foundFalse = false;
        const direct = readBooleanStateLoose(source, ["inServer"]);
        if (direct === true) {
          seen.delete(source);
          return true;
        }
        if (direct === false) foundFalse = true;

        for (const value of Object.values(source)) {
          if (!value || typeof value !== "object") continue;
          const nested = readGameContextInServerRecursive(value, depth + 1, seen);
          if (nested === true) {
            seen.delete(source);
            return true;
          }
          if (nested === false) foundFalse = true;
        }
        seen.delete(source);
        return foundFalse ? false : null;
      }

      function readGameContextInServerFromSource(source) {
        return readGameContextInServerRecursive(source);
      }

      function readGameContextInServerFromPools(pools) {
        let foundFalse = false;
        for (const source of Array.isArray(pools) ? pools : []) {
          const inServerFlag = readGameContextInServerFromSource(source);
          if (inServerFlag === true) return true;
          if (inServerFlag === false) foundFalse = true;
        }
        return foundFalse ? false : null;
      }

      function readPlayerGroupFromSource(source) {
        if (!source || typeof source !== "object") return "";
        const inServerFlag = readGameContextInServerFromSource(source);
        if (inServerFlag === true) return PLAYER_GROUP_CONVOY;
        if (inServerFlag === false) return PLAYER_GROUP_SOLO;
        const convoyFlag = readBooleanState(source, [
          "convoy",
          "isConvoy",
          "inConvoy",
          "serverConvoy",
          "isServerConvoy",
          "multiplayer",
          "isMultiplayer",
          "multi",
          "isMulti",
          "online",
          "isOnline",
          "mp",
          "isMp"
        ]);
        if (convoyFlag === true) return PLAYER_GROUP_CONVOY;

        const soloFlag = readBooleanState(source, [
          "solo",
          "isSolo",
          "singleplayer",
          "isSingleplayer",
          "singlePlayer",
          "isSinglePlayer",
          "offline",
          "isOffline"
        ]);
        if (soloFlag === true) return PLAYER_GROUP_SOLO;
        if (soloFlag === false) return PLAYER_GROUP_CONVOY;
        if (convoyFlag === false) return PLAYER_GROUP_SOLO;

        const text = readString(source, [
          "serverType",
          "server_type",
          "serverMode",
          "server_mode",
          "serverName",
          "server_name",
          "convoyServer",
          "convoy_server",
          "sessionName",
          "session_name",
          "session",
          "lobby",
          "networkMode",
          "network_mode",
          "gameMode",
          "game_mode",
          "mode",
          "sourceMode",
          "source_mode"
        ]).toLowerCase();
        if (/\b(convoy|convoi|multi|multiplayer|serveur|server|online|truckersmp)\b/.test(text)) return PLAYER_GROUP_CONVOY;
        if (/\b(solo|single|singleplayer|offline|local)\b/.test(text)) return PLAYER_GROUP_SOLO;
        return "";
      }

      function readPlayerGroupFromPools(pools) {
        const inServerFlag = readGameContextInServerFromPools(pools);
        if (inServerFlag === true) return PLAYER_GROUP_CONVOY;
        if (inServerFlag === false) return PLAYER_GROUP_SOLO;
        for (const source of pools) {
          const group = readPlayerGroupFromSource(source);
          if (group === PLAYER_GROUP_CONVOY) return PLAYER_GROUP_CONVOY;
        }
        return PLAYER_GROUP_SOLO;
      }

      function entryPools(entry) {
        if (!entry || typeof entry !== "object") return [];
        return [
          entry,
          entry.data,
          entry.payload,
          entry.telemetry,
          entry.signal,
          entry.gameContext,
          entry.game_context,
          entry.data && entry.data.gameContext,
          entry.data && entry.data.game_context,
          entry.payload && entry.payload.gameContext,
          entry.payload && entry.payload.game_context,
          entry.telemetry && entry.telemetry.gameContext,
          entry.telemetry && entry.telemetry.game_context,
          entry.signal && entry.signal.gameContext,
          entry.signal && entry.signal.game_context,
          entry.context,
          entry.context && entry.context.gameContext,
          entry.context && entry.context.game_context,
          entry.game,
          entry.position,
          entry.pos,
          entry.location,
          entry.vehicle,
          entry.truck,
          entry.truckPosition,
          entry.identity,
          entry.playerIdentity,
          entry.player_identity,
          entry.player,
          entry.client,
          entry.sender,
          entry.author,
          entry.account,
          entry.user,
          entry.profile,
          entry.steam,
          entry.metadata,
          entry.meta,
          entry.playerInfo,
          entry.player_info,
          entry.data && entry.data.identity,
          entry.data && entry.data.playerIdentity,
          entry.data && entry.data.player_identity,
          entry.payload && entry.payload.identity,
          entry.payload && entry.payload.playerIdentity,
          entry.payload && entry.payload.player_identity,
          entry.signal && entry.signal.identity,
          entry.signal && entry.signal.playerIdentity,
          entry.signal && entry.signal.player_identity,
          entry.telemetry && entry.telemetry.identity,
          entry.telemetry && entry.telemetry.playerIdentity,
          entry.telemetry && entry.telemetry.player_identity,
          entry.gameContext && entry.gameContext.identity,
          entry.gameContext && entry.gameContext.playerIdentity,
          entry.gameContext && entry.gameContext.player_identity,
          entry.game_context && entry.game_context.identity,
          entry.game_context && entry.game_context.playerIdentity,
          entry.game_context && entry.game_context.player_identity
        ].filter((item) => item && typeof item === "object");
      }

      function profilePools(entry) {
        if (!entry || typeof entry !== "object") return [];
        return [
          entry.profile,
          entry.profileInfo,
          entry.profile_info,
          entry.gameProfile,
          entry.game_profile,
          entry.gameContext && entry.gameContext.profile,
          entry.game_context && entry.game_context.profile,
          entry.context && entry.context.profile,
          entry.game && entry.game.profile,
          entry.data && entry.data.profile,
          entry.payload && entry.payload.profile
        ].filter((item) => item && typeof item === "object");
      }

      function hasIdentity(source) {
        if (!source || typeof source !== "object") return false;
        return identityKeys.some((key) => {
          if (!Object.prototype.hasOwnProperty.call(source, key)) return false;
          const value = source[key];
          return value != null && String(value).trim() !== "";
        });
      }

      function hasVisibleIdentity(source) {
        if (!source || typeof source !== "object") return false;
        return visibleIdentityKeys.some((key) => {
          if (!Object.prototype.hasOwnProperty.call(source, key)) return false;
          const value = source[key];
          return value != null && String(value).trim() !== "";
        });
      }

      function readIdentity(source, depth = 0, seen = new Set()) {
        if (!source || typeof source !== "object" || depth > 4 || seen.has(source)) return {};
        seen.add(source);

        const result = {};
        for (const key of identityKeys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = source[key];
          if (value == null || String(value).trim() === "") continue;
          result[key] = value;
        }
        if (hasVisibleIdentity(result)) return result;

        const priorityKeys = [
          "player",
          "client",
          "sender",
          "author",
          "account",
          "user",
          "profile",
          "identity",
          "playerIdentity",
          "player_identity",
          "steam",
          "metadata",
          "meta",
          "from",
          "playerInfo",
          "player_info"
        ];
        for (const key of priorityKeys) {
          const nested = source[key];
          if (!nested || typeof nested !== "object") continue;
          const identity = readIdentity(nested, depth + 1, seen);
          if (hasVisibleIdentity(identity) || hasIdentity(identity)) return identity;
        }

        for (const value of Object.values(source)) {
          if (!value || typeof value !== "object") continue;
          const identity = readIdentity(value, depth + 1, seen);
          if (hasVisibleIdentity(identity) || hasIdentity(identity)) return identity;
        }
        return hasIdentity(result) ? result : {};
      }

      function normalizeHeadingDeg(value) {
        let deg = Number(value);
        if (!Number.isFinite(deg)) return 0;
        deg = deg % 360;
        if (deg < 0) deg += 360;
        return deg;
      }

      function headingToMarkerRotationDeg(value, convention, unit) {
        let deg = Number(value);
        if (!Number.isFinite(deg)) return 0;
        const unitText = String(unit || "").trim().toLowerCase();
        if (unitText === "rad" || unitText === "radian" || unitText === "radians") {
          deg = deg * (180 / Math.PI);
        }
        deg = normalizeHeadingDeg(deg);
        const mode = String(convention || "north_ccw").trim().toLowerCase();
        if (mode === "north_cw" || mode === "compass" || mode === "telemetry_cw") {
          return normalizeHeadingDeg(deg);
        }
        if (mode === "screen" || mode === "east_ccw" || mode === "map") {
          return normalizeHeadingDeg(deg + 90);
        }
        return normalizeHeadingDeg(-deg);
      }

      function isTechnicalIdentifierText(value) {
        const text = String(value || "").trim();
        if (!text) return false;
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(text)) return true;
        if (/^[0-9a-f]{24,}$/i.test(text)) return true;
        if (/^\d{15,20}$/.test(text)) return true;
        if (/^(player|client|user|session|socket)[_-]?[0-9a-f-]{8,}$/i.test(text)) return true;
        return false;
      }

      function isEmptyIdentityText(value) {
        const text = String(value == null ? "" : value).trim();
        return !text || /^(null|nil|undefined|none|nan|n\/a|unknown|inconnu|anonymous|anonyme)$/i.test(text);
      }

      function normalizeVisiblePlayerName(value) {
        const text = String(value == null ? "" : value).trim();
        if (isEmptyIdentityText(text)) return "";
        if (isTechnicalIdentifierText(text)) return "";
        return text;
      }

      function readVisiblePlayerName(source, keys) {
        if (!source || typeof source !== "object") return "";
        for (const key of keys) {
          if (!Object.prototype.hasOwnProperty.call(source, key)) continue;
          const value = normalizeVisiblePlayerName(source[key]);
          if (value) return value;
        }
        return "";
      }

      function isAnonymousPlayer(player) {
        return !normalizeVisiblePlayerName(player && player.label);
      }

      function playerDisplayTitle(player) {
        return normalizeVisiblePlayerName(player && player.label) || "Joueur sans pseudo";
      }

      function sortWebsocketDataForDisplay(value, depth = 0, seen = new Set()) {
        if (value == null || typeof value !== "object") return value;
        if (seen.has(value)) return "[circular]";
        if (depth >= 6) return Array.isArray(value) ? `[array:${value.length}]` : "[object]";
        seen.add(value);

        if (Array.isArray(value)) {
          const limit = 80;
          const out = value.slice(0, limit).map((item) => sortWebsocketDataForDisplay(item, depth + 1, seen));
          if (value.length > limit) out.push(`... ${value.length - limit} element(s) masque(s)`);
          seen.delete(value);
          return out;
        }

        const out = {};
        Object.keys(value).sort((a, b) => a.localeCompare(b)).forEach((key) => {
          out[key] = sortWebsocketDataForDisplay(value[key], depth + 1, seen);
        });
        seen.delete(value);
        return out;
      }

      function buildPlayerWebsocketInfo(entry) {
        if (!entry || typeof entry !== "object") return {};
        return sortWebsocketDataForDisplay(entry);
      }

      function readGame2Bonus(source) {
        if (!source || typeof source !== "object") return null;
        const candidates = [
          source.game2Bonus,
          source.bonus,
          source.htmlState,
          source.interfaceState,
          source.game2State,
          source.idfMapState
        ];
        for (const candidate of candidates) {
          if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) continue;
          const kind = String(candidate.kind || "").trim();
          if (!kind || kind === "game2_html_state" || candidate.gameMode || candidate.busLine) return candidate;
        }
        return null;
      }

      function readGame2BonusFromPools(pools) {
        for (const source of Array.isArray(pools) ? pools : []) {
          const bonus = readGame2Bonus(source);
          if (bonus) return bonus;
        }
        return null;
      }

      function extractPlayer(entry, fallbackIndex) {
        const pools = entryPools(entry);
        if (!pools.length) return null;
        const inServerFlag = readGameContextInServerFromPools(pools);
        const group = inServerFlag === true
          ? PLAYER_GROUP_CONVOY
          : (inServerFlag === false ? PLAYER_GROUP_SOLO : readPlayerGroupFromPools(pools));
        const websocketInfo = buildPlayerWebsocketInfo(entry);
        const game2Bonus = readGame2BonusFromPools([entry].concat(pools));
        const game2Mode = game2Bonus && game2Bonus.gameMode && typeof game2Bonus.gameMode === "object" ? game2Bonus.gameMode : null;
        const busLine = game2Bonus && game2Bonus.busLine && typeof game2Bonus.busLine === "object" ? game2Bonus.busLine : null;

        let x = null;
        let z = null;
        let heading = null;
        let headingUnit = "";
        let headingConvention = "";
        let steamid = "";
        let name = "";
        let displayname = "";
        let technicalId = "";
        let isPausedOrMenu = false;
        let speedKmh = null;
        let ets2version = "";
        let modsCount = null;
        let profileName = "";
        let profileId = "";
        let truckDamagePercent = null;
        let vehicleName = "";

        for (const source of pools) {
          if (x === null) x = readNumber(source, ["x", "X", "worldX", "world_x", "posX", "positionX"]);
          if (z === null) z = readNumber(source, ["z", "Z", "worldZ", "world_z", "posZ", "positionZ"]);
          if (z === null) z = readNumber(source, ["mapY", "worldY", "world_y"]);
          if (z === null) z = readNumber(source, ["y", "Y", "posY", "positionY"]);
          if (heading === null) heading = readNumber(source, ["heading", "Heading", "rotation", "yaw"]);
          if (!headingUnit) headingUnit = readString(source, ["headingUnit", "heading_unit", "unit"]);
          if (!headingConvention) headingConvention = readString(source, ["headingConvention", "heading_convention", "headingMode", "heading_mode"]);
          if (!steamid) steamid = readString(source, ["steamid", "steamId", "steamID", "steam_id"]);
          if (!displayname) displayname = readVisiblePlayerName(source, ["displayname", "displayName", "display_name", "steamDisplayName", "steam_display_name", "steamName", "steam_name", "personaname", "personaName", "persona_name", "nickname"]);
          if (!name) name = readVisiblePlayerName(source, ["name", "playerName", "player_name", "username", "userName"]);
          if (!technicalId) technicalId = readString(source, ["playerId", "player_id", "from"]);
          if (!isPausedOrMenu && isPausedOrMenuSource(source)) isPausedOrMenu = true;
          if (speedKmh === null) speedKmh = readNumber(source, ["speedKmh", "speed_kmh", "speed", "truckSpeed", "truck_speed"]);
          if (!ets2version) ets2version = readString(source, ["ets2version", "ets2Version", "ets2_version", "gameVersion", "game_version"]);
          if (modsCount === null) modsCount = readCollectionCount(source, ["modsCount", "modCount", "mods_count", "mod_count", "activeModsCount", "active_mods_count", "enabledModsCount", "enabled_mods_count", "mods", "modList", "mod_list", "activeMods", "active_mods", "enabledMods", "enabled_mods"]);
          if (!profileName) profileName = readString(source, ["profileName", "profile_name"]);
          if (!profileId) profileId = readString(source, ["profileId", "profileID", "profile_id"]);
          if (truckDamagePercent === null) truckDamagePercent = readNumber(source, ["truckDamagePercent", "truck_damage_percent", "damage", "wearSum"]);
          if (!vehicleName) vehicleName = readString(source, ["vehicleName", "vehicle_name", "truckName", "truck_name", "truckModel", "truck_model", "vehicle", "truck"]);
        }

        for (const source of profilePools(entry)) {
          if (!profileName) profileName = readString(source, ["profileName", "profile_name", "name", "Name", "displayName", "display_name"]);
          if (!profileId) profileId = readString(source, ["profileId", "profileID", "profile_id", "id", "ID"]);
        }

        if (x === null || z === null) return null;
        displayname = normalizeVisiblePlayerName(displayname);
        name = normalizeVisiblePlayerName(name);

        const label = displayname || name || "";
        const id = steamid || technicalId || displayname || name || `player-${fallbackIndex}`;
        return {
          id,
          steamid,
          name,
          displayname,
          label,
          isAnonymous: !label,
          x,
          z,
          heading: Number.isFinite(Number(heading)) ? Number(heading) : 0,
          headingUnit,
          headingConvention: headingConvention || "north_ccw",
          group,
          inServer: inServerFlag,
          isPausedOrMenu,
          speedKmh,
          ets2version,
          modsCount,
          profileName,
          profileId,
          truckDamagePercent,
          vehicleName,
          htmlStateTitle: game2Bonus ? readString(game2Bonus, ["title"]) : "",
          gameModeLabel: game2Mode ? readString(game2Mode, ["label"]) : "",
          gameModeKey: game2Mode ? readString(game2Mode, ["key"]) : "",
          busLine,
          websocketInfo
        };
      }

      function mergePlayerCollectionContext(entry, context) {
        if (!entry || typeof entry !== "object" || Array.isArray(entry)) return entry;
        if (!context || typeof context !== "object" || Array.isArray(context)) return entry;
        return Object.assign({}, context, entry);
      }

      function collectPlayers(payload) {
        const roots = [];
        if (Array.isArray(payload)) roots.push(...payload);
        else if (payload && typeof payload === "object") {
          roots.push(payload);
          const candidates = [
            payload.players,
            payload.player,
            payload.clients,
            payload.users,
            payload.vehicles,
            payload.data,
            payload.payload
          ];
          for (const candidate of candidates) {
            if (Array.isArray(candidate)) roots.push(...candidate.map((item) => mergePlayerCollectionContext(item, payload)));
            else if (candidate && typeof candidate === "object") {
              const values = Object.values(candidate);
              if (values.some((value) => value && typeof value === "object")) {
                roots.push(...values.map((item) => mergePlayerCollectionContext(item, payload)));
              } else {
                roots.push(mergePlayerCollectionContext(candidate, payload));
              }
            }
          }
        }

        const players = [];
        const seen = new Set();
        roots.forEach((entry, index) => {
          const player = extractPlayer(entry, index);
          if (!player || seen.has(player.id)) return;
          seen.add(player.id);
          players.push(player);
        });
        return players;
      }

      function playerIcon(player, state = "live") {
        const heading = headingToMarkerRotationDeg(player.heading, player.headingConvention, player.headingUnit);
        const label = normalizeVisiblePlayerName(player && player.label);
        const labelHtml = label ? `<div class="player-marker-label">${escapeHtml(label)}</div>` : "";
        const stateClass = state === "paused" ? " is-paused" : (state === "stale" ? " is-stale" : "");
        const nameClass = isAnonymousPlayer(player) ? " is-anonymous" : "";
        const dotClass = `player-marker-dot${nameClass}${stateClass}`;
        const playerId = escapeHtml(player.id || "");
        return L.divIcon({
          className: "",
          iconSize: [34, 34],
          iconAnchor: [17, 17],
          html: `<div class="player-marker" data-player-id="${playerId}"><div class="${dotClass}" style="--heading:${heading.toFixed(1)}deg"></div>${labelHtml}</div>`
        });
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatInfoNumber(value, digits = 2) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return number.toFixed(digits);
      }

      function formatInfoAge(ms) {
        const age = Math.max(0, Number(ms) || 0);
        if (age < 1000) return `${Math.round(age)} ms`;
        return `${(age / 1000).toFixed(1)} s`;
      }

      function formatInfoInteger(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return String(Math.max(0, Math.floor(number)));
      }

      function formatInfoPercent(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return `${number.toFixed(1)}%`;
      }

      function formatInfoMeters(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return `${number.toFixed(1)} m`;
      }

      function formatInfoMinutes(value) {
        const number = Number(value);
        if (!Number.isFinite(number)) return "";
        return `${number.toFixed(1)} min`;
      }

      function formatInfoDurationMs(ms) {
        const total = Math.max(0, Math.round(Number(ms) || 0));
        if (!total) return "";
        const minutes = Math.floor(total / 60000);
        const seconds = Math.floor((total % 60000) / 1000);
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        if (hours > 0) return `${hours}h ${String(mins).padStart(2, "0")}min`;
        return `${mins}min ${String(seconds).padStart(2, "0")}s`;
      }

      function formatProfileInfo(name, id) {
        const profileName = String(name || "").trim();
        const profileId = String(id || "").trim();
        if (profileName && profileId) return `${profileName} (${profileId})`;
        return profileName || profileId;
      }

      function playerGroupLabel(group) {
        return normalizePlayerGroup(group) === PLAYER_GROUP_CONVOY ? "Serveur Convoi" : "Solo";
      }

      function playerGroupLabelForPlayer(player) {
        if (player && player.inServer === true) return "Serveur Convoi";
        if (player && player.inServer === false) return "Solo";
        return playerGroupLabel(player && player.group);
      }

      function playerStateLabel(state) {
        if (state === "paused") return "Pause / menu";
        if (state === "stale") return "Signal perdu";
        return "Actif";
      }

      function formatBusLineName(busLine) {
        if (!busLine || typeof busLine !== "object") return "";
        const line = String(busLine.lineNumber || "").trim();
        const route = String(busLine.routeName || "").trim();
        if (line && route) return `${line} - ${route}`;
        return line || route;
      }

      function formatBusLineStatus(busLine) {
        if (!busLine || typeof busLine !== "object") return "";
        if (busLine.completed === true) return "Terminee";
        if (busLine.started === true) return "En cours";
        if (busLine.waitingStart === true) return "En attente depart";
        return "Selectionnee";
      }

      function formatBusStopsProgress(busLine) {
        if (!busLine || typeof busLine !== "object") return "";
        const reached = formatInfoInteger(busLine.reachedStops);
        const remaining = formatInfoInteger(busLine.remainingStops);
        const total = formatInfoInteger(busLine.stopCount);
        const parts = [];
        if (reached) parts.push(`${reached} atteint(s)`);
        if (remaining) parts.push(`${remaining} restant(s)`);
        if (total) parts.push(`${total} total`);
        return parts.join(" / ");
      }

      function formatBusCapacity(busLine) {
        if (!busLine || typeof busLine !== "object") return "";
        const inBus = formatInfoInteger(busLine.passengersInBus);
        const cap = String(busLine.busMaxCapacityDisplay || "").trim() || formatInfoInteger(busLine.busMaxCapacity);
        if (inBus && cap) return `${inBus}/${cap}`;
        return inBus || cap;
      }

      function formatBusProgress(done, total, remaining) {
        const doneText = formatInfoInteger(done);
        const totalText = formatInfoInteger(total);
        const remainingText = formatInfoInteger(remaining);
        if (doneText && totalText && remainingText) return `${doneText}/${totalText} (${remainingText} restant)`;
        if (doneText && totalText) return `${doneText}/${totalText}`;
        return doneText || totalText || remainingText;
      }

      function playerInfoRow(key, value, field = "") {
        const text = value == null ? "" : String(value).trim();
        const attr = field ? ` data-player-info="${escapeHtml(field)}"` : "";
        const hidden = text ? "" : ` style="display:none" data-empty-row="1"`;
        return `<div class="player-info-row"${hidden}><span class="player-info-key">${escapeHtml(key)}</span><span class="player-info-value"${attr}>${escapeHtml(text)}</span></div>`;
      }

      function playerInfoSection(title, rows) {
        const body = rows.filter(Boolean).join("");
        if (!body) return "";
        const hasVisibleRow = rows.some(function (row) {
          return row && String(row).indexOf('data-empty-row="1"') === -1;
        });
        const hidden = hasVisibleRow ? "" : ` style="display:none"`;
        return `<div class="player-info-section"${hidden}><div class="player-info-section-title">${escapeHtml(title)}</div>${body}</div>`;
      }

      function normalizePccSteamId(value) {
        return String(value == null ? "" : value).trim().replace(/\s+/g, "").toLowerCase();
      }

      function isPccWebSocketReady() {
        return !!(socket && socket.readyState === WebSocket.OPEN);
      }

      function isPccRecorderSupported() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
      }

      function getPccPlayerId(player) {
        return String(player && player.id || "");
      }

      function getPccTargetSteamId(player) {
        return normalizePccSteamId(player && player.steamid);
      }

      function getPccVoiceUnavailableReason(player) {
        if (!getPccTargetSteamId(player)) return "SteamID indisponible";
        if (!isPccRecorderSupported()) return "Micro non supporte par ce navigateur";
        if (!isPccWebSocketReady()) return "WebSocket panel non connecte";
        return "";
      }

      function isPccRecordingForPlayer(player) {
        return !!(pccRecording && pccRecording.playerId === getPccPlayerId(player));
      }

      function getPccVoiceStatus(player) {
        const reason = getPccVoiceUnavailableReason(player);
        if (reason) return { text: reason, kind: "error" };
        if (isPccRecordingForPlayer(player)) return { text: "Enregistrement en cours...", kind: "error" };
        const stored = pccStatusByPlayerId.get(getPccPlayerId(player));
        if (stored && stored.text) return stored;
        return { text: "Pret a envoyer un message vocal PCC cible.", kind: "" };
      }

      function getSelectedPccVoiceFilters() {
        return PCC_VOICE_FILTERS.map(function (entry) { return entry[0]; });
      }

      function buildPccVoiceSection(player) {
        const playerId = getPccPlayerId(player);
        const steamId = getPccTargetSteamId(player);
        const reason = getPccVoiceUnavailableReason(player);
        const recording = isPccRecordingForPlayer(player);

          busAlighting: player.busLine && formatBusProgress(player.busLine.alightingDone, player.busLine.alightingTotal, player.busLine.alightingRemaining),

      function setPccVoiceStatus(playerId, text, kind = "") {
        const safeId = String(playerId || "");
        if (!safeId) return;
        const status = { text: String(text || ""), kind: String(kind || "") };
        pccStatusByPlayerId.set(safeId, status);
        for (const record of playerMarkers.values()) {
          if (getPccPlayerId(record.player) !== safeId) continue;
          syncPccVoiceControls(record);
        }
      }

      function syncPccVoiceControls(record) {
        if (!record || !record.marker || !record.marker.getPopup) return;
        const popup = record.marker.getPopup();
        const element = popup && popup.getElement ? popup.getElement() : null;
        if (!element) return;
        const player = record.player || {};
        const playerId = getPccPlayerId(player);
        const reason = getPccVoiceUnavailableReason(player);
        const recording = isPccRecordingForPlayer(player);
        const status = getPccVoiceStatus(player);
        const button = element.querySelector(".pcc-record-btn[data-player-id]");
        const cancelBtn = element.querySelector(".pcc-cancel-btn[data-player-id]");
        const statusNode = element.querySelector("[data-pcc-status]");
        const panel = element.querySelector("[data-pcc-panel]");
        if (panel) {
          panel.setAttribute("data-player-id", playerId);
          panel.setAttribute("data-pcc-steamid", getPccTargetSteamId(player));
        }
        if (button) {
          button.setAttribute("data-player-id", playerId);
          button.disabled = !!(reason && !recording);
          button.classList.toggle("is-recording", recording);
          button.textContent = recording ? "Arreter et envoyer" : "Enregistrer";
        }
        if (cancelBtn) {
          cancelBtn.setAttribute("data-player-id", playerId);
          cancelBtn.hidden = !recording;
        }
        if (statusNode) {
          statusNode.textContent = status.text || "";
          statusNode.classList.toggle("is-error", status.kind === "error");
          statusNode.classList.toggle("is-ok", status.kind === "ok");
        }
      }

      function updatePlayerPopupDom(record) {
        if (!record || !record.marker || !record.marker.getPopup) return false;
        const popup = record.marker.getPopup();
        const element = popup && popup.getElement ? popup.getElement() : null;
        if (!element) return false;
        const values = getPlayerInfoValues(record);
        Object.keys(values).forEach(function (key) {
          const node = element.querySelector(`[data-player-info="${key}"]`);
          const text = values[key] == null ? "" : String(values[key]);
          if (!node) return;
          if (node.textContent !== text) node.textContent = text;
          const row = node.closest ? node.closest(".player-info-row") : null;
          if (row) row.style.display = text ? "" : "none";
        });
        element.querySelectorAll(".player-info-section").forEach(function (section) {
          const rows = Array.prototype.slice.call(section.querySelectorAll(".player-info-row"));
          if (!rows.length) return;
          const hasVisible = rows.some(function (row) { return row.style.display !== "none"; });
          section.style.display = hasVisible ? "" : "none";
        });
        const state = record.state || "live";
        const dot = element.querySelector("[data-player-info-status-dot]");
        if (dot) {
          dot.classList.toggle("is-anonymous", isAnonymousPlayer(record.player));
          dot.classList.toggle("is-paused", state === "paused");
          dot.classList.toggle("is-stale", state === "stale");
        }
        syncPccVoiceControls(record);
        return true;
      }

      function bindPlayerPopup(record) {
        if (!record || !record.marker) return;
        if (record.popupBound) return;
        record.marker.bindPopup(buildPlayerInfoPopup(record), {
          className: "player-info-leaflet-popup",
          closeButton: true,
          autoPan: true,
          maxWidth: 540,
          minWidth: 360
        });
        record.popupBound = true;
        record.marker.on("popupopen", function () {
          updatePlayerPopup(record, { force: true, preserveScroll: false });
          syncPlayerBusRouteLayer(record);
        });
        record.marker.on("popupclose", function () {
          removePlayerBusRouteLayer(record);
        });
        record.marker.on("click", function (event) {
          if (event && event.originalEvent && typeof event.originalEvent.stopPropagation === "function") {
            event.originalEvent.stopPropagation();
          }
          openPlayerPopup(record);
        });
      }

      function openPlayerPopup(record) {
        if (!record || !record.marker) return;
        bindPlayerPopup(record);
        updatePlayerPopup(record, { force: true, preserveScroll: false });
        record.marker.openPopup();
      }

      function handlePlayerMarkerDomClick(event) {
        const target = event && event.target;
        const markerNode = target && target.closest ? target.closest(".player-marker[data-player-id]") : null;
        if (!markerNode) return;
        if (typeof event.preventDefault === "function") event.preventDefault();
        if (typeof event.stopPropagation === "function") event.stopPropagation();
        const id = markerNode.getAttribute("data-player-id") || "";
        const record = playerMarkers.get(id);
        if (record) openPlayerPopup(record);
      }

      function bindPlayerMarkerDomClick() {
        const container = map && map.getContainer ? map.getContainer() : null;
        if (!container) return;
        container.addEventListener("click", handlePlayerMarkerDomClick, true);
        container.addEventListener("pointerup", handlePlayerMarkerDomClick, true);
      }

      function syncAllPccVoiceControls() {
        for (const record of playerMarkers.values()) syncPccVoiceControls(record);
      }

      function pickPccRecorderMimeType() {
        if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== "function") return "";
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
          "audio/mp4"
        ];
        for (const type of candidates) {
          try {
            if (MediaRecorder.isTypeSupported(type)) return type;
          } catch (err) { }
        }
        return "";
      }

      function clearPccRecordTimeout() {
        if (!pccRecordTimeout) return;
        window.clearTimeout(pccRecordTimeout);
        pccRecordTimeout = 0;
      }

      function stopPccMediaStream(stream) {
        if (!stream || typeof stream.getTracks !== "function") return;
        stream.getTracks().forEach(function (track) {
          try { track.stop(); } catch (err) { }
        });
      }

      function blobToDataUrl(blob) {
        return new Promise(function (resolve, reject) {
          const reader = new FileReader();
          reader.onload = function () { resolve(String(reader.result || "")); };
          reader.onerror = function () { reject(reader.error || new Error("Lecture audio impossible")); };
          reader.readAsDataURL(blob);
        });
      }

      function createPccMessageId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          try { return "pcc-" + window.crypto.randomUUID(); } catch (err) { }
        }
        return "pcc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
      }

      function waitPccMs(ms) {
        return new Promise(function (resolve) {
          window.setTimeout(resolve, Math.max(0, Number(ms) || 0));
        });
      }

      function sendPccSocketJson(payload) {
        if (!isPccWebSocketReady()) throw new Error("WebSocket panel non connecte");
        socket.send(JSON.stringify(payload));
      }

      async function sendPccVoicePayload(playerId, basePayload, audioMeta, dataUrl) {
        const text = String(dataUrl || "");
        if (text.length <= PCC_VOICE_CHUNK_CHARS) {
          sendPccSocketJson(Object.assign({}, basePayload, {
            audio: Object.assign({}, audioMeta, { dataUrl })
          }));
          setPccVoiceStatus(playerId, "Message PCC envoye.", "ok");
          return;
        }

        const total = Math.ceil(text.length / PCC_VOICE_CHUNK_CHARS);
        for (let index = 0; index < total; index += 1) {
          const start = index * PCC_VOICE_CHUNK_CHARS;
          const chunk = text.slice(start, start + PCC_VOICE_CHUNK_CHARS);
          sendPccSocketJson(Object.assign({}, basePayload, {
            chunked: true,
            chunkIndex: index,
            chunkTotal: total,
            audioChunk: chunk,
            audio: Object.assign({}, audioMeta, {
              chunked: true,
              chunkIndex: index,
              chunkTotal: total,
              dataUrlChunk: chunk
            })
          }));
          if (index < total - 1) await waitPccMs(PCC_VOICE_CHUNK_DELAY_MS);
        }
        setPccVoiceStatus(playerId, `Message PCC envoye (${total} paquets).`, "ok");
      }

      async function sendPccVoiceRecording(recording, blob) {
        if (!recording || !blob) return;
        const playerId = recording.playerId;
        const durationMs = Math.max(0, Date.now() - Number(recording.startedAt || Date.now()));
        if (blob.size <= 0) {
          setPccVoiceStatus(playerId, "Aucun son enregistre.", "error");
          return;
        }
        if (blob.size > PCC_VOICE_MAX_BYTES) {
          setPccVoiceStatus(playerId, "Message trop lourd, non envoye.", "error");
          return;
        }
        if (!isPccWebSocketReady()) {
          setPccVoiceStatus(playerId, "WebSocket panel non connecte.", "error");
          return;
        }
        let dataUrl = "";
        try {
          dataUrl = await blobToDataUrl(blob);
        } catch (err) {
          setPccVoiceStatus(playerId, "Encodage audio impossible.", "error");
          return;
        }
        if (!/^data:audio\//i.test(dataUrl)) {
          setPccVoiceStatus(playerId, "Format audio refuse.", "error");
          return;
        }
        const messageId = createPccMessageId();
        const filters = Array.isArray(recording.filters) ? recording.filters.slice() : [];
        const payload = {
          source: "admin_map",
          action: PCC_VOICE_ACTION,
          type: PCC_VOICE_ACTION,
          id: messageId,
          time: Date.now(),
          targetSteamId: recording.targetSteamId,
          target_steamid: recording.targetSteamId,
          target: {
            steamid: recording.targetSteamId,
            label: recording.targetLabel || ""
          },
          filters
        };
        const audioMeta = {
          mimeType: blob.type || recording.mimeType || "audio/webm",
          sizeBytes: blob.size,
          durationMs,
          filters
        };
        try {
          await sendPccVoicePayload(playerId, payload, audioMeta, dataUrl);
        } catch (err2) {
          setPccVoiceStatus(playerId, "Erreur envoi PCC.", "error");
          try { socket.close(); } catch (err3) { }
        }
      }

      function finishPccVoiceRecording(cancelled) {
        if (!pccRecording) return;
        const recording = pccRecording;
        pccRecording = null;
        clearPccRecordTimeout();
        recording.cancelled = cancelled === true;
        try {
          if (recording.recorder && recording.recorder.state !== "inactive") {
            recording.recorder.stop();
          } else {
            stopPccMediaStream(recording.stream);
          }
        } catch (err) {
          stopPccMediaStream(recording.stream);
        }
        setPccVoiceStatus(recording.playerId, recording.cancelled ? "Enregistrement annule." : "Envoi PCC...", recording.cancelled ? "" : "");
        syncAllPccVoiceControls();
      }

      async function startPccVoiceRecording(playerId) {
        const record = playerMarkers.get(String(playerId || ""));
        const player = record && record.player ? record.player : null;
        if (!player) return;
        if (pccRecording) {
          if (pccRecording.playerId === getPccPlayerId(player)) {
            finishPccVoiceRecording(false);
          } else {
            setPccVoiceStatus(getPccPlayerId(player), "Un autre message PCC est en cours.", "error");
          }
          return;
        }
        const reason = getPccVoiceUnavailableReason(player);
        if (reason) {
          setPccVoiceStatus(getPccPlayerId(player), reason, "error");
          return;
        }
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
        } catch (err) {
          setPccVoiceStatus(getPccPlayerId(player), "Acces micro refuse ou indisponible.", "error");
          return;
        }
        const mimeType = pickPccRecorderMimeType();
        let recorder = null;
        try {
          const recorderOptions = { audioBitsPerSecond: 24000 };
          if (mimeType) recorderOptions.mimeType = mimeType;
          recorder = new MediaRecorder(stream, recorderOptions);
        } catch (err2) {
          stopPccMediaStream(stream);
          setPccVoiceStatus(getPccPlayerId(player), "Enregistreur audio indisponible.", "error");
          return;
        }
        const chunks = [];
        const recording = {
          playerId: getPccPlayerId(player),
          targetSteamId: getPccTargetSteamId(player),
          targetLabel: playerDisplayTitle(player),
          filters: getSelectedPccVoiceFilters(),
          mimeType,
          stream,
          recorder,
          chunks,
          startedAt: Date.now(),
          cancelled: false
        };
        recorder.ondataavailable = function (event) {
          if (event && event.data && event.data.size > 0) chunks.push(event.data);
        };
        recorder.onstop = function () {
          stopPccMediaStream(stream);
          if (recording.cancelled) return;
          const blob = new Blob(chunks, { type: recorder.mimeType || mimeType || "audio/webm" });
          sendPccVoiceRecording(recording, blob);
        };
        recorder.onerror = function () {
          setPccVoiceStatus(recording.playerId, "Erreur enregistrement PCC.", "error");
          finishPccVoiceRecording(true);
        };
        pccRecording = recording;
        try {
          recorder.start(250);
        } catch (err3) {
          pccRecording = null;
          stopPccMediaStream(stream);
          setPccVoiceStatus(recording.playerId, "Demarrage micro impossible.", "error");
          return;
        }
        setPccVoiceStatus(recording.playerId, "Enregistrement en cours...", "error");
        clearPccRecordTimeout();
        pccRecordTimeout = window.setTimeout(function () {
          if (pccRecording && pccRecording.playerId === recording.playerId) {
            finishPccVoiceRecording(false);
          }
        }, PCC_VOICE_MAX_DURATION_MS);
        syncAllPccVoiceControls();
      }

      function handlePccVoicePopupClick(event) {
        const target = event && event.target;
        const button = target && target.closest ? target.closest("[data-pcc-action][data-player-id]") : null;
        if (!button) return;
        if (typeof event.preventDefault === "function") event.preventDefault();
        if (typeof event.stopPropagation === "function") event.stopPropagation();
        const playerId = button.getAttribute("data-player-id") || "";
        const action = button.getAttribute("data-pcc-action") || "";
        if (action === "record") {
          startPccVoiceRecording(playerId);
        } else if (action === "cancel") {
          finishPccVoiceRecording(true);
        }
      }

      function isPccVoiceMessage(message) {
        if (!message || typeof message !== "object") return false;
        const action = String(message.action || message.type || message.event || message.kind || "").trim().toLowerCase();
        if (action === PCC_VOICE_ACTION) return true;
        const data = message.data || message.payload || message.message;
        if (data && typeof data === "object" && data !== message) return isPccVoiceMessage(data);
        return false;
      }

      function updatePlayerPopup(record, options = null) {
        if (!record || !record.marker) return;
        bindPlayerPopup(record);
        const opts = options && typeof options === "object" ? options : {};
        const isOpen = record.marker.isPopupOpen && record.marker.isPopupOpen();
        if (!opts.force && !isOpen) return;
        if (isOpen && updatePlayerPopupDom(record)) return;
        if (isOpen && opts.allowRebuildOpen !== true) return;
        const scrollTop = opts.preserveScroll === false || !isOpen ? 0 : getPlayerPopupScrollTop(record);
        const content = buildPlayerInfoPopup(record);
        record.marker.setPopupContent(content);
        if (opts.preserveScroll !== false && isOpen) restorePlayerPopupScrollTop(record, scrollTop);
      }

      function normalizePlayerGroup(group) {
        return group === PLAYER_GROUP_CONVOY ? PLAYER_GROUP_CONVOY : PLAYER_GROUP_SOLO;
      }

      function normalizePlayerGroupForPlayer(player) {
        if (player && player.inServer === true) return PLAYER_GROUP_CONVOY;
        if (player && player.inServer === false) return PLAYER_GROUP_SOLO;
        return normalizePlayerGroup(player && player.group);
      }

      function isPlayerVisibleByFilter(player) {
        const group = normalizePlayerGroupForPlayer(player);
        return playerFilters[group] !== false;
      }

      function isRecordPopupOpen(record) {
        return !!(record && record.marker && record.marker.isPopupOpen && record.marker.isPopupOpen());
      }

      function getPlayerBusLine(player) {
        const busLine = player && player.busLine && typeof player.busLine === "object" ? player.busLine : null;
        if (!busLine || busLine.active !== true) return null;
        return busLine;
      }

      function getBusRouteGeometry(busLine) {
        const geometry = busLine && busLine.routeGeometry && typeof busLine.routeGeometry === "object" ? busLine.routeGeometry : null;
        if (!geometry) return null;
        const hasStops = Array.isArray(geometry.stops) && geometry.stops.length > 0;
        const hasSegments = Array.isArray(geometry.segments) && geometry.segments.length > 0;
        return hasStops || hasSegments ? geometry : null;
      }

      function getBusRouteProgressIndex(busLine, geometry, key) {
        const value =
          geometry && Number.isFinite(Number(geometry[key])) ? Number(geometry[key]) :
          busLine && Number.isFinite(Number(busLine[key])) ? Number(busLine[key]) :
          Number.NaN;
        return Number.isFinite(value) ? Math.floor(value) : Number.NaN;
      }

      function getBusServedStopSet(busLine, geometry) {
        const served = new Set();
        const source = Array.isArray(geometry && geometry.servedStopIndices)
          ? geometry.servedStopIndices
          : (Array.isArray(busLine && busLine.servedStopIndices) ? busLine.servedStopIndices : []);
        source.forEach(function (value) {
          const index = Math.floor(Number(value));
          if (Number.isFinite(index) && index >= 0) served.add(index);
        });
        return served;
      }

      function isBusSegmentPassed(segment, busLine, geometry) {
        const reachedIndex =
          getBusRouteProgressIndex(busLine, geometry, "reachedIndex");
        const reachedStopIndex = Number.isFinite(reachedIndex)
          ? reachedIndex
          : getBusRouteProgressIndex(busLine, geometry, "reachedStopIndex");
        const toIndex = Math.floor(Number(segment && segment.toIndex));
        return Number.isFinite(reachedStopIndex) && Number.isFinite(toIndex) && toIndex <= reachedStopIndex;
      }

      function isBusSegmentCurrent(segment, busLine, geometry) {
        const targetIndex = getBusRouteProgressIndex(busLine, geometry, "targetIndex");
        const targetStopIndex = Number.isFinite(targetIndex)
          ? targetIndex
          : getBusRouteProgressIndex(busLine, geometry, "targetStopIndex");
        const fromIndex = Math.floor(Number(segment && segment.fromIndex));
        const toIndex = Math.floor(Number(segment && segment.toIndex));
        return Number.isFinite(targetStopIndex) &&
          Number.isFinite(fromIndex) &&
          Number.isFinite(toIndex) &&
          fromIndex < targetStopIndex &&
          targetStopIndex <= toIndex;
      }

      function parseRouteWorldPoint(point) {
        if (!point || typeof point !== "object") return null;
        const x = Number(point.x ?? point.X);
        const y = Number(point.y ?? point.Y ?? point.z ?? point.Z);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        return { x, y };
      }

      function appendUniqueRoutePoint(target, point) {
        const parsed = parseRouteWorldPoint(point);
        if (!parsed) return;
        const last = target[target.length - 1];
        if (last && Math.abs(last.x - parsed.x) < 0.01 && Math.abs(last.y - parsed.y) < 0.01) return;
        target.push(parsed);
      }

      function projectRouteWorldPointOnSegment(point, start, end) {
        const p = parseRouteWorldPoint(point);
        const a = parseRouteWorldPoint(start);
        const b = parseRouteWorldPoint(end);
        if (!p || !a || !b) return null;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lenSq = (dx * dx) + (dy * dy);
        if (!(lenSq > 1e-9)) return null;
        let t = (((p.x - a.x) * dx) + ((p.y - a.y) * dy)) / lenSq;
        t = Math.max(0, Math.min(1, t));
        const projected = { x: a.x + (dx * t), y: a.y + (dy * t) };
        const distance = Math.hypot(p.x - projected.x, p.y - projected.y);
        return { point: projected, t, distance };
      }

      function splitBusSegmentAtPlayer(segment, player) {
        const route = (Array.isArray(segment && segment.points) ? segment.points : [])
          .map(parseRouteWorldPoint)
          .filter(Boolean);
        const playerPoint = parseRouteWorldPoint({ x: player && player.x, y: player && player.z });
        if (route.length < 2 || !playerPoint) return null;
        let best = null;
        for (let i = 0; i < route.length - 1; i += 1) {
          const projected = projectRouteWorldPointOnSegment(playerPoint, route[i], route[i + 1]);
          if (!projected) continue;
          if (!best || projected.distance < best.distance) {
            best = Object.assign({ segmentIndex: i }, projected);
          }
        }
        if (!best || !Number.isFinite(best.distance) || best.distance > 140) return null;
        const past = [];
        const future = [];
        for (let i = 0; i <= best.segmentIndex; i += 1) appendUniqueRoutePoint(past, route[i]);
        appendUniqueRoutePoint(past, best.point);
        appendUniqueRoutePoint(future, best.point);
        for (let i = best.segmentIndex + 1; i < route.length; i += 1) appendUniqueRoutePoint(future, route[i]);
        return {
          past: past.length >= 2 ? past : [],
          future: future.length >= 2 ? future : []
        };
      }

      function isBusStopServed(stop, busLine, geometry, servedSet) {
        const index = Math.floor(Number(stop && stop.index));
        if (!Number.isFinite(index)) return false;
        if (servedSet && servedSet.has(index)) return true;
        if (stop && (stop.served === true || stop.reached === true)) return true;
        const reachedIndex = getBusRouteProgressIndex(busLine, geometry, "reachedIndex");
        const reachedStopIndex = Number.isFinite(reachedIndex)
          ? reachedIndex
          : getBusRouteProgressIndex(busLine, geometry, "reachedStopIndex");
        return Number.isFinite(reachedStopIndex) && index <= reachedStopIndex;
      }

      function isBusStopCurrent(stop, busLine, geometry) {
        const index = Math.floor(Number(stop && stop.index));
        if (!Number.isFinite(index)) return false;
        const targetIndex = getBusRouteProgressIndex(busLine, geometry, "targetIndex");
        const targetStopIndex = Number.isFinite(targetIndex)
          ? targetIndex
          : getBusRouteProgressIndex(busLine, geometry, "targetStopIndex");
        return Number.isFinite(targetStopIndex) && index === targetStopIndex;
      }

      function normalizeCssHexColor(value, fallback = "#7dd3fc") {
        const text = String(value || "").trim();
        const match = /^#?([0-9a-f]{6})$/i.exec(text);
        return match ? `#${match[1]}` : fallback;
      }

      function getFallbackLineColor(lineNumber) {
        const palette = ["#6fb2e1", "#ab5798", "#cdc74f", "#e69459", "#9ad1dc"];
        const key = String(lineNumber || "").trim().toLowerCase();
        if (!key) return "#7dd3fc";
        let hash = 0;
        for (let i = 0; i < key.length; i += 1) {
          hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
        }
        const index = /^\d+$/.test(key)
          ? Math.abs(parseInt(key, 10)) % palette.length
          : Math.abs(hash) % palette.length;
        return palette[index] || "#7dd3fc";
      }

      function getBusLineTraceColor(busLine) {
        const explicit = normalizeCssHexColor(
          busLine && (busLine.lineColor || busLine.routeColor || busLine.color),
          ""
        );
        if (explicit) return explicit;
        const lineNumber = String(busLine && busLine.lineNumber || "").trim();
        const styles = window.LINE_STYLES && typeof window.LINE_STYLES === "object" ? window.LINE_STYLES : {};
        const lower = lineNumber.toLowerCase();
        let hit = styles[lineNumber] || null;
        if (!hit) {
          Object.keys(styles).some(function (key) {
            if (String(key || "").toLowerCase() !== lower) return false;
            hit = styles[key];
            return true;
          });
        }
        if (Array.isArray(hit) && hit.length) return normalizeCssHexColor(hit[0], getFallbackLineColor(lineNumber));
        return getFallbackLineColor(lineNumber);
      }

      function addBusPolylinePair(group, latlngs, passed, lineColor) {
        if (!group || !Array.isArray(latlngs) || latlngs.length < 2) return;
        const opacity = passed ? 0.22 : 0.86;
        const outlineOpacity = passed ? 0.16 : 0.34;
        L.polyline(latlngs, {
          pane: "busRoutePane",
          color: "#05070a",
          weight: 9,
          opacity: outlineOpacity,
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }).addTo(group);
        L.polyline(latlngs, {
          pane: "busRoutePane",
          color: lineColor || "#7dd3fc",
          weight: 5,
          opacity,
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }).addTo(group);
      }

      function addBusStopMarker(group, stop, busLine, geometry, servedSet, lineColor) {
        const latlng = routePointToLatLng(stop);
        if (!group || !latlng) return;
        const served = isBusStopServed(stop, busLine, geometry, servedSet);
        const current = isBusStopCurrent(stop, busLine, geometry);
        const radius = current ? 7 : 6;
        L.circleMarker(latlng, {
          pane: "busStopPane",
          radius,
          color: "#ffffff",
          weight: current ? 3 : 2,
          opacity: served ? 0.34 : 0.96,
          fillColor: current ? (lineColor || "#38bdf8") : "#ffffff",
          fillOpacity: served ? 0.22 : 0.94,
          interactive: false
        }).addTo(group);
      }

      function buildPlayerBusRouteLayer(player) {
        const busLine = getPlayerBusLine(player);
        const geometry = getBusRouteGeometry(busLine);
        if (!busLine || !geometry) return null;
        const group = L.layerGroup();
        const segments = Array.isArray(geometry.segments) ? geometry.segments : [];
        const pastSegments = [];
        const futureSegments = [];
        const lineColor = getBusLineTraceColor(busLine);
        segments.forEach(function (segment) {
          if (isBusSegmentPassed(segment, busLine, geometry)) {
            const latlngs = routePointsToLatLngs(segment && segment.points);
            if (latlngs.length >= 2) pastSegments.push(latlngs);
            return;
          }
          if (isBusSegmentCurrent(segment, busLine, geometry)) {
            const split = splitBusSegmentAtPlayer(segment, player);
            if (split) {
              const pastLatLngs = routePointsToLatLngs(split.past);
              const futureLatLngs = routePointsToLatLngs(split.future);
              if (pastLatLngs.length >= 2) pastSegments.push(pastLatLngs);
              if (futureLatLngs.length >= 2) futureSegments.push(futureLatLngs);
              return;
            }
          }
          const latlngs = routePointsToLatLngs(segment && segment.points);
          if (latlngs.length >= 2) futureSegments.push(latlngs);
        });
        pastSegments.forEach(function (latlngs) { addBusPolylinePair(group, latlngs, true, lineColor); });
        futureSegments.forEach(function (latlngs) { addBusPolylinePair(group, latlngs, false, lineColor); });
        const servedSet = getBusServedStopSet(busLine, geometry);
        (Array.isArray(geometry.stops) ? geometry.stops : []).forEach(function (stop) {
          addBusStopMarker(group, stop, busLine, geometry, servedSet, lineColor);
        });
        return group.getLayers().length ? group : null;
      }

      function getPlayerBusRouteRenderKey(player) {
        const busLine = getPlayerBusLine(player);
        const geometry = getBusRouteGeometry(busLine);
        if (!busLine || !geometry) return "";
        const served = Array.isArray(geometry.servedStopIndices) ? geometry.servedStopIndices.join(",") : "";
        return [
          String(busLine.selectedKey || ""),
          String(geometry.cacheKey || ""),
          geometry.pending === true ? "pending" : "ready",
          String(getBusRouteProgressIndex(busLine, geometry, "reachedIndex")),
          String(getBusRouteProgressIndex(busLine, geometry, "reachedStopIndex")),
          String(getBusRouteProgressIndex(busLine, geometry, "targetIndex")),
          String(getBusRouteProgressIndex(busLine, geometry, "targetStopIndex")),
          String(Math.round((Number(player && player.x) || 0) / 2)),
          String(Math.round((Number(player && player.z) || 0) / 2)),
          served,
          String(Array.isArray(geometry.segments) ? geometry.segments.length : 0),
          String(Array.isArray(geometry.stops) ? geometry.stops.length : 0)
        ].join("|");
      }

      function removePlayerBusRouteLayer(record) {
        if (!record || !record.busRouteLayer) return;
        map.removeLayer(record.busRouteLayer);
        record.busRouteLayer = null;
        record.busRouteKey = "";
      }

      function syncPlayerBusRouteLayer(record) {
        if (!record || !record.player) return;
        if (!isRecordPopupOpen(record)) {
          removePlayerBusRouteLayer(record);
          return;
        }
        const key = getPlayerBusRouteRenderKey(record.player);
        if (!key || !isPlayerVisibleByFilter(record.player)) {
          removePlayerBusRouteLayer(record);
          return;
        }
        if (record.busRouteLayer && record.busRouteKey === key) {
          if (!map.hasLayer(record.busRouteLayer)) record.busRouteLayer.addTo(map);
          return;
        }
        removePlayerBusRouteLayer(record);
        const layer = buildPlayerBusRouteLayer(record.player);
        if (!layer) return;
        record.busRouteLayer = layer;
        record.busRouteKey = key;
        layer.addTo(map);
      }

      function preservePreviousBusRouteGeometry(player, previousPlayer) {
        const nextBusLine = getPlayerBusLine(player);
        const previousBusLine = getPlayerBusLine(previousPlayer);
        if (!nextBusLine || !previousBusLine) return player;
        const previousGeometry = getBusRouteGeometry(previousBusLine);
        if (!previousGeometry || previousGeometry.pending === true) return player;
        const nextGeometry = getBusRouteGeometry(nextBusLine);
        const sameRoute = String(nextBusLine.selectedKey || "") === String(previousBusLine.selectedKey || "");
        const nextHasReadySegments = nextGeometry && nextGeometry.pending !== true && Array.isArray(nextGeometry.segments) && nextGeometry.segments.length;
        if (!sameRoute || nextHasReadySegments) return player;
        player.busLine = Object.assign({}, nextBusLine, {
          routeGeometry: Object.assign({}, previousGeometry, {
            reachedIndex: Number.isFinite(Number(nextBusLine.reachedStopIndex)) ? Number(nextBusLine.reachedStopIndex) : previousGeometry.reachedIndex,
            targetIndex: Number.isFinite(Number(nextBusLine.targetStopIndex)) ? Number(nextBusLine.targetStopIndex) : previousGeometry.targetIndex,
            servedStopIndices: nextGeometry && Array.isArray(nextGeometry.servedStopIndices) ? nextGeometry.servedStopIndices : previousGeometry.servedStopIndices
          })
        });
        return player;
      }

      function syncPlayerMarkerVisibility(record) {
        if (!record || !record.marker) return;
        const shouldShow = isPlayerVisibleByFilter(record.player);
        const isShown = map.hasLayer(record.marker);
        if (shouldShow && !isShown) record.marker.addTo(map);
        else if (!shouldShow && isShown) {
          record.marker.closePopup();
          map.removeLayer(record.marker);
        }
        syncPlayerBusRouteLayer(record);
      }

      function updatePlayerFilterCounts() {
        const counts = {
          [PLAYER_GROUP_SOLO]: 0,
          [PLAYER_GROUP_CONVOY]: 0
        };
        for (const record of playerMarkers.values()) {
          const group = normalizePlayerGroupForPlayer(record.player);
          counts[group] += 1;
        }
        if (soloCount) soloCount.textContent = `(${counts[PLAYER_GROUP_SOLO]})`;
        if (convoyCount) convoyCount.textContent = `(${counts[PLAYER_GROUP_CONVOY]})`;
        if (playerTotalCount) playerTotalCount.textContent = `(${counts[PLAYER_GROUP_SOLO] + counts[PLAYER_GROUP_CONVOY]})`;
      }

      function syncAllPlayerFilterUi() {
        for (const record of playerMarkers.values()) syncPlayerMarkerVisibility(record);
        updatePlayerFilterCounts();
      }

      function cloneLatLng(latlng) {
        if (!latlng) return null;
        return L.latLng(Number(latlng.lat), Number(latlng.lng));
      }

      function interpolateLatLng(from, to, ratio) {
        if (!from || !to) return to || from || null;
        const t = Math.max(0, Math.min(1, Number(ratio) || 0));
        return L.latLng(
          from.lat + ((to.lat - from.lat) * t),
          from.lng + ((to.lng - from.lng) * t)
        );
      } 

      function stopPlayerPositionAnimation(record) {
        if (!record) return;
        record.positionAnimation = null;
      }

      function updatePlayerPositionAnimation(record, now) {
        if (!record || !record.marker || !record.positionAnimation) return false;
        const anim = record.positionAnimation;
        const duration = Math.max(1, Number(anim.durationMs) || PLAYER_POSITION_INTERPOLATION_MS);
        const elapsed = Math.max(0, Number(now) - Number(anim.startAtMs));
        const ratio = Math.min(1, elapsed / duration);
        const nextLatLng = interpolateLatLng(anim.fromLatLng, anim.toLatLng, ratio);
        if (nextLatLng) record.marker.setLatLng(nextLatLng);
        if (ratio >= 1) {
          record.marker.setLatLng(anim.toLatLng);
          record.displayLatLng = cloneLatLng(anim.toLatLng);
          stopPlayerPositionAnimation(record);
          return false;
        }
        record.displayLatLng = cloneLatLng(nextLatLng);
        return true;
      }

      function tickPlayerPositionAnimations(now) {
        playerAnimationFrame = 0;
        let hasActiveAnimation = false;
        const ts = Number.isFinite(Number(now)) ? Number(now) : performance.now();
        for (const record of playerMarkers.values()) {
          if (updatePlayerPositionAnimation(record, ts)) hasActiveAnimation = true;
        }
        if (hasActiveAnimation) {
          playerAnimationFrame = requestAnimationFrame(tickPlayerPositionAnimations);
        }
      }

      function startPlayerPositionAnimationLoop() {
        if (playerAnimationFrame) return;
        playerAnimationFrame = requestAnimationFrame(tickPlayerPositionAnimations);
      }

      function setPlayerMarkerTargetLatLng(record, targetLatLng) {
        if (!record || !record.marker || !targetLatLng) return;
        const toLatLng = cloneLatLng(targetLatLng);
        const currentLatLng = cloneLatLng(record.marker.getLatLng && record.marker.getLatLng()) ||
          cloneLatLng(record.displayLatLng) ||
          cloneLatLng(toLatLng);
        if (!currentLatLng || !toLatLng) return;
        const samePosition =
          Math.abs(currentLatLng.lat - toLatLng.lat) < 1e-9 &&
          Math.abs(currentLatLng.lng - toLatLng.lng) < 1e-9;
        if (samePosition) {
          stopPlayerPositionAnimation(record);
          record.displayLatLng = toLatLng;
          record.marker.setLatLng(toLatLng);
          return;
        }
        record.positionAnimation = {
          fromLatLng: currentLatLng,
          toLatLng,
          startAtMs: performance.now(),
          durationMs: PLAYER_POSITION_INTERPOLATION_MS
        };
        record.displayLatLng = currentLatLng;
        startPlayerPositionAnimationLoop();
      }

      function updatePlayerMarkers(players) {
        const now = Date.now();

        for (let player of players) {
          const latlng = toLatLng(player.x, player.z);
          if (!latlng) continue;

          let record = playerMarkers.get(player.id);
          const markerState = getPlayerMarkerState(player, now, now);
          if (!record) {
            const marker = L.marker(latlng, {
              icon: playerIcon(player, markerState),
              title: playerDisplayTitle(player),
              keyboard: false,
              interactive: true,
              bubblingMouseEvents: false,
              riseOnHover: true
            });
            record = { marker, player, lastSeen: now, state: markerState, popupBound: false, busRouteLayer: null, busRouteKey: "", displayLatLng: cloneLatLng(latlng), positionAnimation: null };
            playerMarkers.set(player.id, record);
            bindPlayerPopup(record);
          } else {
            player = preservePreviousBusRouteGeometry(player, record.player);
            record.player = player;
            setPlayerMarkerTargetLatLng(record, latlng);
            record.marker.setIcon(playerIcon(player, markerState));
            record.marker.options.title = playerDisplayTitle(player);
            record.lastSeen = now;
            record.state = markerState;
            updatePlayerPopup(record);
          }
          syncPlayerMarkerVisibility(record);

          if (!hasCenteredOnPlayer && isPlayerVisibleByFilter(player)) {
            hasCenteredOnPlayer = true;
            map.setView(latlng, Math.max(map.getZoom(), maxNativeZoom - 1), { animate: false });
          }
        }

        refreshPlayerMarkerStates(now);
        updatePlayerFilterCounts();
      }

      function getPlayerMarkerState(player, now, lastSeen) {
        if (player && player.isPausedOrMenu) return "paused";
        return now - lastSeen >= PLAYER_WARNING_MS ? "stale" : "live";
      }

      function refreshPlayerMarkerStates(now = Date.now()) {
        let changedCount = false;
        for (const [id, record] of playerMarkers.entries()) {
          const age = now - record.lastSeen;
          if (age >= PLAYER_STALE_MS) {
            record.marker.closePopup();
            map.removeLayer(record.marker);
            removePlayerBusRouteLayer(record);
            playerMarkers.delete(id);
            changedCount = true;
            continue;
          }

          const state = getPlayerMarkerState(record.player || {}, now, record.lastSeen);
          if (record.state === state) {
            if (record.marker.isPopupOpen()) updatePlayerPopup(record);
            continue;
          }
          record.state = state;
          record.marker.setIcon(playerIcon(record.player || {}, state));
          updatePlayerPopup(record, { force: true });
          syncPlayerMarkerVisibility(record);
        }
        if (changedCount) updatePlayerFilterCounts();
      }

      function show(text) {
        const line = String(text == null ? "" : text);
        console.log(line);
      }

      function showData(payload) {
        console.log(payload);
      }

      function fillIdentityFields(target, identity) {
        if (!target || typeof target !== "object" || Array.isArray(target)) return target;
        const merged = Object.assign({}, target);
        for (const key of identityKeys) {
          if (!Object.prototype.hasOwnProperty.call(identity, key)) continue;
          if (Object.prototype.hasOwnProperty.call(merged, key) && merged[key] != null && String(merged[key]).trim() !== "") continue;
          merged[key] = identity[key];
        }
        return merged;
      }

      function readGameContextObject(source, depth = 0, seen = new Set()) {
        if (!source || typeof source !== "object" || depth > 20 || seen.has(source)) return null;
        seen.add(source);
        const direct = source.gameContext || source.game_context;
        if (direct && typeof direct === "object" && !Array.isArray(direct)) {
          seen.delete(source);
          return direct;
        }
        for (const value of Object.values(source)) {
          if (!value || typeof value !== "object") continue;
          const nested = readGameContextObject(value, depth + 1, seen);
          if (nested) {
            seen.delete(source);
            return nested;
          }
        }
        seen.delete(source);
        return null;
      }

      function fillGameContextField(target, source) {
        if (!target || typeof target !== "object" || Array.isArray(target)) return target;
        if (target.gameContext && typeof target.gameContext === "object") return target;
        const gameContext = readGameContextObject(source);
        if (!gameContext) return target;
        return Object.assign({}, target, { gameContext });
      }

      function fillGame2BonusField(target, bonus) {
        if (!target || typeof target !== "object" || Array.isArray(target) || !bonus || typeof bonus !== "object") return target;
        return Object.assign({}, target, { game2Bonus: bonus });
      }

      function mergeEnvelopeIdentity(message) {
        if (!message || typeof message !== "object") return message;
        const payload = Object.prototype.hasOwnProperty.call(message, "data") ? message.data : message;
        const identity = readIdentity(message);
        if (Array.isArray(payload)) {
          return payload.map((item) => fillGameContextField(fillIdentityFields(item, identity), message));
        }
        return fillGameContextField(fillIdentityFields(payload, identity), message);
      }

      function unwrapTelemetryEnvelope(payload) {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) return payload;
        const action = String(payload.action || "").trim().toLowerCase();
        const source = String(payload.source || "").trim().toLowerCase();
        if (action !== "telemetry" && source !== "game2") return payload;
        const inner = payload.data || payload.telemetry || payload.payload;
        if (!inner || typeof inner !== "object") return payload;
        const identity = readIdentity(payload);
        const bonus = readGame2Bonus(payload);
        if (Array.isArray(inner)) {
          return inner.map((item) => fillGame2BonusField(fillGameContextField(fillIdentityFields(item, identity), payload), bonus));
        }
        return fillGame2BonusField(fillGameContextField(fillIdentityFields(inner, identity), payload), bonus);
      }

      function handleTelemetryPayload(payload) {
        const telemetryPayload = unwrapTelemetryEnvelope(payload);
        showData(telemetryPayload);
        updatePlayerMarkers(collectPlayers(telemetryPayload));
        showError("");
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        reconnectTimer = window.setTimeout(function () {
          reconnectTimer = 0;
          connect();
        }, WS_RECONNECT_MS);
      }

      function connect() {
        if (reconnectTimer) {
          window.clearTimeout(reconnectTimer);
          reconnectTimer = 0;
        }

        if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;

        try {
          socket = new WebSocket(WS_URL);
        } catch (err) {
          show("Erreur WebSocket");
          showError("Impossible d'ouvrir le WebSocket panel.");
          scheduleReconnect();
          return;
        }

        socket.onopen = function () {
          output.textContent = "";
          show("Connecte au WebSocket");
          showError("");
          syncAllPccVoiceControls();
        };

        socket.onmessage = function (event) {
          let message = null;
          try {
            message = JSON.parse(event.data);
          } catch (err) {
            show("Systeme : " + String(event.data || ""));
            return;
          }

          if (isPccVoiceMessage(message)) return;

          if (message && message.type === "data") {
            handleTelemetryPayload(mergeEnvelopeIdentity(message));
            return;
          }

          const mergedMessage = mergeEnvelopeIdentity(message);
          const directPlayers = collectPlayers(mergedMessage);
          if (directPlayers.length) {
            handleTelemetryPayload(mergedMessage);
            return;
          }

          show("Systeme : " + JSON.stringify(message));
        };

        socket.onclose = function () {
          socket = null;
          show("Deconnecte, reconnexion...");
          showError("WebSocket panel deconnecte, reconnexion...");
          if (pccRecording) finishPccVoiceRecording(true);
          syncAllPccVoiceControls();
          scheduleReconnect();
        };

        socket.onerror = function () {
          show("Erreur WebSocket");
          showError("Erreur WebSocket panel.");
          try { socket.close(); } catch (err) { }
        };
      }

      function bindPlayerFilterEvents() {
        if (filterSolo) {
          filterSolo.checked = true;
          filterSolo.addEventListener("change", function () {
            playerFilters[PLAYER_GROUP_SOLO] = filterSolo.checked;
            syncAllPlayerFilterUi();
          });
        }
        if (filterConvoy) {
          filterConvoy.checked = true;
          filterConvoy.addEventListener("change", function () {
            playerFilters[PLAYER_GROUP_CONVOY] = filterConvoy.checked;
            syncAllPlayerFilterUi();
          });
        }
        updatePlayerFilterCounts();
      }

      async function boot() {
        try {
          selectedVersion = await selectMapVersion();
          dataBase = `${MAP_FILES_ROOT}/${selectedVersion}`;
          tileBase = `${dataBase}/Tiles`;

          const tileInfoResponse = await fetch(`${dataBase}/TileMapInfo.json`, { cache: "no-store" });
          if (!tileInfoResponse.ok) throw new Error("TileMapInfo introuvable");
          tileMapInfo = await tileInfoResponse.json();

          L.tileLayer(`${tileBase}/{z}/{x}/{y}.png`, {
            tileSize,
            minNativeZoom,
            maxNativeZoom,
            maxZoom: maxNativeZoom + 2,
            noWrap: true,
            bounds: fullBounds,
            crossOrigin: true,
            referrerPolicy: "no-referrer",
            updateWhenIdle: false,
            updateWhenZooming: true,
            keepBuffer: 3
          }).addTo(map);

          map.fitBounds(innerBounds(64), { animate: false });
          applyBounds();
          map.on("zoomend resize", applyBounds);

          connect();
        } catch (err) {
          const message = err && err.message ? err.message : String(err || "Erreur carte");
          showError(message);
        }
      }

      bindPlayerFilterEvents();
      bindPlayerMarkerDomClick();
      document.addEventListener("click", handlePccVoicePopupClick, true);
      window.setInterval(refreshPlayerMarkerStates, PLAYER_STATE_REFRESH_MS);
      boot();
    })();
  </script>
</body>
</html>

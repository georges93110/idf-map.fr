<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID lignes SAEIV</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; color: #111827; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .meta { margin: 0 0 8px; color: #4b5563; font-size: 14px; }
    .help { margin: 0 0 16px; padding: 10px 12px; border: 1px solid #bfdbfe; border-radius: 6px; background: #eff6ff; color: #1e3a8a; font-size: 14px; line-height: 1.45; }
    .search-wrap { display: block; margin: 0 0 12px; font-weight: 700; font-size: 14px; }
    .search-input { display: block; width: 100%; max-width: 520px; box-sizing: border-box; margin-top: 6px; padding: 9px 10px; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; color: #111827; font: inherit; font-weight: 400; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    .action-btn, .line-toggle-btn { border: 1px solid #9ca3af; border-radius: 6px; background: #fff; color: #111827; font: inherit; font-size: 14px; cursor: pointer; }
    .action-btn { padding: 8px 10px; font-weight: 700; }
    .status { margin: 12px 0; padding: 10px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; font-size: 14px; }
    .status.is-error { border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d1d5db; font-size: 14px; }
    th, td { border: 1px solid #d1d5db; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #e5e7eb; z-index: 1; }
    .line-header-row { display: none; }
    .routes-table.is-all-collapsed .line-header-row { display: table-row; }
    .routes-table.is-all-collapsed .route-header-row { display: none; }
    td.uid { width: 110px; font-family: Consolas, "Courier New", monospace; font-weight: 700; white-space: nowrap; }
    td.line-number { width: 130px; font-weight: 700; white-space: nowrap; }
    .line-group-row { background: #dbeafe; }
    .line-group-cell { padding: 0; }
    .line-toggle-btn { width: 100%; min-height: 42px; border: 0; border-radius: 0; padding: 9px 10px; display: flex; align-items: center; gap: 10px; text-align: left; font-weight: 700; }
    .line-toggle-icon { width: 1.2em; flex: 0 0 1.2em; text-align: center; font-family: Consolas, "Courier New", monospace; }
    .line-toggle-main { flex: 1 1 auto; min-width: 0; }
    .line-toggle-count { flex: 0 0 auto; color: #374151; font-weight: 600; }
    tr.route-row.is-collapsed { display: none; }
    tr.route-row td:first-child, tr.route-row td:nth-child(2) { color: #6b7280; }
    .empty { color: #6b7280; font-style: italic; }
  </style>
</head>
<body>
  <h1>Lignes / Routes ID SAEIV</h1>
  <p class="meta" id="meta">Chargement...</p>
  <p class="help">
    <strong>Ligne ID</strong> = le numéro de ligne à mettre dans le SAEIV.<br>
    <strong>Route ID</strong> = le N° agent à mettre dans le SAEIV.
  </p>
  <label class="search-wrap" for="searchInput">
    Recherche
    <input class="search-input" id="searchInput" type="search" placeholder="Ligne, UID, route, terminus..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </label>
  <div class="actions">
    <button class="action-btn" id="openAllBtn" type="button">Tout ouvrir</button>
    <button class="action-btn" id="closeAllBtn" type="button">Tout fermer</button>
  </div>
  <div class="status" id="status">Chargement de lines.xml...</div>
  <table class="routes-table is-all-collapsed" id="routesTable" aria-label="Liste des lignes et routes DBus">
    <thead>
      <tr class="line-header-row"><th colspan="4">Lignes</th></tr>
      <tr class="route-header-row">
        <th>Ligne ID</th>
        <th>Ligne</th>
        <th>Route ID</th>
        <th>Nom route</th>
      </tr>
    </thead>
    <tbody id="routesBody">
      <tr><td colspan="4" class="empty">Chargement...</td></tr>
    </tbody>
  </table>

  <script>
    (() => {
      const DEFAULT_VERSION = "0.1.6a";
      const metaEl = document.getElementById("meta");
      const statusEl = document.getElementById("status");
      const searchEl = document.getElementById("searchInput");
      const openAllBtn = document.getElementById("openAllBtn");
      const closeAllBtn = document.getElementById("closeAllBtn");
      const tableEl = document.getElementById("routesTable");
      const bodyEl = document.getElementById("routesBody");
      const collapsedLines = new Set();
      let totalLineCount = 0;
      let totalRouteCount = 0;
      let noResultRow = null;

      function text(value) { return String(value || "").trim(); }
      function normalizeSearch(value) {
        return text(value).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      }
      function setStatus(value, isError = false) {
        statusEl.textContent = value;
        statusEl.classList.toggle("is-error", !!isError);
      }
      function setBaseStatus() { setStatus(`${totalLineCount} ligne(s), ${totalRouteCount} route(s).`); }
      function compareVersionLike(a, b) {
        const parse = (value) => {
          const match = /^(\d+)\.(\d+)\.(\d+)([a-z]*)$/i.exec(text(value));
          return match ? { major: +match[1] || 0, minor: +match[2] || 0, patch: +match[3] || 0, suffix: String(match[4] || "").toLowerCase() } : null;
        };
        const pa = parse(a);
        const pb = parse(b);
        if (!pa || !pb) return text(a).localeCompare(text(b));
        return (pa.major - pb.major) || (pa.minor - pb.minor) || (pa.patch - pb.patch) || pa.suffix.localeCompare(pb.suffix);
      }
      async function getDbusVersion() {
        const requested = text(new URLSearchParams(location.search).get("version"));
        if (requested) return requested;
        const response = await fetch("../../map_files/versions.json", { cache: "no-store" });
        if (!response.ok) return DEFAULT_VERSION;
        const data = await response.json();
        const versions = Array.isArray(data) ? data : (data && Array.isArray(data.versions) ? data.versions : []);
        const clean = versions.map(text).filter(Boolean).sort(compareVersionLike);
        return clean[clean.length - 1] || DEFAULT_VERSION;
      }
      function addCell(row, value, className = "") {
        const cell = document.createElement("td");
        cell.textContent = value || "-";
        if (className) cell.className = className;
        row.appendChild(cell);
      }
      function ensureNoResultRow() {
        if (noResultRow) return noResultRow;
        noResultRow = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = "Aucun resultat.";
        noResultRow.appendChild(cell);
        bodyEl.appendChild(noResultRow);
        return noResultRow;
      }
      function updateGroupToggle(groupRow) {
        const lineUid = text(groupRow && groupRow.dataset.lineUid);
        const isCollapsed = collapsedLines.has(lineUid);
        const button = groupRow && groupRow.querySelector(".line-toggle-btn");
        const icon = groupRow && groupRow.querySelector(".line-toggle-icon");
        if (button) button.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
        if (icon) icon.textContent = isCollapsed ? "+" : "-";
      }
      function applySearch() {
        const query = normalizeSearch(searchEl && searchEl.value);
        const groups = Array.from(bodyEl.querySelectorAll("tr.line-group-row"));
        let visibleRouteCount = 0;
        let visibleLineCount = 0;
        let visibleOpenRouteCount = 0;
        groups.forEach((groupRow) => {
          const lineUid = text(groupRow.dataset.lineUid);
          const routeRows = Array.from(bodyEl.querySelectorAll("tr.route-row")).filter((row) => text(row.dataset.lineUid) === lineUid);
          let groupHasMatch = !query || normalizeSearch(groupRow.dataset.search).includes(query);
          let matchingRoutes = 0;
          routeRows.forEach((row) => {
            const matches = !query || groupHasMatch || normalizeSearch(row.dataset.search).includes(query);
            if (matches) {
              matchingRoutes += 1;
              visibleRouteCount += 1;
            }
            row.hidden = !matches;
            row.classList.toggle("is-collapsed", matches && collapsedLines.has(lineUid));
            if (matches && !collapsedLines.has(lineUid)) visibleOpenRouteCount += 1;
          });
          if (matchingRoutes > 0) groupHasMatch = true;
          groupRow.hidden = !groupHasMatch;
          if (groupHasMatch) visibleLineCount += 1;
          updateGroupToggle(groupRow);
        });
        const emptyRow = ensureNoResultRow();
        emptyRow.hidden = !query || visibleRouteCount > 0 || visibleLineCount > 0;
        tableEl.classList.toggle("is-all-collapsed", visibleOpenRouteCount === 0);
        if (query) setStatus(`${visibleLineCount} ligne(s), ${visibleRouteCount} route(s) sur ${totalRouteCount} route(s).`);
        else setBaseStatus();
      }
      function renderRows(xml) {
        bodyEl.innerHTML = "";
        noResultRow = null;
        collapsedLines.clear();
        const lines = Array.from(xml.getElementsByTagName("line"));
        let routeCount = 0;
        lines.forEach((lineNode) => {
          const lineUid = text(lineNode.getAttribute("uid"));
          const lineNumber = text(lineNode.getAttribute("number")) || lineUid;
          const routes = Array.from(lineNode.getElementsByTagName("route"));
          collapsedLines.add(lineUid);
          const groupRow = document.createElement("tr");
          groupRow.className = "line-group-row";
          groupRow.dataset.lineUid = lineUid;
          groupRow.dataset.search = `${lineUid} ${lineNumber}`;
          groupRow.innerHTML = `<td class="line-group-cell" colspan="4"><button type="button" class="line-toggle-btn" data-line-uid="${lineUid}" aria-expanded="false"><span class="line-toggle-icon">+</span><span class="line-toggle-main"></span><span class="line-toggle-count">${routes.length} route(s)</span></button></td>`;
          groupRow.querySelector(".line-toggle-main").textContent = `Ligne ${lineNumber}`;
          bodyEl.appendChild(groupRow);
          if (!routes.length) {
            const row = document.createElement("tr");
            row.className = "route-row";
            row.dataset.lineUid = lineUid;
            row.dataset.search = `${lineUid} ${lineNumber} aucune route`;
            addCell(row, lineUid, "uid");
            addCell(row, lineNumber, "line-number");
            addCell(row, "", "uid");
            addCell(row, "Aucune route");
            bodyEl.appendChild(row);
            return;
          }
          routes.forEach((routeNode) => {
            routeCount += 1;
            const routeUid = text(routeNode.getAttribute("uid"));
            const routeName = text(routeNode.getAttribute("name"));
            const row = document.createElement("tr");
            row.className = "route-row";
            row.dataset.lineUid = lineUid;
            row.dataset.search = `${lineUid} ${lineNumber} ${routeUid} ${routeName}`;
            addCell(row, lineUid, "uid");
            addCell(row, lineNumber, "line-number");
            addCell(row, routeUid, "uid");
            addCell(row, routeName);
            bodyEl.appendChild(row);
          });
        });
        totalLineCount = lines.length;
        totalRouteCount = routeCount;
      }
      async function main() {
        try {
          const version = await getDbusVersion();
          metaEl.textContent = `Version : ${version}`;
          const xmlPath = `../../map_files/${encodeURIComponent(version)}/DBus/lines.xml`;
          const response = await fetch(xmlPath, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const xml = new DOMParser().parseFromString(await response.text(), "text/xml");
          if (xml.querySelector("parsererror")) throw new Error("XML invalide");
          renderRows(xml);
          applySearch();
        } catch (err) {
          bodyEl.innerHTML = '<tr><td colspan="4" class="empty">Chargement impossible.</td></tr>';
          setStatus(`Impossible de charger les donnees. Detail : ${String(err && err.message || err)}`, true);
        }
      }
      bodyEl.addEventListener("click", (event) => {
        const button = event.target && event.target.closest ? event.target.closest(".line-toggle-btn") : null;
        if (!button) return;
        const lineUid = text(button.dataset.lineUid);
        if (collapsedLines.has(lineUid)) collapsedLines.delete(lineUid);
        else collapsedLines.add(lineUid);
        applySearch();
      });
      searchEl.addEventListener("input", applySearch);
      openAllBtn.addEventListener("click", () => { collapsedLines.clear(); applySearch(); });
      closeAllBtn.addEventListener("click", () => {
        Array.from(bodyEl.querySelectorAll("tr.line-group-row")).forEach((row) => collapsedLines.add(text(row.dataset.lineUid)));
        applySearch();
      });
      main();
    })();
  </script>
</body>
</html>

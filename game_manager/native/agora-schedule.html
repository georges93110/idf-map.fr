<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Feuille de service Agora</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="paper" width="1024" height="1024"></canvas><script>
'use strict';
const canvas=document.getElementById('paper'),ctx=canvas.getContext('2d');
const ROWS=23,STEP=22.62,TOP=178,LEFT=[48,526],WIDTH=446;
let pages=[[]],page=0,key='',turn=null,nextPage=0,busy=false;
const api=window.IDFAgoraSchedule={ready:true,revision:0,pages:()=>pages,page:()=>page,apply,advance};
function entries(data){
 const routes=Array.isArray(data.routes)?data.routes:[],line=String(data.line||'');
 if(line)return routes.filter(r=>[r.lineUid,r.lineUidRaw].map(String).includes(line)).map(r=>({code:String(r.routeUid||''),name:[r.departureName,r.destinationName].every(Boolean)?r.departureName+' > '+r.destinationName:String(r.routeName||'')}));
 const found=new Map();for(const r of routes){const id=String(r.lineUid||'');if(id&&!found.has(id))found.set(id,{code:String(r.lineUidRaw||id),name:String(r.lineName||r.lineNumber||id)});}
 return [...found.values()].sort((a,b)=>a.code.localeCompare(b.code,'fr',{numeric:true}));
}
function wrap(label){
 ctx.font='16px Arial';const words=label.split(/\s+/),lines=[];let row='';
 for(const word of words){const candidate=row?row+' '+word:word;if(row&&ctx.measureText(candidate).width>WIDTH){lines.push(row);row='    '+word;}else row=candidate;}
 if(row)lines.push(row);return lines.length?lines:[''];
}
function layout(items){
 const result=[[]];for(const item of items){const lines=wrap(item.code+' : '+item.name);let current=result.at(-1);
  if(current.length%ROWS+lines.length>ROWS&&lines.length<=ROWS){while(current.length%ROWS)current.push('');}
  for(const text of lines){if(current.length>=ROWS*2){current=[];result.push(current);}current.push(text);}
 }return result;
}
function apply(data){
 const items=entries(data),k=JSON.stringify([data.line||'',items]);if(k===key)return;
 const old=pages[page]||[];key=k;pages=layout(items);page=0;
 turn={start:performance.now(),old};nextPage=performance.now()+12000;draw();
}
function advance(){if(pages.length<2)return;const old=pages[page];page=(page+1)%pages.length;turn={start:performance.now(),old};nextPage=performance.now()+12000;draw();}
function ink(lines){ctx.fillStyle='#182333';ctx.font='16px Arial';ctx.textBaseline='alphabetic';
 lines.forEach((line,i)=>ctx.fillText(line,LEFT[Math.floor(i/ROWS)],TOP+(i%ROWS)*STEP,WIDTH));
}
function draw(){
 const now=performance.now();if(!turn&&nextPage&&now>=nextPage&&pages.length>1){advance();return;}
 if(!turn&&api.drawnKey===key+':'+page)return;
 ctx.clearRect(0,0,1024,1024);ctx.save();ctx.beginPath();ctx.rect(40,135,444,546);ctx.rect(518,135,464,546);ctx.clip();
 ink(pages[page]);
 if(turn){const p=Math.min(1,(now-turn.start)/650),edge=40+942*(1-p);
  // A moving paper edge reveals the new list; the original clip, logos and
  // ruled sheet stay in the game-owned material outside the written area.
  ctx.save();ctx.beginPath();ctx.rect(40,135,Math.max(0,edge-40),546);ctx.clip();ctx.fillStyle='#eeeede';ctx.fillRect(40,135,942,546);
  ctx.strokeStyle='#a4a49e';ctx.lineWidth=1;for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(40,160+i*STEP);ctx.lineTo(982,160+i*STEP);ctx.stroke();}ink(turn.old);ctx.restore();
  const width=24*Math.sin(p*Math.PI);if(width>0){const shade=ctx.createLinearGradient(edge-width,0,edge+width,0);shade.addColorStop(0,'#cbcbbd');shade.addColorStop(.45,'#fffff5');shade.addColorStop(1,'rgba(30,30,20,0)');ctx.fillStyle=shade;ctx.fillRect(edge-width,135,2*width,546);}
  if(p===1)turn=null;
 }
 ctx.restore();api.drawnKey=key+':'+page;api.revision++;
}
async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/saeiv/schedule-state',{cache:'no-store'});if(r.ok)apply(await r.json());}catch{}finally{busy=false;}}
refresh();setInterval(refresh,250);setInterval(draw,50);
</script></body></html>

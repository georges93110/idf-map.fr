<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Statut Embarquement</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      pointer-events: none;
      transform: scaleY(-1);
      transform-origin: 50% 50%;
      left: 0;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .scene-center {
      position: absolute;
      left: 40%;
      top: 50%;
      width: 0;
      height: 0;
    }

    .bus {
      position: absolute;
      left: -25px;
      top: -70px;
      width: 50px;
      height: 140px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      background: rgba(15, 15, 18, 0.95);
      z-index: 20;
      /* La transition permet au bus de tourner fluidement */
      transition: transform 0.4s linear;
      will-change: transform;
    }

    .door-gap {
      position: absolute;
      right: -2px;
      width: 6px;
      height: 24px;
      background: rgba(15, 15, 18, 0.95);
      z-index: 25;
    }

    .door-in {
      bottom: 12px;
    }

    .door-out {
      top: 12px;
    }

    .counter {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(180deg) scale(-1, 1);
      min-width: 3px;
      padding: 0 6px;
      height: 18px;
      gap: 1px;
      color: #ffffff;
      background: transparent;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: baseline;
      justify-content: center;
      z-index: 30;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .counter-current {
      font-size: 13px;
    }

    .counter-max {
      font-size: 9px;
      opacity: 0.85;
    }

    .platform-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      z-index: 5;
      /* transition for smooth map movement */
      transition: transform 0.4s linear, opacity 0.4s ease;
      will-change: transform, opacity;
    }

    .platform-body {
      position: absolute;
      left: -20px;
      top: -80px;
      width: 40px;
      height: 160px;
      background: #444;
      border-left: 2px solid #facc15;
      border-radius: 4px;
    }

    .dot {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #15ff68;
      box-shadow: 0 0 5px rgba(21, 255, 104, 0.85);
      transform: translate(-50%, -50%);
      z-index: 40;
      will-change: left, top, opacity, transform;
      transition:
        left var(--walk-speed, 0.8s) linear,
        top var(--walk-speed, 0.8s) linear,
        opacity 0.2s linear,
        transform 0.2s linear;
    }

    .dot.leaving {
      background: #ff3b3b;
      box-shadow: 0 0 5px rgba(255, 59, 59, 0.85);
    }

    .waiting-dot {
      z-index: 15;
    }

    .dot.fade {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.35);
    }



    .orientation-readout {
      display: none;
      /* Masqué suite à la finalisation du débug */
      position: absolute;
      left: -95px;
      top: -135px;
      width: 190px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      line-height: 1.35;
      font-weight: 700;
      text-align: left;
      white-space: pre-line;
      z-index: 50;
      font-variant-numeric: tabular-nums;
    }
    /* Progress is received from game.html, no independent CSS walk timer. */
    .dot { transition: none; will-change: transform; left: 0; top: 0; }
    .platform-container { transition: none; }
    .door-gap { width: 5px; right: -3px; border-radius: 2px; background: #94a3b8; }
    .door-gap[data-state="closed"] { background: #ef4444; box-shadow: 0 0 4px #ef4444; }
    .door-gap[data-state="moving"] { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
    .door-gap[data-state="open"] { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
    .legend { position: fixed; bottom: 4px; left: 3px; right: 3px; color: white;
      font-size: 10px; text-align: center; text-shadow: 0 1px 3px #000; }
    .legend span { white-space: nowrap; }
    #service-info { margin: 3px 0; font-size: 11px; }
  </style>
</head>

<body>
  <div class="root">
    <div id="scene" class="scene">
      <div id="scene-center" class="scene-center">
        <div id="bus" class="bus" aria-label="Statut passagers bus">
          <div id="door-entry" class="door-gap door-in" data-state="unknown" role="img" aria-label="Entrée : indisponible"></div>
          <div id="door-exit" class="door-gap door-out" data-state="unknown" role="img" aria-label="Sortie : indisponible"></div>
          <div id="counter" class="counter"><span id="counterCurrent" class="counter-current">0</span><span
              id="counterMax" class="counter-max"> / 100</span></div>
        </div>

        <div id="platform-container" class="platform-container" hidden>
          <div class="platform-body">
          </div>
        </div>

        <div id="dots-container"></div>
        <div id="orientation-readout" class="orientation-readout">Bus X: --<br>Arret X: --</div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div id="service-info" role="status" aria-live="polite">En attente du service</div>
    Portes : <span style="color:#ef4444">● Fermée</span> · <span style="color:#f59e0b">● En cours</span> · <span style="color:#22c55e">● Ouverte</span><br>
    Passagers : <span style="color:#15ff68">● Attente / montée</span> · <span style="color:#ff3b3b">● Descente</span>
  </div>
  <script src="../js/bus-status.js?v=bus-service-4" defer></script>
</body>
</html>

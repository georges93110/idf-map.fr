<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Advisor - ETS2 Ancien</title>
  <style>
    :root {
      --w: 100%;
      --h: 100%;
      --orange: #f2a319;
      --yellow: #ffd15a;
      --text: #f5f5f5;
      --muted: #9c9c9c;
      --dark: #0e0e0e;
      --panel: #1b1b1b;
      --line: #3b3b3b;
      --blue: #2eb5e9;
      --truck-size: 80px;
      --trailer-size: 150px;
      --cargo-size: 45px;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }


    .gps {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #151515;
    }


    .screen {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(138deg, transparent 0 39%, rgba(255, 255, 255, .045) 39.2% 46%, transparent 46.2%),
        radial-gradient(circle at 0 0, rgba(255, 255, 255, .08), transparent 34%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 2px, rgba(0, 0, 0, .06) 2px 4px),
        #151515;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      background: linear-gradient(#4c4c4c, #161616 56%, #090909);
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-weight: 700;
      text-shadow: 0 1px 2px #000;
      z-index: 10;
    }

    .speed {
      width: 112px;
      font-size: 16px;
      text-align: left;
      padding-left: 4px;
    }

    .road {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 150px;
      color: #bdbdbd;
      font-size: 18px;
    }

    .road .tag {
      color: var(--orange);
      font-size: 15px;
      margin-right: 5px;
    }

    .mini-icon {
      opacity: .75;
      filter: drop-shadow(0 1px 0 #000);
      font-size: 18px;
      line-height: 1;
    }

    .mini-truck {
      width: 20px;
      height: 13px;
      position: relative;
      background: #aaa;
      border-radius: 1px;
      margin-left: 1px;
      opacity: .8;
    }

    .mini-truck:before {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 0;
      width: 8px;
      height: 9px;
      background: #aaa;
      border-radius: 1px;
    }

    .mini-truck:after {
      content: "";
      position: absolute;
      right: 1px;
      bottom: -3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #333;
      box-shadow: -14px 0 #333;
    }

    .mini-fuel {
      width: 8px;
      height: 19px;
      border: 1px solid #aaa;
      background: linear-gradient(90deg, #777 0 48%, var(--orange) 49%);
      margin-left: 3px;
    }

    .mail {
      font-size: 20px;
      margin-left: auto;
      opacity: .75;
    }

    .clock {
      font-size: 16px;
      margin-left: auto;
      min-width: 93px;
      text-align: right;
    }

    .routebar {
      position: absolute;
      top: 34px;
      left: 0;
      right: 0;
      height: 24px;
      z-index: 9;
      background: linear-gradient(#252525, #0f0f0f);
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      text-shadow: 0 1px 2px #000;
    }

    .routebar[hidden] {
      display: none !important;
    }

    .flag {
      width: 20px;
      height: 20px;
      margin-right: 7px;
      object-fit: contain;
    }

    .mini-ico {
      height: 16px !important;
      width: auto;
      object-fit: contain;
    }

    .ico-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .route-text {
      font-size: 13px;
      font-weight: 600;
    }

    .money {
      margin-left: auto;
      color: var(--orange);
      font-size: 16px;
    }

    .main {
      position: absolute;
      inset: 64px 6px 60px 6px;
      overflow: hidden;
      z-index: 5;
    }

    .view {
      display: none;
      height: 100%;
      position: relative;
    }

    .view.active {
      display: block;
    }

    /* Map */
    .map-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .map-wrap {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .map-bg {
      position: absolute;
      inset: 0;
      background: #202020;
      overflow: hidden;
    }

    #wazeLeafletMap {
      width: 100%;
      height: 100%;
      background: #202020;
    }

    .waze-leaflet-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #202020;
    }

    .map-label {
      position: absolute;
      font-weight: 800;
      color: #e9c15e;
      letter-spacing: 2px;
      font-size: 18px;
      text-shadow: 0 2px 3px #000;
    }

    .lille {
      left: 238px;
      top: 38px;
    }

    .road-gray {
      position: absolute;
      background: #9a9a9a;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .7));
    }

    .rg1 {
      left: -28px;
      top: 82px;
      width: 199px;
      height: 16px;
      transform: rotate(8deg);
    }

    .rg2 {
      left: 65px;
      top: 38px;
      width: 117px;
      height: 15px;
      transform: rotate(-27deg);
    }

    .rg3 {
      left: 113px;
      top: 31px;
      width: 123px;
      height: 12px;
      transform: rotate(14deg);
    }

    .rg4 {
      left: 17px;
      top: 111px;
      width: 120px;
      height: 18px;
      transform: rotate(36deg);
    }

    .rg5 {
      left: 99px;
      top: 69px;
      width: 84px;
      height: 15px;
      transform: rotate(93deg);
    }

    .roundabout {
      position: absolute;
      left: 92px;
      top: 116px;
      width: 30px;
      height: 19px;
      border-radius: 50%;
      background: #1d1d1d;
      box-shadow: 0 0 0 13px #8e8e8e;
    }

    .route-red,
    .route-yellow {
      position: absolute;
      height: 16px;
      transform-origin: left center;
      filter: drop-shadow(0 1px 0 #111);
    }

    .route-red {
      background: #e11414;
    }

    .route-yellow {
      background: #ffd33c;
    }

    .r1 {
      left: 227px;
      top: 86px;
      width: 121px;
      transform: rotate(5deg);
    }

    .r2 {
      left: 339px;
      top: 88px;
      width: 92px;
      transform: rotate(20deg);
    }

    .r3 {
      left: 219px;
      top: 104px;
      width: 139px;
      transform: rotate(82deg);
    }

    .r4 {
      left: 256px;
      top: 174px;
      width: 91px;
      transform: rotate(24deg);
    }

    .r5 {
      left: 314px;
      top: 96px;
      width: 82px;
      transform: rotate(92deg);
    }

    .y1 {
      left: 346px;
      top: 96px;
      width: 75px;
      transform: rotate(25deg);
    }

    .y2 {
      left: 382px;
      top: 106px;
      width: 111px;
      transform: rotate(99deg);
    }

    .arrow-green {
      position: absolute;
      width: 0;
      height: 0;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
      border-left: 27px solid #28e032;
      filter: drop-shadow(0 1px 0 #000);
    }

    .g1 {
      left: 354px;
      top: 137px;
      transform: rotate(21deg)
    }

    .g2 {
      left: 288px;
      top: 179px;
      transform: rotate(26deg)
    }

    .home {
      position: absolute;
      left: 215px;
      top: 206px;
      width: 25px;
      height: 20px;
      background: #7eda41;
      clip-path: polygon(50% 0, 100% 45%, 82% 45%, 82% 100%, 18% 100%, 18% 45%, 0 45%);
      filter: drop-shadow(0 1px 1px #000);
    }

    .pin {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: #236d96;
      border: 2px solid rgba(255, 255, 255, .7);
      box-shadow: 0 2px 2px #000;
    }

    .pin span {
      position: absolute;
      inset: 3px;
      display: grid;
      place-items: center;
      transform: rotate(45deg);
      font-size: 12px;
      font-weight: 700;
    }

    .pin.p1 {
      left: 218px;
      top: 168px;
    }

    .shop {
      position: absolute;
      width: 39px;
      height: 31px;
      background: linear-gradient(135deg, #1c75c4 0 48%, #f7f7f7 49% 60%, #c61f18 61%);
      transform: rotate(14deg);
      box-shadow: 0 2px 4px #000;
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .shop.s1 {
      left: 199px;
      top: 91px;
    }

    .motel {
      position: absolute;
      width: 34px;
      height: 31px;
      background: #4f5960;
      border: 1px solid #222;
      box-shadow: 0 2px 3px #000;
    }

    .motel:before {
      content: "🛏";
      position: absolute;
      left: 5px;
      top: 4px;
      font-size: 18px;
    }

    .motel:after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 3px;
      height: 4px;
      background: #e1e1e1;
    }

    .motel.m1 {
      left: 299px;
      top: 120px;
    }

    .motel.m2 {
      left: 245px;
      top: 96px;
    }

    .poi {
      position: absolute;
      font-weight: 800;
      text-shadow: 0 1px 2px #000;
    }

    .q {
      left: 149px;
      top: 89px;
      font-size: 28px;
      color: #efefef;
    }

    .gar {
      left: 92px;
      top: 51px;
      font-size: 8px;
      background: #fff;
      color: #32b83b;
      border-radius: 3px;
      padding: 1px 3px;
      transform: rotate(-6deg)
    }

    .metro {
      left: 148px;
      top: 43px;
      font-size: 8px;
      background: #fff;
      color: #a22;
      border-radius: 2px;
      padding: 1px 4px;
      transform: rotate(7deg)
    }

    .trans {
      left: 258px;
      top: 83px;
      font-size: 8px;
      background: #f4c65d;
      color: #883;
      padding: 1px 3px;
      transform: rotate(-3deg)
    }

    /* rest / services */
    .striped {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 18px, transparent 18px 37px), repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 2px, rgba(0, 0, 0, .02) 2px 4px);
    }

    .rest-lines {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 94px;
      font-weight: 800;
      text-shadow: 0 1px 2px #000;
    }

    .rest-lines p {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #dcdcdc;
    }

    .rest-lines .row {
      display: flex;
      font-size: 16px;
    }

    .rest-lines .row span:last-child {
      margin-left: auto;
      color: var(--yellow);
    }

    .damage-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 45px;
      text-align: center;
      font-weight: 800;
      font-size: 24px;
    }

    .damage-icons {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 25px;
      display: flex;
      justify-content: center;
      gap: 25px;
      align-items: flex-end;
      text-align: center;
    }

    .dmg-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dmg-val {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px #000;
      min-width: 40px;
    }

    .damage-icons img {
      height: auto;
      object-fit: contain;
    }

    .dmg-icon {
      position: relative;
      display: block;
      overflow: hidden;
      --damage-fill: 0%;
    }

    .dmg-icon>img,
    .dmg-fill img {
      display: block;
      width: 100%;
      height: auto;
    }

    .dmg-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--damage-fill);
      overflow: hidden;
      pointer-events: none;
    }

    .dmg-fill img {
      position: absolute;
      left: 0;
      bottom: 0;
      filter: brightness(0) saturate(100%) invert(18%) sepia(95%) saturate(4925%) hue-rotate(354deg) brightness(95%) contrast(106%);
      opacity: .9;
    }

    .dmg-truck {
      width: var(--truck-size);
    }

    .dmg-trailer {
      width: var(--trailer-size);
    }

    .dmg-cargo {
      width: var(--cargo-size);
    }

    .dblock {
      width: 85px;
      position: relative;
      color: #f4f4f4;
      font-weight: 800;
      font-size: 16px;
      text-shadow: 0 1px 2px #000;
    }

    .truck-large {
      height: 41px;
      position: relative;
      margin: auto auto 8px;
      width: 70px;
    }

    .truck-large:before {
      content: "";
      position: absolute;
      left: 21px;
      top: 4px;
      width: 40px;
      height: 25px;
      background: #8d8d8d;
    }

    .truck-large:after {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      width: 25px;
      height: 22px;
      background: #9a9a9a;
      box-shadow: 12px 28px 0 -9px #060606, 54px 28px 0 -9px #060606;
    }

    .trailer-large {
      height: 43px;
      width: 94px;
      margin: auto auto 6px;
      position: relative;
    }

    .trailer-large:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 92px;
      height: 33px;
      background: #aaa;
    }

    .trailer-large:after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: 1px;
      width: 8px;
      height: 8px;
      background: #080808;
      border-radius: 50%;
      box-shadow: 14px 0 #080808;
    }

    .cargo-large {
      height: 44px;
      width: 58px;
      margin: auto auto 5px;
      position: relative;
    }

    .cargo-large:before {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      width: 19px;
      height: 19px;
      background: #aaa;
      box-shadow: 22px 0 #aaa, 0 22px #aaa, 22px 22px #aaa;
    }

    .cargo-large:after {
      content: "";
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: -4px;
      height: 4px;
      background: #9a9a9a;
    }

    .service-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 29px;
      background: linear-gradient(#9d9d9d, #525252 48%, #1b1b1b);
      border-top: 1px solid #b0b0b0;
      display: flex;
      align-items: center;
      padding-left: 67px;
      font-weight: 800;
      color: #dedede;
      text-shadow: 0 1px 2px #000;
      font-size: 16px;
    }

    .service-icon {
      position: absolute;
      left: 28px;
      bottom: 4px;
      width: 28px;
      height: 27px;
      background: linear-gradient(#ffd840, #c89004);
      border-radius: 3px;
      display: grid;
      place-items: center;
      color: #5c4a00;
      font-size: 19px;
      box-shadow: 0 1px 2px #000;
    }

    .parking-title {
      position: absolute;
      left: 12px;
      top: 4px;
      color: var(--orange);
      font-weight: 800;
      font-size: 16px;
    }

    .parking-msg {
      position: absolute;
      left: 0;
      right: 0;
      top: 70px;
      text-align: center;
      font-weight: 800;
      line-height: 2.1;
      font-size: 16px;
    }

    .parking-msg b {
      color: var(--yellow);
    }

    /* bottom */
    .fkeys {
      position: absolute;
      bottom: 51px;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      justify-content: center;
      background: rgba(6, 6, 6, .62);
      border-top: 1px solid #272727;
      border-bottom: 1px solid #313131;
      z-index: 20;
    }

    .fkey {
      width: 56px;
      height: 30px;
      background: linear-gradient(#242424, #121212);
      border-left: 1px solid #333;
      border-right: 1px solid #060606;
      display: grid;
      place-items: center;
      color: #696969;
      font-weight: 800;
      font-size: 16px;
      text-shadow: 0 1px 1px #000;
      flex-shrink: 0;
    }

    .menubar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 51px;
      background: linear-gradient(#333, #202020 48%, #050505);
      border-top: 1px solid #4a4a4a;
      z-index: 21;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      gap: 0;
    }

    .cursor-f1 {
      position: absolute;
      left: 0;
      top: 0;
      width: 96px;
      height: 49px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      color: #cfcfcf;
      font-size: 14px;
      background: linear-gradient(90deg, #777, #2a2a2a 70%, transparent);
      font-weight: 800;
      text-shadow: 0 1px 2px #000;
      flex-shrink: 0;
      line-height: 1.1;
    }

    .cursor-f1 .flag {
      width: 38px;
      height: 38px;
      margin-right: 2px;
      flex-shrink: 0;
    }



    .navbtn {
      width: 56px;
      height: 49px;
      display: grid;
      place-items: center;
      position: relative;
      color: #606060;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 0;
      outline: none;
    }

    .navbtn.active {
      background: rgba(255, 255, 255, .08);
    }

    .navbtn .ico {
      width: 31px;
      height: 31px;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 22px;
      filter: drop-shadow(0 2px 2px #000);
      margin-top: 3px;
    }

    .compass {
      border-radius: 50% !important;
      background: radial-gradient(circle at 45% 45%, #fff 0 34%, #c7d5d1 35% 65%, #706d5b 66%);
      font-size: 18px !important;
    }

    .note {
      background: linear-gradient(#f4e7c4, #d2b572);
      color: #503b00;
      position: relative;
    }

    .note:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 31px;
      height: 31px;
      background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(120, 80, 0, .28) 6px 7px);
    }

    .gear {
      background: linear-gradient(#ffd72f, #c88b00);
      color: #5a4a00;
    }

    .list {
      background: linear-gradient(#f5f5f5, #b9d6d6);
      color: #47606b;
      font-size: 20px !important;
    }

    .chat {
      background: transparent;
      color: #28bfe8;
      font-size: 29px !important;
    }

    .help {
      margin-left: auto;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 3px solid #c99c23;
      background: radial-gradient(circle, #d9d9d9 0 48%, #848484 49%);
      display: grid;
      place-items: center;
      color: #345;
      font-size: 25px;
      font-weight: 900;
      text-shadow: none;
    }

    .navbtn.active:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 6px;
      background: var(--orange);
      box-shadow: 0 -1px 8px rgba(252, 174, 27, .55);
    }

    .navbtn.active .ico {
      transform: translateY(-1px);
    }

    .caret {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="gps">
    <div class="screen"></div>
    <div class="topbar">
      <div class="speed">0 km/h</div>
      <!-- <div class="road">
        <img src="../images/widgets/truck.png" class="mini-ico" alt="Truck">
        <img src="../images/widgets/fuel_warning.png" class="mini-ico" alt="Fuel">
      </div>-->
      <div id="timeTop" class="clock">00:00</div>
    </div>
    <div id="routebar" class="routebar" hidden>
      <img src="../images/widgets/job_target.png" class="flag" alt="Target">
      <div id="routeText" class="route-text">00:00, 0 km, 0min</div>
    </div>

    <main class="main">
      <section id="view-map" class="view active">
        <div class="map-wrap">
          <div id="wazeLeafletMap" class="map-bg">
            <iframe id="wazeLeafletFrame" class="waze-leaflet-frame" title="Waze" allow="geolocation"></iframe>
          </div>
        </div>
      </section>

      <section id="view-rest" class="view">
        <div class="striped"></div>
        <div class="rest-lines">
          <p>Vous n'avez pas de livraison pour le moment.</p>
        </div>
      </section>

      <section id="view-service" class="view">
        <div class="striped"></div>
        <div class="damage-title">Dégats</div>
        <div class="damage-icons">
          <div class="dmg-item">
            <div id="truckDmgIcon" class="dmg-icon dmg-truck">
              <img src="../images/widgets/truck.png" alt="Camion">
              <span class="dmg-fill" aria-hidden="true"><img src="../images/widgets/truck.png" alt=""></span>
            </div>
            <span class="dmg-val" id="truckDmg">0%</span>
          </div>
          <div class="dmg-item">
            <div id="trailerDmgIcon" class="dmg-icon dmg-trailer">
              <img src="../images/widgets/trailer.png" alt="Remorque">
              <span class="dmg-fill" aria-hidden="true"><img src="../images/widgets/trailer.png" alt=""></span>
            </div>
            <span class="dmg-val" id="trailerDmg">0%</span>
          </div>
          <div class="dmg-item">
            <div id="cargoDmgIcon" class="dmg-icon dmg-cargo">
              <img src="../images/widgets/cargo.png" alt="Cargaison">
              <span class="dmg-fill" aria-hidden="true"><img src="../images/widgets/cargo.png" alt=""></span>
            </div>
            <span class="dmg-val" id="cargoDmg">0%</span>
          </div>
        </div>
      </section>

    </main>


    <nav class="menubar">
      <button class="navbtn active" data-view="map" title="Carte"><img src="../images/widgets/compass.png"
          class="ico-img" alt=""></button>
      <!-- <button class="navbtn" data-view="rest" title="Jobs"><img src="../images/widgets/job.png" class="ico-img"
          alt=""></button>
      <button class="navbtn" data-view="service" title="Services"><img src="../images/widgets/degats.png"
          class="ico-img" alt=""></button>-->
      <span class="caret">⌄</span>
    </nav>
  </div>

  <script>
    (function () {
      const navbtns = document.querySelectorAll('.navbtn');
      const views = document.querySelectorAll('.view');

      // --- Embedded Waze from gps_mini ---
      const wazeFrame = document.getElementById('wazeLeafletFrame');
      const WIDGET_BRIDGE_SCOPE = "idf_game_widget_bridge_v1";
      const WIDGET_BRIDGE_CHANNEL_WAZE = "waze";
      const WIDGET_BRIDGE_WS_URL = "ws://localhost:3001";
      const SAEIV_TIME_SYSTEM_STORAGE_KEY = "idf_game2_saeiv_time_system_v1";
      const QS = new URLSearchParams(location.search || "");
      const routebarEl = document.getElementById('routebar');
      const routeTextEl = document.getElementById('routeText');
      const speedEl = document.querySelector('.speed');
      const timeTopEl = document.getElementById('timeTop');
      let lastPauseMessage = null;
      let lastWazeBridgeMessage = null;
      let lastTelemetryState = null;
      let lastHostWazeTs = 0;
      let widgetBridgeSocket = null;
      let widgetBridgeReconnectTimer = 0;

      function buildWazeFrameUrl() {
        const url = new URL("gps_mini.html", location.href);
        url.searchParams.set("waze_app", "");
        const hostMode = String(QS.get("host") || "").trim();
        if (hostMode) url.searchParams.set("host", hostMode);
        ["devmap", "dev_map", "nextversion"].forEach((key) => {
          if (QS.has(key)) url.searchParams.set(key, QS.get(key) || "1");
        });
        return url.href;
      }

      function initWazeFrame() {
        if (!wazeFrame) return;
        wazeFrame.addEventListener('load', () => {
          if (lastPauseMessage) postToWazeFrame(lastPauseMessage);
          if (lastWazeBridgeMessage) postToWazeFrame(lastWazeBridgeMessage);
        });
        wazeFrame.src = buildWazeFrameUrl();
      }

      function postToWazeFrame(message) {
        if (!wazeFrame || !wazeFrame.contentWindow) return;
        try {
          wazeFrame.contentWindow.postMessage(message, "*");
        } catch (err) {
        }
      }

      function getPayloadNumber(payload, keys, fallback) {
        for (const key of keys) {
          const value = Number(payload && payload[key]);
          if (Number.isFinite(value)) return value;
        }
        return fallback;
      }

      function formatDisplaySpeedKmh(value) {
        const speed = Number(value);
        return String(Number.isFinite(speed) ? Math.round(Math.abs(speed)) : 0);
      }

      function clampPercent(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return 0;
        const percent = n > 0 && n < 1 ? n * 100 : n;
        return Math.max(0, Math.min(100, percent));
      }

      function getMaxPayloadNumber(payload, keys, fallback) {
        let found = Number.NaN;
        keys.forEach((key) => {
          const value = Number(payload && payload[key]);
          if (Number.isFinite(value)) found = Number.isFinite(found) ? Math.max(found, value) : value;
        });
        return Number.isFinite(found) ? found : fallback;
      }

      function setDamageValue(textId, iconId, value) {
        const percent = clampPercent(value);
        const rounded = Math.round(percent);
        const textEl = document.getElementById(textId);
        const iconEl = document.getElementById(iconId);
        if (textEl) textEl.textContent = rounded + '%';
        if (iconEl) iconEl.style.setProperty('--damage-fill', rounded + '%');
      }

      function updateDamagesFromPayload(payload) {
        if (!payload || typeof payload !== 'object') return;
        setDamageValue('truckDmg', 'truckDmgIcon', getMaxPayloadNumber(payload, [
          'truckDamagePercent',
          'truck_damage_percent',
          'truckDamage',
          'damage',
          'wearSum'
        ], 0));
        setDamageValue('trailerDmg', 'trailerDmgIcon', getMaxPayloadNumber(payload, [
          'trailerDamagePercent',
          'trailer_damage_percent',
          'trailerDamage',
          'trailerWearSum',
          'trailerWearBody',
          'trailerWearChassis',
          'trailerWearWheels',
          'trailerCargoDamage'
        ], 0));
        setDamageValue('cargoDmg', 'cargoDmgIcon', getMaxPayloadNumber(payload, [
          'cargoDamagePercent',
          'cargo_damage_percent',
          'cargoDamage',
          'cargoWear',
          'jobCargoDamage',
          'trailerCargoDamage'
        ], 0));
      }

      function normalizeTimeSystem(value) {
        return String(value || '').trim().toLowerCase() === 'irl' ? 'irl' : 'game';
      }

      function getConfiguredTimeSystem(payload) {
        if (payload && payload.timeSystem) return normalizeTimeSystem(payload.timeSystem);
        try {
          return normalizeTimeSystem(localStorage.getItem(SAEIV_TIME_SYSTEM_STORAGE_KEY));
        } catch (err) {
          return 'game';
        }
      }

      function pad2(value) {
        return String(Math.max(0, Math.floor(Number(value) || 0))).padStart(2, '0');
      }

      function formatClockText(value) {
        if (value == null) return '';
        if (typeof value === 'string') {
          const match = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(value.trim());
          if (match) return pad2(match[1]) + ':' + pad2(match[2]);
          const numeric = Number(value);
          if (!Number.isFinite(numeric)) return '';
          value = numeric;
        }
        const n = Number(value);
        if (!Number.isFinite(n)) return '';
        const minutes = n > 1440 ? Math.floor(n / 60) : Math.floor(n);
        const h = Math.floor(minutes / 60) % 24;
        const m = minutes % 60;
        return pad2(h) + ':' + pad2(m);
      }

      function formatIrlClock() {
        const now = new Date();
        return pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      }

      function resolveClockText(payload) {
        const source = payload && typeof payload === 'object' ? payload : {};
        if (getConfiguredTimeSystem(source) === 'irl') return formatIrlClock();
        return (
          formatClockText(source.refTime) ||
          formatClockText(source.gameTimeSim) ||
          formatClockText(source.gameTime) ||
          formatClockText(source.gameTimeMinutes) ||
          '00:00'
        );
      }

      function parseClockMinutes(text) {
        const match = /^(\d{1,2}):(\d{2})/.exec(String(text || '').trim());
        if (!match) return Number.NaN;
        const h = Number(match[1]);
        const m = Number(match[2]);
        if (!Number.isFinite(h) || !Number.isFinite(m)) return Number.NaN;
        return ((Math.floor(h) % 24) * 60) + Math.floor(m);
      }

      function addMinutesToClock(text, minutes) {
        const base = parseClockMinutes(text);
        const add = Number(minutes);
        if (!Number.isFinite(base) || !Number.isFinite(add)) return text || '00:00';
        const total = ((Math.round(base + add) % 1440) + 1440) % 1440;
        return pad2(Math.floor(total / 60)) + ':' + pad2(total % 60);
      }

      function formatDistance(meters) {
        const m = Number(meters);
        if (!Number.isFinite(m) || m <= 0) return '0 km';
        if (m < 1000) return Math.round(m) + ' m';
        const km = m / 1000;
        return (km < 10 ? km.toFixed(1) : Math.round(km).toString()) + ' km';
      }

      function normalizeRoutePoint(point) {
        if (!point || typeof point !== 'object') return null;
        const x = Number(point.x ?? point.X);
        const y = Number(point.y ?? point.Y ?? point.z ?? point.Z);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
        return { x, y };
      }

      function routeDistanceFromPoints(points) {
        if (!Array.isArray(points) || points.length < 2) return Number.NaN;
        let total = 0;
        let prev = normalizeRoutePoint(points[0]);
        for (let i = 1; i < points.length; i += 1) {
          const next = normalizeRoutePoint(points[i]);
          if (prev && next) {
            const dx = next.x - prev.x;
            const dy = next.y - prev.y;
            total += Math.sqrt((dx * dx) + (dy * dy));
          }
          if (next) prev = next;
        }
        return total > 0 ? total : Number.NaN;
      }

      function formatMinutes(value) {
        const n = Number(value);
        if (!Number.isFinite(n) || n <= 0) return 0;
        return Math.max(0, Math.round(n));
      }

      function updateSpeedFromPayload(payload) {
        if (!speedEl) return;
        const speedKmh = getPayloadNumber(payload, ['speedKmh', 'speed_kmh', 'speed', 'kmh'], 0);
        speedEl.textContent = formatDisplaySpeedKmh(speedKmh) + ' km/h';
      }

      function updateTimeFromPayload(payload) {
        if (!timeTopEl) return;
        timeTopEl.textContent = resolveClockText(payload || lastTelemetryState || {});
      }

      function hasWazeNavigation(payload) {
        if (!payload || typeof payload !== 'object') return false;
        if (payload.clearNavigation === true || payload.clearDestination === true) return false;
        if (payload.routeSelected === false && payload.routeStarted !== true && payload.routeWaitingStart !== true) {
          const points = Array.isArray(payload.routePoints) ? payload.routePoints : [];
          return points.length >= 2 || !!(payload.end || payload.to || payload.b);
        }
        return (
          payload.routeSelected === true ||
          payload.routeStarted === true ||
          payload.routeWaitingStart === true ||
          Array.isArray(payload.routePoints) && payload.routePoints.length >= 2 ||
          Array.isArray(payload.routeStops) && payload.routeStops.length > 0 ||
          !!(payload.end || payload.to || payload.b) ||
          getPayloadNumber(payload, ['distanceToCurrentStopM', 'remainingDistanceM'], 0) > 0 ||
          getPayloadNumber(payload, ['etaRemainingMinutes', 'remainingMinutes'], 0) > 0
        );
      }

      function updateRouteTextFromWazePayload(payload) {
        const active = hasWazeNavigation(payload);
        if (routebarEl) routebarEl.hidden = !active;
        if (!active || !routeTextEl) return;

        const etaMinutes = getPayloadNumber(payload, ['etaRemainingMinutes', 'remainingMinutes'], 0);
        let distanceM = getPayloadNumber(payload, [
          'distanceToCurrentStopM',
          'remainingDistanceM',
          'distanceM',
          'distanceMeters',
          'navigationDistanceM'
        ], 0);
        if (!Number.isFinite(distanceM) || distanceM <= 0) {
          const routeDistance = routeDistanceFromPoints(payload && payload.routePoints);
          if (Number.isFinite(routeDistance)) distanceM = routeDistance;
        }
        const arrivalTs = Number(payload && payload.etaArrivalTimestampMs);
        let arrivalTime = Number.isFinite(arrivalTs) && arrivalTs > 0
          ? formatClockText(new Date(arrivalTs).getHours() * 60 + new Date(arrivalTs).getMinutes())
          : '';
        if (!arrivalTime) {
          arrivalTime = addMinutesToClock(resolveClockText(payload || lastTelemetryState || {}), etaMinutes);
        }
        routeTextEl.textContent = `${arrivalTime}, ${formatDistance(distanceM)}, ${formatMinutes(etaMinutes)}min`;
      }

      function applyTelemetryState(payload) {
        if (!payload || typeof payload !== 'object') return false;
        lastTelemetryState = payload;
        updateSpeedFromPayload(payload);
        updateTimeFromPayload(payload);
        updateDamagesFromPayload(payload);
        return true;
      }

      function applyWazePayload(payload) {
        if (!payload || typeof payload !== 'object') return false;
        lastWazeBridgeMessage = {
          scope: WIDGET_BRIDGE_SCOPE,
          channel: WIDGET_BRIDGE_CHANNEL_WAZE,
          payload: payload,
          ts: Number(payload.ts) || Date.now()
        };
        updateSpeedFromPayload(payload);
        updateTimeFromPayload(payload);
        updateDamagesFromPayload(payload);
        updateRouteTextFromWazePayload(payload);
        return true;
      }

      function parseMaybeJson(value) {
        if (typeof value !== 'string') return value;
        try {
          return JSON.parse(value);
        } catch (err) {
          return null;
        }
      }

      function looksLikeTelemetryState(value) {
        if (!value || typeof value !== 'object') return false;
        return (
          String(value.kind || '') === 'game2_html_state' ||
          value.game2Bonus && String(value.game2Bonus.kind || '') === 'game2_html_state' ||
          Object.prototype.hasOwnProperty.call(value, 'speedKmh') ||
          Object.prototype.hasOwnProperty.call(value, 'gameTime') ||
          Object.prototype.hasOwnProperty.call(value, 'gameTimeSim') ||
          Object.prototype.hasOwnProperty.call(value, 'truckDamagePercent')
        );
      }

      function extractTelemetryState(message) {
        const msg = parseMaybeJson(message);
        if (!msg || typeof msg !== 'object') return null;
        if (msg.type === 'ws_log') return extractTelemetryState(msg.payload);
        if (msg.action === 'telemetry' && msg.data && typeof msg.data === 'object') {
          return Object.assign({}, msg.data, { game2Bonus: msg.bonus || msg.data.game2Bonus });
        }
        if (looksLikeTelemetryState(msg)) return msg;
        if (msg.payload && looksLikeTelemetryState(msg.payload)) return msg.payload;
        if (msg.data && looksLikeTelemetryState(msg.data)) return msg.data;
        return null;
      }

      function handleIncomingMessage(message, sourceWindow) {
        const msg = parseMaybeJson(message);
        if (!msg || typeof msg !== 'object') return false;

        if (wazeFrame && sourceWindow === wazeFrame.contentWindow) return true;

        if (msg.scope === WIDGET_BRIDGE_SCOPE) {
          if (msg.type === 'game_pause_state') {
            lastPauseMessage = msg;
            postToWazeFrame(msg);
            return true;
          }

          if (String(msg.channel || '').trim().toLowerCase() === WIDGET_BRIDGE_CHANNEL_WAZE) {
            const payload = msg.payload && typeof msg.payload === 'object' ? msg.payload : null;
            if (payload) {
              applyWazePayload(payload);
              postToWazeFrame(msg);
            }
            return true;
          }
        }

        const telemetry = extractTelemetryState(msg);
        if (telemetry) {
          applyTelemetryState(telemetry);
          return true;
        }

        return false;
      }

      function getHostWindowCandidates() {
        const out = [];
        const seen = new Set();
        const push = (win) => {
          if (!win || win === window || seen.has(win)) return;
          seen.add(win);
          out.push(win);
        };
        try { push(window.parent); } catch (err) { }
        try { push(window.top); } catch (err) { }
        try { push(window.opener); } catch (err) { }
        return out;
      }

      function pollHostWazeState() {
        const hosts = getHostWindowCandidates();
        for (let i = 0; i < hosts.length; i += 1) {
          const host = hosts[i];
          try {
            if (typeof host.wazeGetBridgeState !== 'function') continue;
            const payload = host.wazeGetBridgeState();
            if (!payload || typeof payload !== 'object') continue;
            const ts = Number(payload.ts) || 0;
            if (ts && ts === lastHostWazeTs) return;
            if (ts) lastHostWazeTs = ts;
            applyWazePayload(payload);
            return;
          } catch (err) {
          }
        }
      }

      function scheduleWidgetBridgeReconnect() {
        if (widgetBridgeReconnectTimer) return;
        widgetBridgeReconnectTimer = window.setTimeout(() => {
          widgetBridgeReconnectTimer = 0;
          connectWidgetBridgeSocket();
        }, 900);
      }

      function connectWidgetBridgeSocket() {
        if (widgetBridgeSocket && (
          widgetBridgeSocket.readyState === WebSocket.OPEN ||
          widgetBridgeSocket.readyState === WebSocket.CONNECTING
        )) return;

        let socket = null;
        try {
          socket = new WebSocket(WIDGET_BRIDGE_WS_URL);
        } catch (err) {
          scheduleWidgetBridgeReconnect();
          return;
        }

        widgetBridgeSocket = socket;
        socket.addEventListener('message', (event) => {
          handleIncomingMessage(event && event.data);
        });
        socket.addEventListener('close', () => {
          if (widgetBridgeSocket === socket) widgetBridgeSocket = null;
          scheduleWidgetBridgeReconnect();
        });
        socket.addEventListener('error', () => {
        });
      }

      initWazeFrame();

      function switchView(viewId) {
        views.forEach(v => v.classList.remove('active'));
        navbtns.forEach(b => b.classList.remove('active'));

        const targetView = document.getElementById('view-' + viewId);
        const targetBtn = document.querySelector(`.navbtn[data-view="${viewId}"]`);

        if (targetView) targetView.classList.add('active');
        if (targetBtn) targetBtn.classList.add('active');

      }

      navbtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          switchView(btn.getAttribute('data-view'));
        });
      });

      window.addEventListener('message', (event) => {
        handleIncomingMessage(event && event.data, event && event.source);
      });

      updateTimeFromPayload({});
      pollHostWazeState();
      connectWidgetBridgeSocket();
      window.setInterval(pollHostWazeState, 250);
      window.setInterval(() => {
        const source = lastWazeBridgeMessage && lastWazeBridgeMessage.payload
          ? lastWazeBridgeMessage.payload
          : lastTelemetryState;
        updateTimeFromPayload(source || {});
      }, 1000);
    })();
  </script>
</body>

  <script>
(function () {
  function fitPhoneWidget() {
    var w = Math.max(1, window.innerWidth);
    var h = Math.max(1, window.innerHeight);
    var scale = Math.min(w / 320, h / 640);
    document.documentElement.style.setProperty('--iphone-widget-scale', String(Math.max(0.1, scale)));
  }
  window.addEventListener('resize', fitPhoneWidget, { passive: true });
  fitPhoneWidget();
})();
$(function(){
  //Global Vars
  const appleMapsIcon = 'apps/maps/apple-maps-icon.jpg';
  const wazeIcon = 'apps/waze/waze-icon.jpg';
  const youTubeIcon = 'apps/youtube/youtube-icon.jpg';
  const disabledOfficialApps = [
    ['Google', 'apps/disabled_icons/google.jpg'],
    ['Chrome', 'apps/disabled_icons/chrome.jpg'],
    ['Gmail', 'apps/disabled_icons/gmail.jpg'],
    ['Google Maps', 'apps/disabled_icons/google_maps.jpg'],
    ['Google Drive', 'apps/disabled_icons/google_drive.jpg'],
    ['Facebook', 'apps/disabled_icons/facebook.jpg'],
    ['Instagram', 'apps/disabled_icons/instagram.jpg'],
    ['TikTok', 'apps/disabled_icons/tiktok.jpg'],
    ['Snapchat', 'apps/disabled_icons/snapchat.jpg'],
    ['WhatsApp', 'apps/disabled_icons/whatsapp.jpg'],
    ['Messenger', 'apps/disabled_icons/messenger.jpg'],
    ['X', 'apps/disabled_icons/x.jpg'],
    ['Netflix', 'apps/disabled_icons/netflix.jpg'],
    ['Prime Video', 'apps/disabled_icons/prime_video.jpg'],
    ['Disney+', 'apps/disabled_icons/disney.jpg'],
    ['Twitch', 'apps/disabled_icons/twitch.jpg'],
    ['Discord', 'apps/disabled_icons/discord.jpg'],
    ['Uber', 'apps/disabled_icons/uber.jpg'],
    ['Airbnb', 'apps/disabled_icons/airbnb.jpg'],
    ['Booking.com', 'apps/disabled_icons/booking_com.jpg'],
    ['Outlook', 'apps/disabled_icons/outlook.jpg'],
    ['Word', 'apps/disabled_icons/word.jpg'],
    ['Excel', 'apps/disabled_icons/excel.jpg'],
    ['PowerPoint', 'apps/disabled_icons/powerpoint.jpg'],
    ['PayPal', 'apps/disabled_icons/paypal.jpg'],
    ['Pinterest', 'apps/disabled_icons/pinterest.jpg'],
    ['LinkedIn', 'apps/disabled_icons/linkedin.jpg']
  ].map(function(app) {
    return {
      name: app[0],
      icon: app[1],
      type: 'app',
      dynamic: false,
      disabled: true
    };
  });
  const globalState = {
    apps: [
      {
        name: 'Plans',
        icon: appleMapsIcon,
        type: 'app',
        dynamic: false
      },
      {
        name: 'Waze',
        icon: wazeIcon,
        type: 'app',
        dynamic: false
      },
      {
        name: 'YouTube',
        icon: youTubeIcon,
        type: 'app',
        dynamic: false
      },
    ].concat(disabledOfficialApps),
    wrapperApps: {
      appsGroup: 24,
      groupActive: 1,
      medida: $('.wrapperApps').outerWidth(true),
      transform: 0
    },
    dateTime: {
      months: ['janvier ',' février ',' mars ',' avril ',' mai ',' juin ',' juillet ',' août ',' septembre ',' octobre ',' novembre ',' décembre '],
        days: ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi']
    },
    draggScreen: false
  }
  const homeScreenBackgroundImage = $('.mainScreen').first().css('background-image') || 'none';
  document.documentElement.style.setProperty('--iphone-home-screen-bg', homeScreenBackgroundImage);

  //Extended Functions
  function getIphoneHostWindowCandidates() {
    const candidates = [];
    [window.parent, window.top, window.opener].forEach(function(win) {
      if (!win || win === window || candidates.indexOf(win) !== -1) return;
      candidates.push(win);
    });
    return candidates;
  }

  function getIphoneHostClockPayload() {
    const candidates = getIphoneHostWindowCandidates();
    for (let index = 0; index < candidates.length; index += 1) {
      const win = candidates[index];
      try {
        if (typeof win.saeivGetBridgeState === 'function') {
          const packet = win.saeivGetBridgeState();
          const payload = packet && typeof packet === 'object' ? (packet.payload || packet) : null;
          if (payload && typeof payload === 'object') return payload;
        }
      } catch (err) { }
      try {
        if (typeof win.wazeGetBridgeState === 'function') {
          const payload = win.wazeGetBridgeState();
          if (payload && typeof payload === 'object') return payload;
        }
      } catch (err2) { }
    }
    return null;
  }

  function parseIphoneClockTextToDate(value) {
    const match = /^(\d{1,2}):(\d{2})(::(\d{2}))$/.exec(String(value || '').trim());
    if (!match) return null;
    const hours = Number(match[1]);
    const minutes = Number(match[2]);
    const seconds = Number(match[3] || 0);
    if (!Number.isFinite(hours) || !Number.isFinite(minutes) || !Number.isFinite(seconds)) return null;
    if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) return null;
    const date = new Date();
    date.setHours(hours, minutes, seconds, 0);
    return date;
  }

  function getIphoneClockDate() {
    const payload = getIphoneHostClockPayload();
    const clockNowMs = Number(payload && payload.clockNowMs);
    if (Number.isFinite(clockNowMs) && clockNowMs > 0) return new Date(clockNowMs);
    const refTimeDate = parseIphoneClockTextToDate(payload && payload.refTime);
    return refTimeDate || new Date();
  }

  $.fn.extend({
    touchMov: function(config){
      config = jQuery.extend({
        mov: 'x',
        threshold: 24,
        movLeft: function(){},
        movRight: function(){},
        movUp: function(){},
        movDown: function(){},
        updateMovX: function(){},
        updateMovY: function(){},
        finishMov: function(){}
      }, config);
      let el = this;
      let initCoords = { x: 0, y: 0 };
      let movCoords = { x: 0, y: 0 };
      let downCoords = { x: 0, y: 0 };
      el.mousedown(function (e) {
        initCoords = { x: e.pageX, y: e.pageY };
        movCoords = { x: e.pageX, y: e.pageY };
        downCoords = { x: e.pageX, y: e.pageY };
        el.mousemove(function (e2) {
          globalState.draggScreen = true;
          movCoords = { x: e2.pageX, y: e2.pageY };
          if (config.mov === 'x') {
            config.updateMovX(e2, (movCoords.x - initCoords.x))
          } else if (config.mov === 'y') {
            config.updateMovY(e2, (movCoords.y - initCoords.y))
          }
        })
        el.mouseup(function (ex) {
          let deltaX = movCoords.x - initCoords.x;
          let deltaY = movCoords.y - initCoords.y;
          if (config.mov === 'x') {
            if (Math.abs(deltaX) >= config.threshold) {
              deltaX > 0 ? config.movRight(ex) : config.movLeft(ex);
            }
          } else if (config.mov === 'y') {
            if (Math.abs(deltaY) >= config.threshold) {
              deltaY > 0 ? config.movDown(ex) : config.movUp(ex);
            }
          }
          globalState.draggScreen = false;
          config.finishMov(ex);
          el.off('mousemove');
          el.off('mouseup');
          el.off('mouseleave');
        })
        el.mouseleave(function (a) {
          let deltaX = movCoords.x - initCoords.x;
          let deltaY = movCoords.y - initCoords.y;
          if (config.mov === 'x') {
            if (Math.abs(deltaX) >= config.threshold) {
              deltaX > 0 ? config.movRight(a) : config.movLeft(a);
            }
          } else if (config.mov === 'y') {
            if (Math.abs(deltaY) >= config.threshold) {
              deltaY > 0 ? config.movDown(a) : config.movUp(a);
            }
          }
          globalState.draggScreen = false;
          config.finishMov(a);
          el.off('mousemove');
          el.off('mouseup');
          el.off('mouseleave');
        })
      })
      return this;
    },
    dateIcon: function(config){
      config = jQuery.extend({
        date: getIphoneClockDate(),
        fullDay: false
      }, config);
      let today = config.date.getDate();
      let day = globalState.dateTime.days[config.date.getDay()];
      this.append(`<div class="dateWrapper"><p class="dayNam">${config.fullDay ? day : day.substring(0, 3)}</p><p class="dayNum">${today}</p></div>`);
      return this;
    },
    hour: function(config) {
      config = jQuery.extend({
        realtime: true
      }, config);
      const renderHour = () => {
        const today = getIphoneClockDate();
        let hour = today.getHours();
        if (hour < 10) hour = '0' + hour;
        let minutes = today.getMinutes();
        if (minutes < 10) minutes = '0' + minutes;
        this.text(`${hour}:${minutes}`);
      };
      if (config.realtime) {
        setInterval(() => {
          renderHour();
        }, 1000);
      }
      renderHour();
      return this;
    },
    date: function (config) {
      config = jQuery.extend({
        date: getIphoneClockDate(),
        fullDay: true
      }, config);
      let today = config.date.getDate();
      let day = globalState.dateTime.days[config.date.getDay()];
      let month = globalState.dateTime.months[config.date.getMonth()];
      this.text(`${config.fullDay ? day : day.substring(0, 3)} ${today} ${month}`);
      return this;
    },
  })

  //Functions
  function restructureString(string){
    return string.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function paintApps(apps, container, containerDots){
    container.empty();
    containerDots.empty();
    globalState.wrapperApps.groups = Math.ceil(apps.length / globalState.wrapperApps.appsGroup);
    let appCount = 1;
    let html = '';
    apps.map((app, idArr) => {
      if (appCount == 1) html += '<div class="group">';
      let clases = 'app';
      if (app.type == 'widgetFull') clases = clases + ' widgetFull';
      if (app.dynamic && app.type == 'app') clases = `${clases} ${restructureString(app.name).toLowerCase()}Dynamic`;
      if (app.disabled) clases = clases + ' disabledOfficial';
      html += `<div class="${clases}" data-app="${app.type + restructureString(app.name)}" data-id="${idArr}"${app.disabled ? ' aria-disabled="true"' : ''}>
${app.notifications ? `<div class="notification">${app.notifications}</div>` : ''}
<div class="icon" style="${!app.dynamic ? `background-image:url(${app.icon});` : 'background-color:#fff;'}"></div>
<p class="name">${app.name}</p>
</div>`;
      if (appCount == globalState.wrapperApps.appsGroup) {
        html += '</div>';
        appCount = 1;
        return false;
      }
      app.type == 'widgetFull' ? appCount = appCount + 8 : appCount++;
    })
    if (globalState.wrapperApps.groups > 1) {
      for (let index = 0; index < globalState.wrapperApps.groups; index++) {
        containerDots.append(`<div class="dot ${index == 0 ? 'active':''}"></div>`);
      }
    }
    container.append(html);
  }
  function syncDeckAppsVisibility() {
    $('.deckApps').each(function() {
      const visibleBusinessApps = $(this).children('.app').filter(function() {
        const app = $(this);
        if (app.is('[data-indeck]')) return false;
        if (app.hasClass('hidden')) return false;
        if (app.attr('hidden') !== undefined) return false;
        if (app.css('display') === 'none') return false;
        return true;
      }).length;
      $(this).toggleClass('empty', visibleBusinessApps === 0);
      $(this).closest('.appScreen').toggleClass('deckAppsEmpty', visibleBusinessApps === 0);
    });
  }
  function installDeckAppsVisibilityObserver() {
    syncDeckAppsVisibility();
    if (typeof MutationObserver === 'undefined') {
      window.setInterval(syncDeckAppsVisibility, 500);
      return;
    }
    $('.deckApps').each(function() {
      const observer = new MutationObserver(function() {
        window.requestAnimationFrame(syncDeckAppsVisibility);
      });
      observer.observe(this, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['class', 'style', 'hidden']
      });
    });
  }
  let iphoneBusinessMode = '';
  let uberEatsOfferRequestSeq = 0;
  let uberEatsPendingTimer = null;
  let uberEatsCurrentOffer = null;
  let uberEatsActiveDelivery = null;
  let uberEatsProgressTimer = null;

  const bridgedContextMenuFrames = new WeakSet();

  function framePointToWidgetDocument(frameEl, event) {
    let x = Number(event.clientX);
    let y = Number(event.clientY);
    let currentFrame = frameEl;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    while (currentFrame) {
      const rect = currentFrame.getBoundingClientRect();
      x += rect.left;
      y += rect.top;
      const ownerWindow = currentFrame.ownerDocument && currentFrame.ownerDocument.defaultView;
      if (!ownerWindow || ownerWindow === window) break;
      currentFrame = ownerWindow.frameElement;
    }
    return { x, y };
  }

  function dispatchWidgetContextMenuFromFrame(frameEl, event) {
    const point = framePointToWidgetDocument(frameEl, event);
    if (!point) return;
    event.preventDefault();
    event.stopPropagation();
    const target = document.querySelector('.iphone-widget-root') || document.body || document.documentElement;
    const bridgedEvent = new MouseEvent('contextmenu', {
      bubbles: true,
      cancelable: true,
      view: window,
      button: 2,
      buttons: 2,
      clientX: point.x,
      clientY: point.y,
      screenX: Number(event.screenX) || 0,
      screenY: Number(event.screenY) || 0,
      ctrlKey: !!event.ctrlKey,
      shiftKey: !!event.shiftKey,
      altKey: !!event.altKey,
      metaKey: !!event.metaKey
    });
    target.dispatchEvent(bridgedEvent);
  }

  function installNestedIframeContextMenuBridge(frameEl) {
    if (!frameEl || bridgedContextMenuFrames.has(frameEl)) return;
    bridgedContextMenuFrames.add(frameEl);
    const bindFrameDocument = function() {
      let frameWindow = null;
      let frameDocument = null;
      try {
        frameWindow = frameEl.contentWindow;
        frameDocument = frameEl.contentDocument || (frameWindow && frameWindow.document);
      } catch (err) {
        return;
      }
      if (!frameWindow || !frameDocument) return;
      try {
        frameWindow.removeEventListener('contextmenu', frameEl.__iphoneContextMenuBridgeHandler, true);
      } catch (err2) { }
      frameEl.__iphoneContextMenuBridgeHandler = function(event) {
        dispatchWidgetContextMenuFromFrame(frameEl, event);
      };
      try {
        frameWindow.addEventListener('contextmenu', frameEl.__iphoneContextMenuBridgeHandler, true);
      } catch (err3) { }
      try {
        frameDocument.querySelectorAll('iframe').forEach(function(childFrame) {
          installNestedIframeContextMenuBridge(childFrame);
          childFrame.addEventListener('load', function() {
            installNestedIframeContextMenuBridge(childFrame);
          });
        });
      } catch (err4) { }
    };
    frameEl.addEventListener('load', bindFrameDocument);

  function getHostWindowCandidates() {
    const candidates = [];
    try {
      let current = window;
      while (current && current.parent && current.parent !== current) {

        if (!candidates.includes(parent)) candidates.push(parent);
        current = parent;
      }
    } catch (err) { }
    try {
      if (window.top && window.top !== window && !candidates.includes(window.top)) candidates.push(window.top);
    } catch (err) { }
    try {
      if (window.opener && window.opener !== window && !candidates.includes(window.opener)) candidates.push(window.opener);
    } catch (err) { }
    return candidates;
  }

  function isHostDevMapMode() {
    let ownStorageEnabled = false;
    try { ownStorageEnabled = isDevMapStorageEnabled(window.localStorage); } catch (err) { }
    if (hasDevMapFlagInSearch(location.search) || ownStorageEnabled) return true;
    const candidates = getHostWindowCandidates();
    for (let i = 0; i < candidates.length; i += 1) {
      const win = candidates[i];
      try {
        if (win.GAME2_DEV_MAP_MODE === true) return true;
      } catch (err) { }
      try {
        if (win.document && win.document.body && win.document.body.classList.contains('is-dev-map-mode')) return true;
      } catch (err) { }
      try {
        if (hasDevMapFlagInSearch(win.location && win.location.search)) return true;
      } catch (err) { }
      try {

      } catch (err) { }
    }
    return false;

  function normalizeIphoneWazePoint(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const x = Number(raw.x ?? raw.X);
    const hasZ = Object.prototype.hasOwnProperty.call(raw, 'z') || Object.prototype.hasOwnProperty.call(raw, 'Z');
    const y = Number(hasZ ? (raw.z ?? raw.Z) : (raw.y ?? raw.Y));
    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    let h = Number(raw.h ?? raw.H ?? raw.height ?? raw.alt ?? raw.altitude);
    if (!Number.isFinite(h) && hasZ) h = Number(raw.y ?? raw.Y);
    const point = { x, y };
    if (Number.isFinite(h)) point.h = h;
    return point;
  }

  function sendWazeDestinationToApp(point, attempt) {
    const destination = normalizeIphoneWazePoint(point);
    if (!destination) return false;
    const frame = $('.wazeApp iframe.waze-app-frame')[0];
    if (frame && frame.contentWindow) {
      try {
        if (typeof frame.contentWindow.wazeSetNavigationDestinationPoint === 'function') {
          frame.contentWindow.wazeSetNavigationDestinationPoint(destination);
          return true;
        }
      } catch (err) { }
      try {
        if (typeof frame.contentWindow.wazeSetNavigationDestinationXYZ === 'function') {
          frame.contentWindow.wazeSetNavigationDestinationXYZ(
            destination.x,
            Number.isFinite(destination.h) ? destination.h : 0,
            destination.y
          );
          return true;
        }
      } catch (err2) { }
    }
    const nextAttempt = Number(attempt) || 0;
    if (nextAttempt < 20) {
      setTimeout(function () {
        sendWazeDestinationToApp(destination, nextAttempt + 1);
      }, 150);
      return true;
    }
    return false;
  }

  function isBottomHomeBarClick(e, panelEl) {
    if ($(e.target).closest('.appHomeBar').length) return true;
    const rect = panelEl.getBoundingClientRect();
    const sourceEvent = e.originalEvent || e;
    let point = sourceEvent;
    if (sourceEvent.changedTouches && sourceEvent.changedTouches.length) {
      point = sourceEvent.changedTouches[0];
    } else if (sourceEvent.touches && sourceEvent.touches.length) {
      point = sourceEvent.touches[0];
    }
    const x = Number.isFinite(point.clientX) ? point.clientX : point.pageX - window.pageXOffset;
    const y = Number.isFinite(point.clientY) ? point.clientY : point.pageY - window.pageYOffset;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    const barHeight = Math.max(38, rect.height * 0.075);
    const barLeft = rect.left + rect.width * 0.24;
    const barRight = rect.right - rect.width * 0.24;
    return x >= barLeft && x <= barRight && y >= rect.bottom - barHeight && y <= rect.bottom;
  }

  const youtubePauseIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M12 6h14v52H12V6zM38 6h14v52H38V6z"></path></svg>';

  function sendYoutubePlayerCommand(command) {
    const frame = $('.youTubeApp iframe.youtube-app-frame')[0];
    if (!frame || !frame.contentWindow) return false;
    frame.contentWindow.postMessage({
      source: 'iphone-control-center',
      command
    }, '*');
    return true;
  }

  window.addEventListener('message', function(event) {
    const data = event.data;
    if (data && data.scope === 'idf_game_widget_bridge_v1' && String(data.channel || '').trim().toLowerCase() === 'waze') {
      const payloadMode = data.payload && data.payload.gameMode;
      if (payloadMode) setIphoneBusinessMode(payloadMode);
      handleUberEatsWazePayload(data.payload || {});
      const frame = $('.wazeApp iframe.waze-app-frame')[0];
      try {
        if (frame && frame.contentWindow) frame.contentWindow.postMessage(data, '*');
      } catch (err) { }
      return;
    }
    if (data && data.source === 'game-uber-eats') {
      if (data.type === 'mode') {
        setIphoneBusinessMode(data.enabled ? data.mode : '');
        return;
      }
      if (data.type === 'disabled') {
        setIphoneBusinessMode('');
        stopUberEatsRing();
        return;
      }
      if (data.type === 'offer') {
        if (data.offer && isUberEatsAppOpen()) scheduleUberEatsOffer(data.offer);
        return;
      }
      if (data.type === 'error') {
        updateUberEatsStatus('Erreur');
        $('.uberEatsApp .uber-eats-empty').text(data.message || 'Impossible de proposer une course').removeClass('hidden');
        return;
      }
    }
    if (!data || data.source !== 'iphone-youtube-player' || data.type !== 'status') return;
    const hasYoutubeWatchUrl = typeof data.url === 'string' && /[&]v=[a-zA-Z0-9_-]{11}/.test(data.url);
    const cleanTitle = String(data.title || '').trim();
    const cleanAuthor = String(data.author || '').trim();
    const hasRealTitle = cleanTitle && !['YouTube', 'Recherche YouTube'].includes(cleanTitle);
    const shouldShowMedia = hasYoutubeWatchUrl && (hasRealTitle || data.state === 'indisponible');
    youtubeMusicState.source = shouldShowMedia ? 'youtube' : '';
    youtubeMusicState.title = shouldShowMedia ? cleanTitle : '';
    youtubeMusicState.author = shouldShowMedia ? cleanAuthor : '';
    youtubeMusicState.playing = shouldShowMedia && Boolean(data.playing);
    syncYoutubeMusicWidget();
  });

      const startY = e.pageY;
      const startX = e.pageX;
      let opened = false;
      $(document)
        .on('mousemove.controlCenterDrag', function(moveEvent) {
          const deltaY = moveEvent.pageY - startY;
          const deltaX = Math.abs(moveEvent.pageX - startX);
          if (!opened && deltaY >= 24 && deltaY >= deltaX) {
            opened = true;
            openControlCenter(statusBar);
          }
        })
        .on('mouseup.controlCenterDrag', function() {
          $(document).off('.controlCenterDrag');
        });
    });

    globalState.wrapperApps.groupActive = page;

//Battery
const updateBattery = () => {
  if (!navigator.getBattery) {
    $('.shell .percent').css('width', '65%');
    return;
  }
  navigator.getBattery().then((battery) => {
    $('.shell .percent').css('width', `${battery.level * 100}%`);
  });
}
setInterval(updateBattery, 60000);
updateBattery();

	 $('.mapsApp, .youTubeApp, .wazeApp, .uberEatsApp').addClass('hidden');
	 $('.widgetCenter, .controlCenter').addClass('hidden').removeAttr('style');
	 $('.mainScreen > .appScreen.moveOut').removeClass('moveOut');
	 syncAppOpenBackgroundState();
	 $('.mainScreen')
       .removeClass('blur filterBlur controlCenterActive appOpen')
       .css({
         filter: '',
         'backdrop-filter': '',
         '-webkit-backdrop-filter': ''
       });
	}
  </script>
</body>

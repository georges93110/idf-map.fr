<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Overlay</title>
  <style>
    :root {
      --bg: #111214;
      --panel: #1a1b1f;
      --line: rgba(160, 160, 160, 0.24);
      --text: #e6e6e6;
      --muted: #a3a3a3;
      --overlay-ui-scale: 0.5;
      --overlay-widget-titlebar-h: calc(32px * var(--overlay-ui-scale));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #2f3136 0%, #1a1b1f 48%, #0c0d0f 100%);
      color: var(--text);
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: minmax(230px, auto) 1fr;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(36, 36, 40, 0.98) 0%, rgba(24, 24, 27, 0.98) 100%);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      min-height: 0;
    }

    .control-panel {
      padding: 12px;
      overflow: auto;
    }

    .title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .telemetry-dot {
      position: fixed;
      top: calc(12px * var(--overlay-ui-scale));
      right: calc(12px * var(--overlay-ui-scale));
      width: calc(16px * var(--overlay-ui-scale));
      height: calc(16px * var(--overlay-ui-scale));
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow:
        0 0 0 calc(2px * var(--overlay-ui-scale)) rgba(0, 0, 0, 0.35),
        0 0 calc(12px * var(--overlay-ui-scale)) rgba(0, 0, 0, 0.45);
      z-index: 6000;
      background: #f59e0b;
      pointer-events: auto;
      cursor: help;
    }
    .telemetry-dot.is-checking {
      background: #f59e0b;
    }
    .telemetry-dot.is-online {
      background: #22c55e;
    }
    .telemetry-dot.is-offline {
      background: #ef4444;
    }
    body.is-telemetry-mode-1::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1500;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.25);
    }
    .telemetry-dot-status {
      position: fixed;
      top: calc((12px + 8px) * var(--overlay-ui-scale));
      right: calc((12px + 16px + 8px) * var(--overlay-ui-scale));
      transform: translateY(-50%) translateX(3px);
      max-width: min(52vw, calc(360px * var(--overlay-ui-scale)));
      padding: calc(4px * var(--overlay-ui-scale)) calc(7px * var(--overlay-ui-scale));
      border-radius: calc(6px * var(--overlay-ui-scale));
      border: 1px solid rgba(148, 163, 184, 0.42);
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
      font-size: calc(11px * var(--overlay-ui-scale));
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
      z-index: 6000;
    }
    #telemetryDot:hover + #telemetryDotStatus {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) translateX(0);
    }
    body.is-telemetry-blocked {
      overflow: hidden;
    }
    body.is-telemetry-blocked .app {
      pointer-events: none !important;
      user-select: none !important;
      filter: blur(1.5px) saturate(0.65);
    }
    .telemetry-error-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000;
      pointer-events: all;
    }
    .telemetry-error-overlay[hidden] {
      display: none !important;
    }
    .telemetry-error-shell {
      width: min(700px, 94vw);
      border-radius: 16px;
      border: 1px solid rgba(239, 68, 68, 0.28);
      background: linear-gradient(180deg, rgba(28, 33, 42, 0.98) 0%, rgba(18, 22, 30, 0.995) 100%);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: clamp(20px, 3vw, 30px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .telemetry-error-shell::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.75), rgba(239, 68, 68, 0.1));
      animation: telemetryErrorAccent 3.2s ease-in-out infinite;
      pointer-events: none;
    }
    .telemetry-error-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(239, 68, 68, 0.42);
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .telemetry-error-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.82);
    }
    .telemetry-error-title {
      margin: 0;
      color: #f3f5f7;
      font-size: clamp(30px, 5.2vw, 42px);
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.08;
    }
    .telemetry-error-text {
      margin: 0;
      color: #f3f4f6;
      font-size: clamp(18px, 2.4vw, 24px);
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.015em;
      animation: telemetryErrorTextSoft 3.4s ease-in-out infinite;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.18);
      position: relative;
      z-index: 1;
    }
    .telemetry-error-help {
      margin: 0;
      color: #9ca9b8;
      font-size: clamp(13px, 1.9vw, 16px);
      line-height: 1.4;
      font-weight: 500;
    }
    .telemetry-error-loader {
      margin-top: 6px;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      border: 1px solid rgba(116, 126, 138, 0.35);
      background: rgba(7, 10, 14, 0.82);
      overflow: hidden;
      position: relative;
    }
    .telemetry-error-loader::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 45%;
      background: linear-gradient(90deg, rgba(112, 189, 255, 0) 0%, rgba(112, 189, 255, 0.95) 50%, rgba(112, 189, 255, 0) 100%);
      animation: telemetryErrorIndeterminate 1.3s linear infinite;
    }
    .telemetry-error-meta {
      margin: 2px 0 0;
      color: #768394;
      font-size: 12px;
      line-height: 1.35;
    }
    @keyframes telemetryErrorIndeterminate {
      from { left: -45%; }
      to { left: 100%; }
    }
    @keyframes telemetryErrorTextSoft {
      0%, 100% { opacity: 0.9; color: #f3f4f6; }
      50% { opacity: 1; color: #fee2e2; }
    }
    @keyframes telemetryErrorAccent {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(230px, 300px) 1fr;
      gap: 10px;
    }

    .section {
      min-height: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(26, 27, 31, 0.9);
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d2d2d2;
    }

    .mode-buttons {
      display: grid;
      gap: 8px;
    }

    .mode-btn {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #2b2d33;
      color: #e4e4e4;
      font-weight: 700;
      text-align: left;
      padding: 0 12px;
    }

    .mode-btn.is-active {
      border-color: rgba(188, 188, 188, 0.7);
      background: linear-gradient(180deg, rgba(76, 76, 82, 0.95) 0%, rgba(56, 56, 62, 0.95) 100%);
      color: #f0f0f0;
    }

    .mode-btn[disabled] {
      cursor: not-allowed;
      opacity: 0.45;
      background: #202228;
      color: #8d8d8d;
    }

    .widget-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: stretch;
    }
    .widget-toolbar.is-disabled {
      opacity: 0.45;
      filter: grayscale(1);
    }

    .widget-select-group {
      min-width: 210px;
      display: grid;
      gap: 4px;
      flex: 1 1 240px;
    }

    .widget-select-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #b7beca;
      padding-left: 2px;
    }

    .add-select {
      height: 36px;
      border-radius: 8px;
      border: 1px solid rgba(160, 160, 160, 0.35);
      background: #222429;
      color: #ebebeb;
      padding: 0 10px;
      min-width: 170px;
      width: 100%;
    }

    .output-lists {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .output-lists.is-extra-disabled #outputColTab,
    .output-lists.is-extra-disabled #outputColPip {
      display: none !important;
    }

    .output-col {
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      background: rgba(26, 27, 31, 0.85);
      min-height: 140px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .output-col.is-unavailable {
      border-color: rgba(248, 113, 113, 0.45);
      background: rgba(32, 20, 20, 0.82);
    }
    .output-col.is-unavailable .output-head {
      background: rgba(127, 29, 29, 0.92);
      border-bottom-color: rgba(252, 165, 165, 0.45);
      color: #fee2e2;
    }
    .output-col.is-unavailable .output-list {
      opacity: 0.35;
      filter: grayscale(1);
      pointer-events: none;
    }
    .output-unavailable-badge {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 48px;
      z-index: 5;
      border: 1px solid rgba(252, 165, 165, 0.6);
      border-radius: 8px;
      background: rgba(127, 29, 29, 0.92);
      color: #fecaca;
      font-size: 11px;
      line-height: 1.35;
      padding: 6px 8px;
      text-align: center;
      font-weight: 700;
    }
    .output-unavailable-badge[hidden] {
      display: none !important;
    }

    .output-head {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #d9d9d9;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(33, 34, 39, 0.92);
    }

    .output-list {
      flex: 1;
      min-height: 92px;
      padding: 8px;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
      touch-action: none;
    }

    .output-list.is-over {
      background: rgba(198, 198, 198, 0.08);
      outline: 1px dashed rgba(198, 198, 198, 0.5);
      outline-offset: -1px;
    }

    .output-empty {
      margin: auto 0;
      color: #9a9a9a;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      width: 100%;
    }

    .output-widget {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 49%;
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(160, 160, 160, 0.3);
      background: #26282d;
      color: #e6e6e6;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 8px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .output-widget.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }

    .widget-close {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(248, 113, 113, 0.6);
      background: rgba(127, 29, 29, 0.35);
      color: #fecaca;
      font-weight: 700;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .view-panel {
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      color: #d4d4d4;
    }

    .widget-stage {
      flex: 1;
      min-height: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
      display: grid;
      gap: 0;
      padding: 0;
    }

    .widget-stage.stage-empty {
      place-items: center;
      color: #93a0b5;
      font-size: 14px;
    }

    .pane {
      border: 0;
      overflow: hidden;
      background: #000;
      min-width: 0;
      min-height: 0;
    }

    .pane-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    @media (max-width: 1100px) {
      .control-grid {
        grid-template-columns: 1fr;
      }
      .output-lists {
        grid-template-columns: 1fr;
      }
      .app {
        grid-template-rows: minmax(360px, auto) 1fr;
      }
    }

    html,
    body {
      background: transparent !important;
    }

    body {
      pointer-events: none;
    }

    .app {
      display: none !important;
    }

    #telemetryErrorOverlay {
      display: none !important;
    }

    #overlayRoot {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
    }

    #overlayWorkspace {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .overlay-window {
      position: absolute;
      border: 1px solid rgba(187, 196, 211, 0.42);
      border-radius: calc(8px * var(--overlay-ui-scale));
      background: rgba(16, 20, 29, 0.92);
      box-shadow:
        0 calc(16px * var(--overlay-ui-scale))
        calc(36px * var(--overlay-ui-scale))
        rgba(0, 0, 0, 0.5);
      overflow: hidden;
      min-width: 120px;
      min-height: 80px;
      pointer-events: auto;
    }

    .overlay-window[data-widget-type] {
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .overlay-window-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(8px * var(--overlay-ui-scale));
      height: var(--overlay-widget-titlebar-h, 32px);
      padding: 0 calc(10px * var(--overlay-ui-scale));
      background: linear-gradient(180deg, rgba(52, 60, 76, 0.95) 0%, rgba(31, 36, 47, 0.96) 100%);
      border-bottom: 1px solid rgba(159, 170, 189, 0.35);
      color: #e8edf8;
      font-size: calc(12px * var(--overlay-ui-scale));
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: move;
      user-select: none;
    }

    .overlay-window[data-widget-type] .overlay-window-titlebar {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(-1 * var(--overlay-widget-titlebar-h, 32px));
      border-bottom: 0;
      border-radius: calc(8px * var(--overlay-ui-scale)) calc(8px * var(--overlay-ui-scale)) 0 0;
      z-index: 2;
    }

    .overlay-window-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .overlay-window-actions {
      display: inline-flex;
      align-items: center;
      gap: calc(6px * var(--overlay-ui-scale));
      flex: 0 0 auto;
    }

    .overlay-window-btn {
      width: calc(20px * var(--overlay-ui-scale));
      height: calc(20px * var(--overlay-ui-scale));
      border: 1px solid rgba(153, 170, 199, 0.5);
      border-radius: calc(5px * var(--overlay-ui-scale));
      background: rgba(27, 33, 45, 0.92);
      color: #e2e8f0;
      font-size: calc(12px * var(--overlay-ui-scale));
      font-weight: 700;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
    }

    .overlay-window-btn.is-danger {
      border-color: rgba(248, 113, 113, 0.7);
      background: rgba(127, 29, 29, 0.45);
      color: #fee2e2;
    }

    .overlay-window-content {
      position: absolute;
      inset: 32px 0 0 0;
      background: #000;
    }

    .overlay-window[data-widget-type] .overlay-window-content {
      inset: 0;
      border: 1px solid rgba(187, 196, 211, 0.42);
      border-radius: calc(8px * var(--overlay-ui-scale));
      background: transparent;
      box-shadow:
        0 calc(16px * var(--overlay-ui-scale))
        calc(36px * var(--overlay-ui-scale))
        rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .overlay-window[data-widget-type] .overlay-window-frame {
      background: transparent;
    }

    .overlay-window-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .overlay-window-resize {
      position: absolute;
      width: calc(18px * var(--overlay-ui-scale));
      height: calc(18px * var(--overlay-ui-scale));
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
      background:
        linear-gradient(135deg, transparent 0 40%, rgba(226, 232, 240, 0.68) 40% 47%, transparent 47% 62%, rgba(226, 232, 240, 0.68) 62% 69%, transparent 69% 100%);
      pointer-events: auto;
    }

    body.is-manager-hidden .overlay-window[data-widget-type] .overlay-window-titlebar,
    body.is-manager-hidden .overlay-window[data-widget-type] .overlay-window-resize {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    body.is-manager-hidden .overlay-window[data-widget-type] .overlay-window-content {
      border-color: transparent;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    #overlayManager {
      width: calc(320px * var(--overlay-ui-scale));
      min-height: calc(210px * var(--overlay-ui-scale));
    }

    #overlayManager .overlay-window-titlebar {
      cursor: move;
    }

    .manager-content {
      padding: calc(10px * var(--overlay-ui-scale));
      color: #e5e7eb;
      font-size: calc(13px * var(--overlay-ui-scale));
      line-height: 1.35;
      display: grid;
      gap: calc(8px * var(--overlay-ui-scale));
      background: rgba(11, 15, 23, 0.95);
      height: calc(100% - var(--overlay-widget-titlebar-h, 32px));
      overflow: auto;
    }

    .manager-help {
      margin: 0;
      color: #9ca3af;
      font-size: calc(12px * var(--overlay-ui-scale));
    }

    .manager-toggle {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--overlay-ui-scale));
      padding: calc(6px * var(--overlay-ui-scale)) calc(8px * var(--overlay-ui-scale));
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: calc(6px * var(--overlay-ui-scale));
      background: rgba(30, 38, 53, 0.82);
    }

    .manager-toggle input[type="checkbox"] {
      margin: 0;
      width: calc(15px * var(--overlay-ui-scale));
      height: calc(15px * var(--overlay-ui-scale));
    }

    .manager-actions {
      display: flex;
      gap: calc(8px * var(--overlay-ui-scale));
      padding-top: 2px;
    }

    .manager-action-btn {
      height: calc(30px * var(--overlay-ui-scale));
      border-radius: calc(7px * var(--overlay-ui-scale));
      border: 1px solid rgba(148, 163, 184, 0.36);
      background: rgba(30, 41, 59, 0.95);
      color: #f1f5f9;
      font-size: calc(12px * var(--overlay-ui-scale));
      font-weight: 700;
      padding: 0 calc(10px * var(--overlay-ui-scale));
      cursor: pointer;
      pointer-events: auto;
    }

    .manager-section-title {
      margin: 0;
      color: #aeb7c8;
      font-size: calc(11px * var(--overlay-ui-scale));
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .manager-tabs {
      display: flex;
      align-items: stretch;
      gap: calc(6px * var(--overlay-ui-scale));
    }

    .manager-tab {
      height: calc(30px * var(--overlay-ui-scale));
      border-radius: calc(7px * var(--overlay-ui-scale));
      border: 1px solid rgba(148, 163, 184, 0.34);
      background: rgba(30, 38, 53, 0.82);
      color: #dbe3ef;
      font-size: calc(12px * var(--overlay-ui-scale));
      font-weight: 700;
      padding: 0 calc(10px * var(--overlay-ui-scale));
      cursor: default;
      pointer-events: none;
    }

    .manager-tab.is-active {
      border-color: rgba(147, 197, 253, 0.72);
      background: linear-gradient(180deg, rgba(59, 130, 246, 0.35) 0%, rgba(37, 99, 235, 0.28) 100%);
      color: #f8fbff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel control-panel">
      <h1 class="title">Selection de jeu</h1>
      <div class="control-grid">
        <section class="section">
          <h2>Mode</h2>
          <div id="modeButtons" class="mode-buttons">
            <button id="modeBtnBus" class="mode-btn is-active" type="button" data-mode="bus" aria-pressed="true">Mode Bus</button>
            <button id="modeBtnUberEats" class="mode-btn" type="button" data-mode="uber_eats" aria-pressed="false">Mode Uber Eats</button>
          </div>
        </section>

        <section class="section">
          <h2>Widgets</h2>
          <div id="widgetToolbar" class="widget-toolbar">
            <label id="widgetGpsGroup" class="widget-select-group">
              <span class="widget-select-label">GPS</span>
              <select id="widgetGpsSelect" class="add-select" aria-label="Widget GPS">
                <option value="">Désactivé</option>
                <option value="waze">GPS Réaliste (Waze)</option>
              </select>
            </label>
            <label id="widgetHudGroup" class="widget-select-group">
              <span class="widget-select-label">HUD Ligne</span>
              <select id="widgetHudSelect" class="add-select" aria-label="Widget HUD Ligne">
                <option value="">Désactivé</option>
                <option value="saeiv">HUD Ligne Réaliste (SAEIV) : SAEIV</option>
                <option value="saeiv_mini">HUD Ligne Simple (Mini) : SAEIV Mini</option>
              </select>
            </label>
          </div>

          <div id="outputLists" class="output-lists">
            <article class="output-col">
              <div class="output-head">Aperçu</div>
              <div id="listInline" class="output-list" data-output="inline"></div>
            </article>
            <article id="outputColTab" class="output-col">

              <div id="listTab" class="output-list" data-output="tab"></div>
            </article>

      function shouldYieldToGameInstance(payload) {
        if (!payload || typeof payload !== "object") return false;
        if (String(payload.type || "") !== "claim") return false;
        var otherId = String(payload.id || "");
        if (!otherId || otherId === gameSingletonId) return false;
        var otherOpenedAt = Number(payload.openedAt);
        if (!Number.isFinite(otherOpenedAt)) otherOpenedAt = 0;
        if (otherOpenedAt > gameSingletonOpenedAt) return true;
        if (otherOpenedAt < gameSingletonOpenedAt) return false;
        return otherId > gameSingletonId;
      }
      function closeThisGameInstanceAsDuplicate() {
        if (gameSingletonClosing) return;
        gameSingletonClosing = true;
        try {
          if (gameSingletonChannel) {
            gameSingletonChannel.close();
            gameSingletonChannel = null;
          }
        } catch (err) {}
        try { stopTelemetryConnectionWatch(); } catch (err) {}
        try {
          if (pipWindow && !pipWindow.closed) pipWindow.close();
        } catch (err) {}
        Object.keys(tabRefs).forEach(function (id) {
          var ref = tabRefs[id];
          if (!ref || ref.closed) return;
          try { ref.close(); } catch (err) {}
        });
        try { window.close(); } catch (err) {}
        setTimeout(function () {
          if (window.closed) return;
          try {
            document.body.innerHTML =
              '<style>html,body{margin:0;width:100%;height:100%;background:#000;color:#d1d5db;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;display:grid;place-items:center;padding:24px;text-align:center} .msg{max-width:620px;border:1px solid rgba(148,163,184,.34);border-radius:14px;background:rgba(17,24,39,.92);padding:20px} .msg h2{margin:0 0 8px;font-size:28px;color:#f3f4f6} .msg p{margin:0;color:#9ca3af;line-height:1.45}</style>' +
              '<div class="msg"><h2>Instance fermee</h2><p>Une autre fenetre game2.html a pris la main.</p></div>';
          } catch (err) {}
          try { window.location.replace("about:blank"); } catch (err) {}
        }, 50);
      }
      function handleGameSingletonClaim(payload) {
        if (!shouldYieldToGameInstance(payload)) return;
        closeThisGameInstanceAsDuplicate();
      }
      function broadcastGameSingletonClaim() {
        var payload = {
          type: "claim",
          id: gameSingletonId,
          openedAt: gameSingletonOpenedAt
        };
        if (gameSingletonChannel) {
          try { gameSingletonChannel.postMessage(payload); } catch (err) {}
        }
        try { localStorage.setItem(GAME_SINGLETON_STORAGE_KEY, JSON.stringify(payload)); } catch (err) {}
      }
      function startGameSingletonGuard() {
        if (typeof BroadcastChannel === "function") {
          try {
            gameSingletonChannel = new BroadcastChannel(GAME_SINGLETON_CHANNEL);
          } catch (err) {
            gameSingletonChannel = null;
          }
        }
        if (gameSingletonChannel) {
          gameSingletonChannel.onmessage = function (event) {
            handleGameSingletonClaim(event ? event.data : null);
          };
        }
        window.addEventListener("storage", function (event) {
          if (!event || event.key !== GAME_SINGLETON_STORAGE_KEY || !event.newValue) return;
          var payload = null;
          try { payload = JSON.parse(event.newValue); } catch (err) { payload = null; }
          handleGameSingletonClaim(payload);
        });
        broadcastGameSingletonClaim();
        setTimeout(broadcastGameSingletonClaim, 140);
      }
      function buildWidgetBridgeEnvelope(channel, payload) {
        return {
          scope: WIDGET_BRIDGE_SCOPE,
          channel: String(channel || "").trim().toLowerCase(),
          payload: payload && typeof payload === "object" ? payload : {},
          clientId: widgetBridgeClientId,
          ts: Date.now()
        };
      }
      function queueWidgetBridgeEnvelope(envelope) {
        if (!envelope || typeof envelope !== "object") return;
        widgetBridgeOutbox.push(envelope);
        if (widgetBridgeOutbox.length > 220) widgetBridgeOutbox.shift();
      }
      function flushWidgetBridgeOutbox() {
        var ws = telemetryWs;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (!widgetBridgeOutbox.length) return;
        var pending = widgetBridgeOutbox.slice();
        widgetBridgeOutbox.length = 0;
        pending.forEach(function (envelope) {
          try {
            ws.send(JSON.stringify(envelope));
          } catch (err) {
            queueWidgetBridgeEnvelope(envelope);
          }
        });
      }
      function sendWidgetBridgeMessage(channel, payload) {
        var envelope = buildWidgetBridgeEnvelope(channel, payload);
        if (!envelope.channel) return false;
        var ws = telemetryWs;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          queueWidgetBridgeEnvelope(envelope);
          return false;
        }
        try {
          ws.send(JSON.stringify(envelope));
          return true;
        } catch (err) {
          queueWidgetBridgeEnvelope(envelope);
          return false;
        }
      }
      function handleWidgetBridgeEnvelope(parsed) {
        if (!parsed || typeof parsed !== "object") return false;
        if (String(parsed.scope || "") !== WIDGET_BRIDGE_SCOPE) return false;
        if (String(parsed.clientId || "") === widgetBridgeClientId) return true;
        var channel = String(parsed.channel || "").trim().toLowerCase();
        var payload = parsed.payload && typeof parsed.payload === "object" ? parsed.payload : null;
        if (!payload) return true;
        if (channel === WIDGET_BRIDGE_CHANNEL_SAEIV) {
          handleSaeivBridgeData(payload);
          return true;
        }
        if (channel === WIDGET_BRIDGE_CHANNEL_WAZE) {
          if (String(payload.type || "") === "waze:request_state") {
            if (!activeBridgeDestinationPoint) {
              ensureSaeivRouteDestinationSynced(true);
            }
            if (!lastBridgeArrowPoint && telemetryLastSignal && typeof telemetryLastSignal === "object") {
              updateWazeBridgePoseFromTelemetry(telemetryLastSignal);
            }
            if (!lastBridgeArrowPoint) {
              ensureWazeBridgeStartPointFallback(null);
            }
            var published = false;
            if (activeBridgeDestinationPoint && lastBridgeArrowPoint) {
              published = publishActiveRouteFromState(true, { allowRecompute: true });
            }
            if (!published && lastWazeBridgePacket) {
              sendWidgetBridgeMessage(WIDGET_BRIDGE_CHANNEL_WAZE, lastWazeBridgePacket);
            }
          }
          return true;
        }
        return true;
      }
      function postSaeivBridgeMessage(message) {
        if (!message || typeof message !== "object") return false;
        var body = Object.assign({}, message, { sourceId: SAEIV_SOURCE_ID });
        return sendWidgetBridgeMessage(WIDGET_BRIDGE_CHANNEL_SAEIV, body);
      }
      function handleSaeivBridgeData(data) {
        if (!data || typeof data !== "object") return;
        if (String(data.sourceId || "") !== SAEIV_SOURCE_ID) return;
        var type = String(data.type || "").trim();
        if (type === "saeiv:catalog_request") {
          ensureDbusDataLoaded()
            .then(function () {
              var filter = String(data.filter || "").trim();
              postSaeivBridgeMessage({
                type: "saeiv:catalog",
                payload: {
                  routes: listLineRouteCatalog(filter)
                }
              });
            })
            .catch(function (err) {
              postSaeivBridgeMessage({
                type: "saeiv:action_result",
                action: "catalog_request",
                ok: false,
                error: String(err && err.message || err || "Chargement DBUS impossible.")
              });
            });
          return;
        }
        if (type === "saeiv:select_route") {
          var lineUid = String(data.lineUid || "").trim();
          var routeUid = String(data.routeUid || "").trim();
          if (!lineUid || !routeUid) {
            postSaeivBridgeMessage({
              type: "saeiv:action_result",
              action: "select_route",
              ok: false,
              error: "lineUid/routeUid manquants."
            });

        var ids = lanes.inline.slice();
        el.stage.className = "widget-stage";
        el.stage.style.gridTemplateRows = "";
        el.stage.style.gridTemplateColumns = "";

        if (!ids.length) {
          el.stage.classList.add("stage-empty");
          el.stage.innerHTML = "Aucun widget en fenetre integree.";
          stageRenderKey = "";
          return;
        }

        if (ids.length === 1) {
          el.stage.style.gridTemplateRows = "1fr";
          el.stage.style.gridTemplateColumns = "1fr";
          lastStableWazeColWidth = 0;
        } else if (ids.length === 2) {
          var firstType = widgetsById[ids[0]] ? widgetsById[ids[0]].type : "";
          var secondType = widgetsById[ids[1]] ? widgetsById[ids[1]].type : "";
          if (
            (firstType === "waze" && secondType === "saeiv") ||
            (firstType === "saeiv" && secondType === "waze")
          ) {
            var stageWidth = Math.max(1, Number(el.stage.clientWidth) || 1);
            var wazeCol = getStableWazeColumnWidth(stageWidth);
            el.stage.style.gridTemplateRows = "1fr";
            el.stage.style.gridTemplateColumns = firstType === "waze"
              ? (wazeCol + "px 1fr")
              : ("1fr " + wazeCol + "px");
          } else {
            el.stage.style.gridTemplateRows = "1fr";
            el.stage.style.gridTemplateColumns = "repeat(2, minmax(0, 1fr))";
            lastStableWazeColWidth = 0;
          }
        } else {
          el.stage.style.gridTemplateRows = "1fr";
          el.stage.style.gridTemplateColumns = "repeat(" + ids.length + ", minmax(0, 1fr))";
          lastStableWazeColWidth = 0;
        }
        var nextKey = ids.join("|");
        var existingCount = el.stage.querySelectorAll(".pane[data-widget-id]").length;
        if (stageRenderKey === nextKey && existingCount === ids.length) return;

        var existing = Object.create(null);
        Array.prototype.forEach.call(el.stage.querySelectorAll(".pane[data-widget-id]"), function (node) {
          var id = node && node.dataset ? node.dataset.widgetId : "";
          if (!id) return;
          existing[id] = node;
        });

        var frag = document.createDocumentFragment();
        ids.forEach(function (id) {
          var pane = existing[id] || createStagePaneElement(id);
          if (!pane) return;
          frag.appendChild(pane);
        });

        el.stage.innerHTML = "";
        el.stage.appendChild(frag);
        stageRenderKey = nextKey;
      }

      function ensurePipShell(doc) {
        if (!doc.getElementById("idfPipStyle")) {
          var style = doc.createElement("style");
          style.id = "idfPipStyle";
          style.textContent =
            "html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060b14}" +
            ".layout{width:100%;height:100%;display:grid;grid-template-rows:1fr;gap:0}" +
            ".pane{border:0;overflow:hidden;background:#000;min-width:0;min-height:0}" +
            ".pane-frame{width:100%;height:100%;border:0;display:block;background:#000}";
          doc.head.appendChild(style);
        }
        var root = doc.getElementById("idfPipRoot");
        if (!root) {
          root = doc.createElement("main");
          root.id = "idfPipRoot";
          root.className = "layout";
          doc.body.innerHTML = "";
          doc.body.appendChild(root);
        }
        return root;
      }
      function createPipPane(doc, id) {
        var widget = widgetsById[id];
        if (!widget) return null;
        var meta = TYPES[widget.type];
        if (!meta) return null;
        var section = doc.createElement("section");
        section.className = "pane";
        section.dataset.widgetId = id;
        var frame = doc.createElement("iframe");
        frame.className = "pane-frame";
        frame.src = meta.url;
        frame.title = meta.label;
        frame.setAttribute("frameborder", "0");
        section.appendChild(frame);
        return section;
      }
      function syncPipPaneSource(pane, id) {
        var widget = widgetsById[id];
        if (!pane || !widget) return;
        var meta = TYPES[widget.type];
        if (!meta) return;
        pane.dataset.widgetId = id;
        var frame = pane.querySelector("iframe.pane-frame");
        if (!frame) {
          frame = pane.ownerDocument.createElement("iframe");
          frame.className = "pane-frame";
          frame.setAttribute("frameborder", "0");
          pane.appendChild(frame);
        }
        if (frame.dataset.widgetType !== widget.type) {
          frame.src = meta.url;
          frame.dataset.widgetType = widget.type;
        }
        frame.title = meta.label;
      }
      function renderPip(win, ids) {
        var doc = win.document;
        doc.documentElement.lang = "fr";
        doc.title = "PIP";
        var root = ensurePipShell(doc);
        root.style.gap = String(PIP_PANE_GAP_PX) + "px";
        if (ids.length > 1) {
          var ratioCols = ids.map(function (id) {
            var widget = widgetsById[id];
            if (!widget) return "1fr";
            return typeAspectRatio(widget.type).toFixed(4) + "fr";
          });
          root.style.gridTemplateColumns = ratioCols.join(" ");
        } else {
          root.style.gridTemplateColumns = "repeat(" + Math.max(1, ids.length) + ", minmax(0, 1fr))";
        }

        var keep = Object.create(null);
        ids.forEach(function (id) { keep[id] = true; });
        Array.prototype.forEach.call(root.querySelectorAll(".pane[data-widget-id]"), function (node) {
          var id = node && node.dataset ? node.dataset.widgetId : "";
          if (!id || keep[id]) return;
          if (node.parentNode) node.parentNode.removeChild(node);
        });

        var byId = Object.create(null);
        Array.prototype.forEach.call(root.querySelectorAll(".pane[data-widget-id]"), function (node) {
          var nodeId = node && node.dataset ? node.dataset.widgetId : "";
          if (!nodeId) return;
          byId[nodeId] = node;
        });

        ids.forEach(function (id, index) {
          var pane = byId[id] || createPipPane(doc, id);
          if (!pane) return;
          syncPipPaneSource(pane, id);
          var currentAtIndex = root.children[index];
          if (currentAtIndex !== pane) root.insertBefore(pane, currentAtIndex || null);
        });
      }

      function bindPipResize(win) {
        if (!win || win.__idfResizeBound) return;
        win.__idfResizeBound = true;
        // Ne pas rerendre au resize: sinon certains navigateurs peuvent recharger les iframes.
        win.addEventListener("resize", function () {});
      }

      function syncTabs(notes) {
        if (!isOutputEnabled("tab")) {
          lanes.tab.slice().forEach(function (id) { forceInline(id); });
          Object.keys(tabRefs).forEach(function (id) {
            var ref = tabRefs[id];
            if (ref && !ref.closed) {
              try { ref.close(); } catch (err) {}
            }
            delete tabRefs[id];
          });
          return;
        }
        var wanted = Object.create(null);
        lanes.tab.forEach(function (id) { wanted[id] = true; });

        Object.keys(tabRefs).forEach(function (id) {
          if (wanted[id]) return;
          var ref = tabRefs[id];
          if (ref && !ref.closed) {
            try { ref.close(); } catch (err) {}
          }
          delete tabRefs[id];
        });

        lanes.tab.slice().forEach(function (id) {
          var widget = widgetsById[id];
          if (!widget) return;
          var current = tabRefs[id];
          if (current && !current.closed) return;
          var opened = null;
          try { opened = window.open(TYPES[widget.type].url, "idf_game_tab_" + id); } catch (err) {}
          if (opened) {
            tabRefs[id] = opened;
            syncExternalTelemetryBlocks();
          } else {
            notes.push("Popup bloquee pour " + widgetName(id));
            forceInline(id);
          }
        });
      }

      function syncPip(notes) {
        if (!isOutputEnabled("pip")) {
          lanes.pip.slice().forEach(function (id) { forceInline(id); });
          if (pipWindow) {
            try { pipWindow.close(); } catch (err0) {}
          }
          pipWindow = null;
          pipActiveIds = [];
          return Promise.resolve();
        }
        var ids = lanes.pip.slice();
        if (!ids.length) {
          if (pipWindow) {
            try { pipWindow.close(); } catch (err) {}
          }
          pipWindow = null;
          pipActiveIds = [];
          return Promise.resolve();
        }

        var dpi = window.documentPictureInPicture;
        if (!dpi || typeof dpi.requestWindow !== "function") {
          notes.push("Document Picture-in-Picture non supporte sur ce navigateur.");
          ids.forEach(forceInline);
          return Promise.resolve();
        }

        if (pipWindow && pipWindow.closed) pipWindow = null;

        var pipTargetHeight = ids.length > 1 ? 760 : (ids[0] && widgetsById[ids[0]] && widgetsById[ids[0]].type === "waze" ? 940 : 620);
        var pipTargetWidth = 980;
        if (ids.length > 1) {
          var totalRatio = 0;
          ids.forEach(function (id) {
            var widget = widgetsById[id];
            if (!widget) return;
            totalRatio += typeAspectRatio(widget.type);
          });
          pipTargetWidth = Math.round((pipTargetHeight * Math.max(1, totalRatio)) + (PIP_PANE_GAP_PX * Math.max(0, ids.length - 1)));
        } else if (ids[0] && widgetsById[ids[0]]) {
          var singleRatio = typeAspectRatio(widgetsById[ids[0]].type);
          pipTargetWidth = Math.round(pipTargetHeight * singleRatio);
        }

        var openPromise = pipWindow
          ? Promise.resolve(pipWindow)
          : dpi.requestWindow({
              width: pipTargetWidth,
              height: pipTargetHeight
            }).then(function (win) {
              pipWindow = win;
              bindPipResize(win);
              win.addEventListener("pagehide", function () {
                pipWindow = null;
                if (pipActiveIds.length) {
                  pipActiveIds.forEach(forceInline);
                  pipActiveIds = [];
                }
                if (!applying) apply();
              });
              return win;
            }, function () {
              notes.push("Ouverture PIP refusee ou bloquee.");
              ids.forEach(forceInline);
              return null;
            });

        return openPromise.then(function (win) {
          if (!win) return;
          pipActiveIds = ids.slice();
          try { renderPip(win, ids); } catch (err) { notes.push("Erreur de rendu PIP."); }
          syncExternalTelemetryBlocks();
        });
      }

      function renderLists() {
        OUTPUTS.forEach(function (output) {
          var listEl = getListEl(output);
          if (!listEl) return;
          listEl.innerHTML = "";
          var ids = lanes[output];
          if (!ids.length) {
            var empty = document.createElement("div");
            empty.className = "output-empty";
            empty.textContent = "Aucun widget";
            listEl.appendChild(empty);
            return;
          }

          ids.forEach(function (id) {
            var item = document.createElement("div");
            item.className = "output-widget";
            item.draggable = false;
            item.dataset.widgetId = id;
            item.dataset.output = output;

            var name = document.createElement("span");
            name.textContent = widgetName(id);

            var close = document.createElement("button");
            close.type = "button";
            close.className = "widget-close";
            close.textContent = "x";
            close.setAttribute("aria-label", "Retirer " + widgetName(id));

            item.appendChild(name);
            item.appendChild(close);
            listEl.appendChild(item);
          });
        });
      }

      function getDropIndex(listEl, event, draggedId, sourceOutput, targetOutput) {
        var all = Array.prototype.slice.call(listEl.querySelectorAll(".output-widget"));
        var cards = all.filter(function (node) {
          if (sourceOutput === targetOutput && node.dataset.widgetId === draggedId) return false;
          return true;
        });
        if (!cards.length) return 0;

        var hit = document.elementFromPoint(event.clientX, event.clientY);
        var card = hit && hit.closest ? hit.closest(".output-widget") : null;
        if (card && listEl.contains(card)) {
          var idx = cards.indexOf(card);
          if (idx < 0) return cards.length;
          var rect = card.getBoundingClientRect();
          var before = event.clientX < (rect.left + rect.width / 2);
          return before ? idx : idx + 1;
        }
        return cards.length;
      }

      function clearDropStyles() {
        OUTPUTS.forEach(function (output) {
          var listEl = getListEl(output);
          if (!listEl) return;
          listEl.classList.remove("is-over");
        });
      }

      function getOutputListFromPoint(x, y) {
        var hit = document.elementFromPoint(x, y);
        if (!hit || !hit.closest) return null;
        return hit.closest(".output-list");
      }

      function finishPointerDrag(commitMove) {
        var state = pointerDragState;
        pointerDragState = null;
        if (!state) return;
        if (state.card) state.card.classList.remove("dragging");
        clearDropStyles();

        if (!commitMove || !state.moved || !state.id || !state.src) return;
        var targetList = getOutputListFromPoint(state.lastX, state.lastY);
        if (!targetList || !targetList.dataset || !targetList.dataset.output) return;
        var targetOutput = targetList.dataset.output;
        var idx = getDropIndex(
          targetList,
          { clientX: state.lastX, clientY: state.lastY },
          state.id,
          state.src,
          targetOutput
        );
        if (!moveWidget(state.id, targetOutput, idx)) return;
        apply();
      }

      function bindDndFor(output) {
        var listEl = getListEl(output);
        if (!listEl) return;

        listEl.addEventListener("dragstart", function (event) {
          finishPointerDrag(false);
          var card = event.target && event.target.closest(".output-widget");
          if (!card) return;
          var id = card.dataset.widgetId;
          var src = card.dataset.output;
          if (!id || !src) return;
          dragState = { id: id, src: src };
          card.classList.add("dragging");
          try {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", JSON.stringify(dragState));
          } catch (err) {}
        });

        listEl.addEventListener("dragend", function () {
          dragState = null;
          clearDropStyles();
          Array.prototype.forEach.call(document.querySelectorAll(".output-widget.dragging"), function (node) {
            node.classList.remove("dragging");
          });
        });

        listEl.addEventListener("dragover", function (event) {
          if (!dragState) return;
          event.preventDefault();
          try { event.dataTransfer.dropEffect = "move"; } catch (err) {}
          listEl.classList.add("is-over");
        });

        listEl.addEventListener("dragleave", function (event) {
          var rel = event.relatedTarget;
          if (rel && listEl.contains(rel)) return;
          listEl.classList.remove("is-over");
        });

        listEl.addEventListener("drop", function (event) {
          event.preventDefault();
          listEl.classList.remove("is-over");

          var payload = dragState;
          if (!payload) {
            try { payload = JSON.parse(event.dataTransfer.getData("text/plain")); }
            catch (err) { payload = null; }
          }
          if (!payload || !payload.id) return;
          var targetOutput = listEl.dataset.output;
          var idx = getDropIndex(listEl, event, payload.id, payload.src, targetOutput);
          if (!moveWidget(payload.id, targetOutput, idx)) return;
          apply();
        });
      }

      function apply() {
        if (applying) return;
        applying = true;
        applyOutputVisibility();
        enforceOutputModeConstraints();
        enforceWidgetsAllowedForCurrentMode();
        enforceSingleWidgetPerCategory();
        ensureModeDefaultWidgetSelection();
        sanitize();
        refreshWidgetTypeSelectors();
        renderLists();

        var notes = [];
        syncTabs(notes);
        sanitize();
        refreshWidgetTypeSelectors();
        renderLists();

        syncPip(notes).then(function () {
          sanitize();
          refreshWidgetTypeSelectors();
          renderLists();
          renderStage();
          saveWidgetLayoutState();
          applying = false;
        }, function () {
          saveWidgetLayoutState();
          applying = false;
        });
      }

      function applyWidgetSelectorsFromUi() {
        if (syncingWidgetTypeSelectors) return;
        var changed = false;
        changed = applyWidgetSelectionForGroup(GPS_WIDGET_TYPES, el.widgetGpsSelect && el.widgetGpsSelect.value) || changed;
        changed = applyWidgetSelectionForGroup(HUD_WIDGET_TYPES, el.widgetHudSelect && el.widgetHudSelect.value) || changed;
        if (!changed) {
          refreshWidgetTypeSelectors();
          return;
        }
        if (widgetSelectorApplyTimer) {
          clearTimeout(widgetSelectorApplyTimer);
          widgetSelectorApplyTimer = 0;
        }
        widgetSelectorApplyTimer = setTimeout(function () {
          widgetSelectorApplyTimer = 0;
          apply();
        }, 0);
      }
      function getOverlayTypeDefaults(type) {
        var index = 0;
        var keys = ["waze", "saeiv", "saeiv_mini"];
        for (var i = 0; i < keys.length; i += 1) {
          if (keys[i] === type) {
            index = i;
            break;
          }
        }
        var baseX = scaleUiSize(26 + (index * 34));
        var baseY = scaleUiSize(62 + (index * 28));
        var ratio = typeAspectRatio(type);
        if (type === "waze") {
          var wazeDefaultWidth = scaleWidgetSize(scaleUiSize(360));
          var wazeMinWidth = scaleWidgetSize(scaleUiSize(140));
          return {
            x: baseX,
            y: baseY,
            width: wazeDefaultWidth,
            height: Math.round(wazeDefaultWidth / ratio),
            minWidth: wazeMinWidth,
            minHeight: Math.round(wazeMinWidth / ratio)
          };
        }
        if (type === "saeiv_mini") {
          var miniDefaultWidth = scaleWidgetSize(scaleUiSize(720));
          var miniDefaultHeight = scaleWidgetSize(scaleUiSize(420));
          return {
            x: baseX,
            y: baseY,
            width: miniDefaultWidth,
            height: miniDefaultHeight,
            minWidth: scaleWidgetSize(scaleUiSize(220)),
            minHeight: scaleWidgetSize(scaleUiSize(120))
          };
        }
        var hudDefaultWidth = scaleWidgetSize(scaleUiSize(720));
        var hudMinWidth = scaleWidgetSize(scaleUiSize(260));
        return {
          x: baseX,
          y: baseY,
          width: hudDefaultWidth,
          height: Math.round(hudDefaultWidth / ratio),
          minWidth: hudMinWidth,
          minHeight: Math.round(hudMinWidth / ratio)
        };
      }

      function clampOverlayRect(state, minWidth, minHeight) {
        var viewportWidth = Math.max(240, Number(window.innerWidth) || 0);
        var viewportHeight = Math.max(180, Number(window.innerHeight) || 0);
        var minW = Math.max(120, Number(minWidth) || 120);
        var minH = Math.max(80, Number(minHeight) || 80);

        state.width = Math.max(minW, Math.min(Number(state.width) || minW, viewportWidth));
        state.height = Math.max(minH, Math.min(Number(state.height) || minH, viewportHeight));

        state.x = Number(state.x) || 0;
        state.y = Number(state.y) || 0;

        if (state.x + state.width > viewportWidth) state.x = Math.max(0, viewportWidth - state.width);
        if (state.y + state.height > viewportHeight) state.y = Math.max(0, viewportHeight - state.height);
        if (state.x < 0) state.x = 0;
        if (state.y < 0) state.y = 0;
      }

      function clampWidgetRect(state, type) {
        var safeType = normalizeWidgetType(type);
        if (!state || !isType(safeType)) return;
        var defaults = getOverlayTypeDefaults(safeType);
        var lockRatio = isAspectRatioLocked(safeType);
        var ratio = typeAspectRatio(safeType);
        var viewportWidth = Math.max(240, Number(window.innerWidth) || 0);
        var viewportHeight = Math.max(180, Number(window.innerHeight) || 0);
        var topInset = Math.max(0, Number(OVERLAY_WIDGET_TITLEBAR_HEIGHT) || 0) + 4;
        var maxContentHeight = Math.max(80, viewportHeight - topInset);
        var minWidth = Math.max(120, Number(defaults.minWidth) || 120);
        var minHeight = Math.max(80, Number(defaults.minHeight) || 80);
        var width = Number(state.width);
        var height = Number(state.height);
        if (lockRatio) {
          var effectiveMinWidth = Math.max(minWidth, minHeight * ratio);
          var maxWidth = Math.min(viewportWidth, maxContentHeight * ratio);
          if (!Number.isFinite(maxWidth) || maxWidth <= 0) maxWidth = effectiveMinWidth;
          if (maxWidth < effectiveMinWidth) effectiveMinWidth = maxWidth;

          if (!Number.isFinite(width) || width <= 0) {
            if (Number.isFinite(height) && height > 0) width = height * ratio;
          }
          if (!Number.isFinite(width) || width <= 0) width = Number(defaults.width) || effectiveMinWidth;
          width = Math.max(effectiveMinWidth, Math.min(width, maxWidth));
          state.width = width;
          state.height = width / ratio;
        } else {
          var maxWidthFree = viewportWidth;
          var maxHeightFree = maxContentHeight;
          if (!Number.isFinite(width) || width <= 0) width = Number(defaults.width) || minWidth;
          if (!Number.isFinite(height) || height <= 0) height = Number(defaults.height) || minHeight;
          state.width = Math.max(minWidth, Math.min(width, maxWidthFree));
          state.height = Math.max(minHeight, Math.min(height, maxHeightFree));
        }
        state.x = Number(state.x) || 0;
        state.y = Number(state.y) || 0;
        var minY = topInset;

        if (state.x + state.width > viewportWidth) state.x = Math.max(0, viewportWidth - state.width);
        if (state.y + state.height > viewportHeight) state.y = Math.max(minY, viewportHeight - state.height);
        if (state.x < 0) state.x = 0;
        if (state.y < minY) state.y = minY;
      }

      function bumpOverlayZ() {
        nextOverlayZ += 1;
        if (!Number.isFinite(nextOverlayZ) || nextOverlayZ > 2147000000) nextOverlayZ = 50;
        return nextOverlayZ;
      }

      function ensureWindowState(type) {
        var safeType = normalizeWidgetType(type);
        if (!isType(safeType)) return null;
        var state = windowsByType[safeType];
        if (!state || typeof state !== "object") {
          var defaults = getOverlayTypeDefaults(safeType);
          state = {
            x: defaults.x,
            y: defaults.y,
            width: defaults.width,
            height: defaults.height,
            z: bumpOverlayZ()
          };
          windowsByType[safeType] = state;
        }
        clampWidgetRect(state, safeType);
        if (!Number.isFinite(Number(state.z))) state.z = bumpOverlayZ();
        return state;
      }

      function bringManagerToFront() {
        managerState.z = bumpOverlayZ();
        renderManager();
      }

      function bringWidgetTypeToFront(type) {
        var state = ensureWindowState(type);
        if (!state) return;
        state.z = bumpOverlayZ();
        var node = windowNodeByType[type];
        if (node) node.style.zIndex = String(state.z);
      }

      function applyOverlayWindowStateToNode(node, state) {
        if (!node || !state) return;
        var safeType = normalizeWidgetType(node.dataset ? node.dataset.widgetType : "");
        if (isType(safeType)) {
          if (isAspectRatioLocked(safeType)) {
            node.style.aspectRatio = String(typeAspectRatio(safeType));
          } else {
            node.style.removeProperty("aspect-ratio");
          }
        }
        node.style.left = Math.round(state.x) + "px";
        node.style.top = Math.round(state.y) + "px";
        node.style.width = Math.round(state.width) + "px";
        node.style.height = Math.round(state.height) + "px";
        node.style.zIndex = String(Math.max(1, Math.round(Number(state.z) || 1)));
      }

      function getInlineActiveTypes() {
        var seenTypes = Object.create(null);
        var out = [];
        (lanes.inline || []).forEach(function (id) {
          var widget = widgetsById[id];
          var type = normalizeWidgetType(widget && widget.type);
          if (!isType(type) || seenTypes[type]) return;
          seenTypes[type] = true;
          out.push(type);
        });
        return out;
      }

      function sanitize() {
        var nextInline = [];
        var seenIds = Object.create(null);
        var seenTypes = Object.create(null);
        (lanes.inline || []).forEach(function (id) {
          if (seenIds[id]) return;
          var widget = widgetsById[id];
          var type = normalizeWidgetType(widget && widget.type);
          if (!widget || !isType(type) || seenTypes[type]) return;
          seenIds[id] = true;
          seenTypes[type] = true;
          nextInline.push(id);
        });
        Object.keys(widgetsById).forEach(function (id) {
          if (seenIds[id]) return;
          var widget = widgetsById[id];
          var type = normalizeWidgetType(widget && widget.type);
          if (!widget || !isType(type) || seenTypes[type]) return;
          seenIds[id] = true;
          seenTypes[type] = true;
          nextInline.push(id);
        });
        lanes = { inline: nextInline, tab: [], pip: [] };
      }

      function saveWidgetLayoutState() {
        sanitize();
        var state = {
          version: 4,
          nextId: Math.max(1, Number(nextId) || 1),
          activeTypes: getInlineActiveTypes(),
          windowsByType: {},
          manager: {
            x: managerState.x,
            y: managerState.y,
            width: managerState.width,
            height: managerState.height,
            z: managerState.z,
            visible: managerState.visible !== false
          }
        };

        Object.keys(windowsByType).forEach(function (type) {
          var safeType = normalizeWidgetType(type);
          if (!isType(safeType)) return;
          var src = ensureWindowState(safeType);
          if (!src) return;
          state.windowsByType[safeType] = {
            x: src.x,
            y: src.y,
            width: src.width,
            height: src.height,
            z: src.z
          };
        });

        try { localStorage.setItem(WIDGET_LAYOUT_STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
        try {
          localStorage.setItem(OVERLAY_MANAGER_STORAGE_KEY, JSON.stringify({
            x: managerState.x,
            y: managerState.y,
            width: managerState.width,
            height: managerState.height,
            z: managerState.z,
            visible: managerState.visible !== false
          }));
        } catch (err2) {}
      }

      function restoreWidgetLayoutState() {
        var raw = "";
        try { raw = String(localStorage.getItem(WIDGET_LAYOUT_STORAGE_KEY) || ""); } catch (err0) { raw = ""; }
        var parsed = null;
        if (raw) {
          try { parsed = JSON.parse(raw); } catch (err1) { parsed = null; }
        }

        widgetsById = Object.create(null);
        lanes = { inline: [], tab: [], pip: [] };
        windowsByType = Object.create(null);
        windowNodeByType = Object.create(null);
        nextId = 1;

        var parsedVersion = Number(parsed && parsed.version);
        if (!parsed || typeof parsed !== "object" || (parsedVersion !== 3 && parsedVersion !== 4)) {
          return false;
        }

        var activeTypes = Array.isArray(parsed.activeTypes) ? parsed.activeTypes : [];
        activeTypes.forEach(function (typeRaw) {
          var type = normalizeWidgetType(typeRaw);
          if (!isType(type)) return;
          var id = createWidget(type);
          if (!id) return;
          lanes.inline.push(id);
        });

        var parsedWindows = parsed.windowsByType && typeof parsed.windowsByType === "object" ? parsed.windowsByType : {};
        Object.keys(parsedWindows).forEach(function (typeRaw) {
          var type = normalizeWidgetType(typeRaw);
          if (!isType(type)) return;
          var src = parsedWindows[typeRaw] && typeof parsedWindows[typeRaw] === "object" ? parsedWindows[typeRaw] : null;
          if (!src) return;
          windowsByType[type] = {
            x: Number(src.x),
            y: Number(src.y),
            width: Number(src.width),
            height: Number(src.height),
            z: Number(src.z)
          };
          if (parsedVersion === 3) {
            windowsByType[type].width = scaleWidgetSize(windowsByType[type].width);
            windowsByType[type].height = scaleWidgetSize(windowsByType[type].height);
          }
          clampWidgetRect(windowsByType[type], type);
          if (!Number.isFinite(Number(windowsByType[type].z))) windowsByType[type].z = bumpOverlayZ();
        });

        var parsedNextId = Math.floor(Number(parsed.nextId));
        if (Number.isFinite(parsedNextId) && parsedNextId > 0) nextId = parsedNextId;

        if (parsed.manager && typeof parsed.manager === "object") {
          managerState.x = Number(parsed.manager.x);
          managerState.y = Number(parsed.manager.y);
          managerState.width = Number(parsed.manager.width);
          managerState.height = Number(parsed.manager.height);
          managerState.z = Number(parsed.manager.z);
          managerState.visible = parsed.manager.visible !== false;
        } else {
          var managerRaw = "";
          try { managerRaw = String(localStorage.getItem(OVERLAY_MANAGER_STORAGE_KEY) || ""); } catch (err2) { managerRaw = ""; }
          if (managerRaw) {
            var managerParsed = null;
            try { managerParsed = JSON.parse(managerRaw); } catch (err3) { managerParsed = null; }
            if (managerParsed && typeof managerParsed === "object") {
              managerState.x = Number(managerParsed.x);
              managerState.y = Number(managerParsed.y);
              managerState.width = Number(managerParsed.width);
              managerState.height = Number(managerParsed.height);
              managerState.z = Number(managerParsed.z);
              managerState.visible = managerParsed.visible !== false;
            }
          }
        }

        clampOverlayRect(managerState, OVERLAY_MANAGER_MIN_WIDTH, OVERLAY_MANAGER_MIN_HEIGHT);
        if (!Number.isFinite(Number(managerState.z))) managerState.z = 1200;
        sanitize();
        return true;
      }

      function createOverlayWindowNode(type) {
        var meta = TYPES[type];
        if (!meta || !el.overlayWorkspace) return null;
        var section = document.createElement("section");
        section.className = "overlay-window";
        section.dataset.widgetType = type;
        section.setAttribute("aria-label", meta.label);

        var titlebar = document.createElement("header");
        titlebar.className = "overlay-window-titlebar";
        titlebar.dataset.role = "drag";
        var title = document.createElement("span");
        title.className = "overlay-window-title";
        title.textContent = meta.label;
        var actions = document.createElement("div");
        actions.className = "overlay-window-actions";
        var closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "overlay-window-btn is-danger";
        closeBtn.textContent = "x";
        closeBtn.setAttribute("aria-label", "Fermer " + meta.label);
        closeBtn.dataset.role = "close";
        actions.appendChild(closeBtn);
        titlebar.appendChild(title);
        titlebar.appendChild(actions);

        var content = document.createElement("div");
        content.className = "overlay-window-content";
        var frame = document.createElement("iframe");
        frame.className = "overlay-window-frame";
        frame.src = meta.url;
        frame.title = meta.label;
        frame.setAttribute("frameborder", "0");
        frame.dataset.widgetType = type;
        content.appendChild(frame);

        var resizeHandle = document.createElement("div");
        resizeHandle.className = "overlay-window-resize";
        resizeHandle.dataset.role = "resize";

        section.appendChild(titlebar);
        section.appendChild(content);
        section.appendChild(resizeHandle);

        section.addEventListener("pointerdown", function () {
          bringWidgetTypeToFront(type);
          saveWidgetLayoutState();
        });
        closeBtn.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          var id = findWidgetIdByType(type);
          if (!id) return;
          removeWidget(id);
          apply();
        });
        titlebar.addEventListener("pointerdown", function (event) {
          if (event.button !== 0) return;
          if (event.target && event.target.closest && event.target.closest("[data-role='close']")) return;
          bringWidgetTypeToFront(type);
          var state = ensureWindowState(type);
          if (!state) return;
          activeOverlayDrag = {
            pointerId: event.pointerId,
            mode: "move",
            type: type,
            startX: event.clientX,
            startY: event.clientY,
            originX: state.x,
            originY: state.y,
            originWidth: state.width,
            originHeight: state.height
          };
          try { titlebar.setPointerCapture(event.pointerId); } catch (err) {}
          event.preventDefault();
        });
        resizeHandle.addEventListener("pointerdown", function (event) {
          if (event.button !== 0) return;
          bringWidgetTypeToFront(type);
          var state = ensureWindowState(type);
          if (!state) return;
          activeOverlayDrag = {
            pointerId: event.pointerId,
            mode: "resize",
            type: type,
            startX: event.clientX,
            startY: event.clientY,
            originX: state.x,
            originY: state.y,
            originWidth: state.width,
            originHeight: state.height
          };
          try { resizeHandle.setPointerCapture(event.pointerId); } catch (err) {}
          event.preventDefault();
          event.stopPropagation();
        });
        return section;
      }

      function renderManager() {
        if (!el.overlayManager) return;
        var managerHidden = telemetryUiMode !== 1;
        managerState.visible = !managerHidden;
        document.body.classList.toggle("is-telemetry-mode-1", telemetryUiMode === 1);
        document.body.classList.toggle("is-manager-hidden", managerHidden);
        clampOverlayRect(managerState, OVERLAY_MANAGER_MIN_WIDTH, OVERLAY_MANAGER_MIN_HEIGHT);
        el.overlayManager.style.left = Math.round(managerState.x) + "px";
        el.overlayManager.style.top = Math.round(managerState.y) + "px";
        el.overlayManager.style.width = Math.round(managerState.width) + "px";
        el.overlayManager.style.height = Math.round(managerState.height) + "px";
        el.overlayManager.style.zIndex = String(Math.max(1, Number(managerState.z) || 1));
        el.overlayManager.style.display = managerHidden ? "none" : "";
      }

      function refreshManagerUi() {
        var active = Object.create(null);
        getInlineActiveTypes().forEach(function (type) {
          active[type] = true;
        });
        var inputs = document.querySelectorAll("input[data-widget-type]");
        Array.prototype.forEach.call(inputs, function (input) {
          var type = normalizeWidgetType(input && input.dataset ? input.dataset.widgetType : "");
          if (!isType(type)) return;
          input.checked = !!active[type];
        });
      }

      function ensureWidgetTypeEnabled(type, enabled) {
        var safeType = normalizeWidgetType(type);
        if (!isType(safeType)) return false;
        var currentId = findWidgetIdByType(safeType);
        if (enabled) {
          if (currentId) {
            if (!findOutputByWidgetId(currentId)) {
              lanes.inline.push(currentId);
              return true;
            }
            return false;
          }
          var created = createWidget(safeType);
          if (!created) return false;
          lanes.inline.push(created);
          return true;
        }
        if (!currentId) return false;
        removeWidget(currentId);
        return true;
      }

      function normalizeOverlayStateForViewport() {
        Object.keys(windowsByType).forEach(function (type) {
          var safeType = normalizeWidgetType(type);
          if (!isType(safeType)) return;
          var state = ensureWindowState(safeType);
          if (!state) return;
          clampWidgetRect(state, safeType);
        });
        clampOverlayRect(managerState, OVERLAY_MANAGER_MIN_WIDTH, OVERLAY_MANAGER_MIN_HEIGHT);
      }

      function renderStage() {
        if (!el.overlayWorkspace) return;
        sanitize();
        var activeTypes = getInlineActiveTypes();
        var keep = Object.create(null);
        activeTypes.forEach(function (type) {
          keep[type] = true;
        });

        Object.keys(windowNodeByType).forEach(function (type) {
          if (keep[type]) return;
          var node = windowNodeByType[type];
          if (node && node.parentNode) node.parentNode.removeChild(node);
          delete windowNodeByType[type];
        });

        activeTypes.forEach(function (type) {
          var state = ensureWindowState(type);
          if (!state) return;
          var node = windowNodeByType[type];
          if (!node) {
            node = createOverlayWindowNode(type);
            if (!node) return;
            windowNodeByType[type] = node;
            el.overlayWorkspace.appendChild(node);
          }
          var frame = node.querySelector("iframe.overlay-window-frame");
          if (frame && frame.dataset.widgetType !== type) {
            frame.src = TYPES[type].url;
            frame.dataset.widgetType = type;
          }
          applyOverlayWindowStateToNode(node, state);
        });
      }

      function renderLists() {}
      function syncTabs() {}
      function syncPip() {
        return Promise.resolve();
      }
      function applyOutputVisibility() {}
      function enforceOutputModeConstraints() {}
      function applyModeWidgetTypeLists() {
        GPS_WIDGET_TYPES = ["waze"];
        HUD_WIDGET_TYPES = ["saeiv", "saeiv_mini"];
      }
      function refreshModeButtonsUi() {}
      function refreshModeWidgetToolbarUi() {}
      function refreshWidgetTypeSelectors() {}
      function enforceWidgetsAllowedForCurrentMode() { return false; }
      function ensureModeDefaultWidgetSelection() { return false; }
      function applyWidgetSelectorsFromUi() {}
      function setGameMode(mode, options) {
        currentGameMode = GAME_MODES.BUS;
        applyModeWidgetTypeLists(currentGameMode);
        var opts = options && typeof options === "object" ? options : {};
        if (opts.persist !== false) writeStoredGameMode(currentGameMode);
      }

      function resolveTelemetryDotState() {
        var wsOpen = !!(telemetryWs && telemetryWs.readyState === WebSocket.OPEN);
        if (!wsOpen) return "offline";
        var lastPacketAt = Number(telemetryLastPacketAt);
        if (Number.isFinite(lastPacketAt) && lastPacketAt > 0) {
          var ageMs = Date.now() - lastPacketAt;
          if (Number.isFinite(ageMs) && ageMs <= Math.max(600, Number(TELEMETRY_PACKET_TIMEOUT_MS) || 2000)) {
            return "online";
          }
        }
        return "checking";
      }

      function setTelemetryConnectionState(isConnected, reason) {
        var nextConnected = !!isConnected;
        telemetryConnected = nextConnected;
        telemetryLastErrorReason = telemetryConnected ? "" : String(reason || "Connexion indisponible.");
        telemetryOfflineLock = !telemetryConnected;
        setTelemetryDotState(resolveTelemetryDotState());
        if (el.telemetryErrorOverlay) el.telemetryErrorOverlay.hidden = true;
        document.body.classList.remove("is-telemetry-blocked");
        syncExternalTelemetryBlocks();
      }

      function apply() {
        if (applying) return;
        applying = true;
        sanitize();
        normalizeOverlayStateForViewport();
        renderStage();
        renderManager();
        refreshManagerUi();
        saveWidgetLayoutState();
        applying = false;
      }

      function startOverlayInteractionBindings() {
        if (el.overlayManager) {
          el.overlayManager.addEventListener("pointerdown", function () {
            bringManagerToFront();
            saveWidgetLayoutState();
          });
        }
        if (el.overlayManagerTitlebar) {
          el.overlayManagerTitlebar.addEventListener("pointerdown", function (event) {
            if (event.button !== 0) return;
            if (event.target && event.target.closest && event.target.closest("button")) return;
            bringManagerToFront();
            activeOverlayDrag = {
              pointerId: event.pointerId,
              mode: "manager-move",
              type: "__manager__",
              startX: event.clientX,
              startY: event.clientY,
              originX: managerState.x,
              originY: managerState.y,
              originWidth: managerState.width,
              originHeight: managerState.height
            };
            try { el.overlayManagerTitlebar.setPointerCapture(event.pointerId); } catch (err) {}
            event.preventDefault();
          });
        }
        if (el.overlayResetLayoutBtn) {
          el.overlayResetLayoutBtn.addEventListener("click", function (event) {
            event.preventDefault();
            windowsByType = Object.create(null);
            managerState = {
              x: scaleUiSize(18),
              y: scaleUiSize(18),
              width: scaleUiSize(320),
              height: scaleUiSize(330),
              z: bumpOverlayZ(),
              visible: true
            };
            apply();
          });
        }

        var toggles = document.querySelectorAll("input[data-widget-type]");
        Array.prototype.forEach.call(toggles, function (input) {
          input.addEventListener("change", function () {
            var type = normalizeWidgetType(input && input.dataset ? input.dataset.widgetType : "");
            if (!isType(type)) return;
            ensureWidgetTypeEnabled(type, !!input.checked);
            if (input.checked) {
              var state = ensureWindowState(type);
              if (state) state.z = bumpOverlayZ();
            }
            apply();
          });
        });

        window.addEventListener("keydown", function (event) {
          if (!telemetryConnected && event.key === "Enter") {
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener("pointermove", function (event) {
          if (!activeOverlayDrag) return;
          if (event.pointerId !== activeOverlayDrag.pointerId) return;
          var dx = event.clientX - activeOverlayDrag.startX;
          var dy = event.clientY - activeOverlayDrag.startY;
          if (activeOverlayDrag.mode === "manager-move") {
            managerState.x = activeOverlayDrag.originX + dx;
            managerState.y = activeOverlayDrag.originY + dy;
            clampOverlayRect(managerState, OVERLAY_MANAGER_MIN_WIDTH, OVERLAY_MANAGER_MIN_HEIGHT);
            renderManager();
            event.preventDefault();
            return;
          }
          var type = normalizeWidgetType(activeOverlayDrag.type);
          var state = ensureWindowState(type);
          if (!state) return;
          if (activeOverlayDrag.mode === "move") {
            state.x = activeOverlayDrag.originX + dx;
            state.y = activeOverlayDrag.originY + dy;
          } else if (activeOverlayDrag.mode === "resize") {
            if (isAspectRatioLocked(type)) {
              var ratio = typeAspectRatio(type);
              var widthFromDx = activeOverlayDrag.originWidth + dx;
              var widthFromDy = (activeOverlayDrag.originHeight + dy) * ratio;
              var nextWidth = Math.abs(dy) > Math.abs(dx) ? widthFromDy : widthFromDx;
              if (!Number.isFinite(nextWidth) || nextWidth <= 0) {
                nextWidth = activeOverlayDrag.originWidth;
              }
              state.width = nextWidth;
              state.height = nextWidth / ratio;
            } else {
              state.width = activeOverlayDrag.originWidth + dx;
              state.height = activeOverlayDrag.originHeight + dy;
            }
          }
          clampWidgetRect(state, type);
          var node = windowNodeByType[type];
          if (node) applyOverlayWindowStateToNode(node, state);
          event.preventDefault();
        });

        function endOverlayDrag() {
          if (!activeOverlayDrag) return;
          activeOverlayDrag = null;
          saveWidgetLayoutState();
        }
        window.addEventListener("pointerup", endOverlayDrag);
        window.addEventListener("pointercancel", endOverlayDrag);
        window.addEventListener("blur", endOverlayDrag);
        window.addEventListener("resize", function () {
          normalizeOverlayStateForViewport();
          renderStage();
          renderManager();
          saveWidgetLayoutState();
        });
      }

      currentGameMode = readStoredGameMode();
      setGameMode(currentGameMode, { persist: false, apply: false });
      startGameSingletonGuard();
      restoreWidgetLayoutState();
      startOverlayInteractionBindings();
      ensureDbusDataLoaded().catch(function () {});
      ensureNavGraphLoaded().catch(function () {});
      ensureNavStopLinksLoaded().catch(function () {});
      ensureNavBridgesLoaded().catch(function () {});
      startTelemetryConnectionWatch();
      apply();
    })();
  </script>
</body>
</html>

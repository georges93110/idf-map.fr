<!doctype html><html><head><meta charset="utf-8"><title>SAEIV native texture</title>
<style>html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;background:#071944}iframe{display:block}</style></head><body>
<script>
const agora=new URLSearchParams(location.search).get("style")==="agora";
if(agora)document.documentElement.style.background=document.body.style.background="transparent";
window.IDFSaeivTexture={ready:false,revision:0};let snapshot=null,lastKey='',busy=false,inputSession=0,catalogWanted=false,catalogAt=0;
window.saeivNativePost=envelope=>{if(envelope?.payload?.type==='saeiv:catalog_request'){catalogWanted=true;catalogAt=0;return;}if(inputSession)fetch('/saeiv/action',{method:'POST',headers:{'Content-Type':'application/json','x-idf-saeiv-session':String(inputSession)},body:JSON.stringify(envelope)}).catch(()=>{});};
// Resolve hover against the same DOM used for clicks, including invisible Agora keys.
window.IDFSaeivTexture.cursorAt=(x,y)=>{
 const frame=document.getElementById('display'),d=frame?.contentDocument;if(!d)return 0;
 const r=frame.getBoundingClientRect();x=(x-r.left)*d.documentElement.clientWidth/r.width;y=(y-r.top)*d.documentElement.clientHeight/r.height;
 if(x<0||y<0||x>=d.documentElement.clientWidth||y>=d.documentElement.clientHeight)return 0;
 const el=d.elementFromPoint(x,y);if(!el)return 0;
 const control=el.closest('button,input,select,textarea,a[href],[role="button"],[aria-disabled]');
 const css=frame.contentWindow.getComputedStyle(control||el);
 if(control?.matches(':disabled,[aria-disabled="true"]')||css.cursor==='not-allowed')return 2;
 if(control||css.cursor==='pointer')return 1;
 return 0;
};
// A silent display only: audio is handled by the authoritative game page.
window.saeivGetBridgeState=()=>snapshot;
async function refresh(){if(busy)return;busy=true;try{
 if(catalogWanted&&Date.now()-catalogAt>=500){catalogAt=Date.now();const response=await fetch('/saeiv/catalog',{cache:'no-store'});if(response.ok){const c=await response.json();if(c.ready&&document.getElementById('display')?.contentWindow){catalogWanted=false;document.getElementById('display').contentWindow.postMessage({scope:'idf_game_widget_bridge_v1',channel:'saeiv',payload:{type:'saeiv:catalog',sourceId:'game',payload:{routes:c.routes}}},location.origin);}}}
const r=await fetch('/saeiv/state',{cache:'no-store'});if(!r.ok)return;const data=await r.json();inputSession=data.inputSession||0;for(const m of data.messages||[])document.getElementById('display')?.contentWindow?.postMessage(m,location.origin);snapshot={...data.state,payload:{...data.state.payload,busAudioTelemetry:undefined,globalAudioVolumeMultiplier:0}};const backlight=agora?1:saeivBacklight(data.gameTime);const display=document.getElementById('display');if(agora)display?.contentWindow?.IDFAgoraNative?.setPower(data.powered!==false,data.gameTime);if(display)display.style.filter='brightness('+backlight+')';const key=JSON.stringify([data.revision,data.active,backlight,Math.floor(Date.now()/1000)]);if(key!==lastKey){lastKey=key;display?.contentWindow?.postMessage({scope:'idf_game_widget_bridge_v1',channel:'saeiv',payload:snapshot},location.origin);window.IDFSaeivTexture.revision++;}}catch{}finally{busy=false;}}
// Explicit backlight curve: unchanged from 08:00 to 18:00, gradual dawn/dusk.
function saeivBacklight(clock){const m=/^(\d{1,2}):(\d{2})/.exec(String(clock||''));if(!m)return 1;const h=Number(m[1])+Number(m[2])/60;if(h>=8&&h<=18)return 1;const daylight=h<8?(h-6)/2:(20-h)/2;const t=Math.max(0,Math.min(1,daylight));return .16+.84*t*t*(3-2*t);}
refresh();setInterval(refresh,50);
</script>
<iframe id="display"></iframe>
<script>display.addEventListener('load',async()=>{const d=display.contentDocument;if(agora){display.style.background='transparent';window.IDFSaeivTexture.ready=true;setInterval(()=>{window.IDFSaeivTexture.revision=display.contentWindow.IDFAgoraNative?.revision||0;},30);return;}const s=d.createElement('style');s.textContent='.pip-drawer,.pip-host-notice{display:none!important}.hud{width:100vw!important;height:100vh!important;aspect-ratio:auto!important;border-radius:0!important;box-shadow:none!important}';d.head.appendChild(s);new MutationObserver(()=>{window.IDFSaeivTexture.revision++;}).observe(d.body,{subtree:true,childList:true,attributes:true,characterData:true});await d.fonts.ready;window.IDFSaeivTexture.ready=true;window.IDFSaeivTexture.revision++;});</script>
<script>display.src=agora?'idf-rp/widgets/saeiv-agora.html?host=game&source=game':'idf-rp/widgets/saeiv.html?host=game&source=game';display.src+='&map='+encodeURIComponent(new URLSearchParams(location.search).get('map')||'__unsupported__');['dataVersion','dataRevision'].forEach(function(k){display.src+='&'+k+'='+encodeURIComponent(new URLSearchParams(location.search).get(k)||'');});if(agora)display.style.background='transparent';</script>
</body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:">
<title>IDF-RP</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;pointer-events:none;user-select:none}
body{font-family:'Segoe UI',Arial,sans-serif;color:#f2f2f2;font-size:15px}
.notice{position:absolute;inset:0;background:rgba(20,21,22,.96);border-radius:4px;padding:18px 20px;display:grid;grid-template-columns:36px 1fr;column-gap:14px;align-content:start;--accent:#ffb700}
.notice[data-tone=success]{--accent:#81c866}.notice[data-tone=error]{--accent:#f2786d}
.symbol{color:var(--accent);width:34px;height:34px;margin-top:1px}
h1{color:var(--accent);font-size:17px;line-height:22px;font-weight:600;margin:0 0 7px}
.version{float:right;color:#a8aaab;font-size:12px;font-weight:400;max-width:150px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.message{font-size:15px;line-height:21px;margin:0;min-height:42px}
.detail{color:#b7b8b9;font-size:12px;line-height:18px;margin-top:9px}
.meter-row{display:flex;gap:12px;align-items:center;height:18px;margin-top:7px}
.meter{height:5px;background:#454647;flex:1;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}
.percent{font-size:12px;font-variant-numeric:tabular-nums;min-width:36px;text-align:right;color:#ddd}
[hidden]{display:none!important}
</style>
</head>
<body>
<section class="notice" id="notice" role="status" aria-live="polite" data-tone="pending">
<svg class="symbol" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="currentColor" stroke-width="2.4"/><path id="symbolPath" d="M18 9v11m0 5v1" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><h1>IDF-RP <span class="version" id="version"></span></h1>
<p class="message" id="message">Vérification des mises à jour…</p>
<div class="meter-row" id="meterRow" hidden><div class="meter" role="progressbar" id="meter" aria-label="Téléchargement" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div><span class="percent" id="percent"></span></div>
<div class="detail" id="detail">ETS2 · Carte · Ressources</div>
</div>
</section>
<script src="startup-notification.js"></script>
</body>
</html>
